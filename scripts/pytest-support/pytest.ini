# Self-contained config for the guard's OWN unit tests.
#
# `pythonpath = .` puts this directory on sys.path so the tests can import
# `hope_worktree_guard` the same way each service's conftest.py does — and,
# because pytest resolves `pythonpath` relative to rootdir, it resolves to
# WHICHEVER checkout the suite was invoked from. The guard is subject to the
# defect it exists to catch, so it must not be exempt from the fix.
[pytest]
minversion = 9.0
pythonpath = .
testpaths = tests
addopts = -ra --strict-config --strict-markers

# ══════════════════════════════════════════════════════════════════════════════
# Scan stage — security scanning with Trivy (no GitLab license required)
# ══════════════════════════════════════════════════════════════════════════════

# ── Trivy container scan template ────────────────────────────────────────────

.trivy-scan:
  stage: scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  variables:
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
    TRIVY_INSECURE: "true"
    SCAN_IMAGE: ""
  script:
    - |
      echo "Scanning image: $SCAN_IMAGE"
      trivy image \
        --exit-code 0 \
        --severity HIGH,CRITICAL \
        --format table \
        --no-progress \
        "$SCAN_IMAGE"

      echo ""
      echo "Checking for CRITICAL vulnerabilities (will fail if found)..."
      trivy image \
        --exit-code 1 \
        --severity CRITICAL \
        --no-progress \
        "$SCAN_IMAGE" || echo "CRITICAL vulnerabilities found — review required"
  allow_failure: true
  rules:
    - if: $PIPELINE_TYPE == "merge_request"
      when: never

# ── Per-service container scans ──────────────────────────────────────────────

scan-api:
  extends: .trivy-scan
  needs:
    - job: build-api
      artifacts: true
  variables:
    SCAN_IMAGE: $IMAGE
  rules:
    - if: $PIPELINE_TYPE == "merge_request"
      when: never
    - !reference [.rules-api, rules]

scan-ui-playground:
  extends: .trivy-scan
  needs:

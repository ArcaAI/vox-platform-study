# ══════════════════════════════════════════════════════════════════════════════
# Scan stage — security scanning with Trivy
# ══════════════════════════════════════════════════════════════════════════════
#
# Container scans run after builds on dev/staging/tags (not on main or feature).
# Source scan (SAST) runs on ALL pipeline types.

# ── Trivy container scan template ────────────────────────────────────────────

.trivy-scan:
  stage: scan
  tags: [build]
  image:
    name: aquasec/trivy:0.58.2
    entrypoint: [""]
  variables:
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
    TRIVY_INSECURE: "true"
    SCAN_IMAGE: ""
  script:
    - |
      echo "Scanning image: $SCAN_IMAGE"
      trivy image \
        --exit-code 0 \
        --severity HIGH,CRITICAL \
        --format table \
        --no-progress \
        "$SCAN_IMAGE"

      echo ""
      echo "Checking for CRITICAL vulnerabilities..."
      trivy image \
        --exit-code 1 \
        --severity CRITICAL \
        --no-progress \
        "$SCAN_IMAGE" || echo "CRITICAL vulnerabilities found — review required"
  allow_failure: true

# ── Per-service container scans ──────────────────────────────────────────────

scan-api:
  extends: .trivy-scan
  needs:
    - job: build-api
      artifacts: true
  variables:
    SCAN_IMAGE: $IMAGE
  rules:
    - if: $PIPELINE_TYPE == "merge_request" || $PIPELINE_TYPE == "feature" || $PIPELINE_TYPE == "release_sdk" || $PIPELINE_TYPE == "release_playground" || $PIPELINE_TYPE == "main"
      when: never
    - !reference [.rules-api, rules]

scan-stt-v2:
  extends: .trivy-scan
  needs:
    - job: build-stt-v2
      artifacts: true
  variables:
    SCAN_IMAGE: $IMAGE
  rules:
    - if: $PIPELINE_TYPE == "merge_request" || $PIPELINE_TYPE == "feature" || $PIPELINE_TYPE == "release_sdk" || $PIPELINE_TYPE == "release_playground" || $PIPELINE_TYPE == "main"
      when: never
    - !reference [.rules-stt-v2, rules]

scan-smr:
  extends: .trivy-scan
  needs:
    - job: build-smr
      artifacts: true
  variables:
    SCAN_IMAGE: $IMAGE
  rules:
    - if: $PIPELINE_TYPE == "merge_request" || $PIPELINE_TYPE == "feature" || $PIPELINE_TYPE == "release_sdk" || $PIPELINE_TYPE == "release_playground" || $PIPELINE_TYPE == "main"
      when: never
    - !reference [.rules-smr, rules]

scan-nlp:
  extends: .trivy-scan
  needs:
    - job: build-nlp
      artifacts: true
  variables:
    SCAN_IMAGE: $IMAGE
  rules:
    - if: $PIPELINE_TYPE == "merge_request" || $PIPELINE_TYPE == "feature" || $PIPELINE_TYPE == "release_sdk" || $PIPELINE_TYPE == "release_playground" || $PIPELINE_TYPE == "main"
      when: never
    - !reference [.rules-nlp, rules]

# ── Filesystem scan (source code SAST) — runs on ALL pipelines ───────────────

scan-source:
  stage: scan
  tags: [fast]
  image:
    name: aquasec/trivy:0.58.2
    entrypoint: [""]
  needs: []
  script:
    - |
      echo "Scanning source code for vulnerabilities..."
      trivy fs \
        --exit-code 0 \
        --severity HIGH,CRITICAL \
        --scanners vuln,secret,misconfig \
        --format table \
        --no-progress \
        .
  allow_failure: true
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+/
    - if: $PIPELINE_TYPE

# ── Gitleaks scan (Phase 0 Item 6) — runs on ALL pipelines, MUST pass ────────

scan-gitleaks:
  stage: scan
  tags: [fast]
  image:
    name: zricethezav/gitleaks:v8.21.2
    entrypoint: [""]
  needs: []
  variables:
    # Full clone (not the default shallow depth-20). A shallow clone grafts the
    # boundary commit and re-attributes its whole file tree to that commit's
    # SHA, so the historic-rotation `commits` allowlist in .gitleaks.toml (keyed
    # by the ORIGINAL introducing SHA) stops matching and already-remediated
    # secrets get re-reported. A full clone keeps original SHAs intact.
    GIT_DEPTH: 0
  script:
    - |
      echo "Scanning entire repo for known-secret patterns…"
      gitleaks detect \
               --source . \
               --config .gitleaks.toml \
               --no-banner \
               --redact \
               --report-format sarif \
               --report-path gl-secret-detection-report.sarif
  artifacts:
    when: always
    paths:
      - gl-secret-detection-report.sarif
    reports:
      sast: gl-secret-detection-report.sarif
    expire_in: 30 days
  allow_failure: false
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+/
    - if: $PIPELINE_TYPE == "merge_request"
    - if: $PIPELINE_TYPE == "feature"
    - if: $PIPELINE_TYPE == "cicd"
    - if: $PIPELINE_TYPE == "dev"
    - if: $PIPELINE_TYPE == "staging"
    - if: $PIPELINE_TYPE == "release_sdk"
    - if: $PIPELINE_TYPE == "release_playground"
    - if: $PIPELINE_TYPE == "main"

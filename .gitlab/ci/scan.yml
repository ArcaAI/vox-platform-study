# ── Filesystem scan (source code SAST) — runs on ALL pipelines ───────────────

scan-source:
  stage: scan
  tags: [fast]
  image:
    name: aquasec/trivy:0.74.0
    entrypoint: [""]
  needs: []
  script:
    - |
      echo "Scanning source code for vulnerabilities..."
      trivy fs \
        --exit-code 0 \
        --severity HIGH,CRITICAL \
        --scanners vuln,secret,misconfig \
        --format table \
        --no-progress \
        .
  allow_failure: true
  rules:
    - !reference [.skip-vuln-scan-on-dev-2-x, rules]
    - if: $CI_COMMIT_TAG =~ /^v\d+/
    - if: $PIPELINE_TYPE


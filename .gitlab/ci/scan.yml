scan-python-base:
  extends: .trivy-scan
  needs:
    - job: build-python-base
      artifacts: true
  variables:
    # SCAN_IMAGE is set EXPLICITLY here, not inherited as $IMAGE like every other
    # scan job. `build-python-base` is the one build job that OVERRIDES
    # .build-template's `script:`, so it never runs the line that writes
    # `IMAGE=` into build.env — it publishes no dotenv, and $IMAGE would expand
    # to empty. With allow_failure removed that is a hard failure,
    # not a silent skip. Reference matches what its script actually pushes.
    SCAN_IMAGE: $REGISTRY/$CI_PROJECT_PATH/hope-python-base:$CI_COMMIT_SHA
  # No .rules-python-base fragment exists — build-python-base is gated by
  # .build-common-rules alone, so this mirrors it exactly. A scan gated
  # differently from its build either never runs or waits on a job that
  # never ran.
  rules:
    - !reference [.build-common-rules, rules]

scan-harness-worker:
  extends: .trivy-scan
  needs:
    - job: build-harness-worker
      artifacts: true
  variables:
    SCAN_IMAGE: $IMAGE
  rules:
    - if: $PIPELINE_TYPE == "merge_request" || $PIPELINE_TYPE == "feature" || $PIPELINE_TYPE == "release_sdk" || $PIPELINE_TYPE == "main"
      when: never
    - !reference [.skip-vuln-scan-on-dev-2-x, rules]
    - !reference [.rules-harness, rules]

scan-qdrant-init:
  extends: .trivy-scan
  needs:
    - job: build-qdrant-init
      artifacts: true
  variables:
    SCAN_IMAGE: $IMAGE
  # No .rules-qdrant-init fragment exists (same situation as scan-python-base
  # above) — build-qdrant-init is gated by .build-common-rules + the ALL- tag
  # alone, so this mirrors it exactly rather than inventing a path-based rule
  # in rules.yml for a one-shot provisioning image.
  rules:
    - !reference [.build-common-rules, rules]
    - if: $CI_COMMIT_TAG =~ /^ALL-/

# ── Gitleaks scan (Phase 0 Item 6) — runs on ALL pipelines, MUST pass ────────

scan-gitleaks:
  stage: scan
  tags: [fast]
  image:
    name: zricethezav/gitleaks:v8.30.1
    entrypoint: [""]
  needs: []
  script:
    - |
      # WORKING-TREE mode, not full history.
      #
      # The previous body used GIT_DEPTH: 0 + full-history detection so the
      # `commits` allowlist in .gitleaks.toml (keyed by original introducing SHA)
      # kept matching. That is the right END state, but it cannot be switched on
      # blind: this repo's history has not been audited, and the sibling
      # hope-v2-deployment repo demonstrated the failure mode — two live
      # credentials in its history would fail every pipeline forever, when the
      # remediation is ROTATION, not a permanently red pipeline.
      #
      # Working-tree mode stops NEW secrets landing, which is what CI can
      # usefully enforce today, and it blocks (allow_failure: false).
      # Full-history mode is Wave-B-gated on that audit.
      echo "Scanning working tree for known-secret patterns…"
      gitleaks detect \
               --no-git \
               --source . \
               --config .gitleaks.toml \
               --no-banner \
               --redact \
               --report-format sarif \
               --report-path gl-secret-detection-report.sarif
  artifacts:
    when: always
    paths:
      - gl-secret-detection-report.sarif
    reports:
      sast: gl-secret-detection-report.sarif
    expire_in: 30 days
  allow_failure: false
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+/
    - if: $PIPELINE_TYPE == "merge_request"
    - if: $PIPELINE_TYPE == "feature"
    - if: $PIPELINE_TYPE == "cicd"
    - if: $PIPELINE_TYPE == "dev"
    - if: $PIPELINE_TYPE == "staging"
    - if: $PIPELINE_TYPE == "release_sdk"
    - if: $PIPELINE_TYPE == "main"

# ══════════════════════════════════════════════════════════════════════════════
# Scan stage — security scanning with Trivy
# ══════════════════════════════════════════════════════════════════════════════
#
# Container scans run after builds on dev/staging/tags (not on main or feature).
# Source scan (SAST) runs on ALL pipeline types.

# ── Trivy container scan template ────────────────────────────────────────────

.trivy-scan:
  stage: scan
  tags: [build]
  image:
    name: aquasec/trivy:0.58.2
    entrypoint: [""]
  variables:
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
    TRIVY_INSECURE: "true"
    SCAN_IMAGE: ""
  script:
    - |
      # Pass 1 — INFORMATIONAL. HIGH+CRITICAL as a readable table, never blocks.
      echo "Scanning image: $SCAN_IMAGE"
      trivy image \
        --exit-code 0 \
        --severity HIGH,CRITICAL \
        --format table \
        --no-progress \
        "$SCAN_IMAGE"

      # Pass 2 — THE GATE. CRITICAL fails the job (TASK-621 C-02).
      #
      # This scan was previously neutralised three times over: pass 1 used
      # --exit-code 0, pass 2's real exit code was swallowed by `|| echo ...`,
      # and the job carried allow_failure: true. All three are removed. A gate
      # that cannot fail is not a gate.
      echo ""
      echo "Gate: CRITICAL vulnerabilities fail this job."
      trivy image \
        --exit-code 1 \
        --severity CRITICAL \
        --no-progress \
        "$SCAN_IMAGE"
  allow_failure: false

# ── Per-service container scans ──────────────────────────────────────────────

scan-api:
  extends: .trivy-scan
  needs:
    - job: build-api
      artifacts: true
  variables:
    SCAN_IMAGE: $IMAGE
  rules:
    - if: $PIPELINE_TYPE == "merge_request" || $PIPELINE_TYPE == "feature" || $PIPELINE_TYPE == "release_sdk" || $PIPELINE_TYPE == "release_playground" || $PIPELINE_TYPE == "main"
      when: never
    - !reference [.skip-on-dev-2-1, rules]
    - !reference [.rules-api, rules]


# ── Filesystem scan (source code SAST) — runs on ALL pipelines ───────────────

scan-source:
  stage: scan
  tags: [fast]
  image:
    name: aquasec/trivy:0.58.2
    entrypoint: [""]
  needs: []
  script:
    - |
      echo "Scanning source code for vulnerabilities..."
      trivy fs \
        --exit-code 0 \
        --severity HIGH,CRITICAL \
        --scanners vuln,secret,misconfig \
        --format table \
        --no-progress \
        .
  allow_failure: true
  rules:
    - !reference [.skip-on-dev-2-1, rules]
    - if: $CI_COMMIT_TAG =~ /^v\d+/
    - if: $PIPELINE_TYPE


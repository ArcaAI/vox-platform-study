# ══════════════════════════════════════════════════════════════════════════════
# Test stage — unit + integration tests for all services
# ══════════════════════════════════════════════════════════════════════════════
#
# External Test Infrastructure (on 10.10.1.0/24 — reachable from GitLab Runner):
#   PostgreSQL HA:  10.10.1.250:5000  (HAProxy R/W VIP)
#   Redis Dev:      10.10.1.120:6379  (DB 8 reserved for CI tests)
#
# Connection details are set via CI/CD variables (Settings → CI/CD → Variables):
#   CI_DATABASE_URL       — postgresql://user:pass@10.10.1.250:5000/vox_dev?schema=public
#   CI_REDIS_URL          — redis://:pass@10.10.1.120:6379/8
#   CI_REDIS_PASS         — Redis password (masked)
#   CI_JWT_SECRET         — test JWT secret (masked)
#   CI_API_KEY_PEPPER     — test API key pepper (masked)
#
# Database-dependent tests (test-api) use CI_DATABASE_URL from GitLab Variables.
# The prepare-test-db job resets the schema + seeds before tests run.
# ══════════════════════════════════════════════════════════════════════════════

# ── Skip controls ────────────────────────────────────────────────────────────
# Set SKIP_TESTS=true to skip ALL test jobs, or use the granular variants:
#   SKIP_TESTS_TS — skip TypeScript tests (test-api, test-packages, test-sdk, test-apps, test-ui-ct)
#   SKIP_TESTS_PY — skip Python tests (test-stt, test-text, test-guardrail, test-nlp, test-harness)
#
# Usage:
#   GitLab UI → Run pipeline → add variable SKIP_TESTS = true
#   git push -o ci.variable="SKIP_TESTS=true"

# ── Shared test variables (anchored for reuse) ──────────────────────────────

.test-env-vars: &test-env-vars
  NODE_ENV: "test"
  CI: "true"
  DATABASE_URL: $CI_DATABASE_URL
  REDIS_URL: $CI_REDIS_URL
  REDIS_PASS: $CI_REDIS_PASS
  JWT_SECRET_KEY: $CI_JWT_SECRET
  API_KEY_PEPPER: $CI_API_KEY_PEPPER
  SESSION_SECRET_KEY: $CI_JWT_SECRET
  LOG_LEVEL: "error"
  LOG_FILE_ENABLED: "false"
  OTEL_TRACES_ENABLED: "false"
  OTEL_METRICS_ENABLED: "false"
  PORT: "8868"
  API_PORT: "8868"
  API_URL: "http://localhost:8868"
  STT_PORT: "8861"
  STT_URL: "http://localhost:8861"
  TEXT_PORT: "8862"
  TEXT_URL: "http://localhost:8862"
  NLP_PORT: "8864"
  NLP_URL: "http://localhost:8864"
  GUARDRAIL_URL: "http://localhost:8863"
  HARNESS_URL: "http://localhost:8866"

# ── API unit tests (NestJS / Vitest) ─────────────────────────────────────────

test-api:
  stage: test
  extends: .test-node-base
  needs:
    - job: install-node
      optional: true
    - job: lint-ts
      optional: true
      artifacts: false
    - job: prepare-test-db
      optional: true
      artifacts: false
  variables:
    <<: *test-env-vars
    # Vault supplies these when VAULT_ADDR is set; the
    # *test-env-vars mappings above remain the fallback. `.test-node-base`
    # carries the fetch step, which exports over the variables of the same name.
    VAULT_SECRETS: !reference [.vault-secret-sets, ci-full]
  script:
    - echo "── Test infra → PostgreSQL=${CI_DATABASE_URL:+set} Redis=${CI_REDIS_URL:+set} ──"
    - pnpm --filter @arcaai/database db:generate
    # Build apps/api's WHOLE upstream DAG (`^...` = dependencies only, not
    # apps/api itself, whose nest build these unit tests do not need). A
    # hand-maintained subset was listed here and silently omitted
    # `@arcaai/async-contract`, so every suite importing it failed to resolve
    # its `dist` entry. `^...` picks up new workspace deps automatically —
    # same idiom as the (now hidden) compat-playground job below.
    - pnpm turbo build --filter=@arcaai/api^...
    - pnpm --filter @arcaai/api test -- --reporter=junit --outputFile=junit-api.xml
  artifacts:
    when: always
    reports:
      junit: junit-api.xml
    expire_in: 30 days
  rules:
    - if: $SKIP_TESTS == "true"
      when: never
    - if: $SKIP_TESTS_TS == "true"
      when: never
    - !reference [.rules-api, rules]

# ── Shared package tests (Vitest) ───────────────────────────────────────────

test-packages:
  stage: test
  extends: .test-node-base
  needs:
    - job: install-node
      optional: true
    - job: lint-ts
      optional: true
      artifacts: false
  variables:
    <<: *test-env-vars
    # Live-Postgres CAS guard below needs the data plane; no tokens are minted.
    VAULT_SECRETS: !reference [.vault-secret-sets, ci-data-plane]
  script:
    - echo "── Test infra → PostgreSQL=${CI_DATABASE_URL:+set} Redis=${CI_REDIS_URL:+set} ──"
    - pnpm --filter @arcaai/database db:generate
    - pnpm turbo build --filter=@arcaai/database
    - pnpm turbo build --filter=@arcaai/exceptions
    - pnpm turbo build --filter=@arcaai/logger
    - pnpm turbo build --filter=@arcaai/domains
    # `@arcaai/domains` is included so the
    # permanent Postgres regression guard for optimistic-locking CAS runs in
    # CI. DATABASE_URL is supplied via *test-env-vars; when set the
    # `updateWithVersion.postgres.test.ts` file exercises a live Postgres and
    # asserts the `_version` predicate is emitted verbatim by the driver
    # (defense against Prisma #10207 / #28840 on a future driver migration).
    # `@arcaai/applications` (180 unit specs, mocked repositories) is
    # included so the application-service layer is exercised in CI, matching the
    # local `pnpm test` (turbo) fan-out. Its workspace deps (exceptions/logger/
    # domains) are built above.
    - pnpm turbo test --filter=@arcaai/logger --filter=@arcaai/utils --filter=@arcaai/pipeline --filter=@arcaai/domains --filter=@arcaai/applications
  rules:
    - if: $SKIP_TESTS == "true"
      when: never
    - if: $SKIP_TESTS_TS == "true"
      when: never
    - !reference [.rules-always, rules]
    - !reference [.rules-cicd-always, rules]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths:
          - packages/**/*
        compare_to: refs/heads/main
    - if: $PIPELINE_TYPE == "dev"
    - if: $PIPELINE_TYPE == "staging" || $PIPELINE_TYPE == "main" || $PIPELINE_TYPE == "feature"
      changes:
        - packages/**/*

# ── SDK + UI package tests (Vitest) ─────────────────────────────────────────

test-sdk:
  stage: test
  extends: .test-node-base
  # Ignored while a real unit regression is outstanding (live-transcript Lexical
  # editor). Runs but does not block the pipeline.
  allow_failure: false
  needs:
    - job: install-node
      optional: true
    - job: lint-ts
      optional: true
      artifacts: false
  variables:
    <<: *test-env-vars
    # @arcaai/noise-filter's wasmAsset.test.ts asserts the on-disk
    # assets/rnnoise.wasm is > 10_000 bytes; a ~130-byte LFS pointer stub
    # fails it — see GIT_LFS_SKIP_SMUDGE in .gitlab-ci.yml.
    GIT_LFS_SKIP_SMUDGE: "0"
  script:
    - echo "── Test infra → PostgreSQL=${CI_DATABASE_URL:+set} Redis=${CI_REDIS_URL:+set} ──"
    # Parallelism is capped by TURBO_CONCURRENCY / VITEST_MAX_WORKERS on
    # `.test-node-base` — an explicit --concurrency flag here would override it.
    - pnpm turbo build --filter=@arcaai/utils
    - pnpm turbo test --filter=@arcaai/vox --filter=@arcaai/vox-node --filter=@arcaai/room --filter=@arcaai/vad --filter=@arcaai/stt --filter=@arcaai/noise-filter --filter=@arcaai/med-ner --filter=@arcaai/ui
  rules:
    - if: $SKIP_TESTS == "true"
      when: never
    - if: $SKIP_TESTS_TS == "true"
      when: never
    - !reference [.rules-always, rules]
    - !reference [.rules-cicd-always, rules]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths:
          - packages/ui/**/*
          - packages/room/**/*
          - packages/vad/**/*
          - packages/stt/**/*
          - packages/noise-filter/**/*
          - packages/agentic-sdk-v2/**/*
          - packages/med-ner/**/*
          - packages/utils/**/*
        compare_to: refs/heads/main
    - if: $PIPELINE_TYPE == "release_sdk"
    - if: $PIPELINE_TYPE == "dev"
    - if: $PIPELINE_TYPE == "staging" || $PIPELINE_TYPE == "main" || $PIPELINE_TYPE == "feature"
      changes:
        - packages/ui/**/*
        - packages/room/**/*
        - packages/vad/**/*
        - packages/stt/**/*
        - packages/noise-filter/**/*
        - packages/agentic-sdk-v2/**/*
        - packages/med-ner/**/*

# ── Admin Console (Next.js) unit tests ──────────────────────────────────────
#
# F-039 — the 1,100+ file Vitest unit suite (jsdom/happy-dom projects, fully
# hermetic: no DB/Redis/API dependency — verified locally) previously ran in
# NO CI job; `admin-console` appeared only in build.yml (Docker image build).
# This job runs `vitest run` directly with `pnpm --filter`, NOT via
# `pnpm turbo test` — turbo's `test` task `dependsOn: ["build"]`, which for
# this Next.js app would force a full `next build` (needs
# NEXT_PUBLIC_API_HOST and other build-time env not provisioned in the test
# stage) purely to reach the test task; that build is already covered
# separately by the `build-admin-console` Docker job. Scope is UNIT TESTS
# ONLY: the ~37-file Playwright e2e suite needs a composed stack (API + BFF +
# seeded DB) and is intentionally NOT run here — it remains local-discipline
# until a nightly/scheduled job is built for it.

test-admin-console:
  stage: test
  extends: .test-node-base
  # Ignored while a real unit regression is outstanding (harness-workflows-screen
  # stays in its skeleton state). Runs but does not block the pipeline.
  allow_failure: false
  needs:
    - job: install-node
      optional: true
    - job: lint-ts
      optional: true
      artifacts: false
  variables:
    <<: *test-env-vars
  script:
    - pnpm turbo build --filter=@arcaai/admin-console^...
    # --maxWorkers=2: 178 test files across two projects spawned one worker per
    # core next to every other test job on this runner; the suite took 252s
    # (2070s of import time) and tests started tripping the timeout.
    # `pnpm --filter <pkg> test -- <flag>` does NOT forward the flag (same trap
    # as db:migrate:create); `exec` runs the binary directly so it lands.
    - pnpm --filter @arcaai/admin-console exec vitest run --maxWorkers=2
  rules:
    - if: $SKIP_TESTS == "true"
      when: never
    - if: $SKIP_TESTS_TS == "true"
      when: never
    - !reference [.rules-admin-console, rules]

# ── Admin Console E2E accessibility suite (Playwright + axe-core) ───────────
#
# The 40 specs under `apps/admin-console/tests/e2e/` are the
# ONLY real-browser, rule-complete axe scans in the repo — `@axe-core/playwright`
# against a painted page, with no rule disabled. Until this job existed they
# were wired to no pipeline at all (the note on `test-admin-console` above said
# so: "remains local-discipline until a nightly/scheduled job is built for it").
# This is that job.
#
# SCHEDULED, NOT PER-MR, and off unless asked for. It composes the whole stack —
# gateway + seeded database + a production build of the console — which is far
# too heavy for an MR gate. Turn it on with a GitLab pipeline SCHEDULE that sets
# RUN_A11Y_E2E=true (or the same variable on a manual "Run pipeline").
#
# ⚠ THE SKIP TRAP — read before editing the script.
# `tests/e2e/helpers/stack.ts` makes every spec SKIP, not fail, when the stack
# is not reachable. A naive job would therefore report GREEN while executing
# zero assertions, which is worse than no job at all. Two guards below stop
# that, and neither is optional:
#   1. the health polls `exit 1` if the API or the console never comes up;
#   2. the post-run check fails the job if the JSON report contains fewer than
#      MIN_EXPECTED_SPECS executed tests.
#
# ⚠ NOT YET PROVEN ON A RUNNER. This job is modelled on `test-api-e2e` (the
# existing background-boot + health-poll pattern) and has never been executed in
# CI. It additionally needs a CI/CD variable that does not exist yet:
#   CI_ADMIN_SESSION_SECRET — >=32 chars; the console refuses to boot without
#   ADMIN_SESSION_SECRET (src/config/env.ts, required: true).
# It also assumes CI_REDIS_URL actually reaches a Redis the gateway can use —
# the comment on `test-api-e2e` records that this was NOT provisioned. Until
# both hold, leaving RUN_A11Y_E2E unset keeps the job out of every pipeline.

test-admin-console-a11y:
  stage: test
  image: mcr.microsoft.com/playwright:v1.62.1-noble
  tags: [test]
  # Deliberately blocking. The job cannot run at all unless someone sets
  # RUN_A11Y_E2E=true, so a red result is always something that was asked for;
  # `allow_failure: true` here would reduce a real-browser a11y sweep to a
  # decorative one, which is the exact defect Phase 2 exists to remove.
  allow_failure: false
  timeout: 45m
  # Declared explicitly: this job does not extend .test-node-base (custom image).
  id_tokens: !reference [.vault-oidc-id-token, id_tokens]
  cache:
    - key:
        files:
          - pnpm-lock.yaml
      paths:
        - node_modules/
        - apps/*/node_modules/
        - packages/*/node_modules/
      policy: pull
  before_script:
    - !reference [.vault-oidc, before_script]
    - corepack enable
    - corepack install -g --cache-only .gitlab/corepack/pnpm-10.34.5.tgz
    - pnpm config set store-dir /pnpm-store
    - pnpm install --frozen-lockfile --prefer-offline
  needs:
    - job: install-node
      optional: true
    - job: prepare-test-db
      optional: true
      artifacts: false
  variables:
    <<: *test-env-vars
    VAULT_SECRETS: !reference [.vault-secret-sets, ci-full]
    # prepare-test-db already reset + seeded; a second destructive reset here
    # would race any sibling job still reading the same external database.
    RESET_DB: "false"
    SKIP_DB_PRECHECK: "true"
    PRISMA_USER_CONSENT_FOR_DANGEROUS_AI_ACTION: "yes"
    ADMIN_CONSOLE_URL: "http://localhost:5176"
    NEXT_PUBLIC_API_HOST: "http://localhost:8868"
    # The CLI `--reporter=json` writes to STDOUT unless this is set; the guard
    # below reads the file, so without it the check would always fail open.
    # Relative to cwd, which `pnpm --filter … exec` sets to apps/admin-console.
    PLAYWRIGHT_JSON_OUTPUT_NAME: "test-results/report.json"
    ADMIN_SESSION_SECRET: $CI_ADMIN_SESSION_SECRET
    # Seeded super admin (packages/database seed 91-user.ts).
    E2E_ADMIN_USERNAME: "super_admin"
    E2E_ADMIN_PASSWORD: "password123"
    # Floor for the "did anything actually run?" guard. Set below the 40-spec
    # file count on purpose: individual specs may legitimately skip on a
    # feature-flagged screen, a wholesale skip may not.
    MIN_EXPECTED_SPECS: "30"
  script:
    - echo "── Test infra → PostgreSQL=${CI_DATABASE_URL:+set} Redis=${CI_REDIS_URL:+set} SessionSecret=${CI_ADMIN_SESSION_SECRET:+set} ──"
    - |
      if [ -z "$CI_ADMIN_SESSION_SECRET" ]; then
        echo "✗ CI_ADMIN_SESSION_SECRET is not set — the admin console cannot boot (src/config/env.ts requires it)."
        exit 1
      fi
    - pnpm --filter @arcaai/database db:generate
    - pnpm turbo build --filter=@arcaai/api
    - pnpm turbo build --filter=@arcaai/admin-console
    - echo "── Booting API gateway in background..."
    - pnpm --filter @arcaai/api start > api.log 2>&1 &
    - echo $! > api.pid
    - echo "── Booting admin console (next start) in background..."
    - pnpm --filter @arcaai/admin-console exec next start -p 5176 > admin.log 2>&1 &
    - echo $! > admin.pid
    - |
      wait_for() {
        name="$1"; url="$2"; log="$3"
        echo "── Waiting for ${name} at ${url} (90s timeout)..."
        for i in $(seq 1 90); do
          if wget -q -O- "$url" >/dev/null 2>&1; then
            echo "  ✓ ${name} answered after ${i}s"
            return 0
          fi
          sleep 1
        done
        echo "  ✗ ${name} never answered — dumping ${log}:"
        tail -200 "$log" || true
        # Hard failure, NOT a skip: stack.ts would turn an unreachable stack
        # into 40 skipped specs and a green job.
        exit 1
      }
    - wait_for "API gateway" "${API_URL}/api/v1/health" api.log
    - wait_for "admin console" "${ADMIN_CONSOLE_URL}/login" admin.log
    - pnpm exec playwright install chromium
    - echo "── Running the 40-spec admin-console a11y suite..."
    - pnpm --filter @arcaai/admin-console exec playwright test --reporter=line,json
    - |
      echo "── Verifying the suite actually executed (skip-trap guard)..."
      node -e '
        const fs = require("node:fs");
        const path = "apps/admin-console/test-results/report.json";
        if (!fs.existsSync(path)) { console.error("✗ no JSON report at " + path); process.exit(1); }
        const report = JSON.parse(fs.readFileSync(path, "utf8"));
        let ran = 0, skipped = 0;
        const walk = (suite) => {
          for (const spec of suite.specs ?? []) {
            for (const test of spec.tests ?? []) {
              for (const result of test.results ?? []) {
                if (result.status === "skipped") skipped++; else ran++;
              }
            }
          }
          for (const child of suite.suites ?? []) walk(child);
        };
        for (const suite of report.suites ?? []) walk(suite);
        const floor = Number(process.env.MIN_EXPECTED_SPECS);
        console.log("   executed=" + ran + " skipped=" + skipped + " floor=" + floor);
        if (ran < floor) {
          console.error("✗ only " + ran + " tests executed (floor " + floor + ") — the stack was almost certainly down and the specs skipped themselves.");
          process.exit(1);
        }
      '
  after_script:
    - if [ -f api.pid ]; then kill "$(cat api.pid)" 2>/dev/null || true; fi
    - if [ -f admin.pid ]; then kill "$(cat admin.pid)" 2>/dev/null || true; fi
  artifacts:
    when: always
    paths:
      - apps/admin-console/test-results/
      - api.log
      - admin.log
    expire_in: 30 days
  rules:
    - if: $SKIP_TESTS == "true"
      when: never
    - if: $SKIP_TESTS_TS == "true"
      when: never
    # Opt-IN only. A GitLab pipeline schedule sets RUN_A11Y_E2E=true; nothing
    # else reaches this job, so it never lands on an MR or a normal push.
    - if: $RUN_A11Y_E2E == "true"
    - when: never

# ── compat-playground is DEPRECATED ───────────────────
# Hidden, not deleted: a leading dot makes GitLab treat the key as a template
# that is never instantiated. Re-enable with the matching hidden jobs in
# build.yml / scan.yml / publish.yml, restore the services.json entry, and
# put COMPAT back in SERVICE_TAG_PREFIXES.
#
.test-compat-playground:
  stage: test
  extends: .test-node-base
  needs:
    - job: install-node
      optional: true
    - job: lint-ts
      optional: true
      artifacts: false
  variables:
    <<: *test-env-vars
  script:
    - pnpm turbo build --filter=@arcaai/compat-playground^...
    - pnpm --filter @arcaai/compat-playground test
  rules:
    - if: $SKIP_TESTS == "true"
      when: never
    - if: $SKIP_TESTS_TS == "true"
      when: never
    - !reference [.rules-compat-playground, rules]

# ── UI component tests (Playwright Component Testing) ───────────────────────
#
# @arcaai/ui ships 84 Playwright-CT specs (1729 cases) that mount
# components in a real browser. They need the Playwright browser image, so this
# job is gated on packages/ui changes.
#
# this job is now BLOCKING and runs by default.
# It holds the only two genuine RENDERED-contrast assertions in the repo
# (`alert.test.tsx` destructive variant, `tabs.test.tsx` inactive trigger):
# every other a11y suite in `packages/ui` runs under happy-dom, where axe
# skips `color-contrast` entirely. While this job was `when: never` +
# `allow_failure: true`, a palette change could regress contrast on every
# screen and still show a green pipeline. The cost/flakiness that motivated
# the opt-out is real but is the lesser risk; if the browser runner proves
# unstable, narrow the browser matrix rather than re-disabling the job.
# In CI the CT config runs Chromium + Firefox + WebKit (all preinstalled in the
# image) for cross-browser coverage.

test-ui-ct:
  stage: test
  image: mcr.microsoft.com/playwright:v1.62.1-noble
  tags: [test]
  variables:
    NODE_OPTIONS: "--max-old-space-size=4096"
  cache:
    - key:
        files:
          - pnpm-lock.yaml
      paths:
        - node_modules/
        - apps/*/node_modules/
        - packages/*/node_modules/
      policy: pull
  before_script:
    - corepack enable
    - corepack install -g --cache-only .gitlab/corepack/pnpm-10.34.5.tgz
    - pnpm config set store-dir /pnpm-store
    - pnpm install --frozen-lockfile --prefer-offline
  needs:
    - job: install-node
      optional: true
    - job: lint-ts
      optional: true
      artifacts: false
  script:
    - pnpm --filter @arcaai/ui test:ct
  artifacts:
    when: on_failure
    paths:
      - packages/ui/test-results/
    expire_in: 30 days
  rules:
    # No RUN_UI_CT opt-out any more. The job is slow —
    # cross-browser CT runs against a 30-min timeout — but it is the only
    # real-browser contrast check that runs on a normal pipeline, so it is
    # change-gated on packages/ui rather than switched off.
    - if: $SKIP_TESTS == "true"
      when: never
    - if: $SKIP_TESTS_TS == "true"
      when: never
    - !reference [.rules-always, rules]
    - !reference [.rules-cicd-always, rules]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths:
          - packages/ui/**/*
        compare_to: refs/heads/main
    - if: $PIPELINE_TYPE == "dev"
    - if: $PIPELINE_TYPE == "staging" || $PIPELINE_TYPE == "main"
      changes:
        - packages/ui/**/*

# ── STT tests (pytest) ───────────────────────────────────────────────────

test-stt:
  stage: test
  image: python:3.11-slim
  # Ignored: references DATABASE_URL/REDIS_URL and no dedicated test infra
  # (esp. Redis) is provisioned. Runs but does not block the pipeline.
  # allow_failure removed — verified green under CI-shaped env
  tags: [test]
  # python:3.11-slim ships neither curl nor wget; vault-login.sh falls back to
  # python3 for both transport and JSON, so no package install is needed here.
  id_tokens: !reference [.vault-oidc-id-token, id_tokens]
  before_script:
    - !reference [.vault-oidc, before_script]
  needs:
    - job: lint-python
      optional: true
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
    # One Vault path can feed several env names — the aliases below are the
    # same credential under different reader-specific names, exactly as the
    # $CI_DATABASE_URL fan-out already is.
    VAULT_SECRETS: >-
      ci/DATABASE_URL=DATABASE_URL
      ci/DATABASE_URL=TEST_DATABASE_URL
      ci/REDIS_URL=REDIS_URL
    DATABASE_URL: $CI_DATABASE_URL
    TEST_DATABASE_URL: $CI_DATABASE_URL
    REDIS_URL: $CI_REDIS_URL
    TEST_REDIS_URL: $CI_REDIS_URL
  cache:
    - key: pip-stt
      paths:
        - .pip-cache/
      policy: pull-push
      fallback_keys:
        - pip-$CI_DEFAULT_BRANCH
  script:
    - echo "── Test infra → PostgreSQL=${CI_DATABASE_URL:+set} Redis=${CI_REDIS_URL:+set} ──"
    - pip install --quiet --retries 5 --timeout 120 packages/py-runtime-models
    - pip install --quiet --retries 5 --timeout 120 packages/py-env
    - pip install --quiet --retries 5 --timeout 120 packages/py-obs
    - pip install --quiet --retries 5 --timeout 120 packages/py-otel
    - cd apps/stt
    - pip install --quiet --retries 5 --timeout 120 ".[test]"
    - python -m pytest tests/unit/ -v --tb=short --junitxml=../../junit-stt.xml
    - python -m pytest tests/ -v --tb=short --junitxml=../../junit-stt.xml --ignore=tests/e2e/ --ignore=tests/integration/ -x
    # TASK-985 QW-12 — the geometry-parity gate is the ONE tests/integration/
    # file that belongs in this FAST, per-commit lane despite the --ignore
    # above: it is pure-CPU (reads two committed source files as text, no
    # services), and it is what makes an ungoverned streaming.*/prompt-state
    # edit (the e3d61eefb/ea174814e pattern) visible at PR time instead of
    # only on the next scheduled stt-quality-gate run. Self-skips until BP-1's
    # live fingerprint capture lands in streaming_thresholds.json.
    - python -m pytest tests/integration/test_seed_geometry_parity.py -v --tb=short --junitxml=../../junit-stt-geometry-parity.xml
  artifacts:
    when: always
    reports:
      junit:
        - junit-stt.xml
        - junit-stt-geometry-parity.xml
    expire_in: 30 days
  rules:
    - if: $SKIP_TESTS == "true"
      when: never
    - if: $SKIP_TESTS_PY == "true"
      when: never
    - !reference [.rules-stt, rules]

# ── STT realtime quality gate (nightly, opt-in) — TASK-985 QW-12 ────────────
#
# Drives the WS-gateway streaming scorecard (test_streaming_quality_scorecard.py,
# N-run aggregate gate), the loss/latency harness (test_streaming_loss_harness.py)
# and the offline ml-en model gate (test_mlen_quality_gate.py, self-skips
# without STT_MLEN_EVAL_DIR) against a FULLY LIVE stack, with the BP-1
# structured fingerprint (streaming_thresholds.json's `_fingerprint` block)
# pinning model digest + geometry + prompt state. This is the concrete fix
# for M-16 ("no accuracy or latency gate runs in CI or on a schedule"; the
# served config scored medical_wer 0.885-0.935 against a 0.033-0.131 baseline
# — a 27x gap — with zero gate anywhere to see it).
#
# OWNER-DECISION SHAPE, identical to harness-eval-gate above (LM Studio has
# no CI-runnable image and the owner declined a dedicated runner for it): STT
# needs a GPU + resident ASR model weights that no shared GitLab runner
# provisions, so this job NEVER boots the stack itself (unlike test-api-e2e's
# ephemeral API boot, which nothing here needs a GPU for) — it assumes a
# SCHEDULED pipeline pointed at a runner/host where the full local stack
# (`pnpm stack:dev` — API :8868, STT :8861, a seeded Postgres+Redis) is
# ALREADY UP. `allow_failure: true` is the second layer (see harness-eval-gate's
# own comment for why): a transient unreachable-stack failure on a scheduled
# run must not need separate triage from a real quality regression.
stt-quality-gate:
  stage: test
  image: python:3.11-slim
  tags: [test]
  id_tokens: !reference [.vault-oidc-id-token, id_tokens]
  before_script:
    - !reference [.vault-oidc, before_script]
  needs:
    - job: lint-python
      optional: true
  allow_failure: true
  retry:
    max: 2
    when: [runner_system_failure, stuck_or_timeout_failure]
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
    VAULT_SECRETS: >-
      ci/DATABASE_URL=DATABASE_URL
      ci/DATABASE_URL=TEST_DATABASE_URL
      ci/REDIS_URL=REDIS_URL
    DATABASE_URL: $CI_DATABASE_URL
    TEST_DATABASE_URL: $CI_DATABASE_URL
    REDIS_URL: $CI_REDIS_URL
    TEST_REDIS_URL: $CI_REDIS_URL
    # The runner's own already-live stack — see the comment above; this job
    # never starts either service.
    STREAM_API_URL: "http://localhost:8868"
    STREAM_STT_URL: "http://localhost:8861"
    # STT's own structured JSON-lines log output on this runner, tailed for
    # the BP-1 `stt.streaming.fingerprint` event. Absent -> every run's
    # fingerprint is None and the scorecard/geometry gates SKIP WITH A REASON
    # rather than compare a run against a baseline blind (M-15).
    STREAM_STT_LOG_PATH: "/var/log/hope/stt.log"
    STREAM_QUALITY_N: "5"
  cache:
    - key: pip-stt
      paths:
        - .pip-cache/
      policy: pull-push
      fallback_keys:
        - pip-$CI_DEFAULT_BRANCH
  script:
    - echo "── checking the live stack this job never boots itself ──"
    - >
      curl -sf --max-time 5 "$STREAM_API_URL/api/v1/health" ||
      (echo "API unreachable at $STREAM_API_URL — this runner needs the full local stack (pnpm stack:dev) already up" && exit 1)
    - >
      curl -sf --max-time 5 "$STREAM_STT_URL/api/v1/health" ||
      (echo "stt unreachable at $STREAM_STT_URL — this runner needs the full local stack (pnpm stack:dev) already up" && exit 1)
    - pip install --quiet --retries 5 --timeout 120 packages/py-runtime-models
    - pip install --quiet --retries 5 --timeout 120 packages/py-env
    - pip install --quiet --retries 5 --timeout 120 packages/py-obs
    - pip install --quiet --retries 5 --timeout 120 packages/py-otel
    - cd apps/stt
    - pip install --quiet --retries 5 --timeout 120 ".[test]"
    - echo "── streaming quality scorecard (N-run aggregate) + loss harness + ml-en offline gate + geometry parity ──"
    - >
      python -m pytest
      tests/integration/test_streaming_quality_scorecard.py
      tests/integration/test_streaming_loss_harness.py
      tests/integration/test_mlen_quality_gate.py
      tests/integration/test_seed_geometry_parity.py
      -v --tb=short --junitxml=../../junit-stt-quality-gate.xml
  artifacts:
    when: always
    reports:
      junit: junit-stt-quality-gate.xml
    paths:
      - apps/stt/stt-quality-scorecard.json
      - apps/stt/stt-loss-report.json
    expire_in: 30 days
  rules:
    # Disabled by default: a scheduled/manually-triggered pipeline on a
    # runner with the full GPU-backed stack already up opts in with
    # RUN_INFRA_TESTS=true — see the comment above. ALSO required (a
    # pre-merge checklist item, since a nightly schedule alone would let a
    # bad geometry/prompt-state change merge and only be caught the following
    # night) on any commit touching seed `streaming.*` / `_metadata.asr`
    # fields or `apps/stt/src/stt/pipeline/language_modes.py`'s
    # WHISPER_CPP_*_PRIMING_PROMPT_ENABLED constants.
    - if: $RUN_INFRA_TESTS != "true"
      when: never
    - if: $SKIP_TESTS == "true"
      when: never
    - if: $SKIP_TESTS_PY == "true"
      when: never
    - !reference [.rules-stt, rules]


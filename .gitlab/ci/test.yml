# ── Harness tests (pytest) ───────────────────────────────────────────────────
#
# TASK-413 — closes the gap where `build-harness` declared an optional
# `test-harness` need that didn't exist anywhere in `.gitlab/`. The suite is
# hermetic (no DB/Redis; Temporal, LLM, and reranker clients are stubbed;
# Qdrant runs via the qdrant-client in-memory local mode), so no external test
# infra is wired. On top of the `.[test,eval]` CI install documented in
# apps/harness/pyproject.toml, the `rag` extra is required at collection time
# (unguarded `qdrant_client` test imports).

test-harness:
  stage: test
  image: python:3.11-slim
  tags: [test]
  needs:
    - job: lint-python
      optional: true
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  cache:
    - key: pip-harness
      paths:
        - .pip-cache/
      policy: pull-push
      fallback_keys:
        - pip-$CI_DEFAULT_BRANCH
  script:
    - cd apps/harness
    - pip install --quiet --retries 5 --timeout 120 ".[test,eval,rag]"
    - PYTHONPATH=src python -m pytest src/harness/tests/ -v --tb=short --junitxml=../../junit-harness.xml -x
  artifacts:
    when: always
    reports:
      junit: junit-harness.xml
    expire_in: 30 days
  rules:
    - if: $SKIP_TESTS == "true"
      when: never
    - if: $SKIP_TESTS_PY == "true"
      when: never
    - !reference [.rules-harness, rules]

# ── API E2E tests (Playwright) ──────────────────────────────────────────────
#
# Boots the NestJS API against the shared test database + Redis and exercises
# the Playwright specs under `apps/api/tests/e2e/`. Currently locked to the
# TASK-258 / TASK-259 tenant-access-control spec — the smallest blast radius
# that proves the boot pattern works. Future tickets can broaden the glob
# once this job is stable.
#
# Prerequisites (provided by CI/CD Variables, identical to test-api):
#   CI_DATABASE_URL, CI_DATABASE_URL_DIRECT, CI_REDIS_URL, CI_REDIS_PASS,
#   CI_JWT_SECRET, CI_JWT_REFRESH_SECRET, CI_API_KEY_PEPPER
#
# Schema reset + seed is delegated to the `prepare-test-db` job (Phase 2).
# `RESET_DB=false` keeps the Playwright global-setup from re-pushing the
# schema mid-run.

test-api-e2e:
  stage: test
  image: mcr.microsoft.com/playwright:v1.61.1-noble
  tags: [test]
  cache:
    - key:
        files:
          - pnpm-lock.yaml
      paths:
        - node_modules/
        - apps/*/node_modules/
        - packages/*/node_modules/
      policy: pull
  before_script:
    - corepack enable
    - corepack install -g --cache-only .gitlab/corepack/pnpm-10.31.0.tgz
    - pnpm config set store-dir /pnpm-store
    - pnpm install --frozen-lockfile --prefer-offline
  needs:
    - job: install-node
      optional: true
    - job: lint-ts
      optional: true
      artifacts: false
    - job: prepare-test-db
      optional: true
      artifacts: false
    - job: test-api
      optional: true
      artifacts: false
  variables:
    <<: *test-env-vars
    RESET_DB: "false"
    # Schema+seed already done by prepare-test-db
    SKIP_DB_PRECHECK: "true"
    PRISMA_USER_CONSENT_FOR_DANGEROUS_AI_ACTION: "yes"
    CI: "true"
  script:
    - echo "── Test infra → PostgreSQL=${CI_DATABASE_URL:+set} Redis=${CI_REDIS_URL:+set} ──"
    - pnpm --filter @arcaai/database db:generate
    - pnpm turbo build --filter=@arcaai/database
    - pnpm turbo build --filter=@arcaai/exceptions
    - pnpm turbo build --filter=@arcaai/logger
    - pnpm turbo build --filter=@arcaai/domains
    - pnpm turbo build --filter=@arcaai/applications
    - pnpm turbo build --filter=@arcaai/api
    - echo "── Booting API in background..."
    - pnpm --filter @arcaai/api start > api.log 2>&1 &
    - echo $! > api.pid
    - echo "── Waiting for API health endpoint (60s timeout)..."
    - |
      for i in $(seq 1 60); do
        if wget -q -O- "${API_URL}/api/v1/health" >/dev/null 2>&1; then
          echo "  ✓ API is healthy after ${i}s"
          break
        fi
        if [ "$i" -eq 60 ]; then
          echo "  ✗ API did not become healthy in 60s — dumping log:"
          tail -200 api.log || true
          exit 1
        fi
        sleep 1
      done
    - echo "── Running Playwright tenant-access-control spec..."
    - pnpm exec playwright install chromium
    - pnpm exec playwright test apps/api/tests/e2e/tenant-access-control.spec.ts --project=api-tests --reporter=line
  after_script:
    - if [ -f api.pid ]; then kill "$(cat api.pid)" 2>/dev/null || true; fi
  artifacts:
    when: on_failure
    paths:
      - test-results/
      - api.log
    expire_in: 30 days
  rules:
    - if: $SKIP_TESTS == "true"
      when: never
    - if: $SKIP_TESTS_TS == "true"
      when: never
    - !reference [.rules-always, rules]
    - !reference [.rules-cicd-always, rules]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths:
          - apps/api/**/*
          - packages/applications/src/services/tenant/**/*
          - packages/applications/src/authorization/**/*
          - packages/database/src/prisma/db_main/seed/**/*
          - .gitlab/ci/test.yml
        compare_to: refs/heads/main
    - if: $PIPELINE_TYPE == "dev"
    - if: $PIPELINE_TYPE == "staging" || $PIPELINE_TYPE == "main"
      changes:
        - apps/api/**/*
        - packages/applications/src/services/tenant/**/*
        - packages/applications/src/authorization/**/*
        - packages/database/src/prisma/db_main/seed/**/*

# ── PgBouncer validation rig (TASK-302 Stream C) ────────────────────────────
#
# Brings up the isolated PG 18 + PgBouncer (transaction mode) stack defined
# in `packages/database/tests/pgbouncer-validation/docker-compose.yml`,
# runs the Vitest suite (Tasks 1.7 – 1.13, 1.16), and optionally the
# pgbench baseline. Used by TASK-302 Stream C as the safety net against
# accidental regressions in `client.ts` adapter options, the soft-delete
# extension, or the Prisma 7 ↔ PgBouncer contract.
#
# Runs on:
#   * MRs that touch packages/database OR the rig itself
#   * the cicd / dev / staging integration branches (always)
#
# The job runs inside Docker-in-Docker so we can `docker compose` the rig
# from within the CI runner. The job is self-contained — it does NOT
# consume CI_DATABASE_URL / CI_REDIS_URL (the rig is hermetic).

test-pgbouncer-validation:
  stage: test
  image: docker:27
  services:
    - name: docker:27-dind
      command: ['--tls=false']
  tags: [test]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ''
    DOCKER_DRIVER: overlay2
    PGBV_RIG_DIR: packages/database/tests/pgbouncer-validation
  before_script:
    # Install Node + pnpm + the psql client into the docker:27 image. We
    # need: pnpm (drives `pgbv:*` scripts), psql (admin queries +
    # `pgbv:show:*`), and bash (rig scripts use `#!/usr/bin/env bash`).
    - apk add --no-cache nodejs npm bash postgresql-client
    - npm install -g corepack
    - corepack enable
    - corepack install -g --cache-only .gitlab/corepack/pnpm-10.31.0.tgz
    - pnpm config set store-dir /tmp/pnpm-store
    - pnpm install --frozen-lockfile --prefer-offline
    - pnpm --filter @arcaai/database db:generate
    - pnpm turbo build --filter=@arcaai/database
  script:
    - echo "── 1. Bringing the rig up..."
    - pnpm pgbv:up
    - |
      echo "── 2. Waiting for both containers to be healthy (90s timeout)..."
      for i in $(seq 1 30); do
        status_pg=$(docker inspect --format '{{.State.Health.Status}}' pgbv-postgres 2>/dev/null || echo starting)
        status_pb=$(docker inspect --format '{{.State.Health.Status}}' pgbv-pgbouncer 2>/dev/null || echo starting)
        if [ "$status_pg" = "healthy" ] && [ "$status_pb" = "healthy" ]; then
          echo "  ✓ pgbv-postgres + pgbv-pgbouncer healthy after ${i}×3s"
          break
        fi
        if [ "$i" -eq 30 ]; then
          echo "  ✗ Rig did not become healthy — dumping logs:"
          docker compose -f "$PGBV_RIG_DIR/docker-compose.yml" logs --tail=100
          exit 1
        fi
        sleep 3
      done
    - echo "── 3. Confirming PgBouncer effective config (Task 1.2)..."
    - pnpm pgbv:show:config | grep -E 'pool_mode|max_prepared_statements|server_reset_query|default_pool_size|min_pool_size'
    - echo "── 4. Bootstrapping schema through the pooler (Task 1.4)..."
    - pnpm pgbv:push
    - echo "── 5. Running Vitest suite (Tasks 1.7 – 1.13, 1.16)..."
    - pnpm pgbv:test
    - echo "── 6. Capturing post-suite SHOW POOLS + SHOW STATS for artifact..."
    - pnpm pgbv:show:pools | tee pgbv-show-pools.txt
    - pnpm pgbv:show:stats | tee pgbv-show-stats.txt
  after_script:
    - docker compose -f "$PGBV_RIG_DIR/docker-compose.yml" logs --tail=50 pgbouncer > pgbv-pgbouncer.log 2>&1 || true
    - docker compose -f "$PGBV_RIG_DIR/docker-compose.yml" logs --tail=50 postgres > pgbv-postgres.log 2>&1 || true
    - pnpm pgbv:down || true
  artifacts:
    when: always
    paths:
      - pgbv-show-pools.txt
      - pgbv-show-stats.txt
      - pgbv-pgbouncer.log
      - pgbv-postgres.log
    expire_in: 30 days
  rules:
    - if: $SKIP_TESTS == "true"
      when: never
    - if: $SKIP_TESTS_TS == "true"
      when: never
    - !reference [.rules-cicd-always, rules]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths:
          - packages/database/**/*
          - .gitlab/ci/test.yml
        compare_to: refs/heads/main
    - if: $PIPELINE_TYPE == "dev"
    - if: $PIPELINE_TYPE == "staging"
      changes:
        - packages/database/**/*

# ── NLP tests (pytest) ──────────────────────────────────────────────────────

test-nlp:
  stage: test
  image: python:3.11-slim
  tags: [test]
  needs:
    - job: lint-python
      optional: true
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
    DATABASE_URL: $CI_DATABASE_URL
    TEST_DATABASE_URL: $CI_DATABASE_URL
    REDIS_URL: $CI_REDIS_URL
    TEST_REDIS_URL: $CI_REDIS_URL
  cache:
    - key: pip-nlp
      paths:
        - .pip-cache/
      policy: pull-push
      fallback_keys:
        - pip-$CI_DEFAULT_BRANCH
  script:
    - echo "── Test infra → PostgreSQL=${CI_DATABASE_URL:+set} Redis=${CI_REDIS_URL:+set} ──"
    - cd apps/nlp
    - pip install --quiet --retries 5 --timeout 120 --index-url https://download.pytorch.org/whl/cpu "torch>=2.1.0"
    - pip install --quiet --retries 5 --timeout 120 ".[test]"
    - python -m pytest tests/ -v --tb=short --junitxml=../../junit-nlp.xml -x
  artifacts:
    when: always
    reports:
      junit: junit-nlp.xml
    expire_in: 30 days
  rules:
    - if: $SKIP_TESTS == "true"
      when: never
    - if: $SKIP_TESTS_PY == "true"
      when: never
    - !reference [.rules-nlp, rules]

# ── Harness eval gate (PDSQI-9 / faithfulness / promptfoo contract) ────────
#
# "Wire the eval gates into
# CI": `harness.eval.ci` (PDSQI-9 + RAGAS-style faithfulness + ICC>=0.8) and
# the promptfoo output-contract check were documented as release-blocking but
# only ever ran as manual commands / in the (separate) GitHub Actions mirror
# `.github/workflows/harness-eval.yml` — never in GitLab CI. Two checks:
#   1) `python -m harness.eval.ci` over the curated_v1 golden set (18 cases:
#      12 quality-lane + 6 calibration-lane — see apps/harness/eval/README.md).
#   2) promptfoo PDSQI-9 output-contract gate — hermetic by default (offline
#      deterministic mock provider, no network/secrets; see
#      apps/harness/eval/promptfoo/provider.py) and CAN pass today.
#
# CORRECTION: the owner
# REJECTED the llama.cpp-service-container backend this job previously wired
# (a `services:` block running `ghcr.io/ggml-org/llama.cpp:server` +
# `Qwen2.5-1.5B-Instruct`) — "we use LM Studio and google/gemma-4-e4b". The
# `services:` container is REMOVED; the job now targets the SAME LM-Studio-shaped
# `openai_compat` endpoint (`http://localhost:1234/v1`) local dev already uses,
# with `HARNESS_JUDGE_MODEL=google/gemma-4-e4b` (the model verified resident and
# serving on the owner's LM Studio instance — real measured run).
#
# OWNER DECISION
# "Owner decision — run locally, not on a self-hosted runner"): this gate runs
# LOCALLY (or on a scheduled pipeline pointed at a machine with LM Studio
# already running), NOT as a blocking job on ordinary shared-CI pipelines.
# LM Studio is a desktop application with no official CI-runnable container
# image — a shared GitLab runner cannot start it the way it started llama.cpp
# — and the owner explicitly rejected standing up a dedicated self-hosted
# runner just to host it (Path (a) from the prior pass's fork). So this job:
#   - stays behind the explicit `RUN_INFRA_TESTS=true` opt-in (never runs on
#     an ordinary MR pipeline);
#   - ALSO carries `allow_failure: true` — even when someone opts in on a
#     pipeline whose runner happens to reach `localhost:1234`, a transient
#     unreachable-judge failure must not redden a shared pipeline for
#     everyone else. This is a quality CHECK, not a merge-blocking gate.
# The supported, documented path for real signal is a LOCAL run:
# `apps/harness/eval/README.md` §"Run the release gate locally (the supported
# path)" has the exact command.
harness-eval-gate:
  stage: test
  image: python:3.11-slim
  tags: [test]
  needs:
    - job: lint-python
      optional: true
  # OWNER DECISION: this is a local/scheduled
  # quality CHECK, not a blocking shared-CI job — LM Studio has no CI-runnable
  # image, and the owner declined to stand up a dedicated self-hosted runner
  # for it. `allow_failure: true` means an accidental RUN_INFRA_TESTS=true
  # opt-in on a pipeline that can't reach :1234 never reddens the pipeline for
  # everyone else; the `rules:` gate below is what actually keeps it off
  # ordinary pipelines. The supported way to get a real, blocking verdict is
  # the LOCAL invocation documented in apps/harness/eval/README.md.
  allow_failure: true
  # flake policy, narrower than the .build-template
  # exemplar (templates.yml:113-128) on purpose: this GitLab-level retry
  # covers ONLY runner/infra flakes (never `script_failure`). A `script_failure`
  # here can legitimately mean "a golden-set note scored below threshold" or
  # "the judge backend never recovered" (harness.eval.judge.base.JudgeConnectionError,
  # already raised after JudgeConfig.transient_retries is exhausted at the
  # app level — see apps/harness/src/harness/eval/judge/providers.py and
  # src/harness/tests/unit/eval/test_judge_transport.py) — retrying either as
  # if it were a flake would silently launder a real quality/connectivity
  # failure into a pass. Only the runner itself dying counts as a flake here.
  retry:
    max: 2
    when: [runner_system_failure, stuck_or_timeout_failure]
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
    PROMPTFOO_DISABLE_TELEMETRY: "1"
    PROMPTFOO_DISABLE_UPDATE: "1"
    PROMPTFOO_DISABLE_SHARING: "1"
    # Judge provider/model selection is fail-closed (06-python-services.md
    # §Configuration): explicit CI variables, never a silent fallback to
    # config.py's shared `JudgeConfig.model` code default (currently
    # `gemma-4-e2b-it-qat`, cross-cutting owner-standardized
    # default for text.live/finalize/test/harness.judge — deliberately NOT
    # changed by this ticket, "Why config.py's default was not
    # touched"). This job's judge model is own explicit choice.
    HARNESS_JUDGE_PROVIDER: "openai_compat"
    # LM-Studio-shaped endpoint — the SAME default OpenAICompatJudgeConfig
    # already ships in code (config.py). Set explicitly here anyway per the
    # fail-closed-selection rule above: this value, not an implicit default,
    # is what makes the endpoint choice legible from the CI file alone.
    HARNESS_JUDGE_OPENAI_COMPAT_BASE_URL: "http://localhost:1234/v1"
    HARNESS_JUDGE_MODEL: "google/gemma-4-e4b"
    HARNESS_JUDGE_TEMPERATURE: "0.0"
    HARNESS_JUDGE_SEED: "7"
    # The completion budget must stay <= the judge's LOADED context window, or
    # LM Studio rejects/terminates the request (`400 {'error':'terminated'}` —
    # Operational notes for gemma-4-e4b on LM Studio). The 3072 this
    # job once used was sized for a 4096-ctx load; measured 2026-08-17 on the
    # owner's instance, gemma-4-e4b loads at its full 131072 ctx (max 131072),
    # so 16384 is comfortably within the ceiling. `apps/harness/eval/run-gate.sh`
    # re-checks this at run time against the endpoint's reported
    # `loaded_context_length` and warns rather than failing 10 minutes in.
    HARNESS_JUDGE_MAX_TOKENS: "16384"
    HARNESS_JUDGE_OUTPUT_MODE: "score"
    # TASK-968 — `HARNESS_JUDGE_SUPPRESS_REASONING: "true"` used to sit here. The variable is
    # GONE (the judge's reasoning posture is platform configuration now, not env), and the
    # behaviour it bought is the DEFAULT: `JudgeConfig.reasoning_mode` is `none`, which appends
    # the same `/no_think` + JSON-only directive. This gate deliberately runs on that in-code
    # floor rather than pulling the control plane — no gateway is reachable from a CI job, and a
    # gate wants one fixed, reproducible posture. Setting the old name here would now be inert.
    # LM Studio rejects `response_format={"type":"json_object"}` on this
    # build (HTTP 400 "must be json_schema or text") — required for the
    # faithfulness claim-extract/verify json_mode calls to succeed at all.
    HARNESS_JUDGE_OPENAI_COMPAT_JSON_RESPONSE_FORMAT: "text"
    HARNESS_JUDGE_TIMEOUT_S: "90"
    # Step 2 (promptfoo) reads its cases from HARNESS_GOLDEN_SET_PATH and
    # otherwise falls back to the 5-case `synthetic_v0.json`. Unset, the two
    # steps of this job silently scored DIFFERENT golden sets — step 1 the
    # 18-case curated_v1, step 2 the 5-case synthetic_v0 — despite
    # promptfooconfig.yaml's own comment claiming they stay on the same set
    # (found 2026-08-17 running the gate end to end).
    # Pinned here so both steps score the same 18 cases. ABSOLUTE on purpose:
    # tests.py does a bare `Path(override)`, and step 2 runs after
    # `cd eval/promptfoo`, so a repo-relative value would not resolve.
    HARNESS_GOLDEN_SET_PATH: "$CI_PROJECT_DIR/apps/harness/src/harness/eval/golden/fixtures/curated_v1.json"
    # LM Studio is one desktop-app process, not a multi-slot server like the
    # rejected llama.cpp container — no parallel decode slots to exploit.
    # harness.core.llm_concurrency's own default cap is 1 for exactly this
    # reason ("the burst-resistant sequential behaviour LM Studio tolerated
    # in the earlier runs"); case_concurrency defaults to 1 too. Left unset
    # here to inherit both defaults rather than re-asserting them.
    #
    # release-gate thresholds: EvalConfig's CODE DEFAULTS
    # (icc_threshold=0.73, faithfulness_threshold=0.85, pdsqi_*_threshold=4.0,
    # icc_gate_enabled=true) are used UNCHANGED — no CI override.
    #
    # OWNER RULING: after six sessions rebuilding the golden set to best practice
    # History): after six sessions rebuilding the golden set to best practice
    # and making judge selection DB-resident, the measured ICC against the
    # real `curated-v2.0.0` golden set (36 cases, n=288 paired ratings) is
    # **`icc=0.7306`** (Gwet AC2 0.9196) — short of the literature-derived
    # 0.80 target but a real, reproduced (2026-08-18) reading, not a
    # structurally-uninformative one. The owner LOWERED `icc_threshold` to
    # **0.73** (the measured baseline, rounded down) rather than relax it
    # further or disable the gate — this is a recorded floor certifying
    # "no worse than 2026-08-20", not a claim of clinical validation.
    # Gate now **PASSES** at this baseline: `icc=0.7306 >= 0.73`; everything
    # else already cleared with margin (pdsqi_mean=4.875, accurate/thorough
    # =4.833, faithfulness=0.9938). Raising the bar back to 0.80 is tracked
    # as explicit debt
    # (needs a reasoning-capable judge or a clinician-reviewed, not
    # rubric-derived, reference set). Nothing else here was touched: the
    # judge model, `icc_gate_enabled`, and the other three thresholds are
    # unchanged from the state this job already documented.
  cache:
    - key: pip-harness-eval-gate
      paths:
        - .pip-cache/
      policy: pull-push
      fallback_keys:
        - pip-harness
        - pip-$CI_DEFAULT_BRANCH
  script:
    - pip install --quiet --retries 5 --timeout 120 packages/py-runtime-models
    - pip install --quiet --retries 5 --timeout 120 packages/py-env
    - pip install --quiet --retries 5 --timeout 120 packages/py-obs
    # `apps/harness` declares hope-async-contract as a workspace dependency
    # (pyproject.toml:70,76). It is not on PyPI, so pip resolves it only when it is
    # installed from the workspace first — exactly as `test-text` already does for
    # the same package. Without this the job dies at install with
    # "No matching distribution found for hope-async-contract".
    - pip install --quiet --retries 5 --timeout 120 packages/py-async-contract
    - cd apps/harness
    - pip install --quiet --retries 5 --timeout 120 ".[test,eval]"
    - echo "── checking judge backend reachability (LM Studio, $HARNESS_JUDGE_OPENAI_COMPAT_BASE_URL) ──"
    - >
      curl -sf --max-time 5 "$HARNESS_JUDGE_OPENAI_COMPAT_BASE_URL/models" ||
      (echo "LM Studio judge backend unreachable at $HARNESS_JUDGE_OPENAI_COMPAT_BASE_URL — this runner needs LM Studio reachable at :1234" && exit 1)
    - echo "── 1/2 — harness.eval.ci PDSQI-9/faithfulness/ICC gate (curated_v1, live LM Studio judge) ──"
    - python -m harness.eval.ci --golden-set src/harness/eval/golden/fixtures/curated_v1.json --output ../../eval-report.json
    - echo "── 2/2 — promptfoo PDSQI-9 output-contract gate (offline mock provider) ──"
    - apt-get update -qq && apt-get install -y --no-install-recommends nodejs npm >/dev/null
    - cd eval/promptfoo
    - PROMPTFOO_PYTHON=python npx --yes promptfoo@0.121.15 eval -c promptfooconfig.yaml --no-cache --no-table
  artifacts:
    when: always
    paths:
      - eval-report.json
    expire_in: 30 days
  rules:
    # Disabled by default: this gate is a
    # local/scheduled quality check, not a per-MR blocking job — no
    # CI-runnable LM Studio image exists, and the owner declined to provision
    # a dedicated self-hosted runner for it. Opt in with RUN_INFRA_TESTS=true
    # only on a pipeline/runner that genuinely has LM Studio reachable at
    # :1234 (e.g. a manually-triggered scheduled pipeline on such a machine);
    # `allow_failure: true` above is the second layer in case that opt-in
    # happens where the judge isn't reachable. The supported way to get a
    # real verdict is the LOCAL invocation in apps/harness/eval/README.md.
    - if: $RUN_INFRA_TESTS != "true"
      when: never
    - if: $SKIP_TESTS == "true"
      when: never
    - if: $SKIP_TESTS_PY == "true"
      when: never
    - !reference [.rules-harness, rules]

# ── API E2E tests (Playwright) ──────────────────────────────────────────────
#
# Boots the NestJS API against the shared test database + Redis and exercises
# the Playwright specs under `apps/api/tests/e2e/`. Currently locked to the
# tenant-access-control spec — the smallest blast radius
# that proves the boot pattern works. Future tickets can broaden the glob
# once this job is stable.
#
# Prerequisites (provided by CI/CD Variables, identical to test-api):
#   CI_DATABASE_URL, CI_REDIS_URL, CI_REDIS_PASS, CI_JWT_SECRET,
#   CI_API_KEY_PEPPER
#
# Schema reset + seed is delegated to the `prepare-test-db` job (Phase 2).
# `RESET_DB=false` keeps the Playwright global-setup from re-pushing the
# schema mid-run.

test-api-e2e:
  stage: test
  image: mcr.microsoft.com/playwright:v1.62.1-noble
  tags: [test]
  # Ignored: boots the full API and needs test infra + secrets we don't
  # provision (Redis via CI_REDIS_URL, CI_JWT_SECRET, CI_API_KEY_PEPPER).
  # Runs but does not block the pipeline; re-enable by removing this once the
  # test Redis + secrets are available.
  allow_failure: true
  # Declared explicitly: this job does not extend .test-node-base (custom image).
  id_tokens: !reference [.vault-oidc-id-token, id_tokens]
  cache:
    - key:
        files:
          - pnpm-lock.yaml
      paths:
        - node_modules/
        - apps/*/node_modules/
        - packages/*/node_modules/
      policy: pull
  before_script:
    - !reference [.vault-oidc, before_script]
    - corepack enable
    - corepack install -g --cache-only .gitlab/corepack/pnpm-10.34.5.tgz
    - pnpm config set store-dir /pnpm-store
    - pnpm install --frozen-lockfile --prefer-offline
  needs:
    - job: install-node
      optional: true
    - job: lint-ts
      optional: true
      artifacts: false
    - job: prepare-test-db
      optional: true
      artifacts: false
    - job: test-api
      optional: true
      artifacts: false
  variables:
    <<: *test-env-vars
    VAULT_SECRETS: !reference [.vault-secret-sets, ci-full]
    RESET_DB: "false"
    # Schema+seed already done by prepare-test-db
    SKIP_DB_PRECHECK: "true"
    PRISMA_USER_CONSENT_FOR_DANGEROUS_AI_ACTION: "yes"
    CI: "true"
  script:
    - echo "── Test infra → PostgreSQL=${CI_DATABASE_URL:+set} Redis=${CI_REDIS_URL:+set} ──"
    - pnpm --filter @arcaai/database db:generate
    - pnpm turbo build --filter=@arcaai/database
    - pnpm turbo build --filter=@arcaai/exceptions
    - pnpm turbo build --filter=@arcaai/logger
    - pnpm turbo build --filter=@arcaai/domains
    - pnpm turbo build --filter=@arcaai/applications
    - pnpm turbo build --filter=@arcaai/api
    - echo "── Booting API in background..."
    - pnpm --filter @arcaai/api start > api.log 2>&1 &
    - echo $! > api.pid
    - echo "── Waiting for API health endpoint (60s timeout)..."
    - |
      for i in $(seq 1 60); do
        if wget -q -O- "${API_URL}/api/v1/health" >/dev/null 2>&1; then
          echo "  ✓ API is healthy after ${i}s"
          break
        fi
        if [ "$i" -eq 60 ]; then
          echo "  ✗ API did not become healthy in 60s — dumping log:"
          tail -200 api.log || true
          exit 1
        fi
        sleep 1
      done
    - echo "── Running Playwright tenant-access-control spec..."
    - pnpm exec playwright install chromium
    - pnpm exec playwright test apps/api/tests/e2e/tenant-access-control.spec.ts --project=api-tests --reporter=line
  after_script:
    - if [ -f api.pid ]; then kill "$(cat api.pid)" 2>/dev/null || true; fi
  artifacts:
    when: on_failure
    paths:
      - test-results/
      - api.log
    expire_in: 30 days
  rules:
    # Disabled: boots the full API and needs test infra + secrets we don't
    # provision (Redis via CI_REDIS_URL, CI_JWT_SECRET, CI_API_KEY_PEPPER).
    # Re-enable by setting RUN_INFRA_TESTS=true on the pipeline.
    - if: $RUN_INFRA_TESTS != "true"
      when: never
    - if: $SKIP_TESTS == "true"
      when: never
    - if: $SKIP_TESTS_TS == "true"
      when: never
    - !reference [.rules-always, rules]
    - !reference [.rules-cicd-always, rules]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths:
          - apps/api/**/*
          - packages/applications/src/services/tenant/**/*
          - packages/applications/src/authorization/**/*
          - packages/database/src/prisma/db_main/seed/**/*
          - .gitlab/ci/test.yml
        compare_to: refs/heads/main
    - if: $PIPELINE_TYPE == "dev"
    - if: $PIPELINE_TYPE == "staging" || $PIPELINE_TYPE == "main"
      changes:
        - apps/api/**/*
        - packages/applications/src/services/tenant/**/*
        - packages/applications/src/authorization/**/*
        - packages/database/src/prisma/db_main/seed/**/*

# ── NLP tests (pytest) ──────────────────────────────────────────────────────

test-nlp:
  stage: test
  image: python:3.11-slim
  # Ignored: references DATABASE_URL/REDIS_URL and no dedicated test infra
  # (esp. Redis) is provisioned. Runs but does not block the pipeline.
  # allow_failure removed — verified green under CI-shaped env
  tags: [test]
  id_tokens: !reference [.vault-oidc-id-token, id_tokens]
  before_script:
    - !reference [.vault-oidc, before_script]
  needs:
    - job: lint-python
      optional: true
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
    VAULT_SECRETS: >-
      ci/DATABASE_URL=DATABASE_URL
      ci/DATABASE_URL=TEST_DATABASE_URL
      ci/REDIS_URL=REDIS_URL
      ci/REDIS_URL=TEST_REDIS_URL
    DATABASE_URL: $CI_DATABASE_URL
    TEST_DATABASE_URL: $CI_DATABASE_URL
    REDIS_URL: $CI_REDIS_URL
    TEST_REDIS_URL: $CI_REDIS_URL
  cache:
    - key: pip-nlp
      paths:
        - .pip-cache/
      policy: pull-push
      fallback_keys:
        - pip-$CI_DEFAULT_BRANCH
  script:
    - echo "── Test infra → PostgreSQL=${CI_DATABASE_URL:+set} Redis=${CI_REDIS_URL:+set} ──"
    - pip install --quiet --retries 5 --timeout 120 packages/py-runtime-models
    - pip install --quiet --retries 5 --timeout 120 packages/py-env
    - pip install --quiet --retries 5 --timeout 120 packages/py-obs
    # `llama-cpp-python` (MiniCheck GGUF scorer) publishes NO wheels — pip
    # always builds it from sdist via scikit-build-core/CMake, which fails in
    # `python:3.11-slim` with "Could not find the compiler specified in CC:
    # gcc". Same toolchain apps/nlp/Dockerfile installs for the same reason.
    # The built wheel lands in PIP_CACHE_DIR, so only the first run pays.
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends build-essential
    - cd apps/nlp
    - pip install --quiet --retries 5 --timeout 120 --index-url https://download.pytorch.org/whl/cpu "torch>=2.1.0"
    - pip install --quiet --retries 5 --timeout 120 ".[test]"
    - python -m pytest tests/ -v --tb=short --junitxml=../../junit-nlp.xml -x
  artifacts:
    when: always
    reports:
      junit: junit-nlp.xml
    expire_in: 30 days
  rules:
    - if: $SKIP_TESTS == "true"
      when: never
    - if: $SKIP_TESTS_PY == "true"
      when: never
    - !reference [.rules-nlp, rules]

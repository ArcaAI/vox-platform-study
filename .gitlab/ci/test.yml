# ══════════════════════════════════════════════════════════════════════════════
# Test stage — unit + integration tests for all services
# ══════════════════════════════════════════════════════════════════════════════
#
# External Test Infrastructure (on 10.10.1.0/24 — reachable from GitLab Runner):
#   PostgreSQL HA:  10.10.1.250:5000  (HAProxy R/W VIP)
#   Redis Dev:      10.10.1.120:6379  (DB 8 reserved for CI tests)
#
# Connection details are set via CI/CD variables (Settings → CI/CD → Variables):
#   CI_DATABASE_URL       — postgresql://user:pass@10.10.1.250:5000/vox_dev?schema=public
#   CI_REDIS_URL          — redis://:pass@10.10.1.120:6379/8
#   CI_REDIS_PASS         — Redis password (masked)
#   CI_JWT_SECRET         — test JWT secret (masked)
#   CI_API_KEY_PEPPER     — test API key pepper (masked)
#
# Database-dependent tests (test-api) use CI_DATABASE_URL from GitLab Variables.
# The prepare-test-db job resets the schema + seeds before tests run.
# ══════════════════════════════════════════════════════════════════════════════

# ── Skip controls ────────────────────────────────────────────────────────────
# Set SKIP_TESTS=true to skip ALL test jobs, or use the granular variants:
#   SKIP_TESTS_TS — skip TypeScript tests (test-api, test-packages, test-sdk, test-apps, test-ui-ct)
#   SKIP_TESTS_PY — skip Python tests (test-stt, test-text, test-guardrail, test-nlp, test-harness)
#
# Usage:
#   GitLab UI → Run pipeline → add variable SKIP_TESTS = true
#   git push -o ci.variable="SKIP_TESTS=true"

# ── Shared test variables (anchored for reuse) ──────────────────────────────

.test-env-vars: &test-env-vars
  NODE_ENV: "test"
  CI: "true"
  DATABASE_URL: $CI_DATABASE_URL
  REDIS_URL: $CI_REDIS_URL
  REDIS_PASS: $CI_REDIS_PASS
  JWT_SECRET_KEY: $CI_JWT_SECRET
  JWT_SECRET: $CI_JWT_SECRET
  API_KEY_PEPPER: $CI_API_KEY_PEPPER
  SESSION_SECRET_KEY: $CI_JWT_SECRET
  LOG_LEVEL: "error"
  LOG_FILE_ENABLED: "false"
  OTEL_TRACES_ENABLED: "false"
  OTEL_METRICS_ENABLED: "false"
  PORT: "8868"
  API_PORT: "8868"
  API_URL: "http://localhost:8868"
  STT_PORT: "8861"
  STT_URL: "http://localhost:8861"
  TEXT_PORT: "8862"
  TEXT_URL: "http://localhost:8862"
  NLP_PORT: "8864"
  NLP_URL: "http://localhost:8864"
  GUARDRAIL_URL: "http://localhost:8863"
  HARNESS_URL: "http://localhost:8866"

# ── API unit tests (NestJS / Vitest) ─────────────────────────────────────────

test-api:
  stage: test
  extends: .test-node-base
  needs:
    - job: install-node
      optional: true
    - job: lint-ts
      optional: true
      artifacts: false
    - job: prepare-test-db
      optional: true
      artifacts: false
  variables:
    <<: *test-env-vars
    # Vault supplies these when VAULT_ADDR is set; the
    # *test-env-vars mappings above remain the fallback. `.test-node-base`
    # carries the fetch step, which exports over the variables of the same name.
    VAULT_SECRETS: !reference [.vault-secret-sets, ci-full]
  script:
    - echo "── Test infra → PostgreSQL=${CI_DATABASE_URL:+set} Redis=${CI_REDIS_URL:+set} ──"
    - pnpm --filter @arcaai/database db:generate
    - pnpm turbo build --filter=@arcaai/database
    - pnpm turbo build --filter=@arcaai/exceptions
    - pnpm turbo build --filter=@arcaai/logger
    - pnpm turbo build --filter=@arcaai/domains
    - pnpm turbo build --filter=@arcaai/applications
    - pnpm --filter @arcaai/api test -- --reporter=junit --outputFile=junit-api.xml
  artifacts:
    when: always
    reports:
      junit: junit-api.xml
    expire_in: 30 days
  rules:
    - if: $SKIP_TESTS == "true"
      when: never
    - if: $SKIP_TESTS_TS == "true"
      when: never
    - !reference [.rules-api, rules]

# ── Shared package tests (Vitest) ───────────────────────────────────────────

test-packages:
  stage: test
  extends: .test-node-base
  needs:
    - job: install-node
      optional: true
    - job: lint-ts
      optional: true
      artifacts: false
  variables:
    <<: *test-env-vars
    # Live-Postgres CAS guard below needs the data plane; no tokens are minted.
    VAULT_SECRETS: !reference [.vault-secret-sets, ci-data-plane]
  script:
    - echo "── Test infra → PostgreSQL=${CI_DATABASE_URL:+set} Redis=${CI_REDIS_URL:+set} ──"
    - pnpm --filter @arcaai/database db:generate
    - pnpm turbo build --filter=@arcaai/database
    - pnpm turbo build --filter=@arcaai/exceptions
    - pnpm turbo build --filter=@arcaai/logger
    - pnpm turbo build --filter=@arcaai/domains
    # `@arcaai/domains` is included so the
    # permanent Postgres regression guard for optimistic-locking CAS runs in
    # CI. DATABASE_URL is supplied via *test-env-vars; when set the
    # `updateWithVersion.postgres.test.ts` file exercises a live Postgres and
    # asserts the `_version` predicate is emitted verbatim by the driver
    # (defense against Prisma #10207 / #28840 on a future driver migration).
    # `@arcaai/applications` (180 unit specs, mocked repositories) is
    # included so the application-service layer is exercised in CI, matching the
    # local `pnpm test` (turbo) fan-out. Its workspace deps (exceptions/logger/
    # domains) are built above.
    - pnpm turbo test --filter=@arcaai/logger --filter=@arcaai/utils --filter=@arcaai/pipeline --filter=@arcaai/domains --filter=@arcaai/applications
  rules:
    - if: $SKIP_TESTS == "true"
      when: never
    - if: $SKIP_TESTS_TS == "true"
      when: never
    - !reference [.rules-always, rules]
    - !reference [.rules-cicd-always, rules]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths:
          - packages/**/*
        compare_to: refs/heads/main
    - if: $PIPELINE_TYPE == "dev"
    - if: $PIPELINE_TYPE == "staging" || $PIPELINE_TYPE == "main" || $PIPELINE_TYPE == "feature"
      changes:
        - packages/**/*

# ── SDK + UI package tests (Vitest) ─────────────────────────────────────────

test-sdk:
  stage: test
  extends: .test-node-base
  # Ignored while a real unit regression is outstanding (live-transcript Lexical
  # editor). Runs but does not block the pipeline.
  allow_failure: false
  needs:
    - job: install-node
      optional: true
    - job: lint-ts
      optional: true
      artifacts: false
  variables:
    <<: *test-env-vars
  script:
    - echo "── Test infra → PostgreSQL=${CI_DATABASE_URL:+set} Redis=${CI_REDIS_URL:+set} ──"
    # --concurrency=2: turbo defaults to one task per core, so the @arcaai/ui
    # build (tsup + tsc over 57 primitives) ran alongside the vox build and the
    # vitest workers and was OOM-killed (exit 137). Peak RSS, not total work,
    # is the constraint on this shared runner.
    - pnpm turbo build --concurrency=2 --filter=@arcaai/utils
    - pnpm turbo test --concurrency=2 --filter=@arcaai/vox --filter=@arcaai/vox-node --filter=@arcaai/room --filter=@arcaai/vad --filter=@arcaai/stt --filter=@arcaai/noise-filter --filter=@arcaai/med-ner --filter=@arcaai/ui
  rules:
    - if: $SKIP_TESTS == "true"
      when: never
    - if: $SKIP_TESTS_TS == "true"
      when: never
    - !reference [.rules-always, rules]
    - !reference [.rules-cicd-always, rules]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths:
          - packages/ui/**/*
          - packages/room/**/*
          - packages/vad/**/*
          - packages/stt/**/*
          - packages/noise-filter/**/*
          - packages/agentic-sdk-v2/**/*
          - packages/med-ner/**/*
          - packages/utils/**/*
        compare_to: refs/heads/main
    - if: $PIPELINE_TYPE == "release_sdk"
    - if: $PIPELINE_TYPE == "dev"
    - if: $PIPELINE_TYPE == "staging" || $PIPELINE_TYPE == "main" || $PIPELINE_TYPE == "feature"
      changes:
        - packages/ui/**/*
        - packages/room/**/*
        - packages/vad/**/*
        - packages/stt/**/*
        - packages/noise-filter/**/*
        - packages/agentic-sdk-v2/**/*
        - packages/med-ner/**/*

# ── Admin Console (Next.js) unit tests ──────────────────────────────────────
#
# F-039 — the 1,100+ file Vitest unit suite (jsdom/happy-dom projects, fully
# hermetic: no DB/Redis/API dependency — verified locally) previously ran in
# NO CI job; `admin-console` appeared only in build.yml (Docker image build).
# This job runs `vitest run` directly with `pnpm --filter`, NOT via
# `pnpm turbo test` — turbo's `test` task `dependsOn: ["build"]`, which for
# this Next.js app would force a full `next build` (needs
# NEXT_PUBLIC_API_HOST and other build-time env not provisioned in the test
# stage) purely to reach the test task; that build is already covered
# separately by the `build-admin-console` Docker job. Scope is UNIT TESTS
# ONLY: the ~37-file Playwright e2e suite needs a composed stack (API + BFF +
# seeded DB) and is intentionally NOT run here — it remains local-discipline
# until a nightly/scheduled job is built for it.

test-admin-console:
  stage: test
  extends: .test-node-base
  # Ignored while a real unit regression is outstanding (harness-workflows-screen
  # stays in its skeleton state). Runs but does not block the pipeline.
  allow_failure: false
  needs:
    - job: install-node
      optional: true
    - job: lint-ts
      optional: true
      artifacts: false
  variables:
    <<: *test-env-vars
  script:
    - pnpm turbo build --concurrency=2 --filter=@arcaai/admin-console^...
    # --maxWorkers=2: 178 test files across two projects spawned one worker per
    # core next to every other test job on this runner; the suite took 252s
    # (2070s of import time) and tests started tripping the timeout.
    # `pnpm --filter <pkg> test -- <flag>` does NOT forward the flag (same trap
    # as db:migrate:create); `exec` runs the binary directly so it lands.
    - pnpm --filter @arcaai/admin-console exec vitest run --maxWorkers=2
  rules:
    - if: $SKIP_TESTS == "true"
      when: never
    - if: $SKIP_TESTS_TS == "true"
      when: never
    - !reference [.rules-admin-console, rules]

test-compat-playground:
  stage: test
  extends: .test-node-base
  needs:
    - job: install-node
      optional: true
    - job: lint-ts
      optional: true
      artifacts: false
  variables:
    <<: *test-env-vars
  script:
    - pnpm turbo build --filter=@arcaai/compat-playground^...
    - pnpm --filter @arcaai/compat-playground test
  rules:
    - if: $SKIP_TESTS == "true"
      when: never
    - if: $SKIP_TESTS_TS == "true"
      when: never
    - !reference [.rules-compat-playground, rules]

# ── UI component tests (Playwright Component Testing) ───────────────────────
#
# @arcaai/ui ships 84 Playwright-CT specs (1729 cases) that mount
# components in a real browser. They need the Playwright browser image, so this
# job is gated on packages/ui changes and kept NON-BLOCKING (`allow_failure`)
# initially to avoid blocking MRs on browser-runner cost/flakiness. Flip
# `allow_failure` to false once it has proven stable on the integration branches.
# In CI the CT config runs Chromium + Firefox + WebKit (all preinstalled in the
# image) for cross-browser coverage.

test-ui-ct:
  stage: test
  image: mcr.microsoft.com/playwright:v1.62.1-noble
  tags: [test]
  allow_failure: true
  variables:
    NODE_OPTIONS: "--max-old-space-size=4096"
  cache:
    - key:
        files:
          - pnpm-lock.yaml
      paths:
        - node_modules/
        - apps/*/node_modules/
        - packages/*/node_modules/
      policy: pull
  before_script:
    - corepack enable
    - corepack install -g --cache-only .gitlab/corepack/pnpm-10.34.5.tgz
    - pnpm config set store-dir /pnpm-store
    - pnpm install --frozen-lockfile --prefer-offline
  needs:
    - job: install-node
      optional: true
    - job: lint-ts
      optional: true
      artifacts: false
  script:
    - pnpm --filter @arcaai/ui test:ct
  artifacts:
    when: on_failure
    paths:
      - packages/ui/test-results/
    expire_in: 30 days
  rules:
    # Disabled: Playwright cross-browser CT is very slow (30-min timeout).
    # Re-enable by setting RUN_UI_CT=true on the pipeline.
    - if: $RUN_UI_CT != "true"
      when: never
    - if: $SKIP_TESTS == "true"
      when: never
    - if: $SKIP_TESTS_TS == "true"
      when: never
    - !reference [.rules-always, rules]
    - !reference [.rules-cicd-always, rules]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths:
          - packages/ui/**/*
        compare_to: refs/heads/main
    - if: $PIPELINE_TYPE == "dev"
    - if: $PIPELINE_TYPE == "staging" || $PIPELINE_TYPE == "main"
      changes:
        - packages/ui/**/*

# ── STT tests (pytest) ───────────────────────────────────────────────────

test-stt:
  stage: test
  image: python:3.11-slim
  # Ignored: references DATABASE_URL/REDIS_URL and no dedicated test infra
  # (esp. Redis) is provisioned. Runs but does not block the pipeline.
  # allow_failure removed — verified green under CI-shaped env
  tags: [test]
  # python:3.11-slim ships neither curl nor wget; vault-login.sh falls back to
  # python3 for both transport and JSON, so no package install is needed here.
  id_tokens: !reference [.vault-oidc-id-token, id_tokens]
  before_script:
    - !reference [.vault-oidc, before_script]
  needs:
    - job: lint-python
      optional: true
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
    # One Vault path can feed several env names — the aliases below are the
    # same credential under different reader-specific names, exactly as the
    # $CI_DATABASE_URL fan-out already is.
    VAULT_SECRETS: >-
      ci/DATABASE_URL=DATABASE_URL
      ci/DATABASE_URL=TEST_DATABASE_URL
      ci/REDIS_URL=REDIS_URL
    DATABASE_URL: $CI_DATABASE_URL
    TEST_DATABASE_URL: $CI_DATABASE_URL
    REDIS_URL: $CI_REDIS_URL
    TEST_REDIS_URL: $CI_REDIS_URL
  cache:
    - key: pip-stt
      paths:
        - .pip-cache/
      policy: pull-push
      fallback_keys:
        - pip-$CI_DEFAULT_BRANCH
  script:
    - echo "── Test infra → PostgreSQL=${CI_DATABASE_URL:+set} Redis=${CI_REDIS_URL:+set} ──"
    - pip install --quiet --retries 5 --timeout 120 packages/py-runtime-models
    - pip install --quiet --retries 5 --timeout 120 packages/py-env
    - pip install --quiet --retries 5 --timeout 120 packages/py-otel
    - cd apps/stt
    - pip install --quiet --retries 5 --timeout 120 ".[test]"
    - python -m pytest tests/unit/ -v --tb=short --junitxml=../../junit-stt.xml
    - python -m pytest tests/ -v --tb=short --junitxml=../../junit-stt.xml --ignore=tests/e2e/ --ignore=tests/integration/ -x
  artifacts:
    when: always
    reports:
      junit: junit-stt.xml
    expire_in: 30 days
  rules:
    - if: $SKIP_TESTS == "true"
      when: never
    - if: $SKIP_TESTS_PY == "true"
      when: never
    - !reference [.rules-stt, rules]

# ── SMR tests (pytest) ──────────────────────────────────────────────────────

test-text:
  stage: test
  image: python:3.11-slim
  # allow_failure removed — the suite is green under a CI-shaped env
  # (1134 passed). It was masking two stale SSE tests that stubbed the
  # pre-TASK-636 read_chunks_blocking: the unstubbed real method returned a
  # MagicMock (truthy, iterates empty), so the endpoint's generator looped
  # forever and the job was OOM-killed ~15 min in, which `-x` then reported as
  # an infra failure. A hang must not be silently tolerated again.
  tags: [test]
  id_tokens: !reference [.vault-oidc-id-token, id_tokens]
  before_script:
    - !reference [.vault-oidc, before_script]
  needs:
    - job: lint-python
      optional: true
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
    VAULT_SECRETS: >-
      ci/DATABASE_URL=DATABASE_URL
      ci/DATABASE_URL=TEST_DATABASE_URL
      ci/DATABASE_URL=SUMMARY_AGENT_DATABASE_URL
      ci/REDIS_URL=REDIS_URL
      ci/REDIS_URL=TEST_REDIS_URL
      ci/REDIS_URL=SUMMARY_AGENT_REDIS_URL
      ci/REDIS_URL=CELERY_BROKER_URL
      ci/REDIS_URL=CELERY_RESULT_BACKEND
    DATABASE_URL: $CI_DATABASE_URL
    TEST_DATABASE_URL: $CI_DATABASE_URL
    REDIS_URL: $CI_REDIS_URL
    TEST_REDIS_URL: $CI_REDIS_URL
    SUMMARY_AGENT_DATABASE_URL: $CI_DATABASE_URL
    SUMMARY_AGENT_REDIS_URL: $CI_REDIS_URL
    CELERY_BROKER_URL: $CI_REDIS_URL
    CELERY_RESULT_BACKEND: $CI_REDIS_URL
  cache:
    - key: pip-text
      paths:
        - .pip-cache/
      policy: pull-push
      fallback_keys:
        - pip-$CI_DEFAULT_BRANCH
  script:
    - echo "── Test infra → PostgreSQL=${CI_DATABASE_URL:+set} Redis=${CI_REDIS_URL:+set} ──"
    - pip install --quiet --retries 5 --timeout 120 packages/py-runtime-models
    - pip install --quiet --retries 5 --timeout 120 packages/py-env
    - pip install --quiet --retries 5 --timeout 120 packages/py-otel
    - cd apps/text
    - pip install --quiet --retries 5 --timeout 120 ".[test]"
    - PYTHONPATH=src python -m pytest src/text/tests/ -v --tb=short --junitxml=../../junit-text.xml -x
  artifacts:
    when: always
    reports:
      junit: junit-text.xml
    expire_in: 30 days
  rules:
    - if: $SKIP_TESTS == "true"
      when: never
    - if: $SKIP_TESTS_PY == "true"
      when: never
    - !reference [.rules-text, rules]


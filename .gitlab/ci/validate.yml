# ══════════════════════════════════════════════════════════════════════════════
# Validate stage — fast feedback (lint + type-check)
# ══════════════════════════════════════════════════════════════════════════════
#
# IMPORTANT: Prisma client must be generated BEFORE any turbo build/lint.
# turbo's `build` depends on `^db:generate` (upstream packages), but
# db:generate lives in @arcaai/database itself — the `^` prefix doesn't
# trigger same-package tasks. We run db:generate explicitly first.

# ── TypeScript linting (ESLint via Turborepo) ────────────────────────────────

lint-ts:
  stage: validate
  extends: .node-base
  needs:
    - job: install-node
      optional: true
  variables:
    # TASK-558 lane K (K2): `prisma generate` + `turbo lint` never OPEN a
    # connection, they only require `env("DATABASE_URL")` to resolve. This job
    # used to be handed the real CI_DATABASE_URL, putting a live credential in
    # a job that cannot use it. A syntactically-valid placeholder is enough —
    # the three `generate-*-check` jobs already run with no DATABASE_URL at all.
    DATABASE_URL: "postgresql://generate:generate@127.0.0.1:5432/generate_only?schema=public"
  script:
    - pnpm --filter @arcaai/database db:generate
    - pnpm turbo lint
  rules:
    - !reference [.skip-on-dev-2-1, rules]
    - !reference [.rules-any-ts, rules]

# ── TypeScript type-checking ─────────────────────────────────────────────────

typecheck:
  stage: validate
  extends: .node-base
  needs:
    - job: install-node
      optional: true
  variables:
    # Same reasoning as lint-ts above — typecheck compiles, it does not connect.
    DATABASE_URL: "postgresql://generate:generate@127.0.0.1:5432/generate_only?schema=public"
  script:
    - pnpm --filter @arcaai/database db:generate
    - pnpm turbo build --filter=@arcaai/database
    - pnpm turbo build --filter=@arcaai/exceptions
    - pnpm turbo build --filter=@arcaai/logger
    - pnpm turbo build --filter=@arcaai/domains
    - pnpm turbo build --filter=@arcaai/applications
    - pnpm --filter @arcaai/api exec tsc --noEmit
    # Packages exposing a `typecheck` script that is currently green. Scoped
    # rather than a repo-wide `pnpm turbo run typecheck` because @arcaai/vox
    # and @arcaai/applications still have large pre-existing backlogs; add them
    # here once those are cleared.
    - pnpm turbo run typecheck --filter=@arcaai/ui --filter=@arcaai/domains --filter=@arcaai/stt --filter=@arcaai/vox-node
  rules:
    - !reference [.skip-on-dev-2-1, rules]
    - !reference [.rules-any-ts, rules]

# ── Data-model generator drift gate ──────────────────────────────────────────
# Regenerates the domain model/enum mirror layer in-memory and fails if the
# committed packages/domains/src/**/generated files differ from generator
# output. Reads Prisma schema files directly via @prisma/internals (DMMF) — no
# database connection or `db:generate` required.
#
# TASK-368 — the generator is now the authoritative source-of-truth for the
# committed generated layer (`generate-data-model:check` is green), so this gate
# is STRICT: any drift between the Prisma schema and the committed
# packages/domains/src/**/generated files fails the pipeline. Regenerate with
# `pnpm --filter @arcaai/tools generate-data-model:all` and commit the result.

generate-data-model-check:
  stage: validate
  extends: .node-base
  needs:
    - job: install-node
      optional: true
  script:
    - pnpm --filter @arcaai/tools generate-data-model:check
  rules:
    - !reference [.skip-on-dev-2-1, rules]
    - !reference [.rules-data-model, rules]

# ── Entity layer drift gate ──────────────────────────────────────────────────
# TASK-370 — the entity generator now reproduces the hand-curated
# packages/domains/src/entities/generated layer verbatim and keeps its barrels in
# sync. This gate is STRICT: it fails the pipeline if the committed entity files
# or barrels drift from generator output (e.g. an entity added/removed without
# updating the barrel). Reconcile with `pnpm --filter @arcaai/tools generate-data-entity`.

generate-data-entity-check:
  stage: validate
  extends: .node-base
  needs:
    - job: install-node
      optional: true
  script:
    - pnpm --filter @arcaai/tools generate-data-entity:check
  rules:
    - !reference [.skip-on-dev-2-1, rules]
    - !reference [.rules-data-model, rules]

# ── Factory layer drift gate ─────────────────────────────────────────────────
# TASK-370 — the factory generator now reproduces the hand-curated
# packages/domains/src/factories/generated layer verbatim and keeps its barrels in
# sync. This gate is STRICT: it fails the pipeline if the committed factory files
# or barrels drift from generator output. Reconcile with
# `pnpm --filter @arcaai/tools generate-factory`.

generate-factory-check:
  stage: validate
  extends: .node-base
  needs:
    - job: install-node
      optional: true
  script:
    - pnpm --filter @arcaai/tools generate-factory:check
  rules:
    - !reference [.skip-on-dev-2-1, rules]
    - !reference [.rules-data-model, rules]

# ── Environment declaration drift gate ───────────────────────────────────────
# TASK-558 lane D — the same shape as the three `generate-*-check` gates above,
# for the environment surface instead of the domain layer.
#
# `pnpm env:sync` regenerates every managed artifact from ONE declared surface:
# the settings-registry descriptors plus each TypeScript deployable's own config
# module. `--check` regenerates in memory and fails, printing the first differing
# hunk, when the committed `.env.sample` files (root consolidated + per-app),
# `turbo.json#globalEnv`, or the generated docs table disagree. Reconcile with
# `pnpm env:sync` and commit.
#
# No database and no Prisma client are needed: the generator only reads
# declarations and `git ls-files`.

env-drift-check:
  stage: validate
  extends: .node-base
  needs:
    - job: install-node
      optional: true
  variables:
    # `prisma generate` loads prisma.config.ts, which guards on the presence of
    # DATABASE_URL/DIRECT_URL. Generate reads the schema and never connects, so
    # a syntactically-valid placeholder satisfies the guard on this infra-less
    # validate-stage runner (no CI_DATABASE_URL here).
    DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder?schema=public"
    DIRECT_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder?schema=public"
  script:
    # `env-sync.mts` enumerates tracked source via `git ls-files`, but the
    # node:22-alpine base ships no git — install it first.
    - apk add --no-cache git
    # `scripts/env-sync.mts` imports apps/api's env.schema, which pulls
    # `@arcaai/applications` by package name — that resolves to its built
    # `dist`, so the package (and its workspace deps) must be built first.
    # turbo resolves the upstream DAG (types/exceptions/logger/database/domains).
    - pnpm --filter @arcaai/database db:generate
    - pnpm turbo build --filter=@arcaai/applications
    - pnpm env:sync --check
  rules:
    - !reference [.skip-on-dev-2-1, rules]
    - !reference [.rules-env-declarations, rules]

# ── Python linting (ruff) ───────────────────────────────────────────────────

lint-python:
  stage: validate
  image: python:3.11-slim
  tags: [fast]
  needs: []
  script:
    - pip install --quiet ruff
    - echo "Linting Python services..."
    - ruff check apps/stt/src/ apps/stt/tests/ --output-format=gitlab || LINT_FAILED=1
    - ruff check apps/smr/src/ --output-format=gitlab || LINT_FAILED=1
    - ruff check apps/nlp/src/ apps/nlp/tests/ --output-format=gitlab || LINT_FAILED=1
    - ruff check apps/guardrail/src/ --output-format=gitlab || LINT_FAILED=1
    # TASK-414 — harness joins the gate (tests live in-package under src/).
    - ruff check apps/harness/src/ --output-format=gitlab || LINT_FAILED=1
    - ruff check apps/tts/src/ --output-format=gitlab || LINT_FAILED=1
    - |
      if [ "${LINT_FAILED:-0}" = "1" ]; then
        echo "Python lint errors found"
        exit 1
      fi
  rules:
    - !reference [.skip-on-dev-2-1, rules]
    - !reference [.rules-any-python, rules]

# ── Release tag grammar gate (TASK-648 §3.1/§5 W1) ───────────────────────────
# Rejects a `<SVC>-`/`ALL-` release tag that does not match the frozen SemVer
# grammar in packages/utils/src/version-grammar.ts. Runs only on the `release`
# pipeline type — the tag family `.gitlab-ci.yml`'s workflow rules put there
# (`^(SDK|SMR|STT|GUARD|TTS|HARNESS|API|ADMIN|NLP|ALL)-`). The SDK sub-family
# is skipped inside the script (separate, pre-existing npm-SemVer scheme). The
# other tag family, `v<X.Y.Z>` (`PIPELINE_TYPE == "tag_release"`), builds
# nothing and promotes an existing digest (see promote.sh) — out of scope here.

validate-release-tag:
  stage: validate
  extends: .node-base
  needs:
    - job: install-node
      optional: true
  script:
    - pnpm exec tsx .gitlab/ci/validate-release-tag.ts
  rules:
    - if: $PIPELINE_TYPE == "release"

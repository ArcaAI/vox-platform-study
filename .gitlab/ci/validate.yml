# ══════════════════════════════════════════════════════════════════════════════
# Validate stage — fast feedback (lint + type-check)
# ══════════════════════════════════════════════════════════════════════════════
#
# IMPORTANT: Prisma client must be generated BEFORE any turbo build/lint.
# turbo's `build` depends on `^db:generate` (upstream packages), but
# db:generate lives in @arcaai/database itself — the `^` prefix doesn't
# trigger same-package tasks. We run db:generate explicitly first.

# ── TypeScript linting (ESLint via Turborepo) ────────────────────────────────

lint-ts:
  stage: validate
  extends: .node-base
  needs:
    - job: install-node
      optional: true
  variables:
    DATABASE_URL: $CI_DATABASE_URL
  script:
    - pnpm --filter @arcaai/database db:generate
    - pnpm turbo lint
  rules:
    - !reference [.rules-any-ts, rules]

# ── TypeScript type-checking ─────────────────────────────────────────────────

typecheck:
  stage: validate
  extends: .node-base
  needs:
    - job: install-node
      optional: true
  variables:
    DATABASE_URL: $CI_DATABASE_URL
  script:
    - pnpm --filter @arcaai/database db:generate
    - pnpm turbo build --filter=@arcaai/database
    - pnpm turbo build --filter=@arcaai/exceptions
    - pnpm turbo build --filter=@arcaai/logger
    - pnpm turbo build --filter=@arcaai/domains
    - pnpm turbo build --filter=@arcaai/applications
    - pnpm --filter @arcaai/api exec tsc --noEmit
  rules:
    - !reference [.rules-any-ts, rules]

# ── Data-model generator drift gate ──────────────────────────────────────────
# Regenerates the domain model/enum mirror layer in-memory and fails if the
# committed packages/domains/src/**/generated files differ from generator
# output. Reads Prisma schema files directly via @prisma/internals (DMMF) — no
# database connection or `db:generate` required.
#
# TASK-368 — the generator is now the authoritative source-of-truth for the
# committed generated layer (`generate-data-model:check` is green), so this gate
# is STRICT: any drift between the Prisma schema and the committed
# packages/domains/src/**/generated files fails the pipeline. Regenerate with
# `pnpm --filter @arcaai/tools generate-data-model:all` and commit the result.

generate-data-model-check:
  stage: validate
  extends: .node-base
  needs:
    - job: install-node
      optional: true
  script:
    - pnpm --filter @arcaai/tools generate-data-model:check
  rules:
    - !reference [.rules-data-model, rules]

# ── Entity layer drift gate ──────────────────────────────────────────────────
# TASK-370 — the entity generator now reproduces the hand-curated
# packages/domains/src/entities/generated layer verbatim and keeps its barrels in
# sync. This gate is STRICT: it fails the pipeline if the committed entity files
# or barrels drift from generator output (e.g. an entity added/removed without
# updating the barrel). Reconcile with `pnpm --filter @arcaai/tools generate-data-entity`.

generate-data-entity-check:
  stage: validate
  extends: .node-base
  needs:
    - job: install-node
      optional: true
  script:
    - pnpm --filter @arcaai/tools generate-data-entity:check
  rules:
    - !reference [.rules-data-model, rules]

# ── Factory layer drift gate ─────────────────────────────────────────────────
# TASK-370 — the factory generator now reproduces the hand-curated
# packages/domains/src/factories/generated layer verbatim and keeps its barrels in
# sync. This gate is STRICT: it fails the pipeline if the committed factory files
# or barrels drift from generator output. Reconcile with
# `pnpm --filter @arcaai/tools generate-factory`.

generate-factory-check:
  stage: validate
  extends: .node-base
  needs:
    - job: install-node
      optional: true
  script:
    - pnpm --filter @arcaai/tools generate-factory:check
  rules:
    - !reference [.rules-data-model, rules]

# ── Python linting (ruff) ───────────────────────────────────────────────────

lint-python:
  stage: validate
  image: python:3.11-slim
  tags: [fast]
  needs: []
  script:
    - pip install --quiet ruff
    - echo "Linting Python services..."
    - ruff check apps/stt-v2/src/ apps/stt-v2/tests/ --output-format=gitlab || LINT_FAILED=1
    - ruff check apps/smr/src/ --output-format=gitlab || LINT_FAILED=1
    - ruff check apps/nlp/src/ apps/nlp/tests/ --output-format=gitlab || LINT_FAILED=1
    - ruff check apps/guardrail/src/ --output-format=gitlab || LINT_FAILED=1
    # TASK-413 — harness joins the gate (tests live in-package under src/).
    - ruff check apps/harness/src/ --output-format=gitlab || LINT_FAILED=1
    - |
      if [ "${LINT_FAILED:-0}" = "1" ]; then
        echo "Python lint errors found"
        exit 1
      fi
  rules:
    - !reference [.rules-any-python, rules]

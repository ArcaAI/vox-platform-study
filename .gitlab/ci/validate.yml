# ══════════════════════════════════════════════════════════════════════════════
# Validate stage — fast feedback (lint + type-check)
# ══════════════════════════════════════════════════════════════════════════════
#
# IMPORTANT: Prisma client must be generated BEFORE any turbo build/lint.
# turbo's `build` depends on `^db:generate` (upstream packages), but
# db:generate lives in @arcaai/database itself — the `^` prefix doesn't
# trigger same-package tasks. We run db:generate explicitly first.

# ── TypeScript linting (ESLint via Turborepo) ────────────────────────────────

lint-ts:
  stage: validate
  extends: .node-base
  needs:
    - job: install-node
      optional: true
  variables:
    # `prisma generate` + `turbo lint` never OPEN a
    # connection, they only require `env("DATABASE_URL")` to resolve. This job
    # used to be handed the real CI_DATABASE_URL, putting a live credential in
    # a job that cannot use it. A syntactically-valid placeholder is enough —
    # the three `generate-*-check` jobs already run with no DATABASE_URL at all.
    DATABASE_URL: "postgresql://generate:generate@127.0.0.1:5432/generate_only?schema=public"
  script:
    - pnpm --filter @arcaai/database db:generate
    # Concurrency is capped by TURBO_CONCURRENCY on `.node-base` (a
    # --concurrency flag here would override it).
    - pnpm turbo lint
  rules:
    - !reference [.skip-on-dev-2-1, rules]
    - !reference [.rules-any-ts, rules]

# ── TypeScript type-checking ─────────────────────────────────────────────────

typecheck:
  stage: validate
  extends: .node-base
  needs:
    - job: install-node
      optional: true
  variables:
    # Same reasoning as lint-ts above — typecheck compiles, it does not connect.
    DATABASE_URL: "postgresql://generate:generate@127.0.0.1:5432/generate_only?schema=public"
  script:
    - pnpm --filter @arcaai/database db:generate
    # Build apps/api's WHOLE upstream DAG (`^...` = dependencies only). This
    # replaced a hand-maintained subset that had drifted: it omitted
    # `@arcaai/async-contract`, so `tsc` reported TS2307 on every module
    # importing it. `^...` picks up new workspace deps automatically.
    - pnpm turbo build --filter=@arcaai/api^...
    - pnpm --filter @arcaai/api exec tsc --noEmit
    # Packages exposing a `typecheck` script that is currently green. Scoped
    # rather than a repo-wide `pnpm turbo run typecheck` because @arcaai/vox
    # and @arcaai/applications still have large pre-existing backlogs; add them
    # here once those are cleared.
    - pnpm turbo run typecheck --filter=@arcaai/ui --filter=@arcaai/domains --filter=@arcaai/stt --filter=@arcaai/vox-node
  rules:
    - !reference [.skip-on-dev-2-1, rules]
    - !reference [.rules-any-ts, rules]

# ── Data-model generator drift gate ──────────────────────────────────────────
# Regenerates the domain model/enum mirror layer in-memory and fails if the
# committed packages/domains/src/**/generated files differ from generator
# output. Reads Prisma schema files directly via @prisma/internals (DMMF) — no
# database connection or `db:generate` required.
#
# The generator is now the authoritative source-of-truth for the
# committed generated layer (`generate-data-model:check` is green), so this gate
# is STRICT: any drift between the Prisma schema and the committed
# packages/domains/src/**/generated files fails the pipeline. Regenerate with
# `pnpm --filter @arcaai/tools generate-data-model:all` and commit the result.

generate-data-model-check:
  stage: validate
  extends: .node-base
  needs:
    - job: install-node
      optional: true
  script:
    - pnpm --filter @arcaai/tools generate-data-model:check
  rules:
    - !reference [.skip-on-dev-2-1, rules]
    - !reference [.rules-data-model, rules]

# ── Entity layer drift gate ──────────────────────────────────────────────────
# The entity generator now reproduces the hand-curated
# packages/domains/src/entities/generated layer verbatim and keeps its barrels in
# sync. This gate is STRICT: it fails the pipeline if the committed entity files
# or barrels drift from generator output (e.g. an entity added/removed without
# updating the barrel). Reconcile with `pnpm --filter @arcaai/tools generate-data-entity`.

generate-data-entity-check:
  stage: validate
  extends: .node-base
  needs:
    - job: install-node
      optional: true
  script:
    - pnpm --filter @arcaai/tools generate-data-entity:check
  rules:
    - !reference [.skip-on-dev-2-1, rules]
    - !reference [.rules-data-model, rules]

# ── Factory layer drift gate ─────────────────────────────────────────────────
# The factory generator now reproduces the hand-curated
# packages/domains/src/factories/generated layer verbatim and keeps its barrels in
# sync. This gate is STRICT: it fails the pipeline if the committed factory files
# or barrels drift from generator output. Reconcile with
# `pnpm --filter @arcaai/tools generate-factory`.

generate-factory-check:
  stage: validate
  extends: .node-base
  needs:
    - job: install-node
      optional: true
  script:
    - pnpm --filter @arcaai/tools generate-factory:check
  rules:
    - !reference [.skip-on-dev-2-1, rules]
    - !reference [.rules-data-model, rules]

# ── Environment declaration drift gate ───────────────────────────────────────
# The same shape as the three `generate-*-check` gates above,
# for the environment surface instead of the domain layer.
#
# `pnpm env:sync` regenerates every managed artifact from ONE declared surface:
# the settings-registry descriptors plus each TypeScript deployable's own config
# module. `--check` regenerates in memory and fails, printing the first differing
# hunk, when the committed `.env.sample` files (root consolidated + per-app),
# `turbo.json#globalEnv`, or the generated docs table disagree. Reconcile with
# `pnpm env:sync` and commit.
#
# No database and no Prisma client are needed: the generator only reads
# declarations and `git ls-files`.

env-drift-check:
  stage: validate
  extends: .node-base
  needs:
    - job: install-node
      optional: true
  variables:
    # `prisma generate` loads prisma.config.ts, which guards on the presence of
    # DATABASE_URL/DIRECT_URL. Generate reads the schema and never connects, so
    # a syntactically-valid placeholder satisfies the guard on this infra-less
    # validate-stage runner (no CI_DATABASE_URL here).
    DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder?schema=public"
    DIRECT_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder?schema=public"
  script:
    # `env-sync.mts` enumerates tracked source via `git ls-files`, but the
    # node:24-alpine base ships no git — install it first.
    - apk add --no-cache git
    # `scripts/env-sync.mts` imports apps/api's env.schema, which pulls
    # `@arcaai/applications` by package name — that resolves to its built
    # `dist`, so the package (and its workspace deps) must be built first.
    # turbo resolves the upstream DAG (types/exceptions/logger/database/domains).
    - pnpm --filter @arcaai/database db:generate
    - pnpm turbo build --filter=@arcaai/applications
    - pnpm env:sync --check
  rules:
    - !reference [.skip-on-dev-2-1, rules]
    - !reference [.rules-env-declarations, rules]

# ── Dead settings-field gate (TASK-799 Phase 3.2) ────────────────────────────
# The MIRROR of `env-drift-check` above, and the two fail for opposite reasons:
#
#   env-drift-check          an env var is READ but not DECLARED — a generated
#                            artifact (.env.sample, turbo.json#globalEnv, the
#                            docs table) disagrees with the source that reads it.
#   python-dead-settings     an env var is DECLARED but never READ — a
#                            pydantic-settings field an operator can set while
#                            nothing consumes the value. Config theatre.
#
# The second was the unwatched direction: TASK-799 Phases 0-2 deleted ~95 such
# fields, every one found by hand (assessment RC-3), and nothing stopped the
# next ~95 accumulating.
#
# Runs on a bare python:3.11-slim with NO installs: the check is a stdlib AST
# pass, deliberately, because importing all six services (torch, presidio,
# qdrant-client, ...) is not affordable in a validate-stage job. See the
# "WHY THIS HALF IS AST" section in scripts/python-env-surface.py.

python-dead-settings:
  stage: validate
  image: python:3.11-slim
  tags: [fast]
  needs: []
  script:
    - python scripts/python-env-surface.py --dead
  rules:
    - !reference [.skip-on-dev-2-1, rules]
    - !reference [.rules-any-python, rules]

# ── vox-node admin surface drift gate (TASK-773) ─────────────────────────────
# The same shape as the three `generate-*-check` gates above, for
# `@arcaai/vox-node`'s ~380-method `/api/v1/admin/**` surface.
#
# That surface is GENERATED from two committed artifacts — `apps/api/route-manifest.json`
# (a Nest `ModulesContainer` walk: route existence, verb, path, `@RequiredSvcScopes`,
# `@RequiresIfMatch`) cross-checked against `apps/api/openapi.json` (request/response
# types from the DTOs). This gate re-runs the generator and fails on ANY difference,
# which catches both directions of drift: a hand-edit to a generated module, and a
# generated module that is stale because a route or DTO moved under it. Generation is
# idempotent by construction — no timestamps, no environment values, total ordering
# everywhere — so a clean tree produces a byte-identical result.
#
# Reconcile with `pnpm --filter @arcaai/vox-node gen:admin`. If the ROUTES changed
# rather than the generator, re-emit the inputs first (`pnpm api:route-manifest`,
# `pnpm api:openapi`) and commit those too.
#
# No database, no Prisma client and no gateway boot: the generator reads the two
# committed JSON artifacts and writes TypeScript. That is the entire reason the
# manifest is emitted by `apps/api` and checked in rather than walked here.

generate-vox-node-admin-check:
  stage: validate
  extends: .node-base
  needs:
    - job: install-node
      optional: true
  script:
    - pnpm --filter @arcaai/vox-node gen:admin:check
  rules:
    - !reference [.skip-on-dev-2-1, rules]
    - !reference [.rules-always, rules]
    - !reference [.rules-cicd-always, rules]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths:
          - apps/api/openapi.json
          - apps/api/route-manifest.json
          - packages/vox-node-codegen/**/*
          - packages/vox-node/src/resources/admin/**/*
        compare_to: refs/heads/main
    - if: $PIPELINE_TYPE == "dev"
    - if: $PIPELINE_TYPE == "staging" || $PIPELINE_TYPE == "main" || $PIPELINE_TYPE == "feature"
      changes:
        - apps/api/openapi.json
        - apps/api/route-manifest.json
        - packages/vox-node-codegen/**/*
        - packages/vox-node/src/resources/admin/**/*
    - if: $PIPELINE_TYPE == "release_sdk"

# ── OpenAPI coverage gate (TASK-783) ────────────────────────────────────────
# Cross-checks the two committed artifacts against each other. Catches:
#
#   1. a route that is served but carries no Swagger metadata — invisible in
#      the developer reference;
#   2. a spec operation with no manifest route — the two files were emitted
#      from different builds and one is stale.
#
# (2) is not hypothetical: `openapi.json` sat one commit behind
# `route-manifest.json` after TASK-733 and nothing caught it.
#
# The distinction between (1) and "deliberately hidden" rests entirely on the
# manifest's `apiExcluded` flag, which was ALWAYS false until TASK-783 fixed
# how it reads `@nestjs/swagger`'s wrapped metadata. `api-exclude-metadata.test.ts`
# locks that against the real decorators.
#
# No Nest boot, no database, no network — it reads two JSON files. Reconcile a
# failure with `pnpm api:build && pnpm api:route-manifest && pnpm api:openapi`.

openapi-coverage-check:
  stage: validate
  extends: .node-base
  needs:
    - job: install-node
      optional: true
  script:
    - pnpm api:openapi:check
  rules:
    - !reference [.skip-on-dev-2-1, rules]
    - !reference [.rules-always, rules]
    - !reference [.rules-cicd-always, rules]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths:
          - apps/api/openapi.json
          - apps/api/route-manifest.json
          - apps/api/src/**/*
          - scripts/check-openapi-coverage.ts
        compare_to: refs/heads/main
    - if: $PIPELINE_TYPE == "dev"
    - if: $PIPELINE_TYPE == "staging" || $PIPELINE_TYPE == "main" || $PIPELINE_TYPE == "feature"
      changes:
        - apps/api/openapi.json
        - apps/api/route-manifest.json
        - apps/api/src/**/*
        - scripts/check-openapi-coverage.ts

# ── Developer-portal spec drift gate (TASK-783) ─────────────────────────────
# The two projections the admin console's developer portal serves are GENERATED
# by joining `openapi.json` (types) with `route-manifest.json` (the
# authorization oracle). Same shape as `generate-vox-node-admin-check`: re-run
# the generator, fail on any difference.
#
# This gate is a security boundary, not a formatting one. The business
# projection is served to tenant developers, and membership in it is decided
# from `apiKeyForbidden` / `apiKeyScopes` / `svcScopes` — never from a
# hand-maintained list. A hand-edit to either committed JSON is exactly the
# change that could publish an administration route to the wrong audience, so
# it fails here.
#
# Reconcile with `pnpm api:portal`. If the ROUTES changed, re-emit the inputs
# first (`pnpm api:route-manifest`, `pnpm api:openapi`) and commit those too.

generate-api-portal-check:
  stage: validate
  extends: .node-base
  needs:
    - job: install-node
      optional: true
  script:
    - pnpm api:portal:check
  rules:
    - !reference [.skip-on-dev-2-1, rules]
    - !reference [.rules-always, rules]
    - !reference [.rules-cicd-always, rules]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths:
          - apps/api/openapi.json
          - apps/api/route-manifest.json
          - apps/admin-console/src/server/api-docs/**/*
          - scripts/gen-api-portal.ts
        compare_to: refs/heads/main
    - if: $PIPELINE_TYPE == "dev"
    - if: $PIPELINE_TYPE == "staging" || $PIPELINE_TYPE == "main" || $PIPELINE_TYPE == "feature"
      changes:
        - apps/api/openapi.json
        - apps/api/route-manifest.json
        - apps/admin-console/src/server/api-docs/**/*
        - scripts/gen-api-portal.ts

# ── Python linting (ruff) ───────────────────────────────────────────────────

lint-python:
  stage: validate
  image: python:3.11-slim
  tags: [fast]
  needs: []
  script:
    - pip install --quiet ruff
    - echo "Linting Python services..."
    - ruff check apps/stt/src/ apps/stt/tests/ --output-format=gitlab || LINT_FAILED=1
    - ruff check apps/text/src/ --output-format=gitlab || LINT_FAILED=1
    - ruff check apps/nlp/src/ apps/nlp/tests/ --output-format=gitlab || LINT_FAILED=1
    - ruff check apps/guardrail/src/ --output-format=gitlab || LINT_FAILED=1
    # Harness joins the gate (tests live in-package under src/).
    - ruff check apps/harness/src/ --output-format=gitlab || LINT_FAILED=1
    - ruff check apps/tts/src/ --output-format=gitlab || LINT_FAILED=1
    - |
      if [ "${LINT_FAILED:-0}" = "1" ]; then
        echo "Python lint errors found"
        exit 1
      fi
  rules:
    - !reference [.skip-on-dev-2-1, rules]
    - !reference [.rules-any-python, rules]

# ── Release tag grammar gate ─────────────────────────────────────────────────
# Rejects a `<SVC>-`/`ALL-` release tag that does not match the frozen SemVer
# grammar in packages/utils/src/version-grammar.ts. Runs only on the `release`
# pipeline type — the tag family `.gitlab-ci.yml`'s workflow rules put there
# (`^(SDK|TEXT|STT|GUARD|TTS|HARNESS|API|ADMIN|NLP|ALL)-`). The SDK sub-family
# is skipped inside the script (separate, pre-existing npm-SemVer scheme). The
# other tag family, `v<X.Y.Z>` (`PIPELINE_TYPE == "tag_release"`), builds
# nothing and promotes an existing digest (see promote.sh) — out of scope here.

validate-release-tag:
  stage: validate
  extends: .node-base
  needs:
    - job: install-node
      optional: true
  script:
    - pnpm exec tsx .gitlab/ci/validate-release-tag.ts
  rules:
    - if: $PIPELINE_TYPE == "release"

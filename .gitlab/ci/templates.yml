# ══════════════════════════════════════════════════════════════════════════════
# Reusable job templates
# ══════════════════════════════════════════════════════════════════════════════

# ── Node.js base ─────────────────────────────────────────────────────────────

.node-base:
  image: node:22-alpine
  tags: [fast]
  before_script:
    - corepack enable
    - corepack prepare pnpm@latest --activate
    - pnpm config set store-dir /pnpm-store
    - pnpm install --frozen-lockfile --prefer-offline

# ── Python base ──────────────────────────────────────────────────────────────

.python-base:
  image: python:3.11-slim
  tags: [fast]
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  cache:
    - key: pip-${SERVICE}
      paths:
        - .pip-cache/
      policy: pull
      fallback_keys:
        - pip-$CI_DEFAULT_BRANCH

# ── Test runner bases ───────────────────────────────────────────────────────
# Test jobs route to test-runner-01 (tags: [test], limit=2) to avoid
# saturating fast-runner-01 which handles lint/typecheck/install.

.test-node-base:
  image: node:22-alpine
  tags: [test]
  before_script:
    - corepack enable
    - corepack prepare pnpm@latest --activate
    - pnpm config set store-dir /pnpm-store
    - pnpm install --frozen-lockfile --prefer-offline

.test-python-base:
  image: python:3.11-slim
  tags: [test]
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  cache:
    - key: pip-${SERVICE}
      paths:
        - .pip-cache/
      policy: pull
      fallback_keys:
        - pip-$CI_DEFAULT_BRANCH

# ── Docker build template ───────────────────────────────────────────────────
# Image versioning: NO `latest` tag.
#
# Tag strategy:
#   semver tag (v1.2.3) → 1.2.3, 1.2, 1, sha-<sha8>
#   staging branch      → staging-<sha8>, sha-<sha8>
#   cicd branch         → cicd-<sha8>, sha-<sha8>
#   other branches      → <branch>-<sha8>, sha-<sha8>

.build-template:
  stage: build
  tags: [build]
  image: docker:27
  timeout: 30m
  interruptible: false
  variables:
    SERVICE_NAME: ""
    DOCKER_CONTEXT: "."
    DOCKERFILE: ""
    BUILD_TARGET: ""
    BUILD_ARGS: ""
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$REGISTRY"
    - |
      printf '[registry."%s"]\nhttp = true\ninsecure = true\n' "$REGISTRY" > /tmp/buildkitd.toml
      if ! docker buildx inspect cibuilder >/dev/null 2>&1; then
        docker buildx create --name cibuilder --driver docker-container \
          --config /tmp/buildkitd.toml \
          --driver-opt network=host \
          --driver-opt "env.BUILDKIT_STEP_LOG_MAX_SIZE=52428800"
      fi
      docker buildx use cibuilder
      docker buildx inspect --bootstrap
  script:
    - |
      set -eu

      image_repo="$REGISTRY/$CI_PROJECT_PATH/$SERVICE_NAME"
      cache_repo="$image_repo/cache"
      short_sha=$(echo "$CI_COMMIT_SHA" | cut -c1-8)
      created_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)

      # ── Compute tags (NO `latest`) ────────────────────────────────────
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        SEMVER_TAG="${CI_COMMIT_TAG#v}"
        MAJOR=$(echo "$SEMVER_TAG" | cut -d. -f1)
        MINOR=$(echo "$SEMVER_TAG" | cut -d. -f1-2)
        TAGS="$SEMVER_TAG $MINOR $MAJOR sha-${short_sha}"
      elif [ "$CI_COMMIT_BRANCH" = "staging" ]; then
        TAGS="staging-${short_sha} sha-${short_sha}"
      elif [ "$CI_COMMIT_BRANCH" = "cicd" ]; then
        TAGS="cicd-${short_sha} sha-${short_sha}"
      elif [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        TAGS="main-${short_sha} sha-${short_sha}"
      else
        BRANCH_SLUG=$(echo "$CI_COMMIT_BRANCH" | sed 's/[^a-zA-Z0-9]/-/g')
        TAGS="${BRANCH_SLUG}-${short_sha} sha-${short_sha}"
      fi

      build_target_arg=""
      if [ -n "$BUILD_TARGET" ]; then
        build_target_arg="--target $BUILD_TARGET"
      fi

      tag_args=""
      for tag in $TAGS; do
        tag_args="$tag_args --tag $image_repo:$tag"
      done

      primary_tag=$(echo "$TAGS" | awk '{print $1}')
      echo "Building service=$SERVICE_NAME primary_tag=$primary_tag all_tags=$TAGS"
      echo "  commit=$CI_COMMIT_SHA branch=${CI_COMMIT_BRANCH:-} git_tag=${CI_COMMIT_TAG:-}"

      docker buildx build \
        --push \
        --cache-from type=registry,ref=$cache_repo \
        --cache-to   type=registry,ref=$cache_repo,mode=max,compression=zstd \
        --label org.opencontainers.image.source=$CI_PROJECT_URL \
        --label org.opencontainers.image.revision=$CI_COMMIT_SHA \
        --label org.opencontainers.image.created=$created_at \
        --label org.opencontainers.image.version=$primary_tag \
        $build_target_arg \
        $BUILD_ARGS \
        $tag_args \
        -f "$DOCKERFILE" \
        "$DOCKER_CONTEXT"

      echo "  pushed tags:"
      for tag in $TAGS; do
        echo "    $image_repo:$tag"
      done

      echo "IMAGE=$image_repo:$primary_tag" >> build.env
  artifacts:
    reports:
      dotenv: build.env

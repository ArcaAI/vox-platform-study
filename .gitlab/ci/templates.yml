# ══════════════════════════════════════════════════════════════════════════════
# Reusable job templates
# ══════════════════════════════════════════════════════════════════════════════

# ── Node.js base ─────────────────────────────────────────────────────────────

.node-base:
  image: node:22-alpine
  tags: [fast]
  # The ID token is minted for every job on this base, but is
  # only USED by jobs that declare VAULT_SECRETS. Minting is local and free; the
  # token grants nothing without a Vault role whose bound_claims match the job.
  id_tokens: !reference [.vault-oidc-id-token, id_tokens]
  cache:
    - key:
        files:
          - pnpm-lock.yaml
      paths:
        - node_modules/
        - apps/*/node_modules/
        - packages/*/node_modules/
      policy: pull
  before_script:
    # Runs FIRST so a credential problem fails in seconds, not after pnpm install.
    - !reference [.vault-oidc, before_script]
    - corepack enable
    - corepack install -g --cache-only .gitlab/corepack/pnpm-10.31.0.tgz
    - pnpm config set store-dir /pnpm-store
    - pnpm install --frozen-lockfile --prefer-offline

# ── Python base ──────────────────────────────────────────────────────────────

.python-base:
  image: python:3.11-slim
  tags: [fast]
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  cache:
    - key: pip-${SERVICE}
      paths:
        - .pip-cache/
      policy: pull
      fallback_keys:
        - pip-$CI_DEFAULT_BRANCH

# ── Test runner bases ───────────────────────────────────────────────────────
# Test jobs route to test-runner-01 (tags: [test], limit=2) to avoid
# saturating fast-runner-01 which handles lint/typecheck/install.

.test-node-base:
  image: node:22-alpine
  tags: [test]
  id_tokens: !reference [.vault-oidc-id-token, id_tokens]
  cache:
    - key:
        files:
          - pnpm-lock.yaml
      paths:
        - node_modules/
        - apps/*/node_modules/
        - packages/*/node_modules/
      policy: pull
  before_script:
    - !reference [.vault-oidc, before_script]
    - corepack enable
    - corepack install -g --cache-only .gitlab/corepack/pnpm-10.31.0.tgz
    - pnpm config set store-dir /pnpm-store
    - pnpm install --frozen-lockfile --prefer-offline

.test-python-base:
  image: python:3.11-slim
  tags: [test]
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  cache:
    - key: pip-${SERVICE}
      paths:
        - .pip-cache/
      policy: pull
      fallback_keys:
        - pip-$CI_DEFAULT_BRANCH

# ── Docker build template ───────────────────────────────────────────────────
# Image versioning: NO `latest` tag.
#
# Tag strategy:
#   semver tag (v1.2.3) → 1.2.3, 1.2, 1, sha-<sha8>
#   staging branch      → staging-<sha8>, sha-<sha8>
#   dev branch          → dev-<sha8>, sha-<sha8>
#   cicd branch         → cicd-<sha8>, sha-<sha8>
#   other branches      → <branch>-<sha8>, sha-<sha8>

# ── Registry login + insecure-registry buildx builder ───────────────────────
# Shared by .build-template (docker buildx build) AND the promote-* jobs in
# deploy.yml (docker buildx imagetools inspect/create —
# digest promotion). imagetools talks to the registry through the active buildx builder
# too, so it needs the same insecure-registry config as a real build.

.buildx-registry-login:
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$REGISTRY"
    - |
      printf '[registry."%s"]\nhttp = true\ninsecure = true\n' "$REGISTRY" > /tmp/buildkitd.toml
      if ! docker buildx inspect cibuilder >/dev/null 2>&1; then
        docker buildx create --name cibuilder --driver docker-container \
          --config /tmp/buildkitd.toml \
          --driver-opt network=host \
          --driver-opt "env.BUILDKIT_STEP_LOG_MAX_SIZE=52428800"
      fi
      docker buildx use cibuilder
      docker buildx inspect --bootstrap

.build-template:
  stage: build
  tags: [build]
  image: docker:27
  timeout: 30m
  interruptible: false
  # Image builds are idempotent — the push is content-addressed, so re-running a
  # job re-pushes identical layers under identical tags. That makes a retry safe,
  # and it absorbs the infra-level flakes that abort a build mid-script (see the
  # digest note below for the exit-255 case that motivated this).
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - script_failure
  variables:
    SERVICE_NAME: ""
    DOCKER_CONTEXT: "."
    DOCKERFILE: ""
    BUILD_TARGET: ""
    BUILD_ARGS: ""
  before_script:
    - !reference [.buildx-registry-login, before_script]
  script:
    - |
      set -eu

      image_repo="$REGISTRY/$CI_PROJECT_PATH/$SERVICE_NAME"
      cache_repo="$image_repo/cache"
      short_sha=$(echo "$CI_COMMIT_SHA" | cut -c1-8)
      created_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)

      # ── Compute tags (NO `latest`) ────────────────────────────────────
      # Release tags (<SVC>-<ver> / ALL-<ver>): use the raw tag verbatim + sha —
      # no semver major/minor derivation (kept deliberately simple).
      # Branch builds: env prefix + short sha. `case` matches the dev-*/staging-*/
      # prod-* release-line globs.
      #
      # BRANCH_SLUG is computed unconditionally below (not just in the `*` case)
      # because BUILD_VERSION needs it for EVERY untagged build, not
      # only the branches that fall through to the generic case.
      BRANCH_SLUG=$(echo "${CI_COMMIT_BRANCH:-unknown}" | sed 's/[^a-zA-Z0-9]/-/g')

      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        TAG_SLUG=$(echo "$CI_COMMIT_TAG" | sed 's/[^a-zA-Z0-9._-]/-/g')
        TAGS="$TAG_SLUG sha-${short_sha}"
      else
        case "${CI_COMMIT_BRANCH:-}" in
          prod-*)              TAGS="prod-${short_sha} sha-${short_sha}" ;;
          staging-*)           TAGS="staging-${short_sha} sha-${short_sha}" ;;
          dev-*)               TAGS="dev-${short_sha} sha-${short_sha}" ;;
          cicd)                TAGS="cicd-${short_sha} sha-${short_sha}" ;;
          *)
            TAGS="${BRANCH_SLUG}-${short_sha} sha-${short_sha}"
            ;;
        esac
      fi

      build_target_arg=""
      if [ -n "$BUILD_TARGET" ]; then
        build_target_arg="--target $BUILD_TARGET"
      fi

      tag_args=""
      for tag in $TAGS; do
        tag_args="$tag_args --tag $image_repo:$tag"
      done

      primary_tag=$(echo "$TAGS" | awk '{print $1}')
      echo "Building service=$SERVICE_NAME primary_tag=$primary_tag all_tags=$TAGS"
      echo "  commit=$CI_COMMIT_SHA branch=${CI_COMMIT_BRANCH:-} git_tag=${CI_COMMIT_TAG:-}"

      # ── build-identity args, baked into /app/build-info.json
      # by each Dockerfile (frozen shape: contracts/build-info.schema.json).
      # BUILD_VERSION is the git tag's SemVer core (the tag IS the version — never
      # package.json/pyproject.toml), or, for an untagged build,
      # 0.0.0-<branch-slug>.<sha8> — the SAME [^a-zA-Z0-9]->- branch-slug rule as
      # the image tag above, and the SAME shape `formatUntaggedVersion` in
      # packages/utils/src/version-grammar.ts produces, so the baked version and
      # the image tag always agree.
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        BUILD_VERSION=$(echo "$CI_COMMIT_TAG" | sed -E 's/^[A-Za-z]+-//')
        BUILD_RELEASE_TAG="$CI_COMMIT_TAG"
      else
        BUILD_VERSION="0.0.0-${BRANCH_SLUG}.${short_sha}"
        BUILD_RELEASE_TAG=""
      fi

      docker buildx build \
        --push \
        --metadata-file /tmp/buildx-metadata.json \
        --cache-from type=registry,ref=$cache_repo \
        --cache-to   type=registry,ref=$cache_repo,mode=max,compression=zstd \
        --label org.opencontainers.image.source=$CI_PROJECT_URL \
        --label org.opencontainers.image.revision=$CI_COMMIT_SHA \
        --label org.opencontainers.image.created=$created_at \
        --label org.opencontainers.image.version=$primary_tag \
        --label org.opencontainers.image.ref.name=$primary_tag \
        --label com.arcaai.branch="${CI_COMMIT_BRANCH:-}" \
        --build-arg BUILD_SERVICE="$SERVICE_NAME" \
        --build-arg BUILD_VERSION="$BUILD_VERSION" \
        --build-arg BUILD_RELEASE_TAG="$BUILD_RELEASE_TAG" \
        --build-arg BUILD_GIT_BRANCH="${CI_COMMIT_BRANCH:-}" \
        --build-arg BUILD_GIT_SHA="$CI_COMMIT_SHA" \
        --build-arg BUILD_AT="$created_at" \
        --build-arg BUILD_CI_PIPELINE_ID="${CI_PIPELINE_ID:-}" \
        --build-arg BUILD_CI_PIPELINE_URL="${CI_PIPELINE_URL:-}" \
        $build_target_arg \
        $BUILD_ARGS \
        $tag_args \
        -f "$DOCKERFILE" \
        "$DOCKER_CONTEXT"

      echo "  pushed tags:"
      for tag in $TAGS; do
        echo "    $image_repo:$tag"
      done

      # ── carry the pushed manifest digest forward as a
      # pipeline artifact variable. This is the value the promote-* jobs in
      # deploy.yml re-resolve and attach to the SAME ServiceRelease row (keyed
      # on service+gitCommitSha+releaseTag) — promotion NEVER creates a second
      # release row, it only re-tags an already-pushed digest (see promote.sh
      # and the resolved promotion-only decisions).
      #
      # Read from the build's own --metadata-file, NOT a second
      # `docker buildx imagetools inspect` round-trip to the registry. The
      # inspect form was BOTH flaky and unable to report its own failure:
      #   * flaky — it intermittently killed the job with a bare exit 255 and
      #     no stderr, immediately after a fully successful build+push
      #     (pipeline 910 build-stt-worker, pipeline 908 build-qdrant-init —
      #     unrelated images, same runner, same silent signature);
      #   * silent — with `digest=$(inspect | awk ...)` and no pipefail, the
      #     substitution's status is AWK's, always 0. A failed inspect (or any
      #     output without a `Digest:` line) yielded an EMPTY digest that
      #     `set -eu` could not catch, shipping `DIGEST=` to promote-*, which
      #     breaks digest promotion quietly instead of loudly.
      # buildx already knows the digest it just pushed, so this needs no
      # network call at all — and the guard below makes an unresolvable digest
      # a hard failure.
      digest=$(sed -n 's/.*"containerimage.digest"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' /tmp/buildx-metadata.json)
      if [ -z "$digest" ]; then
        echo "FATAL: no containerimage.digest in /tmp/buildx-metadata.json" >&2
        cat /tmp/buildx-metadata.json >&2 || true
        exit 1
      fi
      echo "  digest: $digest"

      echo "IMAGE=$image_repo:$primary_tag" >> build.env
      echo "DIGEST=$digest" >> build.env
      echo "BUILD_VERSION=$BUILD_VERSION" >> build.env
      echo "BUILD_RELEASE_TAG=$BUILD_RELEASE_TAG" >> build.env
  artifacts:
    reports:
      dotenv: build.env

# ══════════════════════════════════════════════════════════════════════════════
# Reusable job templates
# ══════════════════════════════════════════════════════════════════════════════

# ── Node.js base ─────────────────────────────────────────────────────────────

.node-base:
  image: node:22-alpine
  tags: [fast]
  # TASK-558 lane K — the ID token is minted for every job on this base, but is
  # only USED by jobs that declare VAULT_SECRETS. Minting is local and free; the
  # token grants nothing without a Vault role whose bound_claims match the job.
  id_tokens: !reference [.vault-oidc-id-token, id_tokens]
  cache:
    - key:
        files:
          - pnpm-lock.yaml
      paths:
        - node_modules/
        - apps/*/node_modules/
        - packages/*/node_modules/
      policy: pull
  before_script:
    # Runs FIRST so a credential problem fails in seconds, not after pnpm install.
    - !reference [.vault-oidc, before_script]
    - corepack enable
    - corepack install -g --cache-only .gitlab/corepack/pnpm-10.31.0.tgz
    - pnpm config set store-dir /pnpm-store
    - pnpm install --frozen-lockfile --prefer-offline

# ── Python base ──────────────────────────────────────────────────────────────

.python-base:
  image: python:3.11-slim
  tags: [fast]
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  cache:
    - key: pip-${SERVICE}
      paths:
        - .pip-cache/
      policy: pull
      fallback_keys:
        - pip-$CI_DEFAULT_BRANCH

# ── Test runner bases ───────────────────────────────────────────────────────
# Test jobs route to test-runner-01 (tags: [test], limit=2) to avoid
# saturating fast-runner-01 which handles lint/typecheck/install.

.test-node-base:
  image: node:22-alpine
  tags: [test]
  id_tokens: !reference [.vault-oidc-id-token, id_tokens]
  cache:
    - key:
        files:
          - pnpm-lock.yaml
      paths:
        - node_modules/
        - apps/*/node_modules/
        - packages/*/node_modules/
      policy: pull
  before_script:
    - !reference [.vault-oidc, before_script]
    - corepack enable
    - corepack install -g --cache-only .gitlab/corepack/pnpm-10.31.0.tgz
    - pnpm config set store-dir /pnpm-store
    - pnpm install --frozen-lockfile --prefer-offline

.test-python-base:
  image: python:3.11-slim
  tags: [test]
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  cache:
    - key: pip-${SERVICE}
      paths:
        - .pip-cache/
      policy: pull
      fallback_keys:
        - pip-$CI_DEFAULT_BRANCH

# ── Docker build template ───────────────────────────────────────────────────
# Image versioning: NO `latest` tag.
#
# Tag strategy:
#   semver tag (v1.2.3) → 1.2.3, 1.2, 1, sha-<sha8>
#   staging branch      → staging-<sha8>, sha-<sha8>
#   dev branch          → dev-<sha8>, sha-<sha8>
#   cicd branch         → cicd-<sha8>, sha-<sha8>
#   other branches      → <branch>-<sha8>, sha-<sha8>

# ── Registry login + insecure-registry buildx builder ───────────────────────
# Shared by .build-template (docker buildx build) AND the promote-* jobs in
# deploy.yml (docker buildx imagetools inspect/create — TASK-616 Appendix F
# §F3). imagetools talks to the registry through the active buildx builder
# too, so it needs the same insecure-registry config as a real build.

.buildx-registry-login:
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$REGISTRY"
    - |
      printf '[registry."%s"]\nhttp = true\ninsecure = true\n' "$REGISTRY" > /tmp/buildkitd.toml
      if ! docker buildx inspect cibuilder >/dev/null 2>&1; then
        docker buildx create --name cibuilder --driver docker-container \
          --config /tmp/buildkitd.toml \
          --driver-opt network=host \
          --driver-opt "env.BUILDKIT_STEP_LOG_MAX_SIZE=52428800"
      fi
      docker buildx use cibuilder
      docker buildx inspect --bootstrap

.build-template:
  stage: build
  tags: [build]
  image: docker:27
  timeout: 30m
  interruptible: false
  variables:
    SERVICE_NAME: ""
    DOCKER_CONTEXT: "."
    DOCKERFILE: ""
    BUILD_TARGET: ""
    BUILD_ARGS: ""
  before_script:
    - !reference [.buildx-registry-login, before_script]
  script:
    - |
      set -eu

      image_repo="$REGISTRY/$CI_PROJECT_PATH/$SERVICE_NAME"
      cache_repo="$image_repo/cache"
      short_sha=$(echo "$CI_COMMIT_SHA" | cut -c1-8)
      created_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)

      # ── Compute tags (NO `latest`) ────────────────────────────────────
      # Release tags (<SVC>-<ver> / ALL-<ver>): use the raw tag verbatim + sha —
      # no semver major/minor derivation (kept deliberately simple).
      # Branch builds: env prefix + short sha. `case` matches the dev-*/staging-*/
      # prod-* release-line globs.
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        TAG_SLUG=$(echo "$CI_COMMIT_TAG" | sed 's/[^a-zA-Z0-9._-]/-/g')
        TAGS="$TAG_SLUG sha-${short_sha}"
      else
        case "${CI_COMMIT_BRANCH:-}" in
          prod-*)              TAGS="prod-${short_sha} sha-${short_sha}" ;;
          staging-*)           TAGS="staging-${short_sha} sha-${short_sha}" ;;
          dev-*)               TAGS="dev-${short_sha} sha-${short_sha}" ;;
          cicd)                TAGS="cicd-${short_sha} sha-${short_sha}" ;;
          release-playground)  TAGS="playground-${short_sha} sha-${short_sha}" ;;
          *)
            BRANCH_SLUG=$(echo "${CI_COMMIT_BRANCH:-unknown}" | sed 's/[^a-zA-Z0-9]/-/g')
            TAGS="${BRANCH_SLUG}-${short_sha} sha-${short_sha}"
            ;;
        esac
      fi

      build_target_arg=""
      if [ -n "$BUILD_TARGET" ]; then
        build_target_arg="--target $BUILD_TARGET"
      fi

      tag_args=""
      for tag in $TAGS; do
        tag_args="$tag_args --tag $image_repo:$tag"
      done

      primary_tag=$(echo "$TAGS" | awk '{print $1}')
      echo "Building service=$SERVICE_NAME primary_tag=$primary_tag all_tags=$TAGS"
      echo "  commit=$CI_COMMIT_SHA branch=${CI_COMMIT_BRANCH:-} git_tag=${CI_COMMIT_TAG:-}"

      docker buildx build \
        --push \
        --cache-from type=registry,ref=$cache_repo \
        --cache-to   type=registry,ref=$cache_repo,mode=max,compression=zstd \
        --label org.opencontainers.image.source=$CI_PROJECT_URL \
        --label org.opencontainers.image.revision=$CI_COMMIT_SHA \
        --label org.opencontainers.image.created=$created_at \
        --label org.opencontainers.image.version=$primary_tag \
        $build_target_arg \
        $BUILD_ARGS \
        $tag_args \
        -f "$DOCKERFILE" \
        "$DOCKER_CONTEXT"

      echo "  pushed tags:"
      for tag in $TAGS; do
        echo "    $image_repo:$tag"
      done

      echo "IMAGE=$image_repo:$primary_tag" >> build.env
  artifacts:
    reports:
      dotenv: build.env

# ══════════════════════════════════════════════════════════════════════════════
# Deploy stage — digest promotion into hope-v2-deployment (Argo CD GitOps)
# ══════════════════════════════════════════════════════════════════════════════
#
# Digest promotion into hope-v2-deployment (component-design-cicd-promotion.md).
#
# Nothing here rebuilds an image. Each promote-* job resolves the immutable
# digest of the `sha-<sha8>` image already pushed earlier in the pipeline (or,
# for prod, in an earlier pipeline on the same commit — see promote.sh),
# copies that manifest to an environment tag with zero rebuild, pins the
# hope-v2-deployment overlay to the resolved sha256 digest via
# `kustomize edit set image`, and pushes to `main` — the branch every Argo CD
# Application actually tracks (deployment/argocd/application-*.yaml).
#
# This replaces the Argo CD Image Updater entirely: it polls the
# registry with no idea what passed CI, its write-back branch didn't match
# what Argo reads, its tag regex matched nothing CI publishes, and it held a
# Git-write PAT next to registry creds in a controller with no audit trail.
# The ImageUpdater CRD + its registry-creds Secret have been removed from
# deployment/argocd/ — see the comment there.
#
# Also replaces the old `deploy-staging` job, which edited a Helm-values tree
# (`apps/<svc>/values-staging.yaml`) inside `arcaai/hope-deployments` — a repo
# and a layout that never existed. The real repo is `arca/hope-v2-deployment`,
# pure Kustomize.
#
# Credentials:
#   DEPLOY_REPO_URL   — NOT a secret; defaulted below so a fresh runner needs no
#                       manual setup. A project/group CI variable of the same
#                       name still wins (project variables outrank job
#                       `variables:`), which is the override path if the
#                       deployment repo ever moves.
#   DEPLOY_TOKEN      — a secret. Comes from Vault via VAULT_SECRETS below once
#                       VAULT_ADDR is set; until then it must exist as a masked
#                       project CI variable (Settings → CI/CD → Variables) with
#                       `write_repository` on arca/hope-v2-deployment. With
#                       VAULT_ADDR empty the Vault step is a no-op, so the CI
#                       variable is the ONLY source — see .gitlab/ci/vault.yml
#                       § "FALLBACK / ROLLOUT SAFETY" and the per-environment
#                       role split.
#
# ══════════════════════════════════════════════════════════════════════════════

.promote-base:
  stage: deploy
  tags: [deploy]
  image: docker:28
  interruptible: false
  id_tokens: !reference [.vault-oidc-id-token, id_tokens]
  variables:
    VAULT_SECRETS: !reference [.vault-secret-sets, deploy]
    DEPLOY_REPO_URL: "https://git.taphuynh.dev/arca/hope-v2-deployment.git"
  before_script:
    - apk add --no-cache git curl bash
    - !reference [.vault-oidc, before_script]
    - !reference [.buildx-registry-login, before_script]
    - git config --global user.email "ci@arcaai.com"
    - git config --global user.name "GitLab CI"
    - |
      set -eu
      # ── KUSTOMIZE COMES OUT OF A REGISTRY IMAGE, NOT OFF GITHUB ─────────────
      # This used to `curl` the release tarball from github.com. On 2026-09-07
      # that call hung and job 16852 died with
      #   curl: (28) Failed to connect to github.com port 443 after 135337 ms
      #   tar: kustomize: not found in archive
      # — a green pipeline (every build, lint and scan passed) whose ONLY
      # failure was fetching a build tool, so the digests never reached
      # hope-v2-deployment and the dev cluster silently stayed a build behind.
      # deploy-runner-01 had reached github.com fine four days earlier in
      # pipeline #1121, which is what makes this the wrong dependency to carry:
      # the promotion step is the last mile of a deploy and must not fail on a
      # host nothing else in the deploy path needs.
      #
      # `image: docker:28` + `.buildx-registry-login` mean this job already has
      # a Docker daemon and is already authenticated, so the binary can be
      # lifted straight out of the upstream image — the same
      # `registry.k8s.io/kustomize/kustomize` that hope-v2-deployment's own
      # `render` CI job runs as its job image, i.e. a registry these runners
      # already pull from on every deployment-repo pipeline.
      #
      # KUSTOMIZE_IMAGE is overridable so this can point at the internal mirror
      # ("$REGISTRY/mirror/kustomize:v5.4.3") once the image is mirrored, which
      # removes the last external host from the promotion path entirely.
      KUSTOMIZE_VERSION="5.4.3"
      KUSTOMIZE_IMAGE="${KUSTOMIZE_IMAGE:-registry.k8s.io/kustomize/kustomize:v${KUSTOMIZE_VERSION}}"
      n=0
      until docker pull -q "$KUSTOMIZE_IMAGE"; do
        n=$((n+1))
        [ "$n" -ge 3 ] && { echo "[kustomize] cannot pull $KUSTOMIZE_IMAGE after $n attempts" >&2; exit 1; }
        echo "[kustomize] pull failed, retry $n/3 in $((n*5))s" >&2
        sleep $((n*5))
      done
      cid="$(docker create "$KUSTOMIZE_IMAGE")"
      docker cp "$cid:/app/kustomize" /usr/local/bin/kustomize
      docker rm -f "$cid" >/dev/null
      chmod +x /usr/local/bin/kustomize
      export PATH="/usr/local/bin:$PATH"
      kustomize version
  script:
    - sh .gitlab/ci/promote.sh

promote-dev:
  extends: .promote-base
  variables:
    DEPLOY_ENV: "dev"
    OVERLAY_PATH: "deployment/k8s/overlays/dev"
    # Dev-scoped Vault role (ref_type branch, ref "dev-*",
    # ref_protected true once dev-* is protected, see the OPEN ITEM in vault.yml).
    VAULT_AUTH_ROLE: "hope-ci-deploy-dev"
  rules:
    - if: $PIPELINE_TYPE == "dev"
  environment:
    name: dev

promote-staging:
  extends: .promote-base
  variables:
    DEPLOY_ENV: "staging"
    OVERLAY_PATH: "deployment/k8s/overlays/staging"
    # Staging-scoped Vault role (ref_type branch, ref "staging-*").
    VAULT_AUTH_ROLE: "hope-ci-deploy-staging"
  rules:
    - if: $PIPELINE_TYPE == "staging"
  environment:
    name: staging
    url: https://staging.hope.arcaai.com

promote-prod:
  extends: .promote-base
  variables:
    DEPLOY_ENV: "prod"
    OVERLAY_PATH: "deployment/k8s/overlays/prod"
    # Prod-scoped Vault role (ref_type TAG, ref "v*"). Production is
    # triggered by a protected vX.Y.Z tag, never a branch.
    # (`production-*` retired 2026-08-07; `prod-*` is the release line.)
    VAULT_AUTH_ROLE: "hope-ci-deploy-prod"
  # tag_release pipelines build nothing (no PIPELINE_TYPE ==
  # "dev"/"staging"/"cicd" match in build.yml's .build-common-rules for a
  # v* tag), so this only ever copies a digest that a prior dev/staging
  # pipeline already built and scanned. `when: manual` is the second human
  # checkpoint GitLab CE can actually enforce — Argo's own prod sync
  # stays manual too, so a bad promotion still doesn't roll out
  # unattended.
  rules:
    - if: $PIPELINE_TYPE == "tag_release"
      when: manual
  environment:
    name: production

# ══════════════════════════════════════════════════════════════════════════════
# PgBouncer smoke test
# ══════════════════════════════════════════════════════════════════════════════
#
# Manual / scheduled job that ssh-runs scripts/smoke-pgbouncer.sh against the
# staging pgbouncer endpoint. Validates that the pooler is reachable, returns
# pool_mode=transaction, that Prisma can route through it, and that
# tenant-scoped GUCs do not leak across pooled checkouts.
#
# Required CI/CD variables (Settings → CI/CD → Variables, masked + protected):
#   PGB_SMOKE_SSH_KEY            Private key authorised on PGB_SMOKE_SSH_HOST
#   PGB_SMOKE_SSH_HOST           SSH host (bastion or one of the HA nodes)
#   PGB_SMOKE_SSH_USER           SSH user
#   PGB_SMOKE_POOLED_HOST        pgbouncer host as seen from PGB_SMOKE_SSH_HOST
#                                (e.g., 10.10.1.250 — the keepalived VIP)
#   PGB_SMOKE_ADMIN_PG_PASSWORD  Admin user password (for SHOW POOLS)
#   PGB_SMOKE_APP_PG_PASSWORD    App user password (for runtime queries)
#
# Optional:
#   PGB_SMOKE_POOLED_PORT (default 6432)
#   PGB_SMOKE_ADMIN_USER  (default hope_admin)
#   PGB_SMOKE_APP_USER    (default hope_app)
#   PGB_SMOKE_DB          (default hope)

smoke-pgbouncer-staging:
  stage: deploy
  tags: [deploy]
  image: alpine:3.22
  interruptible: false
  id_tokens: !reference [.vault-oidc-id-token, id_tokens]
  variables:
    VAULT_AUTH_ROLE: "hope-ci-deploy"
    VAULT_SECRETS: !reference [.vault-secret-sets, pgbouncer-smoke]
  before_script:
    # curl added for vault-login.sh — busybox wget's POST support varies by
    # build, and a credential fetch is not the place for a maybe.
    - apk add --no-cache git openssh-client curl
    - !reference [.vault-oidc, before_script]
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$PGB_SMOKE_SSH_KEY" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H "$PGB_SMOKE_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
  script:
    - |
      set -eu
      echo "── Running PgBouncer smoke tests on $PGB_SMOKE_SSH_HOST → $PGB_SMOKE_POOLED_HOST ──"
      ssh -i ~/.ssh/id_ed25519 "$PGB_SMOKE_SSH_USER@$PGB_SMOKE_SSH_HOST" \
        "POOLED_HOST='$PGB_SMOKE_POOLED_HOST' \
         POOLED_PORT='${PGB_SMOKE_POOLED_PORT:-6432}' \
         ADMIN_USER='${PGB_SMOKE_ADMIN_USER:-hope_admin}' \
         APP_USER='${PGB_SMOKE_APP_USER:-hope_app}' \
         DB='${PGB_SMOKE_DB:-hope}' \
         ADMIN_PG_PASSWORD='$PGB_SMOKE_ADMIN_PG_PASSWORD' \
         APP_PG_PASSWORD='$PGB_SMOKE_APP_PG_PASSWORD' \
         bash -s" < scripts/smoke-pgbouncer.sh
  rules:
    # Manual on staging, and on any cicd branch for pipeline validation.
    # Also runnable from scheduled pipelines via SMOKE_PGBOUNCER=true.
    - if: $CI_COMMIT_BRANCH == "staging"
      when: manual
      allow_failure: false
    - if: $CI_COMMIT_BRANCH == "cicd"
      when: manual
      allow_failure: true
    - if: $SMOKE_PGBOUNCER == "true"
      when: on_success
      allow_failure: false
  environment:
    name: staging
    url: https://staging.hope.arcaai.com

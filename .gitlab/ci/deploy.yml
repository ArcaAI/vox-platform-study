# ══════════════════════════════════════════════════════════════════════════════
# Deploy stage — Argo CD staging sync
# ══════════════════════════════════════════════════════════════════════════════
#
# Triggered on `staging` branch after successful builds.
# Updates image tags in the deployment repository, which Argo CD watches.
#
# ── Setup ────────────────────────────────────────────────────────────────────
#
# 1. Create a deployment repository (e.g. arcaai/hope-deployments):
#
#    hope-deployments/
#    ├── apps/
#    │   ├── api/
#    │   │   ├── values-staging.yaml     # image.tag: "staging-<sha>"
#    │   │   └── values-production.yaml
#    │   ├── stt-ml-runtime/
#    │   ├── stt-worker/
#    │   ├── smr/
#    │   ├── nlp/
#    │   └── database/
#    └── applicationsets/
#        └── staging.yaml
#
# 2. CI Variables needed (Settings → CI/CD → Variables):
#
#    DEPLOY_REPO_URL  — http://10.10.1.110/arcaai/hope-deployments.git
#    DEPLOY_TOKEN     — Project Access Token with write_repository scope
#    ARGOCD_SERVER    — Argo CD server URL (optional, for direct sync)
#    ARGOCD_AUTH_TOKEN — Argo CD API token (optional, for direct sync)
#
# 3. Configure Argo CD to watch the deployment repo:
#    - Add repo in Argo CD: Settings → Repositories → Connect Repo
#    - Create ApplicationSet (see staging.yaml template below)
#    - Enable webhook: Settings → Webhooks → Add GitLab webhook
#
# ══════════════════════════════════════════════════════════════════════════════

deploy-staging:
  stage: deploy
  tags: [deploy]
  image: alpine:3.20
  interruptible: false
  id_tokens: !reference [.vault-oidc-id-token, id_tokens]
  variables:
    # TASK-558 §13.3 C1 — DEPLOY_TOKEN is the write credential for the
    # hope-deployments repo. The Vault role binds it to `ref` ∈ {staging,dev,v*};
    # see the ⚠ OPEN ITEM in .gitlab/ci/vault.yml — `staging` is not a protected
    # branch yet, so that claim is not yet a hard privilege boundary.
    VAULT_AUTH_ROLE: "hope-ci-deploy"
    VAULT_SECRETS: !reference [.vault-secret-sets, deploy]
  before_script:
    - apk add --no-cache git curl jq
    # After apk, so curl+jq are present for the fetch.
    - !reference [.vault-oidc, before_script]
    - git config --global user.email "ci@arcaai.com"
    - git config --global user.name "GitLab CI"
  script:
    - |
      set -eu
      SHORT_SHA=$(echo "$CI_COMMIT_SHA" | cut -c1-8)
      IMAGE_TAG="staging-${SHORT_SHA}"

      echo "Deploying to staging with image tag: $IMAGE_TAG"
      echo "  Pipeline: $CI_PIPELINE_URL"
      echo "  Commit:   $CI_COMMIT_SHA"

      # Clone deployment repo
      DEPLOY_AUTH_URL=$(echo "$DEPLOY_REPO_URL" | sed "s|http://|http://gitlab-ci-token:${DEPLOY_TOKEN}@|")
      git clone --depth 1 "$DEPLOY_AUTH_URL" /tmp/deploy
      cd /tmp/deploy

      # Update image tags for services that were built in this pipeline
      UPDATED=0
      for service in api nlp smr guardrail stt-ml-runtime stt-worker database compat-playground; do
        values_file="apps/${service}/values-staging.yaml"
        if [ -f "$values_file" ]; then
          sed -i "s|tag:.*|tag: \"${IMAGE_TAG}\"|" "$values_file"
          echo "  Updated $values_file → $IMAGE_TAG"
          UPDATED=1
        fi
      done

      if [ "$UPDATED" = "1" ]; then
        git add -A
        if ! git diff --cached --quiet; then
          git commit -m "deploy(staging): ${IMAGE_TAG} from pipeline #${CI_PIPELINE_IID}" \
            -m "Source: ${CI_PROJECT_URL}/-/commit/${CI_COMMIT_SHA}" \
            -m "Pipeline: ${CI_PIPELINE_URL}"
          git push origin main
          echo "Deployment repo updated. Argo CD will sync automatically."
        else
          echo "No changes to deploy."
        fi
      else
        echo "No deployment manifests found. Skipping."
      fi
  rules:
    - if: $PIPELINE_TYPE == "staging"
  environment:
    name: staging
    url: https://staging.hope.arcaai.com

# ── Argo CD sync trigger (optional — use if webhook is not configured) ──────

sync-argocd:
  stage: deploy
  tags: [deploy]
  image: alpine:3.20
  needs:
    - job: deploy-staging
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      set -eu

      if [ -z "${ARGOCD_SERVER:-}" ] || [ -z "${ARGOCD_AUTH_TOKEN:-}" ]; then
        echo "Argo CD credentials not configured. Relying on webhook/polling sync."
        exit 0
      fi

      echo "Triggering Argo CD sync for staging applications..."

      for app in hope-staging-api hope-staging-stt-ml-runtime hope-staging-stt-worker hope-staging-smr hope-staging-guardrail hope-staging-nlp hope-staging-database hope-staging-compat-playground; do
        echo "  Syncing $app..."
        curl -sSf -X POST \
          -H "Authorization: Bearer ${ARGOCD_AUTH_TOKEN}" \
          -H "Content-Type: application/json" \
          "https://${ARGOCD_SERVER}/api/v1/applications/${app}/sync" \
          -d '{"prune": true}' || echo "  Warning: failed to sync $app (may not exist yet)"
      done
  allow_failure: true
  rules:
    - if: $PIPELINE_TYPE == "staging"

# ══════════════════════════════════════════════════════════════════════════════
# PgBouncer smoke test — TASK-302 Stream C Phase 2A (Task 2A.6.2)
# ══════════════════════════════════════════════════════════════════════════════
#
# Manual / scheduled job that ssh-runs scripts/smoke-pgbouncer.sh against the
# staging pgbouncer endpoint. Validates that the pooler is reachable, returns
# pool_mode=transaction, that Prisma can route through it, and that
# tenant-scoped GUCs do not leak across pooled checkouts.
#
# Required CI/CD variables (Settings → CI/CD → Variables, masked + protected):
#   PGB_SMOKE_SSH_KEY            Private key authorised on PGB_SMOKE_SSH_HOST
#   PGB_SMOKE_SSH_HOST           SSH host (bastion or one of the HA nodes)
#   PGB_SMOKE_SSH_USER           SSH user
#   PGB_SMOKE_POOLED_HOST        pgbouncer host as seen from PGB_SMOKE_SSH_HOST
#                                (e.g., 10.10.1.250 — the keepalived VIP)
#   PGB_SMOKE_ADMIN_PG_PASSWORD  Admin user password (for SHOW POOLS)
#   PGB_SMOKE_APP_PG_PASSWORD    App user password (for runtime queries)
#
# Optional:
#   PGB_SMOKE_POOLED_PORT (default 6432)
#   PGB_SMOKE_ADMIN_USER  (default hope_admin)
#   PGB_SMOKE_APP_USER    (default hope_app)
#   PGB_SMOKE_DB          (default hope)

smoke-pgbouncer-staging:
  stage: deploy
  tags: [deploy]
  image: alpine:3.20
  interruptible: false
  id_tokens: !reference [.vault-oidc-id-token, id_tokens]
  variables:
    VAULT_AUTH_ROLE: "hope-ci-deploy"
    VAULT_SECRETS: !reference [.vault-secret-sets, pgbouncer-smoke]
  before_script:
    # curl added for vault-login.sh — busybox wget's POST support varies by
    # build, and a credential fetch is not the place for a maybe.
    - apk add --no-cache git openssh-client curl
    - !reference [.vault-oidc, before_script]
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$PGB_SMOKE_SSH_KEY" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H "$PGB_SMOKE_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
  script:
    - |
      set -eu
      echo "── Running PgBouncer smoke tests on $PGB_SMOKE_SSH_HOST → $PGB_SMOKE_POOLED_HOST ──"
      ssh -i ~/.ssh/id_ed25519 "$PGB_SMOKE_SSH_USER@$PGB_SMOKE_SSH_HOST" \
        "POOLED_HOST='$PGB_SMOKE_POOLED_HOST' \
         POOLED_PORT='${PGB_SMOKE_POOLED_PORT:-6432}' \
         ADMIN_USER='${PGB_SMOKE_ADMIN_USER:-hope_admin}' \
         APP_USER='${PGB_SMOKE_APP_USER:-hope_app}' \
         DB='${PGB_SMOKE_DB:-hope}' \
         ADMIN_PG_PASSWORD='$PGB_SMOKE_ADMIN_PG_PASSWORD' \
         APP_PG_PASSWORD='$PGB_SMOKE_APP_PG_PASSWORD' \
         bash -s" < scripts/smoke-pgbouncer.sh
  rules:
    # Manual on staging, and on any cicd branch for pipeline validation.
    # Also runnable from scheduled pipelines via SMOKE_PGBOUNCER=true.
    - if: $CI_COMMIT_BRANCH == "staging"
      when: manual
      allow_failure: false
    - if: $CI_COMMIT_BRANCH == "cicd"
      when: manual
      allow_failure: true
    - if: $SMOKE_PGBOUNCER == "true"
      when: on_success
      allow_failure: false
  environment:
    name: staging
    url: https://staging.hope.arcaai.com

# ══════════════════════════════════════════════════════════════════════════════
# Install stage — dependency cache warming
# ══════════════════════════════════════════════════════════════════════════════

install-node:
  stage: install
  extends: .node-base
  cache:
    - key:
        files:
          - pnpm-lock.yaml
      paths:
        - .pnpm-store
        - node_modules/
        - apps/*/node_modules/
        - packages/*/node_modules/
      policy: pull-push
      fallback_keys:
        - pnpm-$CI_DEFAULT_BRANCH
  before_script:
    - corepack enable
    - corepack prepare pnpm@latest --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile --prefer-offline
  script:
    - echo "Node dependencies installed and cache warmed"
    - pnpm --version
    - node --version
  rules:
    - !reference [.rules-any-ts, rules]

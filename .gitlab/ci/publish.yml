# ══════════════════════════════════════════════════════════════════════════════
# Registry retention: stop the 90-day reap eating release tags
# ══════════════════════════════════════════════════════════════════════════════
#
# NOT a CI job. This is a GitLab PROJECT SETTING and is ⚙ OWNER-APPLIED; it is
# recorded here because it protects the very digests the jobs above sign.
#
# ⚠ DE-DUPLICATE FIRST. Another change set claims this same GitLab setting.
#   Whichever lands first runs the command; the other
#   links to it. Do not run it twice "to be safe": the second PUT would replace
#   whatever value the first one set.
#
# CURRENT STATE (live GET /projects/6 on 2026-08-07):
#   cadence: 7d · keep_n: 25 · older_than: 90d · name_regex: ".*" ·
#   name_regex_keep: ABSENT
# Every tag matches the reap regex, including release tags. Once name_regex_keep
# exempts them they also stop counting toward keep_n, so no keep_n bump is
# needed.
#
# ⚠ THE REGEX IN THE TICKET TEXT WOULD BE A SILENT NO-OP.
#   GitLab docs (reduce_container_registry_storage, read 2026-08-08): "Both keep
#   and remove regex patterns are automatically surrounded with \A and \Z
#   anchors, so you do not need to include them."
#   So `^(v|prod-|production-)` is evaluated as `\A^(v|prod-|production-)\Z` and
#   matches only the literal strings "v", "prod-" and "production-" — i.e. it
#   protects nothing, while looking like it protects everything. The trailing
#   `.*` below is what makes it match `v1.2.3`, `prod-a1b2c3d4`, etc.
#
# RUN (project owner / maintainer token with `api` scope):
#
#   curl --request PUT \
#        --header "PRIVATE-TOKEN: <owner-token>" \
#        --header "Content-Type: application/json" \
#        --data '{"container_expiration_policy_attributes":{"name_regex_keep":"(v|prod-|production-).*"}}' \
#        "https://git.taphuynh.dev/api/v4/projects/6"
#
#   # glab equivalent
#   glab api --method PUT projects/6 \
#     --field 'container_expiration_policy_attributes[name_regex_keep]=(v|prod-|production-).*'
#
# VERIFY (must echo the value back; a PUT that silently dropped the attribute
# returns 200 with the old policy, so checking the response body is the test):
#
#   curl --silent --header "PRIVATE-TOKEN: <owner-token>" \
#        "https://git.taphuynh.dev/api/v4/projects/6" \
#     | python3 -c 'import json,sys; print(json.load(sys.stdin)["container_expiration_policy"])'
#
# ══════════════════════════════════════════════════════════════════════════════

# ══════════════════════════════════════════════════════════════════════════════
# Publish stage — SDK package release to GitLab Package Registry
# ══════════════════════════════════════════════════════════════════════════════
#
# Triggered on the `release-sdk` branch only.
# Uses Changesets to version and publish @arcaai/* packages.
#
# ── Setup ────────────────────────────────────────────────────────────────────
#
# Prerequisites (one-time setup in GitLab):
#
# 1. Enable Package Registry:
#    Settings → General → Visibility → Package registry → Everyone with access
#
# 2. Create a Project Access Token (or use CI_JOB_TOKEN):
#    Settings → Access Tokens → Add new token
#      Name:   "npm-publish"
#      Role:   Developer
#      Scopes: api, read_package_registry, write_package_registry
#    Save the token as CI variable: NPM_PUBLISH_TOKEN
#
# 3. Install Changesets (in the repo):
#    pnpm add -Dw @changesets/cli @changesets/changelog-github
#    pnpm changeset init
#
# 4. Configure .changeset/config.json:
#    {
#      "$schema": "https://unpkg.com/@changesets/config@3.1.1/schema.json",
#      "changelog": "@changesets/cli/changelog",
#      "commit": false,
#      "fixed": [],
#      "linked": [
#        ["@arcaai/vox", "@arcaai/room", "@arcaai/stt",
#         "@arcaai/vad", "@arcaai/noise-filter"]
#      ],
#      "access": "restricted",
#      "baseBranch": "main",
#      "updateInternalDependencies": "patch",
#      "ignore": [
#        "@arcaai/api", "@arcaai/database",
#        "@arcaai/domains", "@arcaai/applications", "@arcaai/exceptions",
#        "@arcaai/logger", "@arcaai/tools", "@arcaai/config-eslint",
#        "@arcaai/config-rollup", "@arcaai/config-tailwind", "@arcaai/config-ts",
#        "@arcaai/ui"
#      ]
#    }
#
# 5. Add publishConfig to each publishable package.json:
#    {
#      "publishConfig": {
#        "@arcaai:registry": "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/npm/"
#      }
#    }
#
# 6. Add root package.json scripts:
#    {
#      "scripts": {
#        "changeset": "changeset",
#        "changeset:version": "changeset version",
#        "changeset:publish": "changeset publish"
#      }
#    }
#
# ── Developer workflow ───────────────────────────────────────────────────────
#
# 1. Make changes to SDK packages
# 2. Run:  pnpm changeset
#    → Select affected packages, bump type (patch/minor/major)
#    → Creates .changeset/<random-name>.md
# 3. Commit the changeset file with your code changes
# 4. Merge to release-sdk branch
# 5. Pipeline runs:
#    → changeset version (bumps versions + generates CHANGELOGs)
#    → build packages
#    → changeset publish (pushes to GitLab Package Registry)
#
# ── Installing published packages ────────────────────────────────────────────
#
# Consumers add to their .npmrc:
#
#   @arcaai:registry=https://<gitlab-host>/api/v4/projects/<PROJECT_ID>/packages/npm/
#   //<gitlab-host>/api/v4/projects/<PROJECT_ID>/packages/npm/:_authToken=<TOKEN>
#
# Then:  pnpm add @arcaai/vox@1.2.3
#
# ══════════════════════════════════════════════════════════════════════════════

# ── Version + publish packages ───────────────────────────────────────────────

publish-sdk:
  stage: publish
  extends: .node-base
  tags: [fast]
  interruptible: false
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
  before_script:
    - corepack enable
    - corepack install -g --cache-only .gitlab/corepack/pnpm-10.34.5.tgz
    - pnpm config set store-dir .pnpm-store
    - |
      echo "@arcaai:registry=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/npm/"
      echo "${CI_API_V4_URL#http*:}/projects/${CI_PROJECT_ID}/packages/npm/:_authToken=${NPM_PUBLISH_TOKEN}"
    - |
      {
        echo "@arcaai:registry=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/npm/"
        echo "${CI_API_V4_URL#http*:}/projects/${CI_PROJECT_ID}/packages/npm/:_authToken=${NPM_PUBLISH_TOKEN}"
      } > .npmrc
    - pnpm install --frozen-lockfile --prefer-offline
  script:
    - echo "Versioning packages from changesets..."
    - pnpm changeset version

    - echo "Building publishable packages..."
    - pnpm turbo build --filter=@arcaai/utils
    - pnpm turbo build --filter=@arcaai/types
    # Runtime dependency of @arcaai/vox (`workspace:*`), so it is published with the
    # family — a consumer installing @arcaai/vox must be able to resolve it. It was
    # missing from this list, which would have shipped a broken install.
    - pnpm turbo build --filter=@arcaai/json-schema-subset
    - pnpm turbo build --filter=@arcaai/pipeline
    - pnpm turbo build --filter=@arcaai/room
    - pnpm turbo build --filter=@arcaai/vad
    - pnpm turbo build --filter=@arcaai/stt
    - pnpm turbo build --filter=@arcaai/noise-filter
    - pnpm turbo build --filter=@arcaai/med-ner
    - pnpm turbo build --filter=@arcaai/vox
    - pnpm turbo build --filter=@arcaai/vox-node

    - echo "Publishing to GitLab Package Registry..."
    - pnpm changeset publish

    - echo "Committing version bumps..."
    - git config user.email "ci@arcaai.com"
    - git config user.name "GitLab CI"
    - git add -A
    - |
      if ! git diff --cached --quiet; then
        git commit -m "chore(release): version packages [skip ci]"
        git push "http://gitlab-ci-token:${NPM_PUBLISH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" HEAD:release-sdk
      fi
  cache:
    - key:
        files:
          - pnpm-lock.yaml
      paths:
        - .pnpm-store
      policy: pull
  rules:
    # SDK npm release: tag SDK-<ver> (SDK only) or ALL-<ver> (full release).
    # The `publish` stage runs after `test`, so the suite gates this.
    - if: $CI_COMMIT_TAG =~ /^SDK-/ || $CI_COMMIT_TAG =~ /^ALL-/
    # Back-compat: the legacy release-sdk branch still publishes.
    - if: $PIPELINE_TYPE == "release_sdk"

# ══════════════════════════════════════════════════════════════════════════════
# Image signing + SBOM attestation
# ══════════════════════════════════════════════════════════════════════════════
#
# GOAL
#   Every image this pipeline publishes carries (a) a cosign signature bound to
#   its DIGEST and (b) a CycloneDX SBOM attached as an in-toto attestation to
#   that same digest. Together they let the cluster answer "was this exact bag
#   of bytes built by this pipeline, and what is in it?" at admission time —
#   which is what the Kyverno policy in the deployment repo verifies
#   (deployment/k8s/base/kyverno-verify-images.yaml).
#
# ── WHY BY DIGEST, NEVER BY TAG (finding SC-03) ──────────────────────────────
#
#   GitLab CE has no immutable container tags (Ultimate-only, and capped even
#   there). A tag on this registry can be re-pushed to point at different bytes.
#   So:
#     * `cosign sign <repo>:<tag>`  signs whatever the tag means RIGHT NOW and
#       is worthless the moment someone re-pushes it;
#     * `cosign sign <repo>@sha256:...` signs content that cannot change.
#   The tag is resolved to a digest EXACTLY ONCE per job (step 1 below) and
#   every subsequent command uses that digest. Do not "simplify" this by
#   passing $IMAGE straight to `cosign sign` — cosign will accept it, print a
#   warning, and silently resolve the tag itself, reintroducing the race this
#   step exists to remove.
#
# ── ⛔ BLOCKER: PUBLIC FULCIO DOES NOT TRUST THIS GITLAB INSTANCE ─────────────
#
#   Keyless signing works by handing a GitLab-minted OIDC ID token to Fulcio,
#   which issues a short-lived signing certificate. Fulcio only accepts tokens
#   from issuers on an explicit allow-list. Checked 2026-08-08 against
#   https://raw.githubusercontent.com/sigstore/fulcio/main/config/identity/config.yaml:
#
#     * 22 entries in `oidc-issuers`; the GitLab-typed ones are exactly
#       https://gitlab.com, https://dev.gitlab.org, https://ops.gitlab.net and
#       https://gitlab.archlinux.org.
#     * `https://git.taphuynh.dev` is NOT present, and the `meta-issuers`
#       wildcards cover only AKS/GKE/EKS/CircleCI orgs/GitHub Actions — none of
#       them match a self-hosted GitLab.
#
#   So `cosign sign` against the PUBLIC Sigstore will fail from this instance
#   until one of the following is true (owner decision):
#     1. `https://git.taphuynh.dev` is added to public Fulcio's allow-list
#        (upstream MR + a publicly reachable OIDC discovery document), or
#     2. a private Sigstore (Fulcio + Rekor + CTLog + TUF root) is deployed and
#        COSIGN_FULCIO_URL / COSIGN_REKOR_URL below are pointed at it — the job
#        bodies do not change, only those two variables plus a
#        `cosign initialize --mirror ... --root ...` step for the private TUF
#        root, and the matching `rekor.url`/`roots` in the Kyverno policy.
#
#   This is why the jobs are gated on COSIGN_SIGNING_ENABLED (next section) and
#   NOT on `allow_failure: true`. Every gate in this
#   pipeline was built and then neutralised; a job that runs, fails, and is
#   forgiven is exactly that pattern. A job that is explicitly not-yet-armed,
#   with the blocking prerequisite named, is the pattern .gitlab/ci/vault.yml
#   already uses for `VAULT_ADDR: ""`.
#
# ── ARMING THIS ──────────────────────────────────────────────────────────────
#
#   Settings → CI/CD → Variables → COSIGN_SIGNING_ENABLED = "true"
#   (not masked, not a secret — it is a switch, exactly like VAULT_ADDR).
#
#   While it is unset every job below is `when: never`. The moment it is "true"
#   they run and they BLOCK: no allow_failure anywhere in this section. Arm it
#   only after step 1 or 2 above is done, and verify with:
#
#     cosign verify \
#       --certificate-identity-regexp '^https://git\.taphuynh\.dev/arca/hope-v2//\.gitlab-ci\.yml@refs/(heads|tags)/.+$' \
#       --certificate-oidc-issuer https://git.taphuynh.dev \
#       --allow-http-registry --allow-insecure-registry \
#       10.10.1.110:5050/arca/hope-v2/api@sha256:<digest>
#
#     cosign verify-attestation --type cyclonedx \
#       --certificate-identity-regexp '...' --certificate-oidc-issuer ... \
#       10.10.1.110:5050/arca/hope-v2/api@sha256:<digest>
#
# ── TIER ─────────────────────────────────────────────────────────────────────
#
#   Re-probed 2026-08-08 against THIS instance with POST /projects/6/ci/lint,
#   the same method .gitlab/ci/vault.yml:11-27 used for Vault:
#
#     id_tokens: {SIGSTORE_ID_TOKEN: {aud: sigstore}}   -> valid: true
#     artifacts: {reports: {cyclonedx: [...]}}          -> valid: true
#     secrets:   {DB: {vault: ..., token: ...}}         -> valid: FALSE,
#         "jobs:...config contains unknown keys: secrets"
#
#   So: `id_tokens` is available (Free-tier since 15.7) and is what these jobs
#   use. The native `secrets:` / GitLab-managed-signing-key flow is still
#   Premium/Ultimate and is rejected by this instance's linter today — do not
#   migrate to it without re-running the probe.
#
#   `artifacts:reports:cyclonedx` DOES lint here (only the dependency-list UI it
#   feeds is Ultimate-gated), so it is declared alongside the plain artifact
#   path. It costs nothing on CE and lights up automatically if the project ever
#   moves to Ultimate. The authoritative copy of the SBOM is still the registry
#   attestation — that is where a verifier at admission time actually looks.
#
# ── FOLLOWING GitLab'S OWN TEMPLATE ──────────────────────────────────────────
#
#   lib/gitlab/ci/templates/Cosign.gitlab-ci.yml (read 2026-08-08) is:
#
#     variables:  { COSIGN_YES: "true" }
#     id_tokens:  { SIGSTORE_ID_TOKEN: { aud: sigstore } }
#     after_script:
#       - apk add --update cosign
#       - IMAGE_DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' ...)"
#       - cosign sign "$IMAGE_DIGEST"
#
#   Kept: COSIGN_YES, the `aud: sigstore` id_token, sign-by-digest.
#   Changed, deliberately:
#     * a PINNED cosign image instead of `apk add --update cosign` — an
#       unpinned package install inside the job that establishes image
#       provenance is self-defeating;
#     * `cosign triangulate --type digest` instead of `docker inspect` —
#       .build-template pushes with buildx and this job never holds the image
#       locally, so there is no local RepoDigest to inspect;
#     * `script:` not `after_script:` — an after_script failure does NOT fail
#       the job, which would make this a non-gate.
#
# ── WHAT COULD NOT BE VERIFIED WHEN THIS WAS WRITTEN ─────────────────────────
#
#   No pipeline was run, no signature was produced, and no attestation was
#   pushed. Tool behaviour WAS verified locally against the pinned images
#   (cosign v2.6.5 `triangulate --type digest` returns `repo@sha256:...`;
#   `attest --type` accepts `cyclonedx`; trivy 0.74.0 `--format cyclonedx`
#   emits CycloneDX 1.6 carrying the resolved RepoDigest/RepoTag). End-to-end
#   behaviour is unproven until COSIGN_SIGNING_ENABLED is armed.
#
# ══════════════════════════════════════════════════════════════════════════════

# ── Shared gating ────────────────────────────────────────────────────────────
# Referenced FIRST by every job below, so both guards win before any service
# rule can match. Each job then appends its own `.rules-<svc>` fragment — the
# SAME fragment its `build-*` job uses, so a signing job can never be scheduled
# for an image that was not built (and never silently skipped for one that was).

.image-signing-guard:
  rules:
    # Guard 1 — the arming switch (see "ARMING THIS" above).
    - if: $COSIGN_SIGNING_ENABLED != "true"
      when: never
    # Guard 2 — pipeline types that build no images at all. Mirrors the leading
    # `when: never` clause every scan-* job in .gitlab/ci/scan.yml carries.
    # NOTE: `.skip-on-dev-2-1` is deliberately NOT referenced here. Builds DO
    # run on dev-2.1 (.build-common-rules admits PIPELINE_TYPE == "dev"), and an
    # image that is built but never signed is precisely the gap this closes.
    - if: $PIPELINE_TYPE == "merge_request" || $PIPELINE_TYPE == "feature" || $PIPELINE_TYPE == "release_sdk" || $PIPELINE_TYPE == "main"
      when: never

# ── CycloneDX SBOM generation ────────────────────────────────────────────────
# Reuses the Trivy image already pinned by .trivy-scan (.gitlab/ci/scan.yml:14)
# rather than adding syft: one fewer tool in the supply chain, and 0.74.0's
# `--format cyclonedx` was confirmed to emit CycloneDX 1.6 with the image's
# RepoDigest and RepoTag recorded in metadata.component.

.cyclonedx-sbom:
  stage: publish
  tags: [build]
  image:
    name: aquasec/trivy:0.74.0
    entrypoint: [""]
  timeout: 30m
  variables:
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
    TRIVY_INSECURE: "true"
    # Defaults to the dotenv IMAGE published by the matching build-* job.
    # Overridden only by sbom-python-base (see its comment).
    SIGN_IMAGE: $IMAGE
    SBOM_FILE: sbom.cdx.json
  script:
    - |
      set -eu

      if [ -z "${SIGN_IMAGE:-}" ]; then
        echo "SIGN_IMAGE is empty."
        echo "It normally comes from the build-* job's dotenv report (IMAGE)."
        echo "A build job that overrides .build-template's script without also"
        echo "writing build.env publishes no IMAGE — set SIGN_IMAGE explicitly."
        exit 1
      fi

      echo "Generating CycloneDX SBOM for: $SIGN_IMAGE"
      trivy image \
        --quiet \
        --no-progress \
        --format cyclonedx \
        --output "$SBOM_FILE" \
        "$SIGN_IMAGE"

      # Two assertions, because "a file exists" is not "an SBOM was produced".
      grep -qF '"bomFormat":"CycloneDX"' "$SBOM_FILE" \
        || { echo "Output is not a CycloneDX document."; exit 1; }
      # Trivy records the reference it was handed as metadata.component.name
      # and as the aquasecurity:trivy:RepoTag property. If it is absent, this
      # SBOM describes something other than the image about to be signed.
      grep -qF "$SIGN_IMAGE" "$SBOM_FILE" \
        || { echo "SBOM does not reference $SIGN_IMAGE."; exit 1; }

      echo "SBOM OK: $(wc -c < "$SBOM_FILE") bytes"
  artifacts:
    paths:
      - sbom.cdx.json
    reports:
      # Lints clean on this CE instance (probe above); surfaces in the
      # dependency list only on Ultimate. Harmless either way.
      cyclonedx:
        - sbom.cdx.json
    expire_in: 90 days
  allow_failure: false

# ── Keyless signature, then SBOM attestation on the same digest ──────────────

.cosign-sign-attest:
  stage: publish
  tags: [build]
  image:
    # Pinned BY DIGEST, not by tag — the whole point of this section is that a
    # tag is not an identity. Tag shown for humans; the digest is what resolves.
    # gcr.io/projectsigstore/cosign:v2.6.5-dev, an OCI index covering
    # amd64/arm64/arm/s390x/ppc64le (verified 2026-08-08).
    #
    # The `-dev` suffix is REQUIRED and is not a pre-release marker: the plain
    # gcr.io/projectsigstore/cosign:v2.6.5 image is distroless with no shell
    # (verified: `exec: "sh": executable file not found in $PATH`), so GitLab
    # cannot run a `script:` in it. `-dev` is the same cosign binary on a
    # busybox base.
    name: gcr.io/projectsigstore/cosign:v2.6.5-dev@sha256:76029a0246bcfde96caa72469a62a1094f6e0978dc3f537f5cafd4c5f6c6a417
    entrypoint: [""]
  timeout: 20m
  # A half-signed image (signature pushed, attestation not) is worse than an
  # unsigned one: it satisfies a signature check while carrying no SBOM.
  interruptible: false
  id_tokens:
    # Consumed by cosign automatically via $SIGSTORE_ID_TOKEN. `aud: sigstore`
    # is what Fulcio requires; do not rename the variable.
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  variables:
    COSIGN_YES: "true"
    # Point these at a private Sigstore if the public one is unusable — see the
    # BLOCKER section above. Defaults are cosign's own public endpoints.
    COSIGN_FULCIO_URL: "https://fulcio.sigstore.dev"
    COSIGN_REKOR_URL: "https://rekor.sigstore.dev"
    # Credentials are handed to cosign through a docker config file rather than
    # --registry-username/--registry-password so the token never appears in the
    # process argv. go-containerregistry (cosign's registry layer) honours
    # $DOCKER_CONFIG. The cosign image runs as `nonroot`, so use /tmp.
    DOCKER_CONFIG: /tmp/.docker
    SIGN_IMAGE: $IMAGE
    SBOM_FILE: sbom.cdx.json
  script:
    - |
      set -eu

      if [ -z "${SIGN_IMAGE:-}" ]; then
        echo "SIGN_IMAGE is empty — see the same check in .cyclonedx-sbom."
        exit 1
      fi
      if [ ! -s "$SBOM_FILE" ]; then
        echo "$SBOM_FILE is missing or empty."
        echo "It is produced by this service's sbom-* job; check that job's"
        echo "artifacts reached here via needs: [{ ..., artifacts: true }]."
        exit 1
      fi

      # ── Registry credentials ──────────────────────────────────────────────
      # Never wrap any of this in `set -x`: values expanded at runtime are NOT
      # masked by GitLab (masking only covers project-settings variables) —
      # the same trap .gitlab/ci/vault.yml:195-196 documents.
      mkdir -p "$DOCKER_CONFIG"
      auth=$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')
      printf '{"auths":{"%s":{"auth":"%s"}}}' "$REGISTRY" "$auth" > "$DOCKER_CONFIG/config.json"
      unset auth

      # The HOPE registry is plain HTTP on the LAN (REGISTRY=10.10.1.110:5050 in
      # .gitlab-ci.yml; the buildx builder is configured http=true/insecure=true
      # in templates.yml .buildx-registry-login). cosign refuses both by default.
      REG_OPTS="--allow-http-registry --allow-insecure-registry"

      # ── Step 1 — resolve the tag to a digest, ONCE ────────────────────────
      # Everything after this line uses $digest_ref. Nothing is signed by tag.
      digest_ref=$(cosign triangulate --type digest $REG_OPTS "$SIGN_IMAGE")
      case "$digest_ref" in
        *@sha256:*) : ;;
        *)
          echo "Could not resolve $SIGN_IMAGE to a digest (got: '$digest_ref')."
          exit 1
          ;;
      esac
      echo "Resolved $SIGN_IMAGE"
      echo "      -> $digest_ref"

      # ── Step 2 — keyless signature on the digest ───────────────────────────
      echo ""
      echo "Signing (keyless, Fulcio=$COSIGN_FULCIO_URL Rekor=$COSIGN_REKOR_URL)"
      cosign sign \
        $REG_OPTS \
        --fulcio-url "$COSIGN_FULCIO_URL" \
        --rekor-url "$COSIGN_REKOR_URL" \
        "$digest_ref"

      # ── Step 3 — CycloneDX SBOM as an in-toto attestation ──────────────────
      # Same $digest_ref as step 2 — the attestation subject is the signed
      # artifact by construction, not by convention.
      echo ""
      echo "Attesting CycloneDX SBOM ($(wc -c < "$SBOM_FILE") bytes)"
      cosign attest \
        --type cyclonedx \
        --predicate "$SBOM_FILE" \
        --replace \
        $REG_OPTS \
        --fulcio-url "$COSIGN_FULCIO_URL" \
        --rekor-url "$COSIGN_REKOR_URL" \
        "$digest_ref"

      echo ""
      echo "Signed + attested: $digest_ref"
  allow_failure: false

# ── Per-image jobs ───────────────────────────────────────────────────────────
# One sbom-* / sign-* pair per build-* job in .gitlab/ci/build.yml (13 images).
# Two jobs, not one, because no single image ships both trivy and cosign and
# fetching the missing binary at job time would put an unpinned download inside
# the job that establishes provenance.
#
# Each pair's `rules:` are the SAME `.rules-<svc>` fragment its build-* job
# uses. Cross-check BOTH directions when adding an image: a signing job gated
# differently from its build either never runs, or waits forever on a job that
# never ran (the failure mode .gitlab/ci/scan.yml:226-229 already records).

# --- Shared Python base image ---
# build-python-base OVERRIDES .build-template's script and never writes
# build.env, so it publishes NO dotenv IMAGE — $IMAGE would be empty here.
# The reference is reconstructed from the tags that job actually pushes
# (build.yml:90-100). Do not copy this override to any other pair.
sbom-python-base:
  extends: .cyclonedx-sbom
  needs:
    - job: build-python-base
  variables:
    SIGN_IMAGE: $REGISTRY/$CI_PROJECT_PATH/hope-python-base:$CI_COMMIT_SHA
  rules:
    - !reference [.image-signing-guard, rules]
    - !reference [.build-common-rules, rules]
    - if: $CI_COMMIT_TAG =~ /^(SMR|STT|GUARD|TTS|HARNESS|NLP|ALL)-/

sign-python-base:
  extends: .cosign-sign-attest
  needs:
    - job: build-python-base
    - job: sbom-python-base
      artifacts: true
  variables:
    SIGN_IMAGE: $REGISTRY/$CI_PROJECT_PATH/hope-python-base:$CI_COMMIT_SHA
  rules:
    - !reference [.image-signing-guard, rules]
    - !reference [.build-common-rules, rules]
    - if: $CI_COMMIT_TAG =~ /^(SMR|STT|GUARD|TTS|HARNESS|NLP|ALL)-/

# --- API gateway ---
sbom-api:
  extends: .cyclonedx-sbom
  needs:
    - job: build-api
      artifacts: true
  rules:
    - !reference [.image-signing-guard, rules]
    - !reference [.rules-api, rules]

sign-api:
  extends: .cosign-sign-attest
  needs:
    - job: build-api
      artifacts: true
    - job: sbom-api
      artifacts: true
  rules:
    - !reference [.image-signing-guard, rules]
    - !reference [.rules-api, rules]

# --- Admin console ---
sbom-admin-console:
  extends: .cyclonedx-sbom
  needs:
    - job: build-admin-console
      artifacts: true
  rules:
    - !reference [.image-signing-guard, rules]
    - !reference [.rules-admin-console, rules]

sign-admin-console:
  extends: .cosign-sign-attest
  needs:

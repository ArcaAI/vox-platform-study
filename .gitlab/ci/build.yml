# ══════════════════════════════════════════════════════════════════════════════
# Build stage — Docker image build + push
# ══════════════════════════════════════════════════════════════════════════════
#
# Trigger model (automatic — no manual click):
#   dev-* / staging-* / prod-* / cicd branch push → build ALL images (env-tagged)
#   git tag <SVC>-<ver> (e.g. TEXT-2.1.0)          → build that service only
#   git tag ALL-<ver>                             → build every image (+ SDK, see publish.yml)
#   MR / feature / main / release-sdk → no builds
# Builds gate on the relevant test job(s) via `needs:`; a release-tag pipeline
# runs the full suite (rules.yml .rules-always), so nothing ships from red tests.

# ── Shared build rules ───────────────────────────────────────────────────────
# Every build job references this, then appends its own release-tag clause:
#   rules:
#     - !reference [.build-common-rules, rules]
#     - if: $CI_COMMIT_TAG =~ /^TEXT-/ || $CI_COMMIT_TAG =~ /^ALL-/
#
# `prod`/`production` deliberately do NOT appear in
# the build-triggering condition below. Under digest promotion,
# production is reached by copying the SAME sha-<sha8> manifest a dev/staging
# pipeline already built and scanned — a rebuild on a prod-*/production-*
# branch push would produce a structurally different image (base-layer cache
# drift, different `created` label) and break that guarantee. prod-*/
# production-* branches may still exist for cherry-picks; they just never
# build or deploy (production deploys are tag-triggered — see promote-prod
# in deploy.yml and PIPELINE_TYPE == "tag_release").
.build-common-rules:
  rules:
    - if: $PIPELINE_TYPE == "merge_request" || $PIPELINE_TYPE == "release_sdk" || $PIPELINE_TYPE == "main" || $PIPELINE_TYPE == "feature" || $PIPELINE_TYPE == "prod"
      when: never
    - if: $PIPELINE_TYPE == "dev" || $PIPELINE_TYPE == "staging" || $PIPELINE_TYPE == "cicd"

# ── Pre-pull base images ─────────────────────────────────────────────────────

warm-up-base-images:
  stage: build
  tags: [build]
  image: docker:28
  timeout: 15m
  interruptible: true
  script:
    - |
      set -eu
      # MUST match the external bases actually referenced by the Dockerfiles.
      # Derive with:
      #   grep -rhoE '(ghcr.io/astral-sh/uv|python|node|nginx|nvidia/cuda):[^ ]*' \
      #     apps/*/Dockerfile apps/stt/docker/Dockerfile packages/database/Dockerfile \
      #     infrastructure/docker/python-base/Dockerfile \
      #     infrastructure/docker/lmstudio/Dockerfile | sort -u
      # Entries that drift out of sync are pure waste: a stale entry burns runner
      # disk on an image no build consumes, a missing one costs a cold pull.
      images="
        nvidia/cuda:12.8.1-cudnn-runtime-ubuntu22.04
        nvidia/cuda:12.8.1-cudnn-devel-ubuntu22.04
        nvidia/cuda:12.8.1-runtime-ubuntu24.04
        ghcr.io/astral-sh/uv:0.11.33
        python:3.11-slim-trixie
        node:24-slim
        node:24-bookworm-slim
        node:24-alpine
        nginx:1.30.4-alpine
      "
      for img in $images; do
        if docker image inspect "$img" >/dev/null 2>&1; then
          echo "CACHED  $img"
        else
          echo "PULLING $img ..."
          docker pull "$img"
        fi
      done
      echo "All base images warm"
  rules:
    - !reference [.build-common-rules, rules]
    # `ALL-` already covers build-lmstudio, which is the only consumer of the
    # ubuntu24.04 CUDA base added above; it has no service tag of its own (see
    # build-lmstudio's own note on the closed <SVC> grammar).
    - if: $CI_COMMIT_TAG =~ /^(TEXT|STT|GUARD|TTS|HARNESS|NLP|COMPAT|ALL)-/

# ── Shared Python base image ─────────────────────────────────────────────────
# Single base image consumed by ALL Python service builds (guardrail, nlp, text,
# harness, tts, stt CPU stages) via `--build-arg BASE_IMAGE`. Must build BEFORE
# the Python service jobs (they `needs:` this job).

build-python-base:
  extends: .build-template
  needs:
    - job: warm-up-base-images
      optional: true
  variables:
    SERVICE_NAME: hope-python-base
  script:
    - |
      set -eu
      image_repo="$REGISTRY/$CI_PROJECT_PATH/hope-python-base"
      cache_repo="$image_repo/cache"
      echo "Building shared base image -> $image_repo:$CI_COMMIT_SHA"
      docker buildx build \
        --push \
        --cache-from type=registry,ref=$cache_repo \
        --cache-to   type=registry,ref=$cache_repo,mode=max,compression=zstd \
        --label org.opencontainers.image.revision=$CI_COMMIT_SHA \
        --tag $image_repo:$CI_COMMIT_SHA \
        --tag $image_repo:latest \
        infrastructure/docker/python-base/
  rules:
    - !reference [.build-common-rules, rules]
    - if: $CI_COMMIT_TAG =~ /^(TEXT|STT|GUARD|TTS|HARNESS|NLP|ALL)-/

# ── API Gateway ──────────────────────────────────────────────────────────────

build-api:
  extends: .build-template
  needs:
    - job: warm-up-base-images
      optional: true
    - job: test-api
      optional: true
    - job: typecheck
      optional: true
  variables:
    SERVICE_NAME: api
    DOCKER_CONTEXT: "."
    DOCKERFILE: apps/api/Dockerfile
    # The `--build-arg DATABASE_URL=$DATABASE_URL` that
    # was here passed an EMPTY value — no job or global variable named
    # DATABASE_URL exists at the build stage — so the Dockerfile's own
    # generate-only placeholder (`${DATABASE_URL:-postgresql://postgres:...}`,
    # apps/api/Dockerfile:58) took effect either way. Removed: it was a no-op
    # that would silently start baking a real connection string into the image
    # build history the moment anyone defined a pipeline-wide DATABASE_URL.
    BUILD_ARGS: ""
  rules:
    - !reference [.build-common-rules, rules]
    - if: $CI_COMMIT_TAG =~ /^API-/ || $CI_COMMIT_TAG =~ /^ALL-/

# ── Admin Console ────────────────────────────────────────────────────────────

build-admin-console:
  extends: .build-template
  needs:
    - job: warm-up-base-images
      optional: true
    - job: typecheck
      optional: true
  variables:
    SERVICE_NAME: admin-console
    DOCKER_CONTEXT: "."
    DOCKERFILE: apps/admin-console/Dockerfile
    # Browser-reachable gateway origin, inlined into the client bundle.
    BUILD_ARGS: "--build-arg NEXT_PUBLIC_API_HOST=$NEXT_PUBLIC_API_HOST"
  rules:
    - !reference [.build-common-rules, rules]
    - if: $CI_COMMIT_TAG =~ /^ADMIN-/ || $CI_COMMIT_TAG =~ /^ALL-/

build-compat-playground:
  extends: .build-template
  needs:
    - job: warm-up-base-images
      optional: true
    - job: test-compat-playground
      optional: true
    - job: typecheck
      optional: true
  variables:
    SERVICE_NAME: compat-playground
    DOCKER_CONTEXT: "."
    DOCKERFILE: apps/compat-playground/Dockerfile
    BUILD_ARGS: "--build-arg VITE_API_BASE_URL=$NEXT_PUBLIC_API_HOST"
  rules:
    - !reference [.build-common-rules, rules]
    - if: $CI_COMMIT_TAG =~ /^COMPAT-/ || $CI_COMMIT_TAG =~ /^ALL-/

# ── NLP ──────────────────────────────────────────────────────────────────────

build-nlp:
  extends: .build-template
  needs:
    - job: warm-up-base-images
      optional: true
    - job: build-python-base
    - job: test-nlp
      optional: true
  variables:
    SERVICE_NAME: nlp
    DOCKER_CONTEXT: "."
    DOCKERFILE: apps/nlp/Dockerfile
    BUILD_ARGS: "--build-arg BASE_IMAGE=$REGISTRY/$CI_PROJECT_PATH/hope-python-base:$CI_COMMIT_SHA"
  rules:
    - !reference [.build-common-rules, rules]
    - if: $CI_COMMIT_TAG =~ /^NLP-/ || $CI_COMMIT_TAG =~ /^ALL-/

# ── Guardrail ───────────────────────────────────────────────────────────────

build-guardrail:
  extends: .build-template
  needs:
    - job: warm-up-base-images
      optional: true
    - job: build-python-base
    - job: test-guardrail
      optional: true
  variables:
    SERVICE_NAME: guardrail
    DOCKER_CONTEXT: "."
    DOCKERFILE: apps/guardrail/Dockerfile
    BUILD_TARGET: production
    BUILD_ARGS: "--build-arg BASE_IMAGE=$REGISTRY/$CI_PROJECT_PATH/hope-python-base:$CI_COMMIT_SHA"
  rules:
    - !reference [.build-common-rules, rules]
    - if: $CI_COMMIT_TAG =~ /^GUARD-/ || $CI_COMMIT_TAG =~ /^ALL-/

# ── TEXT ──────────────────────────────────────────────────────────────────────

build-text:
  extends: .build-template
  needs:
    - job: warm-up-base-images
      optional: true
    - job: build-python-base
    - job: test-text
      optional: true
  variables:
    SERVICE_NAME: text
    DOCKER_CONTEXT: "."
    DOCKERFILE: apps/text/Dockerfile
    BUILD_ARGS: "--build-arg BASE_IMAGE=$REGISTRY/$CI_PROJECT_PATH/hope-python-base:$CI_COMMIT_SHA"
  rules:
    - !reference [.build-common-rules, rules]
    - if: $CI_COMMIT_TAG =~ /^TEXT-/ || $CI_COMMIT_TAG =~ /^ALL-/

# ── Harness ─────────────────────────────────────────────────────────────────

build-harness:
  extends: .build-template
  needs:
    - job: warm-up-base-images
      optional: true
    - job: build-python-base
    # This need is NON-optional so a red or absent harness suite
    # could stop a publish. That is the right posture, but it is incompatible
    # with the dev-2.1 shim (.gitlab-ci.yml sets SKIP_TESTS=true, which deletes
    # `test-harness` while the build still runs) — the pipeline then fails to be
    # CREATED at all. Restored to `optional: true`, matching every other build
    # job. Drop the `optional: true` again when the dev-2.1 shim is removed.
    - job: test-harness
      optional: true
  variables:
    SERVICE_NAME: harness
    DOCKER_CONTEXT: "."
    DOCKERFILE: apps/harness/Dockerfile
    BUILD_TARGET: production
    BUILD_ARGS: "--build-arg BASE_IMAGE=$REGISTRY/$CI_PROJECT_PATH/hope-python-base:$CI_COMMIT_SHA"
  rules:
    - !reference [.build-common-rules, rules]
    - if: $CI_COMMIT_TAG =~ /^HARNESS-/ || $CI_COMMIT_TAG =~ /^ALL-/

build-harness-worker:
  extends: .build-template
  needs:
    - job: warm-up-base-images
      optional: true
    - job: build-python-base
    # See build-harness above — same dev-2.1 shim constraint.
    - job: test-harness
      optional: true
  variables:
    SERVICE_NAME: harness-worker
    DOCKER_CONTEXT: "."
    DOCKERFILE: apps/harness/Dockerfile
    # Same Dockerfile, `worker` stage — the Temporal worker is a separate
    # PROCESS, not a separate codebase (06-python-services.md §Temporal).
    BUILD_TARGET: worker
    BUILD_ARGS: "--build-arg BASE_IMAGE=$REGISTRY/$CI_PROJECT_PATH/hope-python-base:$CI_COMMIT_SHA"
  rules:
    - !reference [.build-common-rules, rules]
    - if: $CI_COMMIT_TAG =~ /^HARNESS-/ || $CI_COMMIT_TAG =~ /^ALL-/

# ── Qdrant collection provisioning ──────────────────────────────────────────
# One-shot init image for the Argo `Sync`-hook Job that creates
# `knowledge_chunks` (deployment/k8s/base/qdrant-init.yaml in
# hope-v2-deployment) — bakes the script + qdrant-client so the Job never
# pip-installs at pod start. Not built from hope-python-base (see the
# Dockerfile) and has no test job of its own, so `needs:` is just the base
# image warm-up, same shape as build-database.

build-qdrant-init:
  extends: .build-template
  needs:
    - job: warm-up-base-images
      optional: true
  variables:
    SERVICE_NAME: qdrant-init
    DOCKER_CONTEXT: "."
    DOCKERFILE: infrastructure/docker/qdrant-init/Dockerfile
  rules:
    - !reference [.build-common-rules, rules]
    - if: $CI_COMMIT_TAG =~ /^ALL-/

# ── TTS ─────────────────────────────────────────────────────────────────────

build-tts:
  extends: .build-template
  needs:
    - job: warm-up-base-images
      optional: true
    - job: build-python-base
    - job: test-tts
      optional: true
  variables:
    SERVICE_NAME: tts
    DOCKER_CONTEXT: "."
    DOCKERFILE: apps/tts/Dockerfile
    BUILD_TARGET: production
    BUILD_ARGS: "--build-arg BASE_IMAGE=$REGISTRY/$CI_PROJECT_PATH/hope-python-base:$CI_COMMIT_SHA"
  rules:
    - !reference [.build-common-rules, rules]
    - if: $CI_COMMIT_TAG =~ /^TTS-/ || $CI_COMMIT_TAG =~ /^ALL-/

# ── STT ML Runtime ───────────────────────────────────────────────────────

build-stt:
  extends: .build-template
  needs:
    - job: warm-up-base-images
      optional: true
    - job: test-stt
      optional: true
  variables:
    SERVICE_NAME: stt-ml-runtime
    # Root context: Dockerfile now references apps/stt/* paths + workspace lock.
    # GPU stages use the nvidia/cuda base (not hope-python-base), so no BASE_IMAGE.
    DOCKER_CONTEXT: "."
    DOCKERFILE: apps/stt/docker/Dockerfile
    BUILD_TARGET: ml-runtime
  rules:
    - !reference [.build-common-rules, rules]
    - if: $CI_COMMIT_TAG =~ /^STT-/ || $CI_COMMIT_TAG =~ /^ALL-/

# ── STT Worker ───────────────────────────────────────────────────────────

build-stt-worker:
  extends: .build-template
  needs:
    - job: warm-up-base-images
      optional: true
    - job: test-stt
      optional: true
  variables:
    SERVICE_NAME: stt-worker
    # Root context: Dockerfile now references apps/stt/* paths + workspace lock.
    # GPU stages use the nvidia/cuda base (not hope-python-base), so no BASE_IMAGE.
    DOCKER_CONTEXT: "."
    DOCKERFILE: apps/stt/docker/Dockerfile
    BUILD_TARGET: worker
  rules:
    - !reference [.build-common-rules, rules]
    - if: $CI_COMMIT_TAG =~ /^STT-/ || $CI_COMMIT_TAG =~ /^ALL-/

# ── Database (Prisma migrations image) ──────────────────────────────────────

build-database:
  extends: .build-template
  needs:
    - job: warm-up-base-images
      optional: true
    - job: test-packages
      optional: true
  variables:
    SERVICE_NAME: database
    DOCKER_CONTEXT: .
    DOCKERFILE: packages/database/Dockerfile
  rules:
    - !reference [.build-common-rules, rules]
    - if: $CI_COMMIT_TAG =~ /^ALL-/

# ── LM Studio (`llmster`) GGUF serving tier ─────────────────────────────────
# TASK-824. Owner decision 2026-08-30 (ticket §0): LM Studio + vLLM.
#
# CI IS THE ONLY BUILDER FOR THIS IMAGE. It embeds a proprietary binary fetched
# from a vendor CDN and is pushed to the INTERNAL registry only — we hold no
# redistribution right (ticket §0 risk A-5, §5 L-2). $REGISTRY is internal, so
# the existing push path is already correct; do not add a public mirror.
#
# ── WHY THIS JOB DOES NOT USE `curl install.sh | bash` ──────────────────────
# The Dockerfile fetches ONE pinned URL and verifies a pinned SHA-512, because
# the upstream installer picks its bundle from the BUILD HOST and this runner
# has no GPU. Verified against the live script 2026-08-30:
#
#   install.sh:594  get_linux_x86_full_bundle_suffix()
#                     -> "+cuda12" only if supports_cuda_12_4_or_newer()
#   install.sh:447  no `nvidia-smi`  -> "" (CPU bundle)
#   install.sh:442  no `timeout`     -> "" (CPU bundle) — a SECOND trigger,
#                                        which fires EVEN ON A GPU HOST
#
# A CPU-only image starts, serves and answers requests. On this runner the
# installer would produce one every single time. The pinned SHA-512 makes that
# impossible: the CPU and CUDA bundles are provably different artifacts
# (published .sha512 files, fetched 2026-08-30) —
#   full+cuda12.tar.gz  145d84440b8797614edb39b1019085c90fbc215c...
#   full.tar.gz         29464e0cc52bdf31f6feb9d280d1f499cbef494f...
# so a CPU tarball cannot satisfy `sha512sum -c` and the build aborts.
#
# ── NO SERVICE RELEASE TAG YET ──────────────────────────────────────────────
# `<SVC>` in the release grammar is a CLOSED set
# (packages/utils/src/version-grammar.ts): ALL API ADMIN COMPAT GUARD HARNESS
# NLP TEXT STT TTS. There is no LMS/LMSTUDIO member, and adding one edits
# packages/**, which is outside this lane's boundary. So this job triggers on
# branch pushes and `ALL-` only — the same shape as build-qdrant-init and
# build-database. Adding `LMS-` to the grammar is ROOT_CONFIG_REQUEST R-6 in
# docs/implementation/TASK-824-LM-Studio-Service/deployment-llmster/README.md.

build-lmstudio:
  extends: .build-template
  needs:
    - job: warm-up-base-images
      optional: true
  variables:
    SERVICE_NAME: lmstudio
    # Context is the image directory itself, not the repo root: this image
    # copies exactly two files and needs none of the monorepo. Same shape as
    # build-python-base.
    DOCKER_CONTEXT: infrastructure/docker/lmstudio
    DOCKERFILE: infrastructure/docker/lmstudio/Dockerfile
  # The bundle download is ~1.5 GB on top of a 2 GB CUDA base.
  timeout: 45m
  rules:
    - !reference [.build-common-rules, rules]
    - if: $CI_COMMIT_TAG =~ /^ALL-/

# ── The gate that makes the CUDA guarantee real ─────────────────────────────
# The pinned checksum proves we downloaded the CUDA TARBALL. It does NOT prove
# the resulting image can actually offload, and ticket §8.4 establishes that a
# CPU-only deployment is UNDETECTABLE OVER HTTP: /api/v1/models reports
# `format: "gguf"` — a weights format, not an accelerator — and no
# /api/v1/(runtime|engine|system|server) path exists. Runtime introspection
# lives only on the WebSocket RPC channel, surfaced by `lms runtime`.
#
# So this job runs the image CI just built and asserts, via `lms runtime ls`,
# that an accelerated engine is present. If the wrong bundle ever ships, the
# image is already pushed but this job goes red and it never promotes.
#
# WHAT THIS JOB CANNOT PROVE, and must not be read as proving: that a GPU
# EXISTS. Build runners have no NVIDIA device, and `lms runtime select`
# succeeds on a GPU-less host (measured). GPU PRESENCE is asserted at pod
# start by entrypoint.sh A-2, which fails closed with exit 78. The two checks
# are complementary and neither substitutes for the other.
verify-lmstudio-runtime:
  stage: build
  tags: [build]
  image: docker:28
  timeout: 20m
  interruptible: true
  needs:
    - job: build-lmstudio
  before_script:
    - !reference [.buildx-registry-login, before_script]
  script:
    - |
      set -eu
      img="$REGISTRY/$CI_PROJECT_PATH/lmstudio@${DIGEST}"
      echo "verifying $img"
      docker pull "$img"

      echo "── build identity ──"
      docker run --rm --entrypoint cat "$img" /app/build-info.json
      echo "── bundle provenance (which tarball actually landed) ──"
      docker run --rm --entrypoint cat "$img" /home/llmster/.lmstudio/hope-build-info.json

      echo "── installed inference engines (filesystem inventory) ──"
      # DO NOT use `lms runtime ls` here. MEASURED 2026-08-31, job 15218: it
      # answers "No runtimes found." on this runner while the very same
      # container holds three engines on disk. It enumerates runtimes THE HOST
      # CAN RUN -- it is hardware-filtered -- so on a runner with no NVIDIA
      # device it is guaranteed to report nothing, whatever the image contains.
      # Using it made a GPU a prerequisite for verifying an image, which no CI
      # runner here has and buildkit cannot provide.
      #
      # What this job can honestly prove is CONTENTS, so it reads the directory
      # the bundle installs into. That is also exactly what the Dockerfile
      # asserts, so the two agree by construction.
      #
      # The GPU question -- is a device present, and was the CUDA engine
      # actually selected -- belongs to entrypoint.sh A-2 at pod start, where a
      # device exists. `lms runtime ls` is the right command THERE for the same
      # reason it is the wrong one here.
      set +e
      engines=$(docker run --rm --entrypoint /bin/sh "$img" -c \
        'ls -1 /home/llmster/.lmstudio/extensions/backends 2>&1')
      rc=$?
      set -e
      echo "docker run exit status: $rc"
      echo "$engines"

      if [ -z "$engines" ] || [ "$rc" -ne 0 ]; then
        echo "FATAL: could not list the backends directory (exit $rc)." >&2
        echo "The probe could not answer, so the image is UNVERIFIED." >&2
        exit 1
      fi

      if ! echo "$engines" | grep -iq 'cuda'; then
        echo "FATAL: no CUDA engine in this image — it is CPU-ONLY." >&2
        echo "It would start, serve and answer requests at a fraction of the" >&2
        echo "throughput, and no HTTP endpoint could reveal it. Do not promote." >&2
        exit 1
      fi

      # Owner requirement 2026-08-31: images must be ready for CPU *and* CUDA.
      if ! echo "$engines" | grep -i '^llama\.cpp' | grep -qvi 'cuda\|vulkan\|rocm\|hip\|metal'; then
        echo "FATAL: no CPU engine in this image." >&2
        echo "A CPU-runnable image is a requirement, not a fallback." >&2
        exit 1
      fi
      echo "OK: both a CPU and a CUDA engine are present in the image."
      echo "NOTE: this proves the image CONTENTS only. GPU presence is asserted"
      echo "      at pod start by entrypoint.sh A-2 (exit 78) — correctly, since"
      echo "      that is the first place a device actually exists."
  rules:
    - !reference [.build-common-rules, rules]
    - if: $CI_COMMIT_TAG =~ /^ALL-/

# ── vLLM inference image (TASK-823) ─────────────────────────────────────────
# `vllm/vllm-openai:v0.28.0` + the out-of-tree GGUF plugin, pinned to a full
# commit SHA. Rationale, the v0.11.0-vs-v0.28.0 version pincer, and the three
# limitations this image ships with (no GGUF embeddings, Granite unverified,
# GGUF documented by vLLM as highly experimental) are in
# infrastructure/docker/vllm/Dockerfile and ticket §13.
#
# ── NOT IN warm-up-base-images, DELIBERATELY ────────────────────────────────
# `vllm/vllm-openai:v0.28.0` is ~10 GB. warm-up-base-images has a 15m timeout
# and pulls SIX bases sequentially; adding this one risks turning a shared
# warm-up job into the pipeline's flakiest step for a single consumer. buildx
# pulls it as part of this job instead, where the timeout below accounts for it.
# The `needs:` is kept (optional) purely to match the house shape.
#
# ── NO SERVICE RELEASE TAG YET ──────────────────────────────────────────────
# `<SVC>` in the release grammar is a CLOSED set
# (packages/utils/src/version-grammar.ts): ALL API ADMIN COMPAT GUARD HARNESS
# NLP TEXT STT TTS. There is no VLLM member, and adding one edits packages/**,
# which is outside this lane's boundary. So this job triggers on branch pushes
# and `ALL-` only — the same shape as build-lmstudio, build-qdrant-init and
# build-database.

# ── vLLM is ON HOLD (owner decision, 2026-09-02) ─────────────────────────────
# Both jobs below are DISABLED, not deleted: a leading dot makes GitLab treat a
# top-level key as a hidden template that is never instantiated, so the whole
# configuration survives review and `git log` while nothing builds, scans or
# pushes a vllm image.
#
# The workload is already parked in the deployment repo (`base/vllm.yaml`,
# `replicas: 0`), and vllm was never in promote.sh's SERVICES=, so nothing
# downstream is left dangling: no overlay pins a digest this pipeline would
# otherwise refresh. `.github/services.json` drops its vllm entry to match --
# the services-manifest contract compares the manifest against the SERVICE_NAME
# set, and a hidden job declares none.
#
# TO RE-ENABLE: remove the leading dot from BOTH keys (`.build-vllm` and
# `.verify-vllm-plugin` -- the verify job `needs:` the build job, so re-enabling
# only one leaves an unresolvable dependency) and restore the vllm entry in
# `.github/services.json`.

.build-vllm:
  extends: .build-template
  needs:
    - job: warm-up-base-images
      optional: true
  variables:
    SERVICE_NAME: vllm
    # Context is the image directory itself, not the repo root: this image
    # copies exactly one file and needs none of the monorepo. Same shape as
    # build-lmstudio and build-python-base.
    DOCKER_CONTEXT: infrastructure/docker/vllm
    DOCKERFILE: infrastructure/docker/vllm/Dockerfile
  # ~10 GB base pull, plus a from-source nvcc compile of the plugin's GGUF
  # kernels across the base image's full TORCH_CUDA_ARCH_LIST (8 architectures).
  # 45m — build-lmstudio's budget for a 2 GB base and a download — is not enough.
  timeout: 90m
  rules:
    - !reference [.build-common-rules, rules]
    - if: $CI_COMMIT_TAG =~ /^ALL-/

# ── The gate that makes the GGUF claim real ─────────────────────────────────
# Installing `vllm-gguf-plugin` is not the same as vLLM being able to USE it:
# vLLM finds it through an entry point in the `vllm.general_plugins` group
# (vllm/plugins/__init__.py::load_plugins_by_group), so a package that imports
# fine but is not registered there would never be loaded — and a build that
# compiled no CUDA kernels would fail only at inference time.
#
# This job re-runs the image's OWN verifier against the pushed image, so the CI
# gate and the Dockerfile's build-time gate cannot drift apart. It additionally
# proves the pushed image carries the SHA that the Dockerfile in THIS commit
# asks for.
#
# WHAT IT DOES NOT PROVE, and must not be read as proving: that a GPU exists,
# that the kernels execute, or that any weights load. Build runners have no
# NVIDIA device and buildkit exposes none — so, exactly as in
# verify-lmstudio-runtime above, this asserts IMAGE CONTENTS, never host
# capability. That distinction is the whole lesson of job 15218.
.verify-vllm-plugin:
  stage: build
  tags: [build]
  image: docker:28
  timeout: 30m
  interruptible: true
  needs:
    - job: .build-vllm
  before_script:
    - !reference [.buildx-registry-login, before_script]
  script:
    - |
      set -eu
      img="$REGISTRY/$CI_PROJECT_PATH/vllm@${DIGEST}"
      echo "verifying $img"

      # The pin as the REPO states it at this commit. Extracted rather than
      # duplicated, so the two can never disagree; empty is a hard failure
      # (an unguarded empty here would silently verify nothing).
      expect_sha=$(sed -n 's/^ARG VLLM_GGUF_PLUGIN_SHA=\([0-9a-f]\{40\}\)$/\1/p' \
        infrastructure/docker/vllm/Dockerfile)
      if [ -z "$expect_sha" ]; then
        echo "FATAL: could not read a 40-char ARG VLLM_GGUF_PLUGIN_SHA from" >&2
        echo "infrastructure/docker/vllm/Dockerfile. Either the pin was moved to" >&2
        echo "a branch/tag (never do that) or this extraction needs updating." >&2
        exit 1
      fi
      echo "Dockerfile pins the GGUF plugin at $expect_sha"

      docker pull "$img"

      echo "── build identity ──"
      docker run --rm --entrypoint cat "$img" /app/build-info.json

      echo "── plugin provenance + GPU-free registration assertions ──"
      docker run --rm --entrypoint python3 "$img" \
        /opt/hope/build-verify.py assert --expect-sha "$expect_sha"

      echo "OK: the pushed image carries the pinned plugin commit, a compiled"
      echo "    CUDA extension, and a loadable vllm.general_plugins entry point."
  rules:
    - !reference [.build-common-rules, rules]
    - if: $CI_COMMIT_TAG =~ /^ALL-/

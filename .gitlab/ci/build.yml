# ══════════════════════════════════════════════════════════════════════════════
# Build stage — Docker image build + push
# ══════════════════════════════════════════════════════════════════════════════
#
# Builds only run on:
#   - Tags (release)
#   - Main branch (with change detection)
#   - devops/* branches (feature)
# MR pipelines skip builds — they only run lint + test + scan.

# ── API Gateway ──────────────────────────────────────────────────────────────

build-api:
  extends: .build-template
  needs:
    - job: test-api
      optional: true
    - job: typecheck
      optional: true
  variables:
    SERVICE_NAME: api
    DOCKER_CONTEXT: "."
    DOCKERFILE: apps/api/Dockerfile
  rules:
    - if: $PIPELINE_TYPE == "merge_request"
      when: never
    - if: $CI_COMMIT_TAG =~ /^v\d+/
    - if: $CI_COMMIT_BRANCH =~ /^devops\//
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths:
          - apps/api/**/*
          - packages/database/**/*
          - packages/domains/**/*
          - packages/applications/**/*
          - packages/exceptions/**/*
          - packages/logger/**/*
          - packages/tools/**/*
          - packages/config-eslint/**/*
          - packages/config-rollup/**/*
          - packages/config-ts/**/*
        compare_to: refs/heads/main
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - apps/api/**/*
        - packages/database/**/*
        - packages/domains/**/*
        - packages/applications/**/*
        - packages/exceptions/**/*
        - packages/logger/**/*
        - packages/tools/**/*
        - packages/config-eslint/**/*
        - packages/config-rollup/**/*
        - packages/config-ts/**/*


# ══════════════════════════════════════════════════════════════════════════════
# Build stage — Docker image build + push
# ══════════════════════════════════════════════════════════════════════════════
#
# Branch behavior:
#   cicd    — all builds run but require MANUAL approval (when: manual)
#   staging — only changed services build AUTOMATICALLY
#   main    — same as staging
#   MR      — no builds
#   feature — no builds
#   release — no builds (SDK publish only)

# ── Pre-pull base images ─────────────────────────────────────────────────────
# Warm up the host Docker daemon's image cache so that BuildKit (docker-container
# driver) can resolve FROM images locally instead of pulling ~3 GB from upstream
# registries on every build.  Runs once per pipeline before any build job.

warm-up-base-images:
  stage: build
  tags: [build]
  image: docker:27
  timeout: 15m
  interruptible: true
  script:
    - |
      set -eu
      images="
        nvidia/cuda:12.8.1-cudnn-runtime-ubuntu22.04
        ghcr.io/astral-sh/uv:python3.11-bookworm-slim
        ghcr.io/astral-sh/uv:0.8.13
        python:3.11-slim-bookworm
        python:3.11-slim-trixie
        node:22-alpine
      "
      for img in $images; do
        if docker image inspect "$img" >/dev/null 2>&1; then
          echo "CACHED  $img"
        else
          echo "PULLING $img ..."
          docker pull "$img"
        fi
      done
      echo "All base images warm"
  rules:
    - if: $PIPELINE_TYPE == "merge_request" || $PIPELINE_TYPE == "feature" || $PIPELINE_TYPE == "release"
      when: never
    - if: $PIPELINE_TYPE == "cicd" || $PIPELINE_TYPE == "staging" || $PIPELINE_TYPE == "main"
    - if: $CI_COMMIT_TAG =~ /^v\d+/

# ── API Gateway ──────────────────────────────────────────────────────────────

build-api:
  extends: .build-template
  needs:
    - job: warm-up-base-images
      optional: true
    - job: test-api
      optional: true
    - job: typecheck
      optional: true
  variables:
    SERVICE_NAME: api
    DOCKER_CONTEXT: "."
    DOCKERFILE: apps/api/Dockerfile
  rules:
    - if: $PIPELINE_TYPE == "merge_request" || $PIPELINE_TYPE == "feature" || $PIPELINE_TYPE == "release"
      when: never
    - if: $PIPELINE_TYPE == "cicd"
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_TAG =~ /^v\d+/
    - if: $PIPELINE_TYPE == "staging" || $PIPELINE_TYPE == "main"
      changes:
        - apps/api/**/*
        - packages/database/**/*
        - packages/domains/**/*
        - packages/applications/**/*
        - packages/exceptions/**/*
        - packages/logger/**/*
        - packages/tools/**/*


# ══════════════════════════════════════════════════════════════════════════════
# Build stage — Docker image build + push
# ══════════════════════════════════════════════════════════════════════════════
#
# Builds only run on:
#   - Tags (release)
#   - Main branch (with change detection)
#   - devops/* branches (feature)
# MR pipelines skip builds — they only run lint + test + scan.

# ── API Gateway ──────────────────────────────────────────────────────────────

build-api:
  extends: .build-template
  needs:
    - job: test-api
      optional: true
    - job: typecheck
      optional: true
  variables:
    SERVICE_NAME: api
    DOCKER_CONTEXT: "."
    DOCKERFILE: apps/api/Dockerfile
  rules:
    - if: $PIPELINE_TYPE == "merge_request"
      when: never
    - !reference [.rules-api, rules]

# ── UI Playground ────────────────────────────────────────────────────────────

build-ui-playground:
  extends: .build-template
  needs:
    - job: test-sdk
      optional: true
    - job: typecheck
      optional: true
  variables:
    SERVICE_NAME: ui-playground
    DOCKER_CONTEXT: "."
    DOCKERFILE: apps/ui-playground/Dockerfile
    BUILD_ARGS: "--build-arg VITE_API_URL=$VITE_API_URL"
  rules:
    - if: $PIPELINE_TYPE == "merge_request"
      when: never
    - !reference [.rules-ui-playground, rules]


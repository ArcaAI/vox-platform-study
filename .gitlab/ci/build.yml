# ── TEXT ──────────────────────────────────────────────────────────────────────

build-text:
  extends: .build-template
  needs:
    - job: warm-up-base-images
      optional: true
    - job: build-python-base
    - job: test-text
      optional: true
  variables:
    SERVICE_NAME: text
    DOCKER_CONTEXT: "."
    DOCKERFILE: apps/text/Dockerfile
    BUILD_ARGS: "--build-arg BASE_IMAGE=$REGISTRY/$CI_PROJECT_PATH/hope-python-base:$CI_COMMIT_SHA"
  rules:

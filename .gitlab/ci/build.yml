# ══════════════════════════════════════════════════════════════════════════════
# Build stage — Docker image build + push
# ══════════════════════════════════════════════════════════════════════════════
#
# Trigger model (automatic — no manual click):
#   dev-* / staging-* / prod-* / cicd branch push → build ALL images (env-tagged)
#   git tag <SVC>-<ver> (e.g. TEXT-2.1.0)          → build that service only
#   git tag ALL-<ver>                             → build every image (+ SDK, see publish.yml)
#   MR / feature / main / release-sdk → no builds
# Builds gate on the relevant test job(s) via `needs:`; a release-tag pipeline
# runs the full suite (rules.yml .rules-always), so nothing ships from red tests.

# ── Shared build rules ───────────────────────────────────────────────────────
# Every build job references this, then appends its own release-tag clause:
#   rules:
#     - !reference [.build-common-rules, rules]
#     - if: $CI_COMMIT_TAG =~ /^TEXT-/ || $CI_COMMIT_TAG =~ /^ALL-/
#
# `prod`/`production` deliberately do NOT appear in
# the build-triggering condition below. Under digest promotion,
# production is reached by copying the SAME sha-<sha8> manifest a dev/staging
# pipeline already built and scanned — a rebuild on a prod-*/production-*
# branch push would produce a structurally different image (base-layer cache
# drift, different `created` label) and break that guarantee. prod-*/
# production-* branches may still exist for cherry-picks; they just never
# build or deploy (production deploys are tag-triggered — see promote-prod
# in deploy.yml and PIPELINE_TYPE == "tag_release").
.build-common-rules:
  rules:
    - if: $PIPELINE_TYPE == "merge_request" || $PIPELINE_TYPE == "release_sdk" || $PIPELINE_TYPE == "main" || $PIPELINE_TYPE == "feature" || $PIPELINE_TYPE == "prod"
      when: never
    - if: $PIPELINE_TYPE == "dev" || $PIPELINE_TYPE == "staging" || $PIPELINE_TYPE == "cicd"

# ── Pre-pull base images ─────────────────────────────────────────────────────

warm-up-base-images:
  stage: build
  tags: [build]
  image: docker:28
  timeout: 15m
  interruptible: true
  script:
    - |
      set -eu
      # MUST match the external bases actually referenced by the Dockerfiles.
      # Derive with:
      #   grep -rhoE '(ghcr.io/astral-sh/uv|python|node|nginx|nvidia/cuda):[^ ]*' \
      #     apps/*/Dockerfile apps/stt/docker/Dockerfile packages/database/Dockerfile \
      #     infrastructure/docker/python-base/Dockerfile \
      #     infrastructure/docker/lmstudio/Dockerfile | sort -u
      # Entries that drift out of sync are pure waste: a stale entry burns runner
      # disk on an image no build consumes, a missing one costs a cold pull.
      images="
        nvidia/cuda:12.8.1-cudnn-runtime-ubuntu22.04
        nvidia/cuda:12.8.1-cudnn-devel-ubuntu22.04
        nvidia/cuda:12.8.1-runtime-ubuntu24.04
        ghcr.io/astral-sh/uv:0.11.33
        python:3.11-slim-trixie
        node:24-slim
        node:24-bookworm-slim
        node:24-alpine
        nginx:1.30.4-alpine
      "
      for img in $images; do
        if docker image inspect "$img" >/dev/null 2>&1; then
          echo "CACHED  $img"
        else
          echo "PULLING $img ..."
          docker pull "$img"
        fi
      done
      echo "All base images warm"

      # ── Reclaim abandoned buildx builders ─────────────────────────────────
      # Bumping BUILDER_REV (templates.yml, .buildx-registry-login) deliberately
      # ORPHANS the previous builder. Each orphan keeps its OWN BuildKit state
      # volume, and a gcpolicy only ever accounts for the usage of the builder it
      # belongs to — so an abandoned builder's layer cache is bounded by nothing,
      # and is invisible to the live builder's minFreeSpace.
      #
      # `cibuilder` (the pre-BUILDER_REV instance, created 2026-03-23) reached
      # 98 GB that way and filled this runner's disk on 2026-09-07. A full disk
      # truncates writes rather than refusing them, so pnpm wrote zero-length
      # package.json files into /pnpm-store and every validate job died on
      # ERR_PNPM_BAD_PACKAGE_JSON or hung to its 30m timeout — pipelines
      # 1135-1152, two days of red CI whose symptom named neither Docker nor disk.
      #
      # This CANNOT be done with `docker buildx rm`, which is what templates.yml
      # used to advise. buildx keeps its builder list in ~/.docker/buildx INSIDE
      # the job container, and that dies with the job — so a later job has no
      # record of any builder it did not itself create. `docker buildx ls` from a
      # job, and on the host as root, both listed NONE of the orphans while their
      # containers and volumes sat there. Only the Docker objects persist, so the
      # Docker objects are what we remove.
      #
      # Two guards, because removing a builder discards a layer cache a concurrent
      # job may still be writing to:
      #   1. `before=$keep` — only builders strictly OLDER than the live one.
      #      Exact and clock-free: buildx creates one container per builder, so
      #      "older than the newest" IS "superseded".
      #   2. the live builder must itself be >24h old — longer than any pipeline
      #      runs (max job timeout is 90m), so during a BUILDER_REV transition the
      #      outgoing builder is never yanked from a build still using it.
      # Everything tolerates failure: two jobs racing here must not fail a
      # pipeline over housekeeping.
      #
      # `until=` is NOT a docker ps filter (prune-only) and `date -d '24 hours
      # ago'` is GNU-only; both were tried and both fail in this alpine image.
      # The forms below are verified against docker 29 / busybox date.
      before_free=$(df -h / | awk 'NR==2 {print $4}')
      keep=$(docker ps -a --filter 'name=^buildx_buildkit_' --latest --format '{{.Names}}' 2>/dev/null || true)
      if [ -n "$keep" ]; then
        cutoff=$(date -u -d "@$(( $(date -u +%s) - 86400 ))" +%Y%m%d%H%M%S)
        born=$(docker inspect -f '{{.Created}}' "$keep" 2>/dev/null | tr -dc '0-9' | cut -c1-14)
        if [ -n "$born" ] && [ "$born" -lt "$cutoff" ]; then
          for c in $(docker ps -a --filter 'name=^buildx_buildkit_' --filter "before=$keep" --format '{{.Names}}' 2>/dev/null || true); do
            echo "RECLAIM  $c (+ volume ${c}_state)"
            docker rm -f "$c" >/dev/null 2>&1 || true
            docker volume rm "${c}_state" >/dev/null 2>&1 || true
          done
          echo "Builder reclaim done — kept $keep, disk free ${before_free} -> $(df -h / | awk 'NR==2 {print $4}')"
        else
          echo "Builder reclaim skipped — $keep is younger than 24h; a build on the previous revision may still be using its predecessor"
        fi
      fi
  rules:
    - !reference [.build-common-rules, rules]
    # `ALL-` already covers build-lmstudio, which is the only consumer of the
    # ubuntu24.04 CUDA base added above; it has no service tag of its own (see
    # build-lmstudio's own note on the closed <SVC> grammar).
    - if: $CI_COMMIT_TAG =~ /^(TEXT|STT|GUARD|TTS|HARNESS|NLP|ALL)-/

# ── Shared Python base image ─────────────────────────────────────────────────
# Single base image consumed by ALL Python service builds (guardrail, nlp, text,
# harness, tts, stt CPU stages) via `--build-arg BASE_IMAGE`. Must build BEFORE
# the Python service jobs (they `needs:` this job).

build-python-base:
  extends: .build-template
  needs:
    - job: warm-up-base-images
      optional: true
  variables:
    SERVICE_NAME: hope-python-base
  script:
    - |
      set -eu
      image_repo="$REGISTRY/$CI_PROJECT_PATH/hope-python-base"
      cache_repo="$image_repo/cache"
      echo "Building shared base image -> $image_repo:$CI_COMMIT_SHA"
      docker buildx build \
        --push \
        --cache-from type=registry,ref=$cache_repo \
        --cache-to   type=registry,ref=$cache_repo,mode=max,compression=zstd \
        --label org.opencontainers.image.revision=$CI_COMMIT_SHA \
        --tag $image_repo:$CI_COMMIT_SHA \
        --tag $image_repo:latest \
        infrastructure/docker/python-base/
  rules:
    - !reference [.build-common-rules, rules]
    - if: $CI_COMMIT_TAG =~ /^(TEXT|STT|GUARD|TTS|HARNESS|NLP|ALL)-/

# ── API Gateway ──────────────────────────────────────────────────────────────

build-api:
  extends: .build-template
  needs:
    - job: warm-up-base-images
      optional: true
    - job: test-api
      optional: true
    - job: typecheck
      optional: true
  variables:
    SERVICE_NAME: api
    DOCKER_CONTEXT: "."
    DOCKERFILE: apps/api/Dockerfile
    # The `--build-arg DATABASE_URL=$DATABASE_URL` that
    # was here passed an EMPTY value — no job or global variable named
    # DATABASE_URL exists at the build stage — so the Dockerfile's own
    # generate-only placeholder (`${DATABASE_URL:-postgresql://postgres:...}`,
    # apps/api/Dockerfile:58) took effect either way. Removed: it was a no-op
    # that would silently start baking a real connection string into the image
    # build history the moment anyone defined a pipeline-wide DATABASE_URL.
    BUILD_ARGS: ""
  rules:
    - !reference [.build-common-rules, rules]
    - if: $CI_COMMIT_TAG =~ /^API-/ || $CI_COMMIT_TAG =~ /^ALL-/

# ── Admin Console ────────────────────────────────────────────────────────────

build-admin-console:
  extends: .build-template
  needs:
    - job: warm-up-base-images
      optional: true
    - job: typecheck
      optional: true
  variables:
    SERVICE_NAME: admin-console
    DOCKER_CONTEXT: "."
    DOCKERFILE: apps/admin-console/Dockerfile
    # Depends on @arcaai/vox → @arcaai/noise-filter, whose bundled
    # assets/rnnoise.wasm is an LFS object. A pointer stub would build
    # cleanly and ship a broken wasm — see GIT_LFS_SKIP_SMUDGE in .gitlab-ci.yml.
    GIT_LFS_SKIP_SMUDGE: "0"
    # Smudge ONLY that object. With the full smudge the checkout
    # fetched ~26 MB of test audio the image never uses, and against a slow
    # GitLab LFS endpoint the fetch hung until the 30-minute job timeout
    # (pipeline #1113, both Next.js builds, twice). `lfs.fetchinclude` leaves
    # every other LFS file as a pointer; the LFS timeouts make a dead endpoint
    # fail in minutes with a real error instead of a silent hang; and the
    # before_script below refuses to build from a pointer stub.
    GIT_CONFIG_COUNT: "3"
    GIT_CONFIG_KEY_0: lfs.fetchinclude
    GIT_CONFIG_VALUE_0: packages/noise-filter/assets/rnnoise.wasm
    GIT_CONFIG_KEY_1: lfs.activitytimeout
    GIT_CONFIG_VALUE_1: "60"
    GIT_CONFIG_KEY_2: lfs.dialtimeout
    GIT_CONFIG_VALUE_2: "30"
    # Browser-reachable gateway origin, inlined into the client bundle.
    # The gateway host baked into the client bundle. Environment identity lives
    # in the deployment repo's overlays (overlays/dev sets NEXT_PUBLIC_API_HOST =
    # api.taphuynh.dev at RUNTIME, which a Next.js client bundle cannot read) —
    # so the dev pipeline pins the dev gateway host `api-dev.taphuynh.dev` here, by rule, instead of trusting
    # a project variable that shipped `vox-api-dev.taphuynh.dev` (no DNS record)
    # into every dev console build. Other pipeline types keep the variable.
    CONSOLE_GATEWAY_HOST: "$NEXT_PUBLIC_API_HOST"
    BUILD_ARGS: "--build-arg NEXT_PUBLIC_API_HOST=$CONSOLE_GATEWAY_HOST"
  before_script:
    - !reference [.buildx-registry-login, before_script]
    - echo "gateway host baked into the console bundle — $CONSOLE_GATEWAY_HOST"
    # A pointer stub is ~130 bytes of text; a real wasm starts with "\0asm".
    - |
      if ! head -c 4 packages/noise-filter/assets/rnnoise.wasm | grep -q "asm"; then
        echo "rnnoise.wasm is an LFS pointer stub, not the wasm — the LFS fetch did not run. Refusing to build a broken image."
        head -c 200 packages/noise-filter/assets/rnnoise.wasm; echo
        exit 1
      fi
  rules:
    - if: $PIPELINE_TYPE == "dev"
      variables:
        CONSOLE_GATEWAY_HOST: "https://api-dev.taphuynh.dev"
    - !reference [.build-common-rules, rules]
    - if: $CI_COMMIT_TAG =~ /^ADMIN-/ || $CI_COMMIT_TAG =~ /^ALL-/

# ── compat-playground is DEPRECATED  ───────────────────
# Hidden, not deleted — same pattern as `.build-vllm`. GitLab never instantiates
# a dotted top-level key. The app remains in the tree for local `pnpm compat:*`.
#
# TO RE-ENABLE: undot this job plus `.test-compat-playground`,
# `.scan-compat-playground`, `.sbom-compat-playground`, `.sign-compat-playground`;
# restore the `.github/services.json` entry; restore COMPAT in
# SERVICE_TAG_PREFIXES and the promote.sh SERVICES= line.
#
.build-compat-playground:
  extends: .build-template
  needs:
    - job: warm-up-base-images
      optional: true
    - job: .test-compat-playground
      optional: true
    - job: typecheck
      optional: true
  variables:
    SERVICE_NAME: compat-playground
    DOCKER_CONTEXT: "."
    DOCKERFILE: apps/compat-playground/Dockerfile
    # Depends on @arcaai/vox → @arcaai/noise-filter, whose bundled
    # assets/rnnoise.wasm is an LFS object. A pointer stub would build
    # cleanly and ship a broken wasm — see GIT_LFS_SKIP_SMUDGE in .gitlab-ci.yml.
    GIT_LFS_SKIP_SMUDGE: "0"
    # Smudge ONLY that object. With the full smudge the checkout
    # fetched ~26 MB of test audio the image never uses, and against a slow
    # GitLab LFS endpoint the fetch hung until the 30-minute job timeout
    # (pipeline #1113, both Next.js builds, twice). `lfs.fetchinclude` leaves
    # every other LFS file as a pointer; the LFS timeouts make a dead endpoint
    # fail in minutes with a real error instead of a silent hang; and the
    # before_script below refuses to build from a pointer stub.
    GIT_CONFIG_COUNT: "3"
    GIT_CONFIG_KEY_0: lfs.fetchinclude
    GIT_CONFIG_VALUE_0: packages/noise-filter/assets/rnnoise.wasm
    GIT_CONFIG_KEY_1: lfs.activitytimeout
    GIT_CONFIG_VALUE_1: "60"
    GIT_CONFIG_KEY_2: lfs.dialtimeout
    GIT_CONFIG_VALUE_2: "30"
    # Same rule as build-admin-console: the dev pipeline pins the gateway host.
    CONSOLE_GATEWAY_HOST: "$NEXT_PUBLIC_API_HOST"
    BUILD_ARGS: "--build-arg VITE_API_BASE_URL=$CONSOLE_GATEWAY_HOST"
  before_script:
    - !reference [.buildx-registry-login, before_script]
    - echo "gateway host baked into the playground bundle — $CONSOLE_GATEWAY_HOST"
    # A pointer stub is ~130 bytes of text; a real wasm starts with "\0asm".
    - |
      if ! head -c 4 packages/noise-filter/assets/rnnoise.wasm | grep -q "asm"; then
        echo "rnnoise.wasm is an LFS pointer stub, not the wasm — the LFS fetch did not run. Refusing to build a broken image."
        head -c 200 packages/noise-filter/assets/rnnoise.wasm; echo
        exit 1
      fi
  rules:
    - if: $PIPELINE_TYPE == "dev"
      variables:
        CONSOLE_GATEWAY_HOST: "https://api-dev.taphuynh.dev"
    - !reference [.build-common-rules, rules]
    - if: $CI_COMMIT_TAG =~ /^COMPAT-/ || $CI_COMMIT_TAG =~ /^ALL-/


    - job: warm-up-base-images
      optional: true
    - job: test-stt-v2
      optional: true
  variables:
    SERVICE_NAME: stt-v2-ml-runtime
    # Root context: Dockerfile now references apps/stt-v2/* paths + workspace lock.
    # GPU stages use the nvidia/cuda base (not hope-python-base), so no BASE_IMAGE.
    DOCKER_CONTEXT: "."
    DOCKERFILE: apps/stt-v2/docker/Dockerfile
    BUILD_TARGET: ml-runtime
  rules:
    - if: $PIPELINE_TYPE == "merge_request" || $PIPELINE_TYPE == "release_sdk" || $PIPELINE_TYPE == "release_playground" || $PIPELINE_TYPE == "main"

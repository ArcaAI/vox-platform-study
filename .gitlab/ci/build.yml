# ══════════════════════════════════════════════════════════════════════════════
# Build stage — Docker image build + push
# ══════════════════════════════════════════════════════════════════════════════
#
# Trigger model (automatic — no manual click):
#   dev-* / staging-* / prod-* / cicd branch push → build ALL images (env-tagged)
#   git tag <SVC>-<ver> (e.g. SMR-2.1.0)          → build that service only
#   git tag ALL-<ver>                             → build every image (+ SDK, see publish.yml)
#   MR / feature / main / release-sdk / release-playground → no builds
# Builds gate on the relevant test job(s) via `needs:`; a release-tag pipeline
# runs the full suite (rules.yml .rules-always), so nothing ships from red tests.

# ── Shared build rules ───────────────────────────────────────────────────────
# Every build job references this, then appends its own release-tag clause:
#   rules:
#     - !reference [.build-common-rules, rules]
#     - if: $CI_COMMIT_TAG =~ /^SMR-/ || $CI_COMMIT_TAG =~ /^ALL-/
#
# TASK-616 §F11 item 4 — `prod`/`production` deliberately do NOT appear in
# the build-triggering condition below. Under digest promotion (§F3),
# production is reached by copying the SAME sha-<sha8> manifest a dev/staging
# pipeline already built and scanned — a rebuild on a prod-*/production-*
# branch push would produce a structurally different image (base-layer cache
# drift, different `created` label) and break that guarantee. prod-*/
# production-* branches may still exist for cherry-picks; they just never
# build or deploy (production deploys are tag-triggered — see promote-prod
# in deploy.yml and PIPELINE_TYPE == "tag_release").
.build-common-rules:
  rules:
    - if: $PIPELINE_TYPE == "merge_request" || $PIPELINE_TYPE == "release_sdk" || $PIPELINE_TYPE == "release_playground" || $PIPELINE_TYPE == "main" || $PIPELINE_TYPE == "feature" || $PIPELINE_TYPE == "prod"
      when: never
    - if: $PIPELINE_TYPE == "dev" || $PIPELINE_TYPE == "staging" || $PIPELINE_TYPE == "cicd"

# ── Pre-pull base images ─────────────────────────────────────────────────────

warm-up-base-images:
  stage: build
  tags: [build]
  image: docker:27
  timeout: 15m
  interruptible: true
  script:
    - |
      set -eu
      # MUST match the external bases actually referenced by the Dockerfiles.
      # Derive with:
      #   grep -rhoE '(ghcr.io/astral-sh/uv|python|node|nginx|nvidia/cuda):[^ ]*' \
      #     apps/*/Dockerfile apps/stt/docker/Dockerfile packages/database/Dockerfile \
      #     infrastructure/docker/python-base/Dockerfile | sort -u
      # Entries that drift out of sync are pure waste: a stale entry burns runner
      # disk on an image no build consumes, a missing one costs a cold pull.
      images="
        nvidia/cuda:12.8.1-cudnn-runtime-ubuntu22.04
        nvidia/cuda:12.8.1-cudnn-devel-ubuntu22.04
        ghcr.io/astral-sh/uv:0.11.7
        python:3.11-slim-trixie
        node:24-slim
        node:24-bookworm-slim
        node:24-alpine
        nginx:1.27-alpine
      "
      for img in $images; do
        if docker image inspect "$img" >/dev/null 2>&1; then
          echo "CACHED  $img"
        else
          echo "PULLING $img ..."
          docker pull "$img"
        fi
      done
      echo "All base images warm"
  rules:
    - !reference [.build-common-rules, rules]
    - if: $CI_COMMIT_TAG =~ /^(SMR|STT|GUARD|TTS|HARNESS|NLP|COMPAT|ALL)-/

# ── Shared Python base image ─────────────────────────────────────────────────
# Single base image consumed by ALL Python service builds (guardrail, nlp, smr,
# harness, tts, stt CPU stages) via `--build-arg BASE_IMAGE`. Must build BEFORE
# the Python service jobs (they `needs:` this job).

build-python-base:
  extends: .build-template
  needs:
    - job: warm-up-base-images
      optional: true
  variables:
    SERVICE_NAME: hope-python-base
  script:
    - |
      set -eu
      image_repo="$REGISTRY/$CI_PROJECT_PATH/hope-python-base"
      cache_repo="$image_repo/cache"
      echo "Building shared base image -> $image_repo:$CI_COMMIT_SHA"
      docker buildx build \
        --push \
        --cache-from type=registry,ref=$cache_repo \
        --cache-to   type=registry,ref=$cache_repo,mode=max,compression=zstd \
        --label org.opencontainers.image.revision=$CI_COMMIT_SHA \
        --tag $image_repo:$CI_COMMIT_SHA \
        --tag $image_repo:latest \
        infrastructure/docker/python-base/
  rules:
    - !reference [.build-common-rules, rules]
    - if: $CI_COMMIT_TAG =~ /^(SMR|STT|GUARD|TTS|HARNESS|NLP|ALL)-/

# ── API Gateway ──────────────────────────────────────────────────────────────

build-api:
  extends: .build-template
  needs:
    - job: warm-up-base-images
      optional: true
    - job: test-api
      optional: true
    - job: typecheck
      optional: true
  variables:
    SERVICE_NAME: api
    DOCKER_CONTEXT: "."
    DOCKERFILE: apps/api/Dockerfile
    # TASK-558 lane K (K2): the `--build-arg DATABASE_URL=$DATABASE_URL` that
    # was here passed an EMPTY value — no job or global variable named
    # DATABASE_URL exists at the build stage — so the Dockerfile's own
    # generate-only placeholder (`${DATABASE_URL:-postgresql://postgres:...}`,
    # apps/api/Dockerfile:58) took effect either way. Removed: it was a no-op
    # that would silently start baking a real connection string into the image
    # build history the moment anyone defined a pipeline-wide DATABASE_URL.
    BUILD_ARGS: ""
  rules:
    - !reference [.build-common-rules, rules]
    - if: $CI_COMMIT_TAG =~ /^API-/ || $CI_COMMIT_TAG =~ /^ALL-/

# ── Admin Console ────────────────────────────────────────────────────────────

build-admin-console:
  extends: .build-template
  needs:
    - job: warm-up-base-images
      optional: true
    - job: typecheck
      optional: true
  variables:
    SERVICE_NAME: admin-console
    DOCKER_CONTEXT: "."
    DOCKERFILE: apps/admin-console/Dockerfile
    # Browser-reachable gateway origin, inlined into the client bundle.
    BUILD_ARGS: "--build-arg NEXT_PUBLIC_API_HOST=$NEXT_PUBLIC_API_HOST"
  rules:
    - !reference [.build-common-rules, rules]
    - if: $CI_COMMIT_TAG =~ /^ADMIN-/ || $CI_COMMIT_TAG =~ /^ALL-/

build-compat-playground:
  extends: .build-template
  needs:
    - job: warm-up-base-images
      optional: true
    - job: test-compat-playground
      optional: true
    - job: typecheck
      optional: true
  variables:
    SERVICE_NAME: compat-playground
    DOCKER_CONTEXT: "."
    DOCKERFILE: apps/compat-playground/Dockerfile
    BUILD_ARGS: "--build-arg VITE_API_BASE_URL=$NEXT_PUBLIC_API_HOST"
  rules:
    - !reference [.build-common-rules, rules]
    - if: $CI_COMMIT_TAG =~ /^COMPAT-/ || $CI_COMMIT_TAG =~ /^ALL-/


# ── STT ML Runtime ───────────────────────────────────────────────────────

build-stt:
  extends: .build-template
  needs:
    - job: warm-up-base-images
      optional: true
    - job: test-stt
      optional: true
  variables:
    SERVICE_NAME: stt-ml-runtime
    # Root context: Dockerfile now references apps/stt/* paths + workspace lock.
    # GPU stages use the nvidia/cuda base (not hope-python-base), so no BASE_IMAGE.
    DOCKER_CONTEXT: "."
    DOCKERFILE: apps/stt/docker/Dockerfile
    BUILD_TARGET: ml-runtime
  rules:
    - !reference [.build-common-rules, rules]
    - if: $CI_COMMIT_TAG =~ /^STT-/ || $CI_COMMIT_TAG =~ /^ALL-/


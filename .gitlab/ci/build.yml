# ══════════════════════════════════════════════════════════════════════════════
# Build stage — Docker image build + push
# ══════════════════════════════════════════════════════════════════════════════
#
# Branch behavior:
#   cicd               — all builds run but require MANUAL approval (when: manual)
#   dev                — only changed services, MANUAL approval (when: manual)
#   staging            — only changed services, MANUAL approval (when: manual)
#   main               — no builds
#   release-sdk        — no builds (SDK publish only)
#   release-playground — ui-playground build ONLY (automatic)
#   MR                 — no builds
#   feature            — no builds

# ── Pre-pull base images ─────────────────────────────────────────────────────

warm-up-base-images:
  stage: build
  tags: [build]
  image: docker:27
  timeout: 15m
  interruptible: true
  script:
    - |
      set -eu
      images="
        nvidia/cuda:12.8.1-cudnn-runtime-ubuntu22.04
        ghcr.io/astral-sh/uv:python3.11-bookworm-slim
        ghcr.io/astral-sh/uv:0.8.13
        python:3.11-slim-bookworm
        python:3.11-slim-trixie
        node:22-alpine
      "
      for img in $images; do
        if docker image inspect "$img" >/dev/null 2>&1; then
          echo "CACHED  $img"
        else
          echo "PULLING $img ..."
          docker pull "$img"
        fi
      done
      echo "All base images warm"
  rules:
    - if: $PIPELINE_TYPE == "merge_request" || $PIPELINE_TYPE == "release_sdk" || $PIPELINE_TYPE == "main"
      when: never
    - !reference [.rules-always, rules]
    - !reference [.rules-cicd-always, rules]
    - if: $PIPELINE_TYPE == "dev"
    - if: $PIPELINE_TYPE == "staging" || $PIPELINE_TYPE == "feature" || $PIPELINE_TYPE == "release_playground"

# ── Shared Python base image ─────────────────────────────────────────────────
# Single base image consumed by ALL Python service builds (guardrail, nlp, smr,
# harness, stt-v2 CPU stages) via `--build-arg BASE_IMAGE`. Must build BEFORE the
# Python service jobs (they `needs:` this job).

build-python-base:
  extends: .build-template
  needs:
    - job: warm-up-base-images
      optional: true
  variables:
    SERVICE_NAME: hope-python-base
  script:
    - |
      set -eu
      image_repo="$REGISTRY/$CI_PROJECT_PATH/hope-python-base"
      cache_repo="$image_repo/cache"
      echo "Building shared base image -> $image_repo:$CI_COMMIT_SHA"
      docker buildx build \
        --push \
        --cache-from type=registry,ref=$cache_repo \
        --cache-to   type=registry,ref=$cache_repo,mode=max,compression=zstd \
        --label org.opencontainers.image.revision=$CI_COMMIT_SHA \
        --tag $image_repo:$CI_COMMIT_SHA \
        --tag $image_repo:latest \
        infrastructure/docker/python-base/
  rules:
    - if: $PIPELINE_TYPE == "merge_request" || $PIPELINE_TYPE == "release_sdk" || $PIPELINE_TYPE == "release_playground" || $PIPELINE_TYPE == "main"
      when: never
    - if: $PIPELINE_TYPE == "cicd" || $PIPELINE_TYPE == "dev" || $PIPELINE_TYPE == "staging" || $PIPELINE_TYPE == "feature"
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_TAG =~ /^v\d+/

# ── API Gateway ──────────────────────────────────────────────────────────────

build-api:
  extends: .build-template
  needs:
    - job: warm-up-base-images
      optional: true
    - job: test-api
      optional: true
    - job: typecheck
      optional: true
  variables:
    SERVICE_NAME: api
    DOCKER_CONTEXT: "."
    DOCKERFILE: apps/api/Dockerfile
    BUILD_ARGS: "--build-arg DATABASE_URL=$DATABASE_URL"
  rules:
    - if: $PIPELINE_TYPE == "merge_request" || $PIPELINE_TYPE == "release_sdk" || $PIPELINE_TYPE == "release_playground" || $PIPELINE_TYPE == "main"
      when: never
    - if: $PIPELINE_TYPE == "cicd" || $PIPELINE_TYPE == "dev" || $PIPELINE_TYPE == "staging" || $PIPELINE_TYPE == "feature"
      when: manual
      allow_failure: true

        paths:
          - "apps/stt/**/*.py"
          - "apps/smr/**/*.py"
          - "apps/nlp/**/*.py"
          - "apps/guardrail/**/*.py"
          - "apps/harness/**/*.py"
          - "apps/tts/**/*.py"
          - "apps/stt/**/requirements*.txt"
          - "apps/smr/**/requirements*.txt"
          - "apps/nlp/**/requirements*.txt"
          - "apps/stt/**/pyproject.toml"
          - "apps/smr/**/pyproject.toml"
          - "apps/nlp/**/pyproject.toml"
          - "apps/guardrail/**/pyproject.toml"
          - "apps/harness/**/pyproject.toml"
          - "apps/tts/**/pyproject.toml"
        compare_to: refs/heads/main
    - if: $PIPELINE_TYPE == "dev"
    - if: $PIPELINE_TYPE == "staging" || $PIPELINE_TYPE == "main" || $PIPELINE_TYPE == "feature"
      changes:
        - "apps/stt/**/*.py"
        - "apps/smr/**/*.py"
        - "apps/nlp/**/*.py"
        - "apps/guardrail/**/*.py"
        - "apps/harness/**/*.py"
        - "apps/tts/**/*.py"


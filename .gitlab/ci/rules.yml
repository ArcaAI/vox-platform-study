# ══════════════════════════════════════════════════════════════════════════════
# Change-path rule templates
# ══════════════════════════════════════════════════════════════════════════════
#
# Branch behavior:
#   main               — validate + test (change-filtered) via MR gates only, no builds
#   dev                — validate + test (ALL services, unconditional) + manual builds + scan
#   staging            — validate + test (change-filtered) + manual builds + scan + deploy
#   cicd               — all stages run (no change filtering), builds manual
#   release-sdk        — SDK publish only (@arcaai/vox → GitLab Package Registry)
#   release-playground — ui-playground Docker build + push
#   maintenance/*      — validate + test (change-filtered) + scan (no builds)
#
# NOTE: `dev` runs ALL validate/test jobs unconditionally (no `changes` filter)
# because it is the integration branch — the last safety net before staging.

# ── Always-run conditions ───────────────────────────────────────────────────

.rules-always:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+/

# ── cicd branch: always run everything ──────────────────────────────────────

.rules-cicd-always:
  rules:
    - if: $PIPELINE_TYPE == "cicd"

# ── API Gateway ──────────────────────────────────────────────────────────────

.rules-api:
  rules:
    - !reference [.rules-always, rules]
    - !reference [.rules-cicd-always, rules]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths:
          - apps/api/**/*
          - packages/database/**/*
          - packages/domains/**/*
          - packages/applications/**/*
          - packages/exceptions/**/*
          - packages/logger/**/*
          - packages/tools/**/*
          - packages/config-eslint/**/*
          - packages/config-rollup/**/*
          - packages/config-ts/**/*
        compare_to: refs/heads/main
    - if: $PIPELINE_TYPE == "dev"
    - if: $PIPELINE_TYPE == "staging" || $PIPELINE_TYPE == "main"
      changes:
        - apps/api/**/*
        - packages/database/**/*
        - packages/domains/**/*
        - packages/applications/**/*
        - packages/exceptions/**/*
        - packages/logger/**/*
        - packages/tools/**/*
        - packages/config-eslint/**/*
        - packages/config-rollup/**/*
        - packages/config-ts/**/*
    - if: $PIPELINE_TYPE == "feature"
      changes:
        - apps/api/**/*
        - packages/database/**/*
        - packages/domains/**/*
        - packages/applications/**/*

# ── UI Playground ────────────────────────────────────────────────────────────

.rules-ui-playground:
  rules:
    - !reference [.rules-always, rules]
    - !reference [.rules-cicd-always, rules]
    - if: $PIPELINE_TYPE == "release_playground"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths:
          - apps/ui-playground/**/*
          - packages/ui/**/*
          - packages/room/**/*
          - packages/vad/**/*
          - packages/stt/**/*
          - packages/noise-filter/**/*
          - packages/agentic-sdk-v2/**/*
          - packages/med-ner/**/*
          - packages/pipeline/**/*
          - packages/utils/**/*
          - packages/config-tailwind/**/*
        compare_to: refs/heads/main
    - if: $PIPELINE_TYPE == "dev"
    - if: $PIPELINE_TYPE == "staging" || $PIPELINE_TYPE == "main"
      changes:
        - apps/ui-playground/**/*
        - packages/ui/**/*
        - packages/room/**/*
        - packages/vad/**/*
        - packages/stt/**/*
        - packages/noise-filter/**/*
        - packages/agentic-sdk-v2/**/*
        - packages/med-ner/**/*
        - packages/pipeline/**/*
        - packages/utils/**/*
        - packages/config-tailwind/**/*
    - if: $PIPELINE_TYPE == "feature"
      changes:
        - apps/ui-playground/**/*
        - packages/ui/**/*
        - packages/agentic-sdk-v2/**/*


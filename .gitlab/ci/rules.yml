# ══════════════════════════════════════════════════════════════════════════════
# Change-path rule templates
# ══════════════════════════════════════════════════════════════════════════════
#
# Branch behavior:
#   main               — validate + test (change-filtered) via MR gates only, no builds
#   dev                — validate + test (ALL services, unconditional) + manual builds + scan
#   staging            — validate + test (change-filtered) + manual builds + scan + deploy
#   cicd               — all stages run (no change filtering), builds manual
#   release-sdk        — SDK publish only (@arcaai/vox → GitLab Package Registry)
#   release-playground — ui-playground Docker build + push
#   maintenance/*      — validate + test (change-filtered) + scan (no builds)
#
# NOTE: `dev` runs ALL validate/test jobs unconditionally (no `changes` filter)
# because it is the integration branch — the last safety net before staging.

# ── TEMPORARY: skip validate + scan on dev-2.1 only ─────────────────────────
# Referenced at the TOP of each validate/scan job's rules so the branch guard
# wins before any run condition. Test jobs are covered separately via the
# SKIP_TESTS workflow variable set for dev-2.1 in .gitlab-ci.yml. Builds are
# untouched (their test/validate `needs:` are `optional: true`). Remove this
# fragment, its references, and the dev-2.1 workflow rule to restore the pipeline.

.skip-on-dev-2-1:
  rules:
    - if: $CI_COMMIT_BRANCH == "dev-2.1"
      when: never

# ── Always-run conditions ───────────────────────────────────────────────────

.rules-always:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+/
    # Release tags (<SVC>-<ver> / ALL-<ver>) and prod-* branches run the full
    # test suite so a build/release is only cut from a green commit.
    - if: $CI_COMMIT_TAG =~ /^(SDK|SMR|STT|GUARD|TTS|HARNESS|API|ADMIN|NLP|ALL)-/
    - if: $PIPELINE_TYPE == "prod"

# ── cicd branch: always run everything ──────────────────────────────────────

.rules-cicd-always:
  rules:
    - if: $PIPELINE_TYPE == "cicd"

# ── API Gateway ──────────────────────────────────────────────────────────────

.rules-api:
  rules:
    - !reference [.rules-always, rules]
    - !reference [.rules-cicd-always, rules]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths:
          - apps/api/**/*
          - packages/database/**/*
          - packages/domains/**/*
          - packages/applications/**/*
          - packages/exceptions/**/*
          - packages/logger/**/*
          - packages/tools/**/*
          - packages/config-eslint/**/*
          - packages/config-rollup/**/*
          - packages/config-ts/**/*
        compare_to: refs/heads/main
    - if: $PIPELINE_TYPE == "dev"
    - if: $PIPELINE_TYPE == "staging" || $PIPELINE_TYPE == "main"
      changes:
        - apps/api/**/*
        - packages/database/**/*
        - packages/domains/**/*
        - packages/applications/**/*
        - packages/exceptions/**/*
        - packages/logger/**/*
        - packages/tools/**/*
        - packages/config-eslint/**/*
        - packages/config-rollup/**/*
        - packages/config-ts/**/*
    - if: $PIPELINE_TYPE == "feature"
      changes:
        - apps/api/**/*
        - packages/database/**/*
        - packages/domains/**/*
        - packages/applications/**/*

# ── Admin Console ────────────────────────────────────────────────────────────

.rules-admin-console:

# ── Database (Prisma migrations) ────────────────────────────────────────────

.rules-database:
  rules:
    - !reference [.rules-always, rules]
    - !reference [.rules-cicd-always, rules]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths:
          - packages/database/**/*
        compare_to: refs/heads/main
    - if: $PIPELINE_TYPE == "dev"
    - if: $PIPELINE_TYPE == "staging" || $PIPELINE_TYPE == "main" || $PIPELINE_TYPE == "feature"
      changes:
        - packages/database/**/*

# ── Generated domain-layer drift (generated layer ↔ Prisma schema / generators) ──
# Shared by the three generator drift gates (data-model, data-entity, factory).
# Fires when the Prisma schema (DMMF source), the committed generated domain
# layer (models/enums/entities/factories), any of the three generators, or the
# shared preservation util changes — i.e. anything that could make a
# `generate-*:check` drift. (TASK-368 added data-model; TASK-370 added entity/factory.)

.rules-data-model:
  rules:
    - !reference [.rules-always, rules]
    - !reference [.rules-cicd-always, rules]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths:
          - packages/database/src/prisma/**/*.prisma
          - packages/domains/src/**/generated/**/*
          - packages/tools/src/generate-data-model/**/*
          - packages/tools/src/generate-data-entity/**/*
          - packages/tools/src/generate-factory/**/*
          - packages/tools/src/utils/**/*
        compare_to: refs/heads/main
    - if: $PIPELINE_TYPE == "dev"
    - if: $PIPELINE_TYPE == "staging" || $PIPELINE_TYPE == "main" || $PIPELINE_TYPE == "feature"
      changes:
        - packages/database/src/prisma/**/*.prisma
        - packages/domains/src/**/generated/**/*
        - packages/tools/src/generate-data-model/**/*
        - packages/tools/src/generate-data-entity/**/*
        - packages/tools/src/generate-factory/**/*
        - packages/tools/src/utils/**/*

# ── Any TypeScript change ───────────────────────────────────────────────────

.rules-any-ts:
  rules:
    - !reference [.rules-always, rules]
    - !reference [.rules-cicd-always, rules]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths:
          - apps/api/**/*
          - apps/ui-playground/**/*
          - packages/**/*
          - "*.json"
        compare_to: refs/heads/main
    - if: $PIPELINE_TYPE == "dev"
    - if: $PIPELINE_TYPE == "staging" || $PIPELINE_TYPE == "main" || $PIPELINE_TYPE == "feature"
      changes:
        - apps/api/**/*
        - apps/ui-playground/**/*
        - packages/**/*
    - if: $PIPELINE_TYPE == "release_sdk" || $PIPELINE_TYPE == "release_playground"

# ── Any Python change ───────────────────────────────────────────────────────

.rules-any-python:
  rules:
    - !reference [.rules-always, rules]
    - !reference [.rules-cicd-always, rules]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths:
          - "apps/stt-v2/**/*.py"
          - "apps/smr/**/*.py"
          - "apps/nlp/**/*.py"
          - "apps/guardrail/**/*.py"
          - "apps/stt-v2/**/requirements*.txt"
          - "apps/smr/**/requirements*.txt"
          - "apps/nlp/**/requirements*.txt"
          - "apps/stt-v2/**/pyproject.toml"
          - "apps/smr/**/pyproject.toml"
          - "apps/nlp/**/pyproject.toml"
          - "apps/guardrail/**/pyproject.toml"
        compare_to: refs/heads/main
    - if: $PIPELINE_TYPE == "dev"
    - if: $PIPELINE_TYPE == "staging" || $PIPELINE_TYPE == "main" || $PIPELINE_TYPE == "feature"
      changes:
        - "apps/stt-v2/**/*.py"
        - "apps/smr/**/*.py"
        - "apps/nlp/**/*.py"
        - "apps/guardrail/**/*.py"

# ── SDK packages (for publish stage) ────────────────────────────────────────

.rules-sdk-publish:
  rules:
    - if: $PIPELINE_TYPE == "release_sdk"
      changes:
        - packages/agentic-sdk-v2/**/*
        - packages/room/**/*
        - packages/stt/**/*
        - packages/vad/**/*
        - packages/noise-filter/**/*
        - packages/med-ner/**/*
        - packages/pipeline/**/*
        - packages/utils/**/*
        - packages/types/**/*
        - ".changeset/**/*"

# ── UI Playground release (for build + push) ────────────────────────────────

.rules-playground-release:
  rules:
    - if: $PIPELINE_TYPE == "release_playground"

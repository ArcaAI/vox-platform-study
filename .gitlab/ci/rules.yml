# ── Generated domain-layer drift (generated layer ↔ Prisma schema / generators) ──
# Shared by the three generator drift gates (data-model, data-entity, factory).
# Fires when the Prisma schema (DMMF source), the committed generated domain
# layer (models/enums/entities/factories), any of the three generators, or the
# shared preservation util changes — i.e. anything that could make a
# `generate-*:check` drift. (TASK-368 added data-model; TASK-370 added entity/factory.)

.rules-data-model:
  rules:
    - !reference [.rules-always, rules]
    - !reference [.rules-cicd-always, rules]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths:
          - packages/database/src/prisma/**/*.prisma
          - packages/domains/src/**/generated/**/*
          - packages/tools/src/generate-data-model/**/*
          - packages/tools/src/generate-data-entity/**/*
          - packages/tools/src/generate-factory/**/*
          - packages/tools/src/utils/**/*
        compare_to: refs/heads/main
    - if: $PIPELINE_TYPE == "dev"
    - if: $PIPELINE_TYPE == "staging" || $PIPELINE_TYPE == "main" || $PIPELINE_TYPE == "feature"
      changes:
        - packages/database/src/prisma/**/*.prisma
        - packages/domains/src/**/generated/**/*
        - packages/tools/src/generate-data-model/**/*
        - packages/tools/src/generate-data-entity/**/*
        - packages/tools/src/generate-factory/**/*
        - packages/tools/src/utils/**/*

# ── Environment declaration drift ───────────────────────────────────────────
# TASK-558 lane D. Fires when anything that FEEDS `pnpm env:sync` changes (the
# setting descriptors, either TypeScript deployable's config module, the
# generator itself) or when one of its GENERATED outputs changes (the example
# files, turbo.json, the docs table) — the two halves of a drift.
#
# The `process.env` scan that builds `turbo.json#globalEnv` reads every TS
# source, so `packages/**` and `apps/**` are in scope wholesale: adding a
# `process.env.NEW_THING` anywhere is exactly the change this gate must catch.

.rules-env-declarations:
  rules:
    - !reference [.rules-always, rules]
    - !reference [.rules-cicd-always, rules]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths:
          - .env.sample
          - apps/**/*
          - packages/**/*
          - scripts/env-sync.mts
          - scripts/tsconfig.env-sync.json
          - turbo.json
        compare_to: refs/heads/main
    - if: $PIPELINE_TYPE == "dev"
    - if: $PIPELINE_TYPE == "staging" || $PIPELINE_TYPE == "main" || $PIPELINE_TYPE == "feature"
      changes:
        - .env.sample
        - apps/**/*
        - packages/**/*
        - scripts/env-sync.mts
        - scripts/tsconfig.env-sync.json
        - turbo.json

# ── Any TypeScript change ───────────────────────────────────────────────────

.rules-any-ts:
  rules:
    - !reference [.rules-always, rules]
    - !reference [.rules-cicd-always, rules]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths:
          - apps/api/**/*
          - packages/**/*
          - "*.json"
        compare_to: refs/heads/main
    - if: $PIPELINE_TYPE == "dev"
    - if: $PIPELINE_TYPE == "staging" || $PIPELINE_TYPE == "main" || $PIPELINE_TYPE == "feature"
      changes:
        - apps/api/**/*
        - packages/**/*
    - if: $PIPELINE_TYPE == "release_sdk" || $PIPELINE_TYPE == "release_playground"


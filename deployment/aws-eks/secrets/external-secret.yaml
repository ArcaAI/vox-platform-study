# External Secrets Operator: AWS Secrets Manager → the k8s Secret `hope-secrets`
# that every existing manifest already references by secretKeyRef.
#
# Why this matters beyond hosting: a Secret created by the ESO controller carries
# NO `kubectl.kubernetes.io/last-applied-configuration` annotation. The current
# k3s `hope-secrets` DOES, and that annotation holds every value in PLAINTEXT
# (finding F8). Moving to ESO removes the exposure structurally.
#
# Substitute ${ENV} (dev|staging|prod) and ${AWS_REGION} before applying, or let
# the overlay's kustomize vars do it.
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secretsmanager
  namespace: hope-v2-${ENV}
spec:
  provider:
    aws:
      service: SecretsManager
      region: ${AWS_REGION}
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: hope-secrets
  namespace: hope-v2-${ENV}
spec:
  # Rotation propagates within this interval — but env vars are read at BOOT.
  # A refresh does NOT restart pods. Pair with Reloader or an explicit
  # `kubectl rollout restart` to complete an env-tier rotation.
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    name: hope-secrets
    creationPolicy: Owner
  dataFrom:
    - extract: { key: hope/${ENV}/platform }
    - extract: { key: hope/${ENV}/services }
    - extract: { key: hope/${ENV}/providers }

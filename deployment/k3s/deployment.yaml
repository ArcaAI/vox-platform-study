# =============================================================================
# ArgoCD Bootstrap — Project HOPE multi-environment deployment
# =============================================================================
# This file creates two ArgoCD Applications: hope-dev and hope-prod.
# Each points to its Kustomize overlay for environment-specific config.
#
# !! DO NOT place this file inside the ArgoCD sync-path. !!
# Apply it ONCE manually to bootstrap:
#
#   kubectl apply -f deployment.yaml -n argocd
#
# Prerequisites:
#   1. ArgoCD installed on the K3s cluster
#   2. Git repo registered in ArgoCD (Settings → Repositories)
#   3. Secrets pre-created in each namespace:
#        kubectl apply -f secrets.dev.yaml  -n hope-dev
#        kubectl apply -f secrets.prod.yaml -n hope-prod
# =============================================================================

# -- AppProject scoping --
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: project-hope
  namespace: argocd
spec:
  description: Project HOPE platform
  sourceRepos:
    - "https://gitlab.example.com/group/hope-v2.git"
  destinations:
    - server: https://192.168.1.100:6443
      namespace: hope-dev
    - server: https://192.168.1.100:6443
      namespace: hope-prod
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: ""
      kind: "*"
    - group: apps
      kind: "*"
    - group: batch
      kind: "*"
    - group: networking.k8s.io
      kind: "*"

---
# -- DEV environment (auto-sync) --
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hope-dev
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: project-hope
    environment: dev
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: project-hope
  source:
    repoURL: "https://gitlab.example.com/group/hope-v2.git"
    targetRevision: HEAD
    path: deployment/k3s/overlays/dev
  destination:
    server: https://192.168.1.100:6443
    namespace: hope-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas

---
# -- PROD environment (manual sync) --
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hope-prod
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: project-hope
    environment: prod
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: project-hope
  source:
    repoURL: "https://gitlab.example.com/group/hope-v2.git"
    targetRevision: HEAD
    path: deployment/k3s/overlays/prod
  destination:
    server: https://192.168.1.100:6443
    namespace: hope-prod
  syncPolicy:
    # No automated block — requires manual sync via UI/CLI
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas

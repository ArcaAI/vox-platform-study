apiVersion: v1
kind: ConfigMap
metadata:
  name: hope-config
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/part-of: project-hope
    environment: __ENV__
data:
  # -- Common --
  NODE_ENV: "__NODE_ENV__"
  LOG_LEVEL: "info"
  DEBUG: "false"

  # -- Ports --
  API_PORT: "8868"
  NLP_PORT: "8864"
  SMR_PORT: "8862"
  STT_V2_PORT: "8861"

  # -- Internal Service URLs --
  API_URL: "http://hope-api:8868"
  NLP_URL: "http://hope-nlp:8864"
  SMR_URL: "http://hope-smr:8862"
  STT_V2_URL: "http://hope-stt-v2:8861"

  # -- Database --
  POSTGRES_HOST: "hope-postgres"
  POSTGRES_PORT: "5432"

  # -- Redis --
  REDIS_HOST: "hope-redis"
  REDIS_PORT: "6379"

  # -- MinIO (VM 402 - external) --
  MINIO_ENDPOINT: "<REPLACE_MINIO_VM402_IP>:9000"
  MINIO_USE_SSL: "false"
  MINIO_AUDIO_BUCKET: "hope-audio"
  MINIO_CHUNK_BUCKET: "hope-audio-chunks"

  # -- OpenTelemetry (disabled for now) --
  OTEL_TRACES_ENABLED: "false"
  OTEL_METRICS_ENABLED: "false"
  OTEL_SERVICE_NAMESPACE: "__NAMESPACE__"

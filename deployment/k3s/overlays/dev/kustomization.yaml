apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hope-dev

namePrefix: ""

commonLabels:
  environment: dev

resources:
  - ../../base

patches:
  # --- ConfigMap: dev-specific values ---
  - target:
      kind: ConfigMap
      name: hope-config
    patch: |
      - op: replace
        path: /data/NODE_ENV
        value: development
      - op: replace
        path: /data/LOG_LEVEL
        value: debug
      - op: replace
        path: /data/DEBUG
        value: "true"
      - op: replace
        path: /data/OTEL_TRACES_ENABLED
        value: "false"
      - op: replace
        path: /data/OTEL_METRICS_ENABLED
        value: "false"

  # --- API Ingress: dev hostname ---
  - target:
      kind: Ingress
      name: hope-api
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: api-dev.hope.local

  # --- UI Ingress: dev hostname ---
  - target:
      kind: Ingress
      name: hope-ui
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: ui-dev.hope.local

images:
  - name: gitlab-server:5000/arca
    newTag: dev-latest

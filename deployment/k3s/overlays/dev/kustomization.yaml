apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hope-v2-dev

commonLabels:
  environment: dev

resources:
  - ../../base

components:
  - ../../components/registry

patches:
  # --- ConfigMap: dev-specific values ---
  - target:
      kind: ConfigMap
      name: hope-config
    patch: |
      - op: replace
        path: /data/NODE_ENV
        value: development
      - op: replace
        path: /data/LOG_LEVEL
        value: debug
      - op: replace
        path: /data/DEBUG
        value: "true"
      - op: replace
        path: /data/ENABLE_PRISMA_STUDIO
        value: "true"
      - op: replace
        path: /data/OTEL_TRACES_ENABLED
        value: "false"
      - op: replace
        path: /data/OTEL_METRICS_ENABLED
        value: "false"

  # --- API Ingress: dev hostname ---
  - target:
      kind: Ingress
      name: hope-api
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: api-dev.hope.local

  # --- UI Ingress: dev hostname ---
  - target:
      kind: Ingress
      name: hope-ui
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: ui-dev.hope.local

# Image tags are pinned here and are NOT updated by CI. CI builds on the `dev`
# branch are manually triggered and push `dev-<sha8>` + `sha-<sha8>` image tags
# (never `latest`, never a plain `dev` tag); the CI deploy-staging job writes Helm
# values to the separate `hope-deployments` repo, not to this overlay. ArgoCD
# auto-syncs this overlay from `main`: update `newTag` manually (edit + merge to
# main) to promote a build. NOTE: `dev` below is a placeholder tag that CI does
# not push — pods can only pull once `newTag` points at a real tag such as
# `dev-<sha8>` or `sha-<sha8>`.
# CAVEAT (pre-existing, found in TASK-413): kustomize applies the
# ../../components/registry newName rewrite BEFORE this images block, so these
# newTag pins do not currently reach the rendered manifests — images render as
# registry.taphuynh.dev/arca/hope-v2/*:latest (a tag CI never pushes). Fixing
# requires matching the rewritten names here (or merging the rewrite into this
# block), which changes rendered output and needs its own review.
images:
  - name: hope-v2/api
    newTag: dev
  - name: hope-v2/ui-playground
    newTag: dev
  - name: hope-v2/nlp
    newTag: dev
  - name: hope-v2/smr
    newTag: dev
  - name: hope-v2/stt-v2-ml-runtime
    newTag: dev
  - name: hope-v2/stt-v2-worker
    newTag: dev
  - name: hope-v2/database
    newTag: dev

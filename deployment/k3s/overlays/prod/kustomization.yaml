apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hope-v2-prod

commonLabels:
  environment: prod

resources:
  - ../../base

components:
  - ../../components/registry

patches:
  # --- ConfigMap: prod-specific values ---
  - target:
      kind: ConfigMap
      name: hope-config
    patch: |
      - op: replace
        path: /data/NODE_ENV
        value: production
      - op: replace
        path: /data/LOG_LEVEL
        value: warn
      - op: replace
        path: /data/DEBUG
        value: "false"
      - op: replace
        path: /data/OTEL_TRACES_ENABLED
        value: "true"
      - op: replace
        path: /data/OTEL_METRICS_ENABLED
        value: "true"

  # --- API: scale up for prod ---
  - target:
      kind: Deployment
      name: hope-api
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2

  # --- API Ingress: prod hostname ---
  - target:
      kind: Ingress
      name: hope-api
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: api.hope.local

  # --- UI Ingress: prod hostname ---
  - target:
      kind: Ingress
      name: hope-ui
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: ui.hope.local

  # --- Admin Console Ingress: prod hostname ---
  - target:
      kind: Ingress
      name: hope-admin-console
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: admin.hope.local

# Image tags are pinned here and are NOT updated by CI (no promote-prod job
# exists). On `v*` tag pipelines CI automatically builds and pushes semver tags
# (`X.Y.Z`, `X.Y`, `X`, plus `sha-<sha8>`) — never `latest`. Promote by bumping
# `newTag` on the `prod` branch: manually, or via the optional semver ImageUpdater
# templated in deployment/argocd/bootstrap.prod.yaml.example (git write-back to
# `prod`). Either way the prod Application is MANUAL-sync — ArgoCD applies the
# change only when an operator syncs. NOTE: `0.0.0` below is a placeholder; set a
# real released version when promoting.
# CAVEAT (pre-existing, found in TASK-414): kustomize applies the
# ../../components/registry newName rewrite BEFORE this images block, so these
# newTag pins do not currently reach the rendered manifests — images render as
# registry.taphuynh.dev/arca/hope-v2/*:latest (a tag CI never pushes). Fixing
# requires matching the rewritten names here (or merging the rewrite into this
# block), which changes rendered output and needs its own review.
images:
  - name: hope-v2/api
    newTag: "0.0.0"
  - name: hope-v2/admin-console
    newTag: "0.0.0"
  - name: hope-v2/smr
    newTag: "0.0.0"
  - name: hope-v2/stt-v2-ml-runtime
    newTag: "0.0.0"
  - name: hope-v2/stt-v2-worker
    newTag: "0.0.0"
  - name: hope-v2/database
    newTag: "0.0.0"

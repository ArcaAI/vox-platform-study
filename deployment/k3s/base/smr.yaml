apiVersion: apps/v1
kind: Deployment
metadata:
  name: hope-smr
  labels:
    app: hope-smr
    app.kubernetes.io/part-of: project-hope
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: hope-smr
  template:
    metadata:
      labels:
        app: hope-smr
    spec:
      containers:
        - name: smr
          image: gitlab-server:5000/arca:smr-latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8862
          envFrom:
            - configMapRef:
                name: hope-config
            - secretRef:
                name: hope-secrets
          env:
            - name: SMR_V2_HOST
              value: "0.0.0.0"
            - name: SMR_V2_PORT
              value: "8862"
            - name: SMR_V2_DEBUG
              value: "false"
            - name: SMR_V2_LOG_LEVEL
              value: "info"
            - name: OTEL_SERVICE_NAME
              value: hope-smr
            - name: SMR_V2_OTEL_ENABLED
              value: "false"
            - name: SMR_V2_REDIS_URL
              value: "redis://:$(REDIS_PASS)@hope-redis:6379/0"
            - name: SMR_V2_AZURE_ENABLED
              value: "true"
            - name: SMR_V2_AZURE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hope-secrets
                  key: AZURE_OPENAI_API_KEY
            - name: SMR_V2_AZURE_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: hope-secrets
                  key: AZURE_OPENAI_ENDPOINT
            - name: SMR_V2_AZURE_DEPLOYMENT_NAME
              valueFrom:
                secretKeyRef:
                  name: hope-secrets
                  key: AZURE_OPENAI_DEPLOYMENT_NAME
          startupProbe:
            httpGet:
              path: /api/v1/health/live
              port: 8862
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/v1/health/live
              port: 8862
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: 8862
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: hope-smr
  labels:
    app: hope-smr
spec:
  selector:
    app: hope-smr
  ports:
    - name: http
      port: 8862
      targetPort: 8862
  type: ClusterIP

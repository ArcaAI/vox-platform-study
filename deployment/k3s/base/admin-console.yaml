apiVersion: apps/v1
kind: Deployment
metadata:
  name: hope-admin-console
  labels:
    app: hope-admin-console
    app.kubernetes.io/part-of: project-hope
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: hope-admin-console
  template:
    metadata:
      labels:
        app: hope-admin-console
    spec:
      containers:
        - name: admin-console
          image: hope-v2/admin-console:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            # In-cluster gateway origin the BFF proxies to (server-side only).
            - name: API_URL
              valueFrom:
                configMapKeyRef:
                  name: hope-config
                  key: API_URL
            # Browser-reachable gateway origin for direct SSE/WS streams.
            # NOTE: NEXT_PUBLIC_* is inlined into the client bundle at image
            # BUILD time — this runtime value only affects server rendering.
            - name: NEXT_PUBLIC_API_HOST
              valueFrom:
                configMapKeyRef:
                  name: hope-config
                  key: NEXT_PUBLIC_API_HOST
            - name: ADMIN_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: hope-secrets
                  key: ADMIN_SESSION_SECRET
          readinessProbe:
            httpGet:
              path: /login
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /login
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: hope-admin-console
  labels:
    app: hope-admin-console
spec:
  selector:
    app: hope-admin-console
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30081
  type: NodePort
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hope-admin-console
  labels:
    app: hope-admin-console
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: admin.hope.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hope-admin-console
                port:
                  number: 3000

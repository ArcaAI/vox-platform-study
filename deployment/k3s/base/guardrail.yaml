apiVersion: apps/v1
kind: Deployment
metadata:
  name: hope-guardrail
  labels:
    app: hope-guardrail
    app.kubernetes.io/part-of: project-hope
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: hope-guardrail
  template:
    metadata:
      labels:
        app: hope-guardrail
    spec:
      containers:
        - name: guardrail
          image: hope-v2/guardrail:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8863
          envFrom:
            - configMapRef:
                name: hope-config
            - secretRef:
                name: hope-secrets
          env:
            - name: GUARDRAIL_V2_HOST
              value: "0.0.0.0"
            - name: GUARDRAIL_V2_PORT
              value: "8863"
            - name: GUARDRAIL_V2_DEBUG
              value: "false"
            - name: GUARDRAIL_V2_LOG_LEVEL
              value: "info"
            - name: GUARDRAIL_REDIS_REDIS_URL
              value: "redis://:$(REDIS_PASS)@hope-redis:6379/0"
            - name: OTEL_SERVICE_NAME
              value: hope-guardrail
            - name: GUARDRAIL_V2_OTEL_ENABLED
              value: "false"
          startupProbe:
            httpGet:
              path: /api/health/live
              port: 8863
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: 8863
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: 8863
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: hope-guardrail
  labels:
    app: hope-guardrail
spec:
  selector:
    app: hope-guardrail
  ports:
    - name: http
      port: 8863
      targetPort: 8863
  type: ClusterIP

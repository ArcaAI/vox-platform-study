apiVersion: apps/v1
kind: Deployment
metadata:
  name: hope-tts
  labels:
    app: hope-tts
    app.kubernetes.io/part-of: project-hope
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: hope-tts
  template:
    metadata:
      labels:
        app: hope-tts
    spec:
      containers:
        - name: tts
          image: hope-v2/tts-v2:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8865
          envFrom:
            - configMapRef:
                name: hope-config
            - secretRef:
                name: hope-secrets
          env:
            - name: TTS_HOST
              value: "0.0.0.0"
            - name: TTS_PORT
              value: "8865"
            - name: TTS_DEBUG
              value: "false"
            - name: TTS_LOG_LEVEL
              value: "info"
            - name: OTEL_SERVICE_NAME
              value: hope-tts
            # Cloud (Azure) is the day-1 provider; it reuses the shared Azure
            # Speech credential (AZURE_SPEECH_KEY / AZURE_SPEECH_REGION arrive via
            # envFrom hope-secrets and resolve through the TTS_AZURE_ config
            # aliases). Flip to "true" once the credential is provisioned.
            - name: TTS_AZURE_ENABLED
              value: "false"
            # Self-hosted local engines require the [local] image variant + a GPU
            # node; keep them OFF in the base deployment.
            - name: TTS_KOKORO_ENABLED
              value: "false"
            - name: TTS_PARLER_ENABLED
              value: "false"
          startupProbe:
            httpGet:
              path: /api/v1/health/live
              port: 8865
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/v1/health/live
              port: 8865
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: 8865
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: hope-tts
  labels:
    app: hope-tts
spec:
  selector:
    app: hope-tts
  ports:
    - name: http
      port: 8865
      targetPort: 8865
  type: ClusterIP

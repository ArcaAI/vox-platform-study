apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hope-ollama
  labels:
    app: hope-ollama
    app.kubernetes.io/part-of: project-hope
spec:
  serviceName: hope-ollama
  replicas: 1
  selector:
    matchLabels:
      app: hope-ollama
  template:
    metadata:
      labels:
        app: hope-ollama
    spec:
      runtimeClassName: nvidia
      containers:
        - name: ollama
          image: ollama/ollama:0.18.2
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              ollama serve &
              until ollama list >/dev/null 2>&1; do sleep 1; done
              echo "Pulling Ollama models..."
              ollama pull granite4:latest
              ollama pull granite4:tiny-h
              ollama pull gemma3:latest
              ollama pull gemma3n:latest
              ollama pull gemma3n:e2b
              ollama pull qwen3.5:latest
              ollama pull qwen3.5:27b
              ollama pull translategemma:latest
              ollama pull translategemma:12b
              ollama pull gpt-oss:latest
              ollama pull hf.co/unsloth/medgemma-27b-text-it-GGUF:Q4_K_M
              echo "All models pulled."
              wait
          ports:
            - containerPort: 11434
          volumeMounts:
            - name: data
              mountPath: /root/.ollama
          readinessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 10
          resources:
            requests:
              cpu: "4"
              memory: "16Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "12"
              memory: "48Gi"
              nvidia.com/gpu: "1"
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 100Gi
---
apiVersion: v1
kind: Service
metadata:
  name: hope-ollama
  labels:
    app: hope-ollama
spec:
  clusterIP: None
  selector:
    app: hope-ollama
  ports:
    - name: http
      port: 11434
      targetPort: 11434

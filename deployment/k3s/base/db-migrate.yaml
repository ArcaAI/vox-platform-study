apiVersion: batch/v1
kind: Job
metadata:
  name: hope-db-migrate
  labels:
    app: hope-db-migrate
    app.kubernetes.io/part-of: project-hope
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: hope-db-migrate
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: hope-v2/database:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: hope-secrets
                  key: DATABASE_URL
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

# LM Studio — in-cluster alias for the external OpenAI-compatible LLM engine.
#
# Per TASK-337, LM Studio is the default local engine for SMR, guardrail, and the
# harness (judge + Granite-Guardian safety). LM Studio is a desktop/headless
# OpenAI-compatible server (the LM Studio app, or `lms server start`), NOT a
# standard container image — so it runs OUTSIDE the cluster on a GPU host and is
# surfaced to in-cluster clients under the stable name `hope-lmstudio`. The
# configmap points SMR/guardrail/harness at http://hope-lmstudio:1234/v1.
#
# ========================= OPS MUST SET =========================
# Replace `lmstudio.REPLACE_ME.example.com` with the DNS name of the host running
# LM Studio. That host must:
#   * Serve the LM Studio OpenAI-compatible API on TCP 1234, bound to the network
#     (LM Studio: enable "Serve on Local Network", or `lms server start --port 1234`),
#     reachable from the cluster pod network.
#   * Have the required models loaded/available by these ids:
#       - google/gemma-4-e4b        (harness judge, SMR)
#       - granite-guardian-4.1-8b   (harness safety, guardrail)
#
# This is a Service of type ExternalName: it is a DNS CNAME only (no proxying), so
# clients still connect on :1234 (taken from the base URL above) and the target
# host must serve LM Studio on that port. ExternalName requires a DNS NAME, not an
# IP address — if LM Studio is only reachable by IP, comment out this Service and
# use the "Service + Endpoints" variant at the bottom of this file instead.
apiVersion: v1
kind: Service
metadata:
  name: hope-lmstudio
  labels:
    app: hope-lmstudio
spec:
  type: ExternalName
  externalName: lmstudio.REPLACE_ME.example.com
# ---------------------------------------------------------------------------
# ALTERNATIVE — LM Studio reachable only by IP (no DNS name):
# Comment out the ExternalName Service above, then uncomment the selector-less
# Service + manual Endpoints below and set the host IP. Endpoints does proper
# port mapping (1234 -> 1234) and accepts a raw IP, which ExternalName does not.
#
# CAVEAT: this base's kustomization.yaml uses `commonLabels`, which injects a
# spec.selector into every Service. A manual-Endpoints Service MUST stay
# selector-less (otherwise the endpoints controller overwrites the manual
# Endpoints). So apply this variant directly with `kubectl apply -f lmstudio.yaml`,
# or migrate the kustomization to `labels:` (includeSelectors: false) first.
#
# apiVersion: v1
# kind: Service
# metadata:
#   name: hope-lmstudio
#   labels:
#     app: hope-lmstudio
# spec:
#   ports:
#     - name: http
#       port: 1234
#       targetPort: 1234
# ---
# apiVersion: v1
# kind: Endpoints
# metadata:
#   name: hope-lmstudio        # MUST match the Service name above
#   labels:
#     app: hope-lmstudio
# subsets:
#   - addresses:
#       - ip: 10.0.0.REPLACE_ME # OPS: IP of the host running LM Studio
#     ports:
#       - name: http
#         port: 1234

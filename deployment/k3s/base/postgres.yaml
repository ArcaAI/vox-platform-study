apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hope-postgres
  labels:
    app: hope-postgres
    app.kubernetes.io/part-of: project-hope
spec:
  serviceName: hope-postgres
  replicas: 1
  selector:
    matchLabels:
      app: hope-postgres
  template:
    metadata:
      labels:
        app: hope-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:18-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: hope-secrets
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: hope-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hope-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_INITDB_ARGS
              value: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
          args:
            - "postgres"
            - "-c"
            - "shared_buffers=2GB"
            - "-c"
            - "effective_cache_size=8GB"
            - "-c"
            - "work_mem=64MB"
            - "-c"
            - "maintenance_work_mem=512MB"
            - "-c"
            - "max_connections=200"
            - "-c"
            - "wal_level=replica"
            - "-c"
            - "max_wal_senders=3"
            - "-c"
            - "log_min_duration_statement=1000"
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "4"
              memory: "8Gi"
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 100Gi
---
apiVersion: v1
kind: Service
metadata:
  name: hope-postgres
  labels:
    app: hope-postgres
spec:
  clusterIP: None
  selector:
    app: hope-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432

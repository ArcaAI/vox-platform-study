apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hope-redis
  labels:
    app: hope-redis
    app.kubernetes.io/part-of: project-hope
spec:
  serviceName: hope-redis
  replicas: 1
  selector:
    matchLabels:
      app: hope-redis
  template:
    metadata:
      labels:
        app: hope-redis
    spec:
      containers:
        - name: redis
          image: redis:8-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6379
          command:
            - redis-server
            - --requirepass
            - $(REDIS_PASS)
            - --maxmemory
            - "512mb"
            - --maxmemory-policy
            - allkeys-lru
            - --appendonly
            - "yes"
            - --appendfsync
            - everysec
          env:
            - name: REDIS_PASS
              valueFrom:
                secretKeyRef:
                  name: hope-secrets
                  key: REDIS_PASS
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli -a "$REDIS_PASS" ping | grep PONG
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli -a "$REDIS_PASS" ping | grep PONG
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: hope-redis
  labels:
    app: hope-redis
spec:
  clusterIP: None
  selector:
    app: hope-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379

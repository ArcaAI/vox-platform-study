apiVersion: v1
kind: ConfigMap
metadata:
  name: hope-config
  labels:
    app.kubernetes.io/part-of: project-hope
data:
  # -- Common --
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  DEBUG: "false"
  CORS_ALLOWED_ORIGINS: "*"
  ENABLE_PRISMA_STUDIO: "false"

  # -- Ports --
  API_PORT: "8868"
  NLP_PORT: "8864"
  SMR_PORT: "8862"
  STT_V2_PORT: "8861"

  # -- Internal Service URLs --
  API_URL: "http://hope-api:8868"
  NLP_URL: "http://hope-nlp:8864"
  SMR_URL: "http://hope-smr:8862"
  STT_V2_URL: "http://hope-stt-v2:8861"

  # -- Database --
  POSTGRES_HOST: "hope-postgres"
  POSTGRES_PORT: "5432"

  # -- Redis --
  REDIS_HOST: "hope-redis"
  REDIS_PORT: "6379"

  # -- MinIO --
  MINIO_USE_SSL: "false"
  MINIO_AUDIO_BUCKET: "hope-audio"
  MINIO_CHUNK_BUCKET: "hope-audio-chunks"

  # -- STT V2 --
  API_GATEWAY_TIMEOUT: "30"
  MODEL_CACHE_MAX_MODELS: "5"
  MODEL_CACHE_TTL_SECONDS: "3600"
  WORKER_CONCURRENCY: "4"
  WORKER_MAX_RETRIES: "3"
  TRANSCRIPTION_TIMEOUT_SECONDS: "300"
  TRANSCRIPTION_CHUNK_LENGTH_S: "30"
  HUGGINGFACE_CACHE_DIR: "/models/hf-cache"
  AZURE_SPEECH_REGION: "eastus"

  # -- SMR V2 --
  SMR_V2_OLLAMA_ENABLED: "true"
  SMR_V2_OLLAMA_BASE_URL: "http://hope-ollama:11434"
  SMR_V2_OLLAMA_DEFAULT_MODEL: "qwen2.5:0.5b"
  SMR_V2_OLLAMA_TIMEOUT_S: "300"
  SMR_V2_OPENAI_COMPAT_ENABLED: "false"
  SMR_V2_OPENAI_COMPAT_BASE_URL: "http://localhost:1234/v1"
  SMR_V2_OPENAI_COMPAT_DEFAULT_MODEL: "qwen3.5-4b"
  SMR_V2_OPENAI_COMPAT_TIMEOUT_S: "300"
  SMR_V2_GUARDRAIL_ENABLED: "false"
  SMR_V2_METRICS_ENABLED: "false"

  # -- OpenTelemetry --
  OTEL_TRACES_ENABLED: "false"
  OTEL_METRICS_ENABLED: "false"

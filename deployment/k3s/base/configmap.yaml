apiVersion: v1
kind: ConfigMap
metadata:
  name: hope-config
  labels:
    app.kubernetes.io/part-of: project-hope
data:
  # -- Common --
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  DEBUG: "false"
  CORS_ALLOWED_ORIGINS: "*"
  ENABLE_PRISMA_STUDIO: "false"

  # -- Ports --
  API_PORT: "8868"
  GUARDRAIL_PORT: "8863"
  NLP_PORT: "8864"
  SMR_PORT: "8862"
  STT_V2_PORT: "8861"

  # -- Internal Service URLs --
  API_URL: "http://hope-api:8868"
  GUARDRAIL_URL: "http://hope-guardrail:8863"
  NLP_URL: "http://hope-nlp:8864"
  SMR_URL: "http://hope-smr:8862"
  STT_V2_URL: "http://hope-stt-v2:8861"

  # -- Database --
  POSTGRES_HOST: "hope-postgres"
  POSTGRES_PORT: "5432"

  # -- Redis --
  REDIS_HOST: "hope-redis"
  REDIS_PORT: "6379"

  # -- MinIO --
  MINIO_USE_SSL: "false"
  MINIO_AUDIO_BUCKET: "hope-audio"
  MINIO_CHUNK_BUCKET: "hope-audio-chunks"

  # -- STT V2 --
  API_GATEWAY_TIMEOUT: "30"
  MODEL_CACHE_MAX_MODELS: "2"
  MODEL_CACHE_TTL_SECONDS: "3600"
  WORKER_CONCURRENCY: "4"
  WORKER_MAX_RETRIES: "3"
  TRANSCRIPTION_TIMEOUT_SECONDS: "300"
  TRANSCRIPTION_CHUNK_LENGTH_S: "30"
  HUGGINGFACE_CACHE_DIR: "/models/hf-cache"
  AZURE_SPEECH_REGION: "eastus"

  # -- SMR V2 (LM Studio is the default local engine; Ollama is optional) --
  SMR_V2_OPENAI_COMPAT_ENABLED: "true"
  SMR_V2_OPENAI_COMPAT_BASE_URL: "http://hope-lmstudio:1234/v1"
  SMR_V2_OPENAI_COMPAT_DEFAULT_MODEL: "google/gemma-4-e4b"
  SMR_V2_OPENAI_COMPAT_TIMEOUT_S: "300"
  SMR_V2_OLLAMA_ENABLED: "false"
  SMR_V2_OLLAMA_BASE_URL: "http://hope-ollama:11434"
  SMR_V2_OLLAMA_DEFAULT_MODEL: "google/gemma-4-e4b"
  SMR_V2_OLLAMA_TIMEOUT_S: "300"
  SMR_V2_GUARDRAIL_ENABLED: "false"
  SMR_V2_EXTERNAL_GUARDRAIL_ENABLED: "true"
  SMR_V2_EXTERNAL_GUARDRAIL_BASE_URL: "http://hope-guardrail:8863"
  SMR_V2_EXTERNAL_GUARDRAIL_TIMEOUT_S: "10"
  SMR_V2_EXTERNAL_GUARDRAIL_FAIL_OPEN: "false"
  SMR_V2_EXTERNAL_GUARDRAIL_REQUIRE_MEDICAL: "true"
  SMR_V2_EXTERNAL_GUARDRAIL_INCLUDE_REASONING: "false"
  SMR_V2_EXTERNAL_GUARDRAIL_SERVICE_TOKEN: ""

  # -- Guardrail (LM Studio default via Granite Guardian; Ollama optional) --
  # NOTE: requires an in-cluster LM Studio (or any OpenAI-compatible server)
  # serving granite-guardian-4.1-8b reachable at the base URL below.
  GUARDRAIL_V2_LOG_LEVEL: "info"
  GUARDRAIL_V2_METRICS_ENABLED: "false"
  GUARDRAIL_V2_PROVIDER: "lm-studio"
  GUARDRAIL_OPENAI_COMPAT_ENABLED: "true"
  GUARDRAIL_OPENAI_COMPAT_BASE_URL: "http://hope-lmstudio:1234/v1"
  GUARDRAIL_OPENAI_COMPAT_API_KEY: "lm-studio"
  GUARDRAIL_OPENAI_COMPAT_GUARDRAIL_MODEL: "granite-guardian-4.1-8b"
  GUARDRAIL_OPENAI_COMPAT_CONTENT_SAFETY_MODEL: "granite-guardian-4.1-8b"
  GUARDRAIL_OPENAI_COMPAT_PII_DETECTION_MODEL: "granite-guardian-4.1-8b"
  GUARDRAIL_OPENAI_COMPAT_PROMPT_INJECTION_MODEL: "granite-guardian-4.1-8b"
  GUARDRAIL_OPENAI_COMPAT_COMPREHENSIVE_MODEL: "granite-guardian-4.1-8b"
  GUARDRAIL_OPENAI_COMPAT_GUARDIAN_MODEL: "granite-guardian-4.1-8b"
  GUARDRAIL_OPENAI_COMPAT_GUARDIAN_ENABLED: "true"
  GUARDRAIL_OPENAI_COMPAT_TIMEOUT_S: "60"
  GUARDRAIL_OPENAI_COMPAT_MAX_CONCURRENT: "4"
  # Optional Ollama engine (set GUARDRAIL_V2_PROVIDER=ollama to use)
  GUARDRAIL_OLLAMA_ENABLED: "false"
  GUARDRAIL_OLLAMA_BASE_URL: "http://hope-ollama:11434"
  GUARDRAIL_OLLAMA_GUARDRAIL_MODEL: "gemma3:latest"
  GUARDRAIL_OLLAMA_CONTENT_SAFETY_MODEL: "gemma3:latest"
  GUARDRAIL_OLLAMA_PII_DETECTION_MODEL: "gemma3:latest"
  GUARDRAIL_OLLAMA_PROMPT_INJECTION_MODEL: "gemma3:latest"
  GUARDRAIL_OLLAMA_COMPREHENSIVE_MODEL: "gemma3:latest"
  GUARDRAIL_OLLAMA_GUARDIAN_MODEL: "gemma3:latest"
  GUARDRAIL_OLLAMA_GUARDIAN_ENABLED: "true"
  GUARDRAIL_OLLAMA_TIMEOUT_S: "60"
  GUARDRAIL_OLLAMA_MAX_CONCURRENT: "4"

  # -- OpenTelemetry --
  OTEL_TRACES_ENABLED: "false"
  OTEL_METRICS_ENABLED: "false"

apiVersion: v1
kind: ConfigMap
metadata:
  name: hope-config
  labels:
    app.kubernetes.io/part-of: project-hope
data:
  # -- Common --
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  DEBUG: "false"
  CORS_ALLOWED_ORIGINS: "*"
  ENABLE_PRISMA_STUDIO: "false"

  # -- Ports --
  API_PORT: "8868"
  NLP_PORT: "8864"
  SMR_PORT: "8862"
  STT_V2_PORT: "8861"

  # -- Internal Service URLs --
  API_URL: "http://hope-api:8868"
  NLP_URL: "http://hope-nlp:8864"
  SMR_URL: "http://hope-smr:8862"
  STT_V2_URL: "http://hope-stt-v2:8861"

  # -- Database --
  POSTGRES_HOST: "hope-postgres"
  POSTGRES_PORT: "5432"

  # -- Redis --
  REDIS_HOST: "hope-redis"
  REDIS_PORT: "6379"

  # -- MinIO --
  MINIO_USE_SSL: "false"
  MINIO_AUDIO_BUCKET: "hope-audio"
  MINIO_CHUNK_BUCKET: "hope-audio-chunks"

  # -- OpenTelemetry --
  OTEL_TRACES_ENABLED: "false"
  OTEL_METRICS_ENABLED: "false"

apiVersion: apps/v1
kind: Deployment
metadata:
  name: hope-stt-v2
  namespace: __NAMESPACE__
  labels:
    app: hope-stt-v2
    app.kubernetes.io/part-of: project-hope
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: hope-stt-v2
  template:
    metadata:
      labels:
        app: hope-stt-v2
    spec:
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: init-hf-cache
          image: gitlab-server:5000/arca:stt-v2-__IMAGE_TAG__-latest
          command: ["/bin/sh", "-c"]
          args:
            - mkdir -p /models/hf-cache && chown -R app:app /models
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: models-cache
              mountPath: /models
      containers:
        - name: stt-v2
          image: gitlab-server:5000/arca:stt-v2-__IMAGE_TAG__-latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8861
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
          envFrom:
            - configMapRef:
                name: hope-config
            - secretRef:
                name: hope-secrets
          env:
            - name: APP_NAME
              value: stt-v2
            - name: APP_VERSION
              value: "2.0.0"
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "8861"
            - name: CORS_ORIGINS
              value: '["*"]'
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: hope-secrets
                  key: STT_V2_DATABASE_URL
            - name: DATABASE_POOL_SIZE
              value: "5"
            - name: DATABASE_MAX_OVERFLOW
              value: "10"
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASS)@hope-redis:6379/0"
            - name: MINIO_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: hope-config
                  key: MINIO_ENDPOINT
            - name: MINIO_SECURE
              value: "false"
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: hope-secrets
                  key: MINIO_ACCESS_KEY
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: hope-secrets
                  key: MINIO_SECRET_KEY
            - name: MINIO_AUDIO_BUCKET
              value: hope-audio
            - name: MINIO_CHUNK_BUCKET
              value: hope-audio-chunks
            - name: API_GATEWAY_URL
              value: "http://hope-api:8868"
            - name: STT_PROVIDER
              value: "azure"
            - name: OTEL_SERVICE_NAME
              value: hope-stt-v2
            - name: HF_HOME
              value: /models/hf-cache
            - name: HUGGINGFACE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hope-secrets
                  key: HUGGINGFACE_TOKEN
          volumeMounts:
            - name: models-cache
              mountPath: /models
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: 8861
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8861
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8861
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: "4"
              memory: "8Gi"
            limits:
              cpu: "8"
              memory: "16Gi"
      volumes:
        - name: models-cache
          persistentVolumeClaim:
            claimName: hope-stt-v2-models
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hope-stt-v2-models
  namespace: __NAMESPACE__
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: hope-stt-v2
  namespace: __NAMESPACE__
  labels:
    app: hope-stt-v2
spec:
  selector:
    app: hope-stt-v2
  ports:
    - name: http
      port: 8861
      targetPort: 8861
  type: ClusterIP

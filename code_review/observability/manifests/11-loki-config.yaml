# Loki config — namespace project-hope-vox-infra
#
# Single-binary ("monolithic") Loki. Config is mounted from this ConfigMap and
# read on every start (`args: -config.file=/etc/loki/loki.yml`), so bumping the
# image tag never changes how config is applied — same pattern as Prometheus,
# where the config lives in the pod spec / a ConfigMap, not the image.
#
# Chosen deliberately:
#   store: tsdb, schema v13   — the current default. The old raw stack used the
#                               retired `boltdb-shipper`; do not reuse it.
#   auth_enabled: false       — single tenant. Loki is ClusterIP-only (see 12).
#   compactor.retention       — in Loki 3.x retention ONLY works through the
#                               compactor, and ONLY when combined with
#                               limits_config.retention_period. Both are set.
#
# Retention is 30d (720h). Lower it (e.g. 168h = 7d) if disk is tight.
# Storage is filesystem on a PVC (nfs-client), 50Gi — no S3, no gateway.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: project-hope-vox-infra
  labels:
    app: loki
    app.kubernetes.io/part-of: project-hope
data:
  loki.yml: |
    auth_enabled: false

    server:
      http_listen_port: 3100
      grpc_listen_port: 9096
      log_level: info

    common:
      path_prefix: /loki
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules

    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    limits_config:
      retention_period: 720h
      ingestion_rate_mb: 8
      ingestion_burst_size_mb: 16
      max_cache_freshness_per_query: 10m
      max_query_series: 500

    compactor:
      working_directory: /loki/compactor
      compaction_interval: 10m
      retention_enabled: true
      retention_delete_delay: 2h
      retention_delete_worker_count: 150
      delete_request_store: filesystem

    ruler:
      enable_api: true
      alertmanager_url: http://alertmanager:9093
      storage:
        type: local
        local:
          directory: /loki/rules
      rule_path: /loki/rules-temp

    analytics:
      reporting_enabled: false

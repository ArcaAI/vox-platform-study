# Gateway-Test — deployed in cluster (gatway-test-svc). Included here.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway-test-ingress
  namespace: project-hope-vox
  labels:
    app.kubernetes.io/part-of: gateway-test
spec:
  ingressClassName: traefik
  rules:
    - host: gateway-test.arcaai.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway-test-svc
                port:
                  # Must match the Service port (80), NOT the container targetPort (8868).
                  number: 80

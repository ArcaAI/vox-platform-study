[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nlp"
version = "0.1.0"
description = "Medical Entity Recognition & NLP Service for AgenticSDK"
authors = [
    {name = "ARCA AI Team", email = "team@arcaai.com"}
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.12"
keywords = ["nlp", "medical", "entity-recognition", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # --- Web framework ---
    "fastapi>=0.133.0",
    "uvicorn[standard]>=0.41.0",
    # --- Data validation ---
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    # --- NLP / ML ---
    "spacy>=3.8.0",
    "transformers>=4.48.0",
    "torch>=2.1.0",
    "numpy>=2.0.0",
    "pandas>=2.1.0",
    "scikit-learn>=1.3.0",
    # --- Document extraction / OCR (TASK-344 A2) ---
    # PyMuPDF for cheap PDF text-layer extraction; RapidOCR (PaddleOCR on ONNX,
    # CPU-only) for scanned pages/images. Route, don't OCR everything.
    "pymupdf>=1.24.0",
    "rapidocr-onnxruntime>=1.3.0",
    # --- Async / HTTP ---
    "aiofiles>=25.1.0",
    "python-multipart>=0.0.22",
    "httpx>=0.28.1",
    # --- Auth ---
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    # --- Text processing ---
    "symspellpy>=6.9.0",
    # --- Logging ---
    "structlog>=25.5.0",
    "python-dotenv>=1.2.0",
    # --- Serialization ---
    "orjson>=3.11.7",
    # --- Observability ---
    "prometheus-client>=0.24.1",
    "prometheus-fastapi-instrumentator>=7.1.0",
    "opentelemetry-api>=1.39.1",
    "opentelemetry-sdk>=1.39.1",
    "opentelemetry-instrumentation>=0.60b1",
    "opentelemetry-instrumentation-fastapi>=0.60b1",
    "opentelemetry-instrumentation-logging>=0.60b1",
    "opentelemetry-exporter-otlp-proto-grpc>=1.39.0",
]
# CONDA-MANAGED PACKAGES (installed via conda, not pip):
#   ffmpeg 6.1.2, av 13.1.0, numpy 2.4.2, scipy 1.17.1, libiconv 1.18
# av (PyAV) is a transitive dependency of transformers (video_classification
# pipeline imports it at module load time). It MUST be installed via conda
# to avoid native library symbol conflicts (libiconv) on macOS.
# See scripts/setup-python-env.sh for the authoritative install sequence.

[project.optional-dependencies]
dev = [
    "black>=26.1.0",
    "ruff>=0.15.7",
    "mypy>=1.19.1",
    "pre-commit>=4.5.1",
]
test = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "httpx>=0.28.1",
    "pytest-xdist>=3.8.0",
]
lint = [
    "black>=26.1.0",
    "ruff>=0.15.7",
    "mypy>=1.19.1",
]

[project.urls]
"Homepage" = "https://github.com/arcaai/hope"
"Repository" = "https://github.com/arcaai/hope"

[project.scripts]
nlp = "nlp.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nlp = ["py.typed", "*.yaml", "*.yml", "*.json"]

# Black configuration
[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
  \.eggs
  | \.git
  | \.mypy_cache
  | \.venv
  | build
  | dist
)/
'''

# mypy configuration
[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["transformers", "torch", "spacy", "passlib.*", "jose.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["symspellpy", "symspellpy.*"]
ignore_missing_imports = true
follow_untyped_imports = false

[[tool.mypy.overrides]]
module = ["prometheus_fastapi_instrumentator", "prometheus_fastapi_instrumentator.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["fitz", "fitz.*", "rapidocr_onnxruntime", "rapidocr_onnxruntime.*"]
ignore_missing_imports = true

# pytest configuration
[tool.pytest.ini_options]
minversion = "9.0"
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
markers = [
    "e2e: End-to-end tests requiring real NLP models (deselect with '-m \"not e2e\"')",
]

# Coverage configuration
[tool.coverage.run]
source = ["src/nlp"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/.*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstract",
]

# Ruff configuration
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*" = ["B011"]

[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "text"
version = "2.0.0"
description = "Multi-provider text generation service"
authors = [
    {name = "ARCA AI Team", email = "team@arcaai.com"}
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.12"
keywords = ["text-generation", "llm", "fastapi", "multi-provider"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.3",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.15.0",
    "httpx>=0.28.1",
    # `providers/pool.py` imports httpx2 DIRECTLY. It arrives
    # transitively via `openai>=3` (which migrated to it) while `anthropic` is
    # still on httpx — two structurally identical, NOT interchangeable client
    # libraries in one process. Depending on a transitive import for a direct
    # one is how that breaks silently on an unrelated bump.
    "httpx2>=2.10.0",
    # HTTP/2 for self-hosted upstreams (Lane A A-3). Without it
    # `httpx.AsyncClient(http2=True)` raises ImportError and the pool silently
    # degrades to HTTP/1.1 — the code is complete, this is the only gate.
    "h2>=4.1.0",
    "redis>=8.1.0,<9.0",
    "structlog>=25.5.0",
    "python-dotenv>=1.2.0",
    "orjson>=3.12.0",
    "sse-starlette>=3.4.8",
    "prometheus-client>=0.26.0",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "openai>=3.1.0,<4",
    "anthropic>=0.122.0",
    "google-genai>=2.18.1",
    "boto3>=1.43.72",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-httpx>=0.65b0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.44.0",
    "opentelemetry-instrumentation-logging>=0.65b0",
    # --- Shared runtime contracts ---
    "hope-runtime-models",
    # --- Shared env-file loader: NODE_ENV -> .env.<env>, host env wins ---
    "hope-env",
    # --- Shared OTel trace-propagation helper ---
    "hope-otel",
    # Async task/event envelope contract
    "hope-async-contract",
    "uuid7>=0.1.0",
]

[tool.uv.sources]
hope-runtime-models = { workspace = true }
hope-env = { workspace = true }
hope-otel = { workspace = true }
hope-async-contract = { workspace = true }

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "black>=26.1.0",
    "ruff>=0.16.3",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "boto3-stubs[bedrock-runtime,bedrock]>=1.43.72",
    "botocore-stubs>=1.43.67",
]

test = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "httpx>=0.28.1",
    "pytest-xdist>=3.8.0",
    "fakeredis[lua]>=2.37.0",
]

lint = [
    "black>=26.1.0",
    "ruff>=0.16.3",
    "mypy>=2.3.1",
    "boto3-stubs[bedrock-runtime,bedrock]>=1.43.72",
    "botocore-stubs>=1.43.67",
]

load = [
    "locust>=2.46.3",
]

[project.urls]
"Homepage" = "https://github.com/arcaai/hope"
"Repository" = "https://github.com/arcaai/hope"
"Bug Tracker" = "https://github.com/arcaai/hope/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
text = ["py.typed", "*.yaml", "*.yml", "*.json"]

# Black configuration
[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # Directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

# mypy configuration
[tool.mypy]
python_version = "3.11"
# text is editable-installed AND uses a src-layout namespace package, so mypy
# can resolve files under two module names ("src.text.*" vs "text.*").
# Pinning the package base to apps/text/src forces the single, installed name.
namespace_packages = true
explicit_package_bases = true
mypy_path = "apps/text/src"
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
# Test modules rely on pytest fixtures and many intentionally-untyped helpers;
# under the strict settings above they produce ~1k no-untyped-def diagnostics
# with no runtime value. Type-check production code only — pytest still runs the
# full suite (testpaths below) unchanged.
exclude = "/tests/"

[[tool.mypy.overrides]]
module = ["sse_starlette"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["uuid_extensions"]
ignore_missing_imports = true

# pytest configuration
[tool.pytest.ini_options]
minversion = "9.0"
# `pythonpath` is resolved relative to rootdir, i.e. relative to the checkout the
# suite was invoked from, and is applied at `pytest_load_initial_conftests` —
# earlier than anything that could import the service. That ordering is what makes
# a run inside a git worktree exercise THAT worktree's source instead of the
# primary checkout the conda env's `__editable__.*.pth` files point at.
# Measured 2026-08-30 from a worktree: without this, `import text` resolved to the
# PRIMARY checkout and the suite reported green for code it had not touched.
pythonpath = [
    "src",
    "../../packages/py-async-contract/src",
    "../../packages/py-env/src",
    "../../packages/py-otel/src",
    "../../packages/py-runtime-models/src",
    "../../scripts/pytest-support",
]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--cov=text",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "-m", "not e2e",
]
testpaths = ["src/text/tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
markers = [
    "e2e: End-to-end tests requiring real LLM providers (deselect with '-m \"not e2e\"')",
    # opt OUT of conftest's default `X-Tenant-Id` injection, for the
    # tests that assert the mandatory-header contract itself (an absent header
    # must reach the endpoint and get a 428).
    "no_default_tenant_header: send requests with no X-Tenant-Id (contract tests)",
]

# Coverage configuration
[tool.coverage.run]
source = ["src/text"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/.*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@abstract",
]

# Ruff configuration
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*" = ["B011"]

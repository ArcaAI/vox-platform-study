[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stt"
version = "2.0.0"
description = "High-availability Speech-to-Text service with multi-model support"
authors = [
    {name = "ARCA AI Team", email = "team@arcaai.com"}
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.12"
keywords = ["speech-to-text", "asr", "whisper", "fastapi", "dramatiq"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # --- Web framework ---
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.3",
    "python-multipart>=0.0.22",
    # --- Async support ---
    "aiofiles>=25.1.0",
    "asyncpg>=0.31.0",
    # --- Database (read-only) ---
    "sqlalchemy[asyncio]>=2.0.52",
    # --- Data validation ---
    "pydantic>=2.12.5",
    "pydantic-settings>=2.15.0",
    # --- HTTP client (API Gateway communication) ---
    "httpx>=0.28.1",
    # --- Task queue ---
    # NOTE: dramatiq 2.2.0 supports redis>=4.0,<9.0 — keep the redis cap in
    # lock-step with dramatiq's declared upper bound when bumping either.
    "dramatiq[redis]>=2.0.0",
    "redis[hiredis]>=8.1.0,<9.0",
    # --- Object storage ---
    # minio SDK backs both the `minio` and `aws_s3` providers (S3-compatible).
    "minio>=7.2.20",
    # Azure Blob Storage SDK backs the per-tenant `azure_blob` provider.
    "azure-storage-blob>=12.23.0",
    # --- Configuration ---
    "python-dotenv>=1.2.0",
    "pyyaml>=6.0.3",
    # --- Logging and observability ---
    "structlog>=25.5.0",
    "python-json-logger>=4.0.0",
    # --- Date / time / JSON / UUID ---
    "python-dateutil>=2.9.0",
    "orjson>=3.12.0",
    "uuid7>=0.1.0",
    # --- Monitoring ---
    "psutil>=7.2.2",
    "prometheus-client>=0.26.0",
    "prometheus-fastapi-instrumentator>=8.1.0",
    # --- OpenTelemetry ---
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.44.0",
    "opentelemetry-instrumentation>=0.65b0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-httpx>=0.65b0",
    "opentelemetry-instrumentation-logging>=0.65b0",
    # --- Core processing (imported top-level in batch_service & preprocessing) ---
    "numpy>=2.0.0",
    # --- Resampling (streaming preprocessor's core resample path — always
    # active whenever input sample rate != target rate) ---
    "scipy>=1.17.0",
    # --- Azure Speech SDK (cloud ASR engine, imported top-level in batch_service) ---
    "azure-cognitiveservices-speech>=1.51.1",
    # --- Cadence punctuation runtime compatibility (Gemma3 bidirectional mask path) ---
    "cadence-punctuation>=1.1.0",
    # --- Shared runtime contracts ---
    "hope-runtime-models",
    # --- Shared env-file loader: NODE_ENV -> .env.<env>, host env wins ---
    "hope-env",
    # --- Shared OTel trace-propagation helper ---
    "hope-otel",
]

[tool.uv.sources]
hope-runtime-models = { workspace = true }
hope-env = { workspace = true }
hope-otel = { workspace = true }

[project.optional-dependencies]
# ---------------------------------------------------------------------------
# ML / Inference extras
# ---------------------------------------------------------------------------
# Install with: pip install -e ".[ml]" (CPU / Apple Silicon MPS)
#                pip install -e ".[ml-gpu]" (NVIDIA CUDA)
#
# IMPORTANT: pyannote.audio 4.x hard-pins torch==2.8.0, torchaudio==2.8.0.
# Do NOT upgrade torch past 2.8.x until pyannote releases a compatible version.
# torch 2.8.0 has full MPS (Apple Silicon) and CUDA support.
#
# CONDA-MANAGED PACKAGES (installed via conda, not pip):
#   ffmpeg 6.1.2, av 13.1.0, numpy 2.4.2, scipy 1.17.1, libiconv 1.18
# These are managed by conda to avoid native library symbol conflicts on macOS.
# See scripts/setup-python-env.sh for the authoritative install sequence.
# ---------------------------------------------------------------------------
ml = [
    # PyTorch — pinned to 2.8.x for pyannote.audio 4.x compatibility
    "torch>=2.8.0,<2.9.0",
    "torchaudio>=2.8.0,<2.9.0",
    # HuggingFace ecosystem
    "accelerate>=1.12.0",
    "safetensors>=0.7.0",
    "huggingface_hub>=0.28.0",
    # HuggingFace Optimum — ONNX model loading for multi-file models (Whisper ONNX)
    # Required: onnx-community/whisper-large-v3-turbo uses separate encoder/decoder ONNX
    # files and needs ORTModelForSpeechSeq2Seq from optimum to orchestrate them.
    # Audio I/O (lazy-imported in preprocessing & embedding_service)
    "soundfile>=0.13.1",
    "librosa>=0.11.0",
    "numba>=0.67.0",
    "scipy>=1.17.0",
    # ONNX Runtime — CPU (used for Whisper ONNX + Silero VAD)
    "onnxruntime>=1.28.0",
    # RNNoise noise suppression (requires 48kHz, 480-sample frames)
    "pyrnnoise>=0.4.0",
    # Speaker diarization — pyannote embedding extraction
    # NOTE: pyannote.audio 4.x pins torch==2.8.0 and torchaudio==2.8.0 internally
    "pyannote.audio>=3.3.0",
    # SpeechBrain
    "speechbrain>=1.0.0",
    # omegaconf — required by pyannote.audio for model config loading
    "omegaconf>=2.3.1",
    # torchcodec — pulled in by pyannote.audio; must match torch version.
    # torch 2.8.x requires torchcodec 0.6.x or 0.7.x (0.10+ needs torch 2.10).
    # Requires FFmpeg 6.x installed via conda (torchcodec links libavutil.58).
    "torchcodec>=0.6.0,<0.8.0",
    "optimum==2.1.0",
    "transformers==5.5.4",
    "torchvision>=0.23.0,<0.24.0",
    # faster-whisper / CTranslate2 ASR engine.
    # Lazy-imported in stt.models.faster_whisper_loader — only needed at
    # runtime for pipelines with `engine: faster_whisper`.
    "faster-whisper==1.2.1",
    # whisper.cpp ASR engine. Prebuilt manylinux + macOS wheels,
    # no torch dependency. Lazy-imported in stt.models.whisper_cpp_loader.
    "pywhispercpp>=1.5.0",
    # NOTE: DeepFilterNet3 (deepfilternet) is intentionally NOT installed.
    # Its latest release (0.5.6) hard-pins numpy>=1.22,<2.0 and packaging<24.0,
    # which are incompatible with this stack's numpy 2.x (torch 2.8, scipy 1.17,
    # librosa) — pip cannot resolve it and it has no numpy-2.x release upstream.
    # rnnoise (pyrnnoise, above) is the frame-accurate default denoise engine;
    # the `deepfilternet3` engine option degrades gracefully to a no-op with a
    # warning when the package is absent (see preprocessing.py /
    # streaming/deepfilternet_denoiser.py). Re-add here only if a numpy-2.x
    # compatible deepfilternet ships upstream.
]

nemo = [
    "nemo_toolkit[asr]>=2.7.2,<3.0.0",
    # Keep the fork: ml/guardrail stay on numba 0.67 / onnxruntime 1.28.
    # A fresh uv resolve otherwise unifies the conflicting extras onto 0.67 / 1.28.
    "numba>=0.66.0,<0.67.0",
    "onnxruntime>=1.27.0,<1.28.0",
    # Nemo extra previously locked torch 2.12.x. A fresh resolve picks 2.13,
    # which is the optional P6 ML bump — pin the prior line so pyannote's
    # ml extra (torch 2.8) and this extra stay split without taking 2.13.
    "torch>=2.12.0,<2.13.0",
]

# GPU variant — identical to ml but swaps onnxruntime for onnxruntime-gpu.
# Use self-referencing extra to avoid duplication (PEP 685).
ml-gpu = [
    "stt[ml]",
    # Override: GPU-accelerated ONNX Runtime (replaces CPU onnxruntime). CUDA-only
    # — no macOS wheels exist, so this is Linux-gated (dev machines are darwin).
    "onnxruntime-gpu>=1.28.0; sys_platform == 'linux'",
    # Flash Attention 2 — faster attention for Whisper on CUDA GPUs (Ampere+).
    # CUDA-only (Linux-gated, same reasoning as onnxruntime-gpu above).
    "flash-attn>=2.8.3; sys_platform == 'linux'",
]

# ---------------------------------------------------------------------------
# Development extras
# ---------------------------------------------------------------------------
dev = [
    # Linting & formatting
    "black>=26.1.0",
    "ruff>=0.16.3",
    "mypy>=2.3.1",
    # Type stubs for mypy strict checking (used by py:stt:typecheck)
    "types-PyYAML>=6.0.12.20260815",
    "types-psutil>=7.0.0",
    # Pre-commit hooks
    "pre-commit>=4.6.2",
]

test = [
    # Test runner & plugins
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "pytest-xdist>=3.8.0",
    # Test utilities
    "testcontainers>=4.15.0",
    "freezegun>=1.5.0",
    "soundfile>=0.13.1",
]

[project.urls]
"Homepage" = "https://github.com/arcaai/hope"
"Documentation" = "https://docs.arcaai.com/stt"
"Repository" = "https://github.com/arcaai/hope"

[project.scripts]
stt = "stt.main:main"
stt-worker = "stt.worker:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stt = ["py.typed", "*.yaml", "*.yml", "*.json"]

# Black configuration
[tool.black]
line-length = 100
target-version = ["py311", "py312", "py313"]
include = '\.pyi?$'
extend-exclude = '''
/(
  \.eggs
  | \.git
  | \.mypy_cache
  | \.venv
  | build
  | dist
)/
'''

# mypy configuration
[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true

# Third-party ML / audio / infra packages that ship no type stubs or py.typed
# marker. `pnpm py:stt:typecheck` loads this config via `--config-file`, so
# these overrides apply and silence the otherwise-missing imports. Packages that
# now have real stubs installed (PyYAML -> types-PyYAML, psutil -> types-psutil)
# are intentionally NOT listed here so mypy type-checks their usage against the
# stubs.
[[tool.mypy.overrides]]
module = ["transformers", "torch", "torchaudio", "soundfile", "librosa", "scipy.*", "minio", "dramatiq", "nemo_toolkit", "nemo", "nemo.*", "pyannote.*", "azure.*", "speechbrain.*", "optimum.*", "pyrnnoise", "onnxruntime", "cadence", "accelerate", "flash_attn", "faster_whisper", "pywhispercpp", "pywhispercpp.*", "_pywhispercpp", "deepfilterlib", "df", "df.*"]
ignore_missing_imports = true

# pytest configuration
[tool.pytest.ini_options]
minversion = "9.0"
# `pythonpath` is resolved relative to rootdir, i.e. relative to the checkout the
# suite was invoked from, and is applied at `pytest_load_initial_conftests` —
# earlier than anything that could import the service. That ordering is what makes
# a run inside a git worktree exercise THAT worktree's source instead of the
# primary checkout the conda env's `__editable__.*.pth` files point at.
# `scripts/pytest-support` carries the guard that proves it held; see
# scripts/pytest-support/hope_worktree_guard.py.
pythonpath = [
    "src",
    "../../packages/py-env/src",
    "../../packages/py-otel/src",
    "../../packages/py-runtime-models/src",
    "../../scripts/pytest-support",
]
# Note: Coverage options moved to Makefile/CI to avoid requiring pytest-cov for basic test runs
# Use `make test-cov` or `pytest --cov=stt` when coverage is needed
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# pytest-asyncio configuration
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: Unit tests (fast, no external deps)",
    "integration: Integration tests (requires containers)",
    "e2e: End-to-end tests (full system)",
    "slow: Slow tests (model loading, etc.)",
    "asyncio: Async tests (handled by pytest-asyncio)",
    # Platform-specific markers
    "cpu: Tests that run on CPU only",
    "gpu: Tests that require any GPU (CUDA or MPS)",
    "cuda: Tests that require NVIDIA CUDA GPU",
    "mps: Tests that require Apple Silicon MPS",
    "apple_silicon: Tests specific to Apple Silicon platform",
    "ml: Tests that require ML dependencies (torch, etc.)",
]

# Coverage configuration
[tool.coverage.run]
source = ["src/stt"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/.*",
    # Infrastructure modules requiring real services or ML libraries
    "src/stt/models/huggingface_loader.py",
    "src/stt/models/nemo_loader.py",
    "src/stt/models/onnx_loader.py",
    "src/stt/transcription/batch_service.py",
    "src/stt/transcription/preprocessing.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstract",
    # ML library imports that require torch/nemo/onnx/optimum
    "import torch",
    "from torch",
    "import nemo",
    "from nemo",
    "import onnx",
    "from onnx",
    "import optimum",
    "from optimum",
]

# Ruff configuration
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*" = ["B011", "E402"]

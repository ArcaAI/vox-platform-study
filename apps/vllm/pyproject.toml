[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hope-vllm"
version = "0.1.0"
description = "Stateless Whisper decode service on vLLM continuous batching (TASK-1010 spike)"
authors = [
    {name = "ARCA AI Team", email = "team@arcaai.com"}
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.12"
keywords = ["speech-to-text", "asr", "whisper", "vllm", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Framework :: FastAPI",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# The SERVICE shell only. Everything here imports on a Mac in the shared conda
# env `arcaenv`; the engine itself (`vllm`) is the `[vllm]` extra below and is
# imported LAZILY by `hope_vllm.engine.vllm_backend`, so the app and its unit
# tests never need it.
dependencies = [
    "fastapi>=0.133.0",
    "uvicorn[standard]>=0.52.3",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.15.0",
    "numpy>=2.0.0",
    "httpx>=0.28.1",
    "prometheus-client>=0.26.0",
    "prometheus-fastapi-instrumentator>=8.1.0",
    # Push invalidation of platform settings (`arca:config:invalidate`); absent = TTL only.
    "redis>=8.1.0,<9.0",
    # Registry-first weight fetch (OD-7): snapshot_download with the registry credential.
    # Also a vLLM dependency; declared because this service imports it directly.
    "huggingface-hub>=0.34.0",
    # --- Shared env-file loader: NODE_ENV -> .env.<env>, host env wins ---
    "hope-env",
    # --- Shared logging & tracing runtime (TASK-987) ---
    "hope-obs",
]

[tool.uv.sources]
# PATH sources, not `workspace = true`: this service is deliberately NOT a member
# of the root uv workspace (vLLM pins fastapi<0.137 and torch==2.13.0, which the
# shared lock cannot hold next to the other services — see README).
hope-env = { path = "../../packages/py-env" }
hope-obs = { path = "../../packages/py-obs" }

[tool.uv]
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'"]

[project.optional-dependencies]
# The engine. Linux + CUDA only (vLLM publishes manylinux wheels only), and it
# hard-pins its own torch/transformers/fastapi — see the README "Dependency
# isolation" section for why this service is NOT a member of the root uv
# workspace. Installed by apps/vllm/Dockerfile on top of the pinned
# `vllm/vllm-openai` image, never into `arcaenv`.
vllm = [
    "vllm==0.30.0; sys_platform == 'linux'",
]

dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "black>=26.1.0",
    "ruff>=0.16.3",
    "mypy>=2.3.1",
]

test = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "httpx>=0.28.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hope_vllm = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
namespace_packages = true
explicit_package_bases = true
mypy_path = "apps/vllm/src"
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
exclude = "/tests/"

[[tool.mypy.overrides]]
# The engine is not installed where mypy runs (Mac, `arcaenv`); it is imported
# lazily and only on Linux + CUDA. `pynvml` is vLLM's own `nvidia-ml-py` dependency,
# imported lazily by the backend to size engines against the device (TASK-1021).
module = ["vllm", "vllm.*", "pynvml"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["prometheus_fastapi_instrumentator", "prometheus_fastapi_instrumentator.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "9.0"
# Same provenance contract as every other service: `pythonpath` is applied at
# `pytest_load_initial_conftests`, so a run from a git worktree imports THAT
# worktree's source rather than the primary checkout the conda env's editable
# `.pth` files point at. `tests/conftest.py` proves it held.
pythonpath = [
    "src",
    "../../packages/py-env/src",
    "../../packages/py-obs/src",
    "../../scripts/pytest-support",
]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
]
testpaths = ["src/hope_vllm/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/hope_vllm"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008", "C901"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*" = ["B011"]

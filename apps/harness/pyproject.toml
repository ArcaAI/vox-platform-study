[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harness"
version = "0.1.0"
description = "Clinical Documentation Harness orchestrator (TASK-330) — bounded guides→generate→sensors→gate loop on Temporal"
authors = [
    {name = "ARCA AI Team", email = "team@arcaai.com"}
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.12"
keywords = ["clinical", "harness", "temporal", "fastapi", "durable-workflow"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.3",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.15.0",
    "httpx>=0.28.1",
    "structlog>=25.5.0",
    "python-dotenv>=1.2.0",
    "orjson>=3.12.0",
    "jsonschema>=4.23.0",   # SOAP json_schema validation (sensors.computational.schema_validity)
    # `[opentelemetry]` extra pulls opentelemetry-sdk (already listed explicitly
    # below) so `temporalio.contrib.opentelemetry.TracingInterceptor` is available
    # (workflow/activity trace spans).
    "temporalio[opentelemetry]>=1.31.0",
    "prometheus-client>=0.26.0",
    "prometheus-fastapi-instrumentator>=8.1.0",
    # These were previously dropped (no TracerProvider was ever constructed; only the
    # bare API remained for the inert `_add_otel_context` structlog processor in
    # core/logging.py). Later work re-adds the SDK/exporter/instrumentation
    # packages: `core/observability.py` is now the consumer that installs a
    # TracerProvider (default OFF) for both the FastAPI app and the
    # Temporal worker process.
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.44.0",
    # Claim-check payload offload: S3BlobStore keeps large workflow
    # payloads out of Temporal history. Lazy-imported (claim_check.py, inside
    # S3BlobStore only) and gated behind HARNESS_CLAIM_CHECK_STORE=s3 (default
    # `memory`), but promoted to a base dep so the production S3 path is always
    # installable without an extra — matching the text base-dep precedent.
    "boto3>=1.43.72",
    # --- Shared runtime contracts ---
    "hope-runtime-models",
    # --- Shared env-file loader: NODE_ENV -> .env.<env>, host env wins ---
    "hope-env",
]

[tool.uv.sources]
hope-runtime-models = { workspace = true }
hope-env = { workspace = true }

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "black>=26.1.0",
    "ruff>=0.16.3",
    "mypy>=2.3.1",
    # Type stubs consumed by strict mypy (jsonschema validator + the lazy
    # boto3/botocore Bedrock judge backend in eval.judge.providers).
    "types-jsonschema>=4.26.0",
    "boto3-stubs[bedrock-runtime,bedrock]>=1.43.72",
    "botocore-stubs>=1.43.67",
    "pre-commit>=4.6.2",
]

test = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "httpx>=0.28.1",
    "pytest-xdist>=3.8.0",
]

# Optional self-hosted MiniCheck-Flan-T5 GGUF entailer for the atomic-fact verifier
# (owner directive 2026-07-11 — GGUF/llama.cpp). OPTIONAL: the entailer
# lazy-imports llama_cpp and the verifier defaults to the model-free entailer, so base
# installs / CI skip it. Enable on a staging host with `uv sync --extra atomic-fact`
# (or `pip install '.[atomic-fact]'`) + set HARNESS_ATOMIC_FACT_MODEL_PATH.
atomic-fact = [
    "llama-cpp-python>=0.3.2",
]

# MCP external-tools client (official python SDK, streamable-HTTP
# transport). OPTIONAL: the whole MCP path is feature-flagged OFF (per-tenant
# HarnessPolicy.mcpToolsEnabled + per-server McpServer.enabled), and `mcp_client.py`
# lazy-imports the SDK so base installs / the hermetic test suite skip it. Enable on a
# host that talks to a registered MCP server with `uv sync --extra mcp-tools`
# (or `pip install '.[mcp-tools]'`).
mcp-tools = [
    "mcp>=2.0.0",
]

# Evaluation harness: PDSQI-9 LLM-as-judge, RAGAS-style
# faithfulness, DeepEval metric wrappers, and ICC/Gwet-AC2 calibration. Kept as
# an opt-in extra so the base service install stays slim and CI installs it
# explicitly for the eval gate (`pip install -e '.[test,eval]'`).
eval = [
    "numpy>=1.26",          # ICC(2,1) + Gwet AC2 reliability math
    "openai>=3.1.0,<4",    # LM Studio / vLLM (OpenAI-compatible) + Azure OpenAI judge
    "deepeval>=4.1.8,<5",   # Faithfulness / Hallucination / Summarization / GEval wrappers
    "boto3>=1.43.72",        # optional AWS Bedrock judge backend (imported lazily)
]

# RAGAS-the-library is OPTIONAL: the harness implements faithfulness RAGAS-*style*
# natively (claim decomposition + support check) with no langchain dependency.
# Installing ragas pulls the full langchain/langgraph stack, so it is isolated
# here and is NOT part of the CI eval gate.
eval-ragas = [
    "ragas>=0.4.3",
]

# Phase-2 guardrails: fail-closed PHI redaction (Presidio analyzer +
# anonymizer + a clinical spaCy NER recognizer). The Granite Guardian safety
# sensor speaks HTTP to a local Ollama, so it needs NO new dependency (it reuses
# httpx). Kept opt-in like `eval` so the base service install stays slim; presidio
# is imported lazily and the PHI guard fails CLOSED when it is absent. NOTE: this
# install does NOT pull a spaCy model — the PHI agent downloads the model it needs.
guardrails = [
    "presidio-analyzer>=2.2.364",
    "presidio-anonymizer>=2.2.364",
    "spacy>=3.8.15",
]

# Phase-3 institutional RAG: hybrid retrieval over a dedicated Qdrant
# `knowledge_chunks` collection. `qdrant-client` drives the named dense+sparse
# vectors and the Query API (prefetch + RRF fusion); `fastembed` produces the
# in-process Qdrant/bm25 sparse vectors (CPU, no extra service). Dense embeddings
# and the cross-encoder rerank are HTTP (LM Studio /v1/embeddings + a TEI
# reranker), so they need NO new dependency (they reuse httpx). Kept opt-in like
# `eval`/`guardrails` so the base service install stays slim; all RAG code is
# flag-gated (HARNESS_RETRIEVAL_ENABLED, default off) and degrade-safe.
rag = [
    "qdrant-client>=1.19.0",
    "fastembed>=0.4",
]

lint = [
    "black>=26.1.0",
    "ruff>=0.16.3",
    "mypy>=2.3.1",
    # Type stubs consumed by strict mypy (jsonschema validator + the lazy
    # boto3/botocore Bedrock judge backend in eval.judge.providers).
    "types-jsonschema>=4.26.0",
    "boto3-stubs[bedrock-runtime,bedrock]>=1.43.72",
    "botocore-stubs>=1.43.67",
]

[project.scripts]
harness-worker = "harness.temporal.worker:main"

[project.urls]
"Homepage" = "https://github.com/arcaai/hope"
"Repository" = "https://github.com/arcaai/hope"
"Bug Tracker" = "https://github.com/arcaai/hope/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
harness = ["py.typed", "*.yaml", "*.yml", "*.json"]

# Black configuration
[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # Directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

# mypy configuration
[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
# Test modules rely on pytest fixtures and many intentionally-untyped helpers;
# under the strict settings above they produce ~600 no-untyped-def diagnostics
# with no runtime value. Type-check production code only — pytest still runs the
# full suite (testpaths below) unchanged.
exclude = "/tests/"

# Optional 'mcp-tools' extra — the `mcp` SDK is lazily imported inside a
# try/except in tools/mcp_client.py and is absent unless the extra is installed.
[[tool.mypy.overrides]]
module = ["mcp", "mcp.*", "httpx2", "httpx2.*"]
ignore_missing_imports = true

# The remaining optional extras are all lazily imported behind flags/try-except and
# are absent from base installs (and from the hermetic CI suite), so mypy cannot
# resolve them. Each entry below maps to a declared [project.optional-dependencies]
# extra — never add an override here for a hard dependency, which would mask a real
# regression. `warn_unused_ignores` stays on, so an override that stops being needed
# surfaces as a diagnostic.

# 'rag' extra — qdrant-client + fastembed (guides/retrieval/*, eval/retrieval_eval.py).
[[tool.mypy.overrides]]
module = ["qdrant_client", "qdrant_client.*", "fastembed", "fastembed.*"]
ignore_missing_imports = true

# 'guardrails' extra — Presidio analyzer/anonymizer (guards/phi/redactor.py).
[[tool.mypy.overrides]]
module = [
    "presidio_analyzer",
    "presidio_analyzer.*",
    "presidio_anonymizer",
    "presidio_anonymizer.*",
]
ignore_missing_imports = true

# 'eval' extra — DeepEval metric wrappers (eval/metrics/deepeval_metrics.py).
[[tool.mypy.overrides]]
module = ["deepeval", "deepeval.*"]
ignore_missing_imports = true

# asyncpg — used ONLY by the offline eval gate's DB-resident judge selection
# (eval/judge/selection.py), where it is imported LAZILY so the harness SERVICE keeps its
# deliberate "no DB client" property (rule 06). asyncpg ships no py.typed marker.
[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true

# 'atomic-fact' extra — llama-cpp-python (sensors/inferential/minicheck_entailer.py).
# The submodule pattern is required: the entailer drives llama.cpp's encoder-decoder
# path via `llama_cpp._internals.LlamaBatch`, which the high-level completion API
# omits for T5 graphs. That private handle is version-sensitive by design and is
# validated end-to-end on the host by the fail-closed `verify_calibration()` gate.
[[tool.mypy.overrides]]
module = ["llama_cpp", "llama_cpp.*"]
ignore_missing_imports = true

# pytest configuration
[tool.pytest.ini_options]
minversion = "9.0"
# pythonpath lets pytest import `harness` from src/ without requiring an
# editable install (the service is also installed via `pip install -e` to
# mirror text/stt/nlp, but tests must work standalone too).
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--cov=harness",
    "--cov-report=term-missing",
    "-m", "not e2e",
]
testpaths = ["src/harness/tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
markers = [
    "e2e: End-to-end tests requiring a running Temporal server (deselect with '-m \"not e2e\"')",
    "integration: Integration tests requiring external services",
]

# Coverage configuration
[tool.coverage.run]
source = ["src/harness"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/.*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@abstract",
]

# Ruff configuration
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*" = ["B011"]

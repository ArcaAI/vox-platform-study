[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smr"
version = "2.0.0"
description = "Multi-provider text generation service"
authors = [
    {name = "ARCA AI Team", email = "team@arcaai.com"}
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.12"
keywords = ["text-generation", "llm", "fastapi", "multi-provider"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi>=0.133.0",
    "uvicorn[standard]>=0.41.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "httpx>=0.28.1",
    "redis>=5.2.0",
    "structlog>=25.5.0",
    "python-dotenv>=1.2.0",
    "orjson>=3.11.7",
    "sse-starlette>=3.2.0",
    "prometheus-client>=0.24.1",
    "prometheus-fastapi-instrumentator>=7.1.0",
    "openai>=2.24.0",
    "anthropic>=0.40.0",
    "google-genai>=1.0.0",
    "boto3>=1.42.0",
    "opentelemetry-api>=1.39.1",
    "opentelemetry-sdk>=1.39.1",
    "opentelemetry-instrumentation-fastapi>=0.60b1",
    "opentelemetry-instrumentation-httpx>=0.60b1",
    "opentelemetry-exporter-otlp-proto-grpc>=1.39.0",
    "opentelemetry-instrumentation-logging>=0.60b1",
    # --- Shared runtime contracts (TASK-529) ---
    "hope-runtime-models",
    # --- Shared env-file loader (TASK-558): NODE_ENV -> .env.<env>, host env wins ---
    "hope-env",
    # --- Shared OTel trace-propagation helper (TASK-636 OBS-16) ---
    "hope-otel",
]

[tool.uv.sources]
hope-runtime-models = { workspace = true }
hope-env = { workspace = true }
hope-otel = { workspace = true }

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "black>=26.1.0",
    "ruff>=0.15.7",
    "mypy>=1.19.1",
    "pre-commit>=4.5.1",
    "boto3-stubs[bedrock-runtime,bedrock]>=1.42.0",
    "botocore-stubs>=1.42.0",
]

test = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "httpx>=0.28.1",
    "pytest-xdist>=3.8.0",
    "fakeredis[lua]>=2.21.0",
]

lint = [
    "black>=26.1.0",
    "ruff>=0.15.7",
    "mypy>=1.19.1",
    "boto3-stubs[bedrock-runtime,bedrock]>=1.42.0",
    "botocore-stubs>=1.42.0",
]

load = [
    "locust>=2.32.0",
]

[project.urls]
"Homepage" = "https://github.com/arcaai/hope"
"Repository" = "https://github.com/arcaai/hope"
"Bug Tracker" = "https://github.com/arcaai/hope/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
smr = ["py.typed", "*.yaml", "*.yml", "*.json"]

# Black configuration
[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # Directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

# mypy configuration
[tool.mypy]
python_version = "3.11"
# smr is editable-installed AND uses a src-layout namespace package, so mypy
# can resolve files under two module names ("src.smr.*" vs "smr.*").
# Pinning the package base to apps/smr/src forces the single, installed name.
namespace_packages = true
explicit_package_bases = true
mypy_path = "apps/smr/src"
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
# Test modules rely on pytest fixtures and many intentionally-untyped helpers;
# under the strict settings above they produce ~1k no-untyped-def diagnostics
# with no runtime value. Type-check production code only — pytest still runs the
# full suite (testpaths below) unchanged.
exclude = "/tests/"

[[tool.mypy.overrides]]
module = ["sse_starlette"]
ignore_missing_imports = true

# pytest configuration
[tool.pytest.ini_options]
minversion = "9.0"
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--cov=smr",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "-m", "not e2e",
]
testpaths = ["src/smr/tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
markers = [
    "e2e: End-to-end tests requiring real LLM providers (deselect with '-m \"not e2e\"')",
]

# Coverage configuration
[tool.coverage.run]
source = ["src/smr"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/.*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@abstract",
]

# Ruff configuration
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*" = ["B011"]

[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stt-v2"
version = "2.0.0"
description = "High-availability Speech-to-Text service with multi-model support"
authors = [
    {name = "ARCA AI Team", email = "team@arcaai.com"}
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["speech-to-text", "asr", "whisper", "fastapi", "dramatiq"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # --- Web framework ---
    "fastapi>=0.133.0",
    "uvicorn[standard]>=0.41.0",
    "python-multipart>=0.0.22",
    # --- Async support ---
    "aiofiles>=25.1.0",
    "asyncpg>=0.31.0",
    # --- Database (read-only) ---
    "sqlalchemy[asyncio]>=2.0.47",
    # --- Data validation ---
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    # --- HTTP client (API Gateway communication) ---
    "httpx>=0.28.1",
    # --- Task queue ---
    # NOTE: dramatiq 2.0.x pins redis<7.0 — do NOT bump redis past 6.x
    # until dramatiq releases a version that supports redis-py 7+
    "dramatiq[redis]>=2.0.0",
    "redis[hiredis]>=5.2.0,<7.0",
    # --- Object storage ---
    "minio>=7.2.20",
    # --- Configuration ---
    "python-dotenv>=1.2.0",
    "pyyaml>=6.0.3",
    # --- Logging and observability ---
    "structlog>=25.5.0",
    "python-json-logger>=4.0.0",
    # --- Date / time / JSON / UUID ---
    "python-dateutil>=2.9.0",
    "orjson>=3.11.7",
    "uuid7>=0.1.0",
    # --- Monitoring ---
    "psutil>=7.2.2",
    "prometheus-client>=0.24.1",
    "prometheus-fastapi-instrumentator>=7.1.0",
    # --- OpenTelemetry ---
    "opentelemetry-api>=1.39.1",
    "opentelemetry-sdk>=1.39.1",
    "opentelemetry-exporter-otlp-proto-grpc>=1.39.0",
    "opentelemetry-instrumentation>=0.60b1",
    "opentelemetry-instrumentation-fastapi>=0.60b1",
    "opentelemetry-instrumentation-httpx>=0.60b1",
    "opentelemetry-instrumentation-logging>=0.60b1",
    # --- Core processing (imported top-level in batch_service & preprocessing) ---
    "numpy>=2.0.0",
    # --- Azure Speech SDK (cloud ASR engine, imported top-level in batch_service) ---
    "azure-cognitiveservices-speech>=1.47.0",
    # --- Qdrant (speaker embedding vector store, used by diarization) ---
    "qdrant-client>=1.13.0",
    # --- Cadence punctuation runtime compatibility (Gemma3 bidirectional mask path) ---
    "transformers>=4.57.6,<4.58.0",
    "cadence-punctuation>=1.1.0",
]

[project.optional-dependencies]
# ---------------------------------------------------------------------------
# ML / Inference extras
# ---------------------------------------------------------------------------
# Install with:  pip install -e ".[ml]"      (CPU / Apple Silicon MPS)
#                pip install -e ".[ml-gpu]"   (NVIDIA CUDA)
#
# IMPORTANT: pyannote.audio 4.x hard-pins torch==2.8.0, torchaudio==2.8.0.
# Do NOT upgrade torch past 2.8.x until pyannote releases a compatible version.
# torch 2.8.0 has full MPS (Apple Silicon) and CUDA support.
#
# CONDA-MANAGED PACKAGES (installed via conda, not pip):
#   ffmpeg 6.1.2, av 13.1.0, numpy 2.4.2, scipy 1.17.1, libiconv 1.18
# These are managed by conda to avoid native library symbol conflicts on macOS.
# See scripts/setup-python-env.sh for the authoritative install sequence.
# ---------------------------------------------------------------------------
ml = [
    # PyTorch — pinned to 2.8.x for pyannote.audio 4.x compatibility
    "torch>=2.8.0,<2.9.0",
    "torchaudio>=2.8.0,<2.9.0",
    # HuggingFace ecosystem
    "accelerate>=1.12.0",
    "safetensors>=0.7.0",
    "huggingface_hub>=0.28.0",
    # HuggingFace Optimum — ONNX model loading for multi-file models (Whisper ONNX)
    # Required: onnx-community/whisper-large-v3-turbo uses separate encoder/decoder ONNX
    # files and needs ORTModelForSpeechSeq2Seq from optimum to orchestrate them.
    "optimum[onnxruntime]>=2.1.0",
    # Audio I/O (lazy-imported in preprocessing & embedding_service)
    "soundfile>=0.13.1",
    "librosa>=0.11.0",
    "numba>=0.63.0",
    "scipy>=1.17.0",
    # ONNX Runtime — CPU (used for Whisper ONNX + Silero VAD)
    "onnxruntime>=1.23.0",
    # RNNoise noise suppression (requires 48kHz, 480-sample frames)
    "pyrnnoise>=0.4.0",
    # Speaker diarization — pyannote embedding extraction
    # NOTE: pyannote.audio 4.x pins torch==2.8.0 and torchaudio==2.8.0 internally
    "pyannote.audio>=3.3.0",
    # SpeechBrain
    "speechbrain>=1.0.0",
    # omegaconf — required by pyannote.audio for model config loading
    "omegaconf>=2.3.0",
    # torchcodec — pulled in by pyannote.audio; must match torch version.
    # torch 2.8.x requires torchcodec 0.6.x or 0.7.x (0.10+ needs torch 2.10).
    # Requires FFmpeg 6.x installed via conda (torchcodec links libavutil.58).
    "torchcodec>=0.6.0,<0.8.0",
]

# GPU variant — identical to ml but swaps onnxruntime for onnxruntime-gpu.
# Use self-referencing extra to avoid duplication (PEP 685).
ml-gpu = [
    "stt-v2[ml]",
    # Override: GPU-accelerated ONNX Runtime (replaces CPU onnxruntime)
    "onnxruntime-gpu>=1.23.0",
]

nemo = [
    # NVIDIA NeMo Parakeet family (requires separate CUDA setup)
    "nemo_toolkit[asr]>=2.6.0",
]

# ---------------------------------------------------------------------------
# Development extras
# ---------------------------------------------------------------------------
dev = [
    # Linting & formatting
    "black>=26.1.0",
    "ruff>=0.15.7",
    "mypy>=1.19.1",
    # Pre-commit hooks
    "pre-commit>=4.5.1",
]

test = [
    # Test runner & plugins
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "pytest-xdist>=3.8.0",
    # Test utilities
    "testcontainers>=4.14.0",
    "freezegun>=1.5.0",
]

[project.urls]
"Homepage" = "https://github.com/arcaai/hope"
"Documentation" = "https://docs.arcaai.com/stt-v2"
"Repository" = "https://github.com/arcaai/hope"

[project.scripts]
stt-v2 = "stt_v2.main:main"
stt-v2-worker = "stt_v2.worker:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stt_v2 = ["py.typed", "*.yaml", "*.yml", "*.json"]

# Black configuration
[tool.black]
line-length = 100
target-version = ["py311", "py312", "py313"]
include = '\.pyi?$'
extend-exclude = '''
/(
  \.eggs
  | \.git
  | \.mypy_cache
  | \.venv
  | build
  | dist
)/
'''

# mypy configuration
[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["transformers", "torch", "torchaudio", "soundfile", "librosa", "minio", "dramatiq", "nemo_toolkit", "pyannote.*", "qdrant_client.*", "azure.*", "speechbrain.*", "optimum.*"]
ignore_missing_imports = true

# pytest configuration
[tool.pytest.ini_options]
minversion = "9.0"
# Note: Coverage options moved to Makefile/CI to avoid requiring pytest-cov for basic test runs
# Use `make test-cov` or `pytest --cov=stt_v2` when coverage is needed
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# pytest-asyncio configuration
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: Unit tests (fast, no external deps)",
    "integration: Integration tests (requires containers)",
    "e2e: End-to-end tests (full system)",
    "slow: Slow tests (model loading, etc.)",
    "asyncio: Async tests (handled by pytest-asyncio)",
    # Platform-specific markers
    "cpu: Tests that run on CPU only",
    "gpu: Tests that require any GPU (CUDA or MPS)",
    "cuda: Tests that require NVIDIA CUDA GPU",
    "mps: Tests that require Apple Silicon MPS",
    "apple_silicon: Tests specific to Apple Silicon platform",
    "ml: Tests that require ML dependencies (torch, etc.)",
]

# Coverage configuration
[tool.coverage.run]
source = ["src/stt_v2"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/.*",
    # Infrastructure modules requiring real services or ML libraries
    "src/stt_v2/models/huggingface_loader.py",
    "src/stt_v2/models/nemo_loader.py",
    "src/stt_v2/models/onnx_loader.py",
    "src/stt_v2/transcription/batch_service.py",
    "src/stt_v2/transcription/preprocessing.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstract",
    # ML library imports that require torch/nemo/onnx/optimum
    "import torch",
    "from torch",
    "import nemo",
    "from nemo",
    "import onnx",
    "from onnx",
    "import optimum",
    "from optimum",
]

# Ruff configuration
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*" = ["B011", "E402"]

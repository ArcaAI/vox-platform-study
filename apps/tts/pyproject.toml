[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tts"
version = "0.1.0"
description = "Realtime multi-provider text-to-speech service (English + Malayalam)"
authors = [
    {name = "ARCA AI Team", email = "team@arcaai.com"}
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.12"
keywords = ["text-to-speech", "tts", "fastapi", "multi-provider", "malayalam"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.3",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.15.0",
    "httpx>=0.28.1",
    "structlog>=25.5.0",
    "python-dotenv>=1.2.0",
    "orjson>=3.12.0",
    "sse-starlette>=3.4.8",
    "prometheus-client>=0.26.0",
    "prometheus-fastapi-instrumentator>=8.1.0",
    # Config-invalidation subscriber ONLY (owner decision D-5). tts subscribes to
    # `arca:config:invalidate` and evicts a cache; it reads no keys, writes none,
    # and holds no tenant state — this must not become a route to local tenant
    # resolution. Version range matches `apps/guardrail`, which uses it the same
    # way, so the shared `uv.lock` resolves one redis for the workspace.
    "redis>=8.1.0,<9.0",
    "pysbd>=0.3.4",
    "azure-cognitiveservices-speech>=1.51.1",
    # `minio` backs the `s3://` model-source scheme
    # `tts/models/source_resolver.py`), used by the Indic Parler / IndicF5
    # local-mirror overrides. Imported LAZILY inside `_make_s3_client`, so a
    # deployment that never resolves an `s3://` source never imports it.
    "minio>=7.2.20",
    # --- Shared runtime contracts ---
    "hope-runtime-models",
    # --- Shared env-file loader: NODE_ENV -> .env.<env>, host env wins ---
    "hope-env",
    # --- OpenTelemetry tracing ---
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-httpx>=0.65b0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.44.0",
    "opentelemetry-instrumentation-logging>=0.65b0",
]

[tool.uv.sources]
hope-runtime-models = { workspace = true }
hope-env = { workspace = true }

[project.optional-dependencies]
# --- Self-hosted local engines, split by engine ---
#
# `kokoro` is BUILT INTO the default image (see apps/tts/Dockerfile): it is
# Apache-2.0, needs no credential, and the SYSTEM TenantTtsConfig row already
# routes English to it. Everything Kokoro needs at import/synth time lives here:
#   - kokoro -> the engine (transitively pulls torch, transformers,
#                        numpy, huggingface-hub, misaki[en]/spacy — `transformers`
#                        is a HARD dependency of kokoro 0.9.x, not separable)
#   - numpy / soxr -> tts.core.audio (imported at module scope by the provider)
#   - lameenc -> tts.core.audio MP3 encoding
# torch is listed explicitly so the CPU-only wheel index in the Dockerfile has a
# direct requirement to pin against.
kokoro = [
    "torch>=2.4.0",
    "kokoro>=0.9.4",
    "numpy>=1.26.0",
    "soxr>=0.5.0",
    "lameenc>=1.7.0",
]

# Indic Parler-TTS (Malayalam). NOT in the default image — it adds the
# sentencepiece/accelerate tail on top of a much larger weight set, so it is
# installed by the `[indic-parler]` image VARIANT
# (`docker build --build-arg TTS_EXTRAS="--extra indic-parler"`).
# `parler-tts` is not on PyPI; TASK-860 pins it to a git TAG so the shared
# `uv.lock` records one commit (uv resolves git sources). The ai4bharat
# weights are HF-gated — the publisher mirrors them into the bucket
# (OD-7 licence acceptance). `transformers` is pinned here as a direct
# requirement because indic_parler uses it directly.
indic-parler = [
    "transformers>=4.46.1",
    "sentencepiece>=0.2.2",
    "accelerate>=1.0.0",
    "parler-tts @ git+https://github.com/huggingface/parler-tts.git@v0.2.2",
]

# Back-compat aggregate: everything local. Kept so `--extra local` in existing
# scripts/envs keeps meaning "all self-hosted engines".
local = [
    "tts[kokoro]",
    "tts[indic-parler]",
]

dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "black>=26.1.0",
    "ruff>=0.16.3",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
]

test = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "httpx>=0.28.1",
    "pytest-xdist>=3.8.0",
    # Audio post-processing utils are exercised by the hermetic suite (the local
    # providers import core/audio); the ML model libs stay in [local] (mocked).
    "numpy>=1.26.0",
    "soxr>=0.5.0",
    "lameenc>=1.7.0",
]

lint = [
    "black>=26.1.0",
    "ruff>=0.16.3",
    "mypy>=2.3.1",
]

[project.urls]
"Homepage" = "https://github.com/arcaai/hope"
"Repository" = "https://github.com/arcaai/hope"
"Bug Tracker" = "https://github.com/arcaai/hope/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tts = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
namespace_packages = true
explicit_package_bases = true
mypy_path = "apps/tts/src"
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
exclude = "/tests/"

[[tool.mypy.overrides]]
# No type stubs published (pysbd, soxr) or GPU-only optional [local] deps not
# installed in the mypy-scanning env (lameenc, kokoro, azure speech SDK, parler_tts).
module = [
    "pysbd",
    "soxr",
    "lameenc",
    "kokoro",
    "azure",
    "azure.cognitiveservices",
    "azure.cognitiveservices.speech",
    "parler_tts",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# `minio` (`tts/models/source_resolver.py`) ships no inline types.
module = ["minio", "minio.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "9.0"
# `pythonpath` is resolved relative to rootdir, i.e. relative to the checkout the
# suite was invoked from, and is applied at `pytest_load_initial_conftests` —
# earlier than anything that could import the service. That ordering is what makes
# a run inside a git worktree exercise THAT worktree's source instead of the
# primary checkout the conda env's `__editable__.*.pth` files point at.
# `scripts/pytest-support` carries the guard that proves it held; see
# scripts/pytest-support/hope_worktree_guard.py.
pythonpath = [
    "src",
    "../../packages/py-env/src",
    "../../packages/py-runtime-models/src",
    "../../scripts/pytest-support",
]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--cov=tts",
    "--cov-report=term-missing",
    "-m", "not e2e",
]
testpaths = ["src/tts/tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
markers = [
    "e2e: End-to-end tests requiring real providers (deselect with '-m \"not e2e\"')",
]

[tool.coverage.run]
source = ["src/tts"]
omit = ["*/tests/*", "*/test_*", "*/__pycache__/*", "*/.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008", "C901"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*" = ["B011"]

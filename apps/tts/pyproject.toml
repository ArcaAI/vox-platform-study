[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tts"
version = "0.1.0"
description = "Realtime multi-provider text-to-speech service (English + Malayalam)"
authors = [
    {name = "ARCA AI Team", email = "team@arcaai.com"}
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.12"
keywords = ["text-to-speech", "tts", "fastapi", "multi-provider", "malayalam"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi>=0.133.0",
    "uvicorn[standard]>=0.41.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "httpx>=0.28.1",
    "structlog>=25.5.0",
    "python-dotenv>=1.2.0",
    "orjson>=3.11.7",
    "sse-starlette>=3.2.0",
    "prometheus-client>=0.24.1",
    "prometheus-fastapi-instrumentator>=7.1.0",
    "pysbd>=0.3.4",
    "azure-cognitiveservices-speech>=1.42.0",
    # --- Shared runtime contracts (TASK-529) ---
    "hope-runtime-models",
    # --- Shared env-file loader (TASK-558): NODE_ENV -> .env.<env>, host env wins ---
    "hope-env",
    # --- OpenTelemetry tracing (TASK-636 OBS-13) ---
    "opentelemetry-api>=1.39.1",
    "opentelemetry-sdk>=1.39.1",
    "opentelemetry-instrumentation-fastapi>=0.60b1",
    "opentelemetry-instrumentation-httpx>=0.60b1",
    "opentelemetry-exporter-otlp-proto-grpc>=1.39.0",
    "opentelemetry-instrumentation-logging>=0.60b1",
]

[tool.uv.sources]
hope-runtime-models = { workspace = true }
hope-env = { workspace = true }

[project.optional-dependencies]
# Self-hosted local engines (Phase 4). Kept OUT of the base install so the
# default image + CI stay light; enabled only on GPU-capable deployments.
# NOTE: `parler-tts` installs from git (not on PyPI) — it is added in the
# GPU image build, not here, so the shared `uv.lock` stays resolvable.
local = [
    "torch>=2.4.0",
    "transformers>=4.46.1",
    "kokoro>=0.9.4",
    "numpy>=1.26.0",
    "soxr>=0.5.0",
    "sentencepiece>=0.2.0",
    "accelerate>=1.0.0",
    "lameenc>=1.7.0",
]

dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "black>=26.1.0",
    "ruff>=0.15.7",
    "mypy>=1.19.1",
    "pre-commit>=4.5.1",
]

test = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "httpx>=0.28.1",
    "pytest-xdist>=3.8.0",
    # Audio post-processing utils are exercised by the hermetic suite (the local
    # providers import core/audio); the ML model libs stay in [local] (mocked).
    "numpy>=1.26.0",
    "soxr>=0.5.0",
    "lameenc>=1.7.0",
]

lint = [
    "black>=26.1.0",
    "ruff>=0.15.7",
    "mypy>=1.19.1",
]

[project.urls]
"Homepage" = "https://github.com/arcaai/hope"
"Repository" = "https://github.com/arcaai/hope"
"Bug Tracker" = "https://github.com/arcaai/hope/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tts = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
namespace_packages = true
explicit_package_bases = true
mypy_path = "apps/tts/src"
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
exclude = "/tests/"

[[tool.mypy.overrides]]
# No type stubs published (pysbd, soxr) or GPU-only optional [local] deps not
# installed in the mypy-scanning env (lameenc, kokoro, azure speech SDK, parler_tts).
module = [
    "pysbd",
    "soxr",
    "lameenc",
    "kokoro",
    "azure",
    "azure.cognitiveservices",
    "azure.cognitiveservices.speech",
    "parler_tts",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "9.0"
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--cov=tts",
    "--cov-report=term-missing",
    "-m", "not e2e",
]
testpaths = ["src/tts/tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
markers = [
    "e2e: End-to-end tests requiring real providers (deselect with '-m \"not e2e\"')",
]

[tool.coverage.run]
source = ["src/tts"]
omit = ["*/tests/*", "*/test_*", "*/__pycache__/*", "*/.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008", "C901"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*" = ["B011"]

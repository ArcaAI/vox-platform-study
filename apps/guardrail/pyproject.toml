[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guardrail"
version = "1.0.0"
description = "AI-powered content safety service"
authors = [
    {name = "ARCA AI Team", email = "team@arcaai.com"}
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.12"
keywords = ["content-safety", "guardrail", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.3",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.15.0",
    "httpx>=0.28.1",
    "redis>=8.1.0,<9.0",
    "structlog>=25.5.0",
    "python-dotenv>=1.2.0",
    "prometheus-client>=0.26.0",
    "prometheus-fastapi-instrumentator>=8.1.0",
    # OpenTelemetry tracing. Mirrors apps/text's dependency
    # set: guardrail auto-instruments FastAPI + httpx (the LM Studio/vLLM/
    # llama.cpp engine calls) and exports spans via OTLP/gRPC.
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-httpx>=0.65b0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.44.0",
    # Async DB access for per-tenant config resolution (mirrors STT).
    # SQLAlchemy has no `asyncpg` extra — the async driver must be declared explicitly.
    "sqlalchemy[asyncio]>=2.0.52",
    "asyncpg>=0.31.0",
    # NO ML RUNTIME. TASK-735 Phases 3 & 6 moved the GLiNER detector and the
    # MiniCheck GGUF scorer into `apps/nlp`, and weight staging went with them:
    # `gliner2-onnx`, `transformers`, `onnxruntime` and `minio` are all gone.
    # Guardrail is policy + HTTP now, and must stay that way (rule 06: "do not
    # grow a second inference stack").
    # --- Shared runtime contracts ---
    "hope-runtime-models",
    # --- Shared env-file loader: NODE_ENV -> .env.<env>, host env wins ---
    "hope-env",
]

[tool.uv.sources]
hope-runtime-models = { workspace = true }
hope-env = { workspace = true }

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "black>=26.1.0",
    "ruff>=0.16.3",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
]

test = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "httpx>=0.28.1",
    "fakeredis[lua]>=2.37.0",
]

# The `groundedness` extra is GONE (TASK-735 Phase 6): the MiniCheck GGUF and its
# llama-cpp-python dependency moved to `apps/nlp` with the weights.

lint = [
    "black>=26.1.0",
    "ruff>=0.16.3",
    "mypy>=2.3.1",
]

[project.urls]
"Homepage" = "https://github.com/arcaai/hope"
"Repository" = "https://github.com/arcaai/hope"
"Bug Tracker" = "https://github.com/arcaai/hope/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
guardrail = ["py.typed", "*.yaml", "*.yml", "*.json"]

# Black configuration
[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # Directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

# mypy configuration
[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
# Test modules rely on pytest fixtures and many intentionally-untyped helpers;
# under the strict settings above they produce many no-untyped-def diagnostics
# with no runtime value. Type-check production code only — pytest still runs the
# full suite (testpaths below) unchanged.
exclude = "/tests/"

[[tool.mypy.overrides]]

# `gliner2_onnx`, `llama_cpp*` and `minio` are gone with the models and the weight
# staging they served (TASK-735 Phases 3 & 6).
module = [
    "prometheus_client",
    "prometheus_fastapi_instrumentator",
]
ignore_missing_imports = true

# pytest configuration
[tool.pytest.ini_options]
minversion = "9.0"
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--cov=guardrail",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
testpaths = ["src/guardrail/tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"

# Coverage configuration
[tool.coverage.run]
source = ["src/guardrail"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/.*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@abstract",
]

# Ruff configuration
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports
"tests/**/*" = ["B011"]  # assert false

# ── Guardrail docker-compose (local dev / single-node) ───────────────────────
#
# Architecture:
#   guardrail  — FastAPI service (GLiNER ONNX + Ollama medical validation)
#   redis      — job queue + result cache
#
# Ollama is external (hope-ollama pod). Set OLLAMA_BASE_URL below.
# GLiNER model downloads from HuggingFace on first boot (~150 MB) and is
# cached in the `hf-cache` volume.
# ─────────────────────────────────────────────────────────────────────────────

services:
  guardrail:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    ports:
      - "8863:8863"
    volumes:
      # Persist the GLiNER ONNX model across restarts
      - hf-cache:/app/.hf-cache
    environment:
      # ── GLiNER ONNX (content safety / adversarial / PII) ─────────────────
      GUARDRAIL_GLINER_ENABLED: "true"
      GUARDRAIL_GLINER_MODEL_ID: hivetrace/gliner-guard-uniencoder-onnx
      GUARDRAIL_GLINER_PRECISION: fp32
      GUARDRAIL_GLINER_CLASSIFICATION_THRESHOLD: "0.4"
      GUARDRAIL_GLINER_PII_THRESHOLD: "0.5"
      GUARDRAIL_GLINER_MAX_WORKERS: "2"

      # ── Ollama (medical context validation only — external pod) ───────────
      GUARDRAIL_OLLAMA_ENABLED: "true"
      GUARDRAIL_OLLAMA_BASE_URL: http://hope-ollama:11434
      GUARDRAIL_OLLAMA_GUARDIAN_MODEL: hf.co/unsloth/medgemma-27b-text-it-GGUF:Q4_K_M
      GUARDRAIL_OLLAMA_GUARDIAN_ENABLED: "true"
      GUARDRAIL_OLLAMA_GUARDIAN_TEMPERATURE: "0.05"
      GUARDRAIL_OLLAMA_GUARDIAN_MAX_TOKENS: "300"
      GUARDRAIL_OLLAMA_GUARDIAN_MIN_CONFIDENCE: "0.75"
      GUARDRAIL_OLLAMA_TIMEOUT_S: "60"
      GUARDRAIL_OLLAMA_MAX_CONCURRENT: "4"

      # ── Redis ─────────────────────────────────────────────────────────────
      GUARDRAIL_REDIS_URL: redis://redis:6379/0
      GUARDRAIL_REDIS_TASK_TTL_SECONDS: "3600"
      GUARDRAIL_REDIS_STREAM_MAX_LEN: "10000"
      GUARDRAIL_REDIS_CACHE_TTL_SECONDS: "1800"

      # ── Application ───────────────────────────────────────────────────────
      GUARDRAIL_HOST: 0.0.0.0
      GUARDRAIL_PORT: "8863"
      GUARDRAIL_DEBUG: "false"
      GUARDRAIL_LOG_LEVEL: info
      GUARDRAIL_CORS_ENABLED: "true"
      GUARDRAIL_CORS_ORIGINS: '["http://localhost:3000","http://localhost:8080"]'

      # ── Connection pooling ────────────────────────────────────────────────
      GUARDRAIL_HTTPX_MAX_CONNECTIONS: "100"
      GUARDRAIL_HTTPX_MAX_KEEPALIVE: "50"

      # ── Observability ─────────────────────────────────────────────────────
      GUARDRAIL_METRICS_ENABLED: "true"
      GUARDRAIL_OTEL_ENABLED: "false"

      # ── Job queue ─────────────────────────────────────────────────────────
      GUARDRAIL_QUEUE_MAX_WAIT_S: "60.0"
      GUARDRAIL_QUEUE_MAX_RETRIES: "3"
      GUARDRAIL_QUEUE_RETRY_BACKOFF_S: "1.0"
      GUARDRAIL_QUEUE_BATCH_SIZE: "10"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - guardrail-network

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - guardrail-network

volumes:
  redis-data:
    driver: local
  hf-cache:
    driver: local

networks:
  guardrail-network:
    driver: bridge

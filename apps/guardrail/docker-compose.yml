# ── Guardrail docker-compose (local dev / single-node) ───────────────────────
#
# Architecture:
#   guardrail  — FastAPI service (policy only; every engine is delegated)
#   redis      — job queue + result cache
#
# Guardrail hosts NO model and NO LLM: medical validation posts to apps/text's
# judge lane, PII/groundedness to apps/nlp, and provider/model come from
# core."AiTaskDefault" per tenant. There is nothing here to point at an engine.
# ─────────────────────────────────────────────────────────────────────────────

services:
  guardrail:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    ports:
      - "8863:8863"
    environment:
      # ── Redis ─────────────────────────────────────────────────────────────
      GUARDRAIL_REDIS_REDIS_URL: redis://redis:6379/0

      # ── Application ───────────────────────────────────────────────────────
      # env_prefix is GUARDRAIL_V2_ for the root Settings; a bare GUARDRAIL_
      # name is silently ignored (which is what these all were).
      GUARDRAIL_V2_HOST: 0.0.0.0
      GUARDRAIL_V2_PORT: "8863"
      GUARDRAIL_V2_DEBUG: "false"
      GUARDRAIL_V2_LOG_LEVEL: info
      GUARDRAIL_V2_CORS_ENABLED: "true"
      GUARDRAIL_V2_CORS_ORIGINS: '["http://localhost:3000","http://localhost:8080"]'

      # ── Observability ─────────────────────────────────────────────────────
      GUARDRAIL_V2_METRICS_ENABLED: "true"
      GUARDRAIL_V2_OTEL_ENABLED: "false"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - guardrail-network

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - guardrail-network

volumes:
  redis-data:
    driver: local

networks:
  guardrail-network:
    driver: bridge

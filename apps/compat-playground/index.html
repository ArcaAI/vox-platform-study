<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>HOPE Compat Playground</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Apply the theme class BEFORE the first paint (the no-flash pattern
      next-themes implements for apps/admin-console; this is a plain Vite app,
      so it is spelled out here).

      This is not only about the flash. A class applied AFTER the first paint
      changes `--foreground` & friends on <html>, which starts a `color` /
      `background-color` transition on every @arcaai/ui primitive that carries
      `transition-all` or `transition-[color,box-shadow]`. Those transitions
      never advance — the element is never repainted — so the control keeps the
      previous theme's colour indefinitely (input text at ~1.03 contrast).
      Keep this script blocking and in <head>; `src/lib/use-theme.ts` adopts
      whatever class it leaves behind.
    -->
    <script>
      try {
        if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
          document.documentElement.classList.add('dark');
        }
      } catch {
        /* no matchMedia (very old browser / non-DOM host) — light is the default */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

# ============================================================================
# E2E Tests Workflow
# ============================================================================
# Runs end-to-end API tests using Playwright.
# Tests the full application stack with real services.
#
# Service Ports (same as local test infrastructure):
#   - PostgreSQL: 5433
#   - Redis: 6380
#
# Features:
#   - Path filtering to skip when only docs change
#   - Manual dispatch with configurable options
#   - Playwright trace and report artifacts
#   - Full stack testing with PostgreSQL and Redis
# ============================================================================

name: E2E Tests

on:
  # Called by CI orchestrator
  workflow_call:
    inputs:
      test-filter:
        description: 'Test file filter (e.g., auth.spec.ts)'
        required: false
        default: ''
        type: string
      retries:
        description: 'Number of retries for failed tests'
        required: false
        default: '2'
        type: string
      workers:
        description: 'Number of parallel workers'
        required: false
        default: '1'
        type: string
      skip-seed:
        description: 'Skip database seeding'
        required: false
        default: false
        type: boolean

  pull_request:
    branches: [main]
    paths:
      # API source files
      - 'apps/api/**/*.ts'
      - 'packages/**/*.ts'
      # E2E test files
      - 'apps/api/tests/e2e/**'
      - 'tests/**'
      # Config files
      - 'playwright.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      # Database schema
      - 'packages/database/**/*.prisma'
      # Workflow file itself
      - '.github/workflows/test-e2e.yml'
      - '.github/actions/**'

  push:
    branches: [main]
    paths:
      - 'apps/api/**/*.ts'
      - 'packages/**/*.ts'
      - 'apps/api/tests/e2e/**'
      - 'tests/**'
      - 'packages/database/**/*.prisma'

  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Test file filter (e.g., auth.spec.ts, rbac.spec.ts)'
        required: false
        default: ''
        type: string
      retries:
        description: 'Number of retries for failed tests'
        required: false
        default: '2'
        type: string
      workers:
        description: 'Number of parallel workers'
        required: false
        default: '1'
        type: string
      debug:
        description: 'Enable debug mode'
        required: false
        default: false
        type: boolean
      skip-seed:
        description: 'Skip database seeding'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================================
  # E2E API Tests
  # ==========================================================================
  e2e-tests:
    name: E2E API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: hope_test
          POSTGRES_INITDB_ARGS: '--encoding=UTF-8 --lc-collate=C --lc-ctype=C'
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U test -d hope_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
          --health-start-period 10s
          --shm-size 128mb

      redis:
        image: redis:8-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup test environment
        uses: ./.github/actions/setup-test-env
        with:
          database-port: '5433'
          redis-port: '6380'
          log-level: 'error'

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Build packages
        uses: ./.github/actions/build-packages
        with:
          include-modules: 'true'
          include-api: 'true'

      - name: Push database schema
        run: npx prisma db push --schema=packages/database/src/prisma/db_main --accept-data-loss

      - name: Seed test data
        if: ${{ !inputs.skip-seed }}
        run: pnpm seed
        continue-on-error: true

      - name: Start API server
        run: |
          pnpm start:api &
          echo "Waiting for API to start..."

      - name: Wait for API to be ready
        run: |
          for i in {1..60}; do
            if curl -s http://localhost:8868/api/v1/health > /dev/null 2>&1; then
              echo "API is ready!"
              exit 0
            fi
            echo "Waiting for API... ($i/60)"
            sleep 2
          done
          echo "API failed to start"
          exit 1

      - name: Run E2E tests
        run: |
          PLAYWRIGHT_ARGS="--reporter=list,html,json"

          # Add retries
          RETRIES="${{ inputs.retries || '2' }}"
          PLAYWRIGHT_ARGS="$PLAYWRIGHT_ARGS --retries=$RETRIES"

          # Add workers
          WORKERS="${{ inputs.workers || '1' }}"
          PLAYWRIGHT_ARGS="$PLAYWRIGHT_ARGS --workers=$WORKERS"

          # Add test filter if specified
          if [ -n "${{ inputs.test-filter }}" ]; then
            PLAYWRIGHT_ARGS="$PLAYWRIGHT_ARGS ${{ inputs.test-filter }}"
          fi

          # Add debug if enabled
          if [ "${{ inputs.debug }}" == "true" ]; then
            PLAYWRIGHT_ARGS="$PLAYWRIGHT_ARGS --debug"
          fi

          echo "Running: pnpm test:e2e $PLAYWRIGHT_ARGS"
          pnpm test:e2e $PLAYWRIGHT_ARGS

      - name: Generate test summary
        if: always()
        run: |
          echo "## E2E Tests Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f "test-results/results.json" ]; then
            PASSED=$(jq '.stats.expected // 0' test-results/results.json)
            FAILED=$(jq '.stats.unexpected // 0' test-results/results.json)
            SKIPPED=$(jq '.stats.skipped // 0' test-results/results.json)
            DURATION=$(jq '.stats.duration // 0' test-results/results.json)

            echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| ✅ Passed | $PASSED |" >> $GITHUB_STEP_SUMMARY
            echo "| ❌ Failed | $FAILED |" >> $GITHUB_STEP_SUMMARY
            echo "| ⏭️ Skipped | $SKIPPED |" >> $GITHUB_STEP_SUMMARY
            echo "| ⏱️ Duration | ${DURATION}ms |" >> $GITHUB_STEP_SUMMARY
          else
            echo "No test results found" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

      - name: Upload Playwright traces
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/artifacts/
          retention-days: 7

  # ==========================================================================
  # E2E Tests Summary
  # ==========================================================================
  e2e-summary:
    name: E2E Tests Summary
    runs-on: ubuntu-latest
    needs: [e2e-tests]
    if: always()

    steps:
      - name: Check test results
        run: |
          E2E_RESULT="${{ needs.e2e-tests.result }}"

          if [ "$E2E_RESULT" == "success" ]; then
            echo "✅ E2E tests passed"
          elif [ "$E2E_RESULT" == "skipped" ]; then
            echo "⏭️ E2E tests skipped"
          else
            echo "❌ E2E tests failed"
            exit 1
          fi

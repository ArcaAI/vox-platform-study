# ============================================================================
# Unit Tests Workflow
# ============================================================================
# Runs unit tests on every pull request and push to main branches.
# Unit tests are mostly isolated, but TypeScript tests that transitively
# import Prisma need a DATABASE_URL set (even if not connecting).
#
# Infrastructure modes:
#   1. Default — test-only env vars (no real DB connection needed for unit tests)
#   2. External infrastructure — when USE_EXTERNAL_TEST_DB=true, uses the
#      shared HA-Postgres & Redis for any tests that need a live connection.
#
# Features:
#   - Path filtering to skip when only docs change
#   - Manual dispatch with configurable options
#   - Coverage thresholds enforcement
#   - Parallel execution for TypeScript and Python
# ============================================================================

name: Unit Tests

on:
  # Called by CI orchestrator
  workflow_call:
    inputs:
      skip-typescript:
        description: 'Skip TypeScript tests'
        required: false
        default: false
        type: boolean
      skip-python:
        description: 'Skip Python tests'
        required: false
        default: false
        type: boolean
      coverage-threshold:
        description: 'Minimum coverage percentage (0-100)'
        required: false
        default: '90'
        type: string
      python-services:
        description: 'Python services to test (comma-separated)'
        required: false
        default: 'smr,stt-v2,tts,nlp'
        type: string

  pull_request:
    branches: [main, dev, 'feat/*', 'feature/*', 'maintenance/*']
    paths:
      # TypeScript/JavaScript source files
      - 'apps/api/**/*.ts'
      - 'packages/**/*.ts'
      - 'packages/**/*.tsx'
      # Python source files
      - 'apps/smr/**/*.py'
      - 'apps/stt-v2/**/*.py'
      - 'apps/tts/**/*.py'
      - 'apps/nlp/**/*.py'
      # Test files
      - 'tests/**/*.ts'
      - '**/tests/**'
      # Config files that affect tests
      - 'vitest.config.ts'
      - 'vitest.*.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '**/pyproject.toml'
      # Prisma schema
      - 'packages/database/**/*.prisma'
      # Workflow file itself
      - '.github/workflows/test-unit.yml'
      - '.github/actions/**'

  push:
    branches: [main, dev, 'maintenance/*']
    paths:
      - 'apps/api/**/*.ts'
      - 'packages/**/*.ts'
      - 'packages/**/*.tsx'
      - 'apps/smr/**/*.py'
      - 'apps/stt-v2/**/*.py'
      - 'apps/tts/**/*.py'
      - 'apps/nlp/**/*.py'
      - 'tests/**/*.ts'
      - '**/tests/**'

  workflow_dispatch:
    inputs:
      skip-typescript:
        description: 'Skip TypeScript tests'
        required: false
        default: false
        type: boolean
      skip-python:
        description: 'Skip Python tests'
        required: false
        default: false
        type: boolean
      coverage-threshold:
        description: 'Minimum coverage percentage (0-100)'
        required: false
        default: '90'
        type: string
      python-services:
        description: 'Python services to test (comma-separated: smr,stt-v2,tts,nlp)'
        required: false
        default: 'smr,stt-v2,tts,nlp'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COVERAGE_THRESHOLD: ${{ inputs.coverage-threshold || '90' }}

jobs:
  # ==========================================================================
  # TypeScript Unit Tests
  # ==========================================================================
  unit-tests-typescript:
    name: TypeScript Unit Tests
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip-typescript }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup test environment (external)
        if: vars.USE_EXTERNAL_TEST_DB == 'true'
        uses: ./.github/actions/setup-test-env
        with:
          use-external-db: 'true'
          external-pg-host: ${{ secrets.TEST_PG_HOST || '10.10.1.250' }}
          external-pg-port: ${{ secrets.TEST_PG_PORT || '5000' }}
          external-pg-user: ${{ secrets.TEST_PG_USER }}
          external-pg-password: ${{ secrets.TEST_PG_PASSWORD }}
          external-pg-database: ${{ secrets.TEST_PG_DB || 'vox_dev' }}
          external-redis-host: ${{ secrets.TEST_REDIS_HOST || '10.10.1.120' }}
          external-redis-port: ${{ secrets.TEST_REDIS_PORT || '6379' }}
          external-redis-password: ${{ secrets.TEST_REDIS_PASSWORD }}
          external-redis-db: ${{ secrets.TEST_REDIS_DB || '8' }}

      - name: Setup test environment (default)
        if: vars.USE_EXTERNAL_TEST_DB != 'true'
        uses: ./.github/actions/setup-test-env

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Build packages
        uses: ./.github/actions/build-packages

      - name: Run unit tests
        run: pnpm test:unit --coverage

      - name: Check coverage threshold
        run: |
          COVERAGE=$(cat coverage/coverage-summary.json 2>/dev/null | jq -r '.total.lines.pct // 0')
          echo "Coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < ${{ env.COVERAGE_THRESHOLD }}" | bc -l) )); then
            echo "::error::Coverage ${COVERAGE}% is below threshold ${{ env.COVERAGE_THRESHOLD }}%"
            exit 1
          fi
          echo "✅ Coverage ${COVERAGE}% meets threshold ${{ env.COVERAGE_THRESHOLD }}%"
        continue-on-error: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: unit-tests-typescript
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-unit-typescript
          path: coverage/
          retention-days: 7

  # ==========================================================================
  # Python Unit Tests (Matrix) - CPU Platform
  # ==========================================================================
  unit-tests-python:
    name: Python Unit Tests (${{ matrix.service }}) - CPU
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip-python }}

    strategy:
      fail-fast: false
      matrix:
        service: [smr, stt-v2, tts, nlp]

    defaults:
      run:
        working-directory: apps/${{ matrix.service }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check if service should be tested
        id: check-service
        run: |
          SERVICES="${{ inputs.python-services || 'smr,stt-v2,tts,nlp' }}"
          if [[ ",$SERVICES," == *",${{ matrix.service }},"* ]]; then
            echo "should-run=true" >> $GITHUB_OUTPUT
          else
            echo "should-run=false" >> $GITHUB_OUTPUT
            echo "Skipping ${{ matrix.service }} - not in selected services"
          fi
        working-directory: .

      - name: Setup Python and uv
        if: steps.check-service.outputs.should-run == 'true'
        uses: ./.github/actions/setup-python-uv
        with:
          working-directory: apps/${{ matrix.service }}

      - name: Run unit tests (CPU)
        if: steps.check-service.outputs.should-run == 'true'
        env:
          TEST_PLATFORM: cpu
        run: |
          if [ -d "tests/unit" ]; then
            # Use uv run to ensure correct environment
            # TEST_PLATFORM=cpu runs only CPU-compatible tests
            uv run pytest tests/unit -v \
              --cov=src \
              --cov-report=xml:coverage.xml \
              --cov-report=term-missing \
              || echo "::warning::Unit tests failed for ${{ matrix.service }}"
          else
            echo "No unit tests directory found for ${{ matrix.service }}"
          fi
        continue-on-error: true

      - name: Upload coverage
        if: steps.check-service.outputs.should-run == 'true'
        uses: codecov/codecov-action@v4
        with:
          files: apps/${{ matrix.service }}/coverage.xml
          flags: unit-tests-python-${{ matrix.service }}-cpu
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ==========================================================================
  # STT-v2 GPU Unit Tests (NVIDIA CUDA)
  # Runs on self-hosted GPU runner or skipped if not available
  # ==========================================================================
  unit-tests-stt-v2-gpu:
    name: STT-v2 Unit Tests - GPU (CUDA)
    runs-on: [self-hosted, gpu, cuda]
    if: ${{ !inputs.skip-python && contains(inputs.python-services || 'stt-v2', 'stt-v2') }}
    continue-on-error: true  # Don't fail the workflow if GPU runner not available

    defaults:
      run:
        working-directory: apps/stt-v2

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python and uv
        uses: ./.github/actions/setup-python-uv
        with:
          working-directory: apps/stt-v2

      - name: Install ML dependencies (GPU)
        run: uv pip install -e ".[ml-gpu]"

      - name: Verify CUDA availability
        run: |
          uv run python -c "import torch; print(f'CUDA available: {torch.cuda.is_available()}'); print(f'CUDA version: {torch.version.cuda}')"

      - name: Run GPU unit tests
        env:
          TEST_PLATFORM: cuda
        run: |
          uv run pytest tests/unit -v \
            --cov=src \
            --cov-report=xml:coverage-gpu.xml \
            --cov-report=term-missing

      - name: Upload GPU coverage
        uses: codecov/codecov-action@v4
        with:
          files: apps/stt-v2/coverage-gpu.xml
          flags: unit-tests-stt-v2-gpu
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ==========================================================================
  # STT-v2 Apple Silicon Unit Tests (macOS ARM64)
  # Runs on macOS ARM64 runner
  # ==========================================================================
  unit-tests-stt-v2-apple:
    name: STT-v2 Unit Tests - Apple Silicon (MPS)
    runs-on: macos-latest  # GitHub's macOS runners are ARM64 (M1/M2)
    if: ${{ !inputs.skip-python && contains(inputs.python-services || 'stt-v2', 'stt-v2') }}
    continue-on-error: true  # Don't fail if MPS not available

    defaults:
      run:
        working-directory: apps/stt-v2

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: pip install uv

      - name: Setup environment
        run: |
          uv venv --python 3.11
          uv pip install -e ".[test]"

      - name: Check platform
        run: |
          uv run python -c "
          import platform
          print(f'System: {platform.system()}')
          print(f'Machine: {platform.machine()}')
          try:
              import torch
              print(f'PyTorch: {torch.__version__}')
              print(f'MPS available: {torch.backends.mps.is_available()}')
          except ImportError:
              print('PyTorch not installed (expected for CPU tests)')
          "

      - name: Run Apple Silicon unit tests
        env:
          TEST_PLATFORM: mps
        run: |
          uv run pytest tests/unit -v \
            --cov=src \
            --cov-report=xml:coverage-apple.xml \
            --cov-report=term-missing \
            -m "not cuda"  # Skip CUDA-specific tests

      - name: Upload Apple Silicon coverage
        uses: codecov/codecov-action@v4
        with:
          files: apps/stt-v2/coverage-apple.xml
          flags: unit-tests-stt-v2-apple
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ==========================================================================
  # Unit Tests Summary
  # ==========================================================================
  unit-tests-summary:
    name: Unit Tests Summary
    runs-on: ubuntu-latest
    needs: [unit-tests-typescript, unit-tests-python, unit-tests-stt-v2-gpu, unit-tests-stt-v2-apple]
    if: always()

    steps:
      - name: Check test results
        run: |
          echo "## Unit Tests Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          TS_RESULT="${{ needs.unit-tests-typescript.result }}"
          PY_RESULT="${{ needs.unit-tests-python.result }}"
          GPU_RESULT="${{ needs.unit-tests-stt-v2-gpu.result }}"
          APPLE_RESULT="${{ needs.unit-tests-stt-v2-apple.result }}"

          echo "### Core Tests" >> $GITHUB_STEP_SUMMARY

          if [ "$TS_RESULT" == "success" ]; then
            echo "✅ TypeScript: Passed" >> $GITHUB_STEP_SUMMARY
          elif [ "$TS_RESULT" == "skipped" ]; then
            echo "⏭️ TypeScript: Skipped" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ TypeScript: $TS_RESULT" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$PY_RESULT" == "success" ]; then
            echo "✅ Python (CPU): Passed" >> $GITHUB_STEP_SUMMARY
          elif [ "$PY_RESULT" == "skipped" ]; then
            echo "⏭️ Python (CPU): Skipped" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Python (CPU): $PY_RESULT" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Platform-Specific Tests (STT-v2)" >> $GITHUB_STEP_SUMMARY

          if [ "$GPU_RESULT" == "success" ]; then
            echo "✅ GPU (CUDA): Passed" >> $GITHUB_STEP_SUMMARY
          elif [ "$GPU_RESULT" == "skipped" ]; then
            echo "⏭️ GPU (CUDA): Skipped (no GPU runner)" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ GPU (CUDA): $GPU_RESULT (non-blocking)" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$APPLE_RESULT" == "success" ]; then
            echo "✅ Apple Silicon (MPS): Passed" >> $GITHUB_STEP_SUMMARY
          elif [ "$APPLE_RESULT" == "skipped" ]; then
            echo "⏭️ Apple Silicon (MPS): Skipped" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Apple Silicon (MPS): $APPLE_RESULT (non-blocking)" >> $GITHUB_STEP_SUMMARY
          fi

          # Only fail if core tests failed (GPU/Apple are non-blocking)
          if [ "$TS_RESULT" == "failure" ] || [ "$PY_RESULT" == "failure" ]; then
            echo ""
            echo "❌ Core unit tests failed" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo ""
          echo "✅ All core unit tests passed" >> $GITHUB_STEP_SUMMARY

# ============================================================================
# Lint and Format Workflow
# ============================================================================
# Runs linting and formatting checks on pull requests.
# This is a fast check that should complete in under 2 minutes.
# ============================================================================

name: Lint & Format

on:
  # Called by CI orchestrator
  workflow_call:
    inputs:
      skip-typescript:
        description: 'Skip TypeScript linting'
        required: false
        default: false
        type: boolean
      skip-python:
        description: 'Skip Python linting'
        required: false
        default: false
        type: boolean

  pull_request:
    branches: [main, dev, 'feat/*', 'feature/*', 'maintenance/*']
    paths:
      # TypeScript/JavaScript files
      - '**.ts'
      - '**.tsx'
      - '**.js'
      - '**.jsx'
      - '**.json'
      # Python files
      - '**.py'
      # Config files
      - '.eslintrc*'
      - '.prettierrc*'
      - 'pyproject.toml'
      - 'ruff.toml'
  push:
    branches: [main, dev, 'maintenance/*']
    paths:
      - '**.ts'
      - '**.tsx'
      - '**.js'
      - '**.jsx'
      - '**.json'
      - '**.py'

  workflow_dispatch:
    inputs:
      skip-typescript:
        description: 'Skip TypeScript linting'
        required: false
        default: false
        type: boolean
      skip-python:
        description: 'Skip Python linting'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================================
  # TypeScript/JavaScript Linting
  # ==========================================================================
  lint-typescript:
    name: TypeScript Lint & Format
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip-typescript }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Run ESLint
        run: pnpm lint
        continue-on-error: false

      - name: Check Prettier formatting
        run: pnpm format --check
        continue-on-error: false

      - name: TypeScript type check
        run: pnpm --filter @arcaai/api exec tsc --noEmit
        continue-on-error: false

  # ==========================================================================
  # Python Linting
  # ==========================================================================
  lint-python:
    name: Python Lint & Format
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip-python }}

    strategy:
      fail-fast: false
      matrix:
        service: [smr, tts, nlp]

    defaults:
      run:
        working-directory: apps/${{ matrix.service }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install linting tools
        run: |
          uv venv
          uv pip install ruff black isort mypy

      - name: Run Ruff linter
        run: |
          source .venv/bin/activate
          ruff check src/ --output-format=github || true

      - name: Check Black formatting
        run: |
          source .venv/bin/activate
          black --check src/ || echo "::warning::Black formatting issues found in ${{ matrix.service }}"

      - name: Check isort
        run: |
          source .venv/bin/activate
          isort --check-only src/ || echo "::warning::Import sorting issues found in ${{ matrix.service }}"

  # ==========================================================================
  # Summary
  # ==========================================================================
  lint-summary:
    name: Lint Summary
    runs-on: ubuntu-latest
    needs: [lint-typescript, lint-python]
    if: always()

    steps:
      - name: Check lint results
        run: |
          if [ "${{ needs.lint-typescript.result }}" == "failure" ] || [ "${{ needs.lint-python.result }}" == "failure" ]; then
            echo "❌ Linting failed"
            exit 1
          fi
          echo "✅ All linting checks passed"

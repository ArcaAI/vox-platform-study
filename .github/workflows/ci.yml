# ============================================================================
# CI Pipeline Orchestrator
# ============================================================================
# This workflow orchestrates the full CI pipeline by calling other workflows.
# It provides a single status check for PRs and coordinates test execution.
#
# Features:
#   - Single entry point for all CI checks
#   - Aggregated status reporting
#   - Manual dispatch with full control
#   - Path filtering for efficiency
# ============================================================================

name: CI Pipeline

on:
  pull_request:
    branches: [main, dev]

  push:
    branches: [main, dev, 'maintenance/*']

  workflow_dispatch:
    inputs:
      run-lint:
        description: 'Run lint checks'
        required: false
        default: true
        type: boolean
      run-unit-tests:
        description: 'Run unit tests'
        required: false
        default: true
        type: boolean
      run-integration-tests:
        description: 'Run integration tests'
        required: false
        default: true
        type: boolean
      run-e2e-tests:
        description: 'Run E2E tests'
        required: false
        default: true
        type: boolean

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================================
  # Determine what to run based on changed files
  # ==========================================================================
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      typescript: ${{ steps.filter.outputs.typescript }}
      python: ${{ steps.filter.outputs.python }}
      database: ${{ steps.filter.outputs.database }}
      tests: ${{ steps.filter.outputs.tests }}
      docs-only: ${{ steps.filter.outputs.docs-only }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Filter paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            typescript:
              - 'apps/api/**/*.ts'
              - 'packages/**/*.ts'
              - 'packages/**/*.tsx'
              - 'package.json'
              - 'pnpm-lock.yaml'
            python:
              - 'apps/smr/**/*.py'
              - 'apps/stt-v2/**/*.py'
              - 'apps/tts/**/*.py'
              - 'apps/nlp/**/*.py'
              - '**/pyproject.toml'
            database:
              - 'packages/database/**/*.prisma'
              - 'packages/database/**/migrations/**'
            tests:
              - 'tests/**'
              - '**/tests/**'
              - '**/*.test.ts'
              - '**/*.spec.ts'
            docs-only:
              - 'docs/**'
              - '**/*.md'
              - '!**/tests/**'
              - '!**/*.test.ts'
              - '!**/*.spec.ts'

  # ==========================================================================
  # Lint and Format (Fast - runs in parallel)
  # ==========================================================================
  lint:
    name: Lint & Format
    needs: changes
    if: |
      (inputs.run-lint != false) &&
      (needs.changes.outputs.typescript == 'true' || needs.changes.outputs.python == 'true')
    uses: ./.github/workflows/lint-format.yml
    secrets: inherit

  # ==========================================================================
  # Unit Tests (Fast - runs in parallel)
  # ==========================================================================
  unit-tests:
    name: Unit Tests
    needs: changes
    if: |
      (inputs.run-unit-tests != false) &&
      (needs.changes.outputs.typescript == 'true' || needs.changes.outputs.python == 'true' || needs.changes.outputs.tests == 'true')
    uses: ./.github/workflows/test-unit.yml
    secrets: inherit
    with:
      skip-typescript: ${{ needs.changes.outputs.typescript != 'true' }}
      skip-python: ${{ needs.changes.outputs.python != 'true' }}

  # ==========================================================================
  # Integration Tests (Requires services - runs after lint)
  # ==========================================================================
  integration-tests:
    name: Integration Tests
    needs: [changes, lint, unit-tests]
    if: |
      always() &&
      (inputs.run-integration-tests != false) &&
      (needs.lint.result == 'success' || needs.lint.result == 'skipped') &&
      (needs.unit-tests.result == 'success' || needs.unit-tests.result == 'skipped') &&
      (needs.changes.outputs.typescript == 'true' || needs.changes.outputs.python == 'true' || needs.changes.outputs.database == 'true')
    uses: ./.github/workflows/test-integration.yml
    secrets: inherit
    with:
      skip-typescript: ${{ needs.changes.outputs.typescript != 'true' && needs.changes.outputs.database != 'true' }}
      skip-python: ${{ needs.changes.outputs.python != 'true' }}

  # ==========================================================================
  # E2E Tests (Full stack - runs after integration)
  # ==========================================================================
  e2e-tests:
    name: E2E Tests
    needs: [changes, integration-tests]
    if: |
      always() &&
      (inputs.run-e2e-tests != false) &&
      (needs.integration-tests.result == 'success' || needs.integration-tests.result == 'skipped') &&
      (needs.changes.outputs.typescript == 'true' || needs.changes.outputs.database == 'true' || needs.changes.outputs.tests == 'true') &&
      github.base_ref == 'main'
    uses: ./.github/workflows/test-e2e.yml
    secrets: inherit

  # ==========================================================================
  # CI Summary
  # ==========================================================================
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [changes, lint, unit-tests, integration-tests, e2e-tests]
    if: always()

    steps:
      - name: Generate CI Summary
        run: |
          echo "## CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY

          # Changes detection
          echo "| 🔍 Changes Detected | TS: ${{ needs.changes.outputs.typescript }}, PY: ${{ needs.changes.outputs.python }}, DB: ${{ needs.changes.outputs.database }} |" >> $GITHUB_STEP_SUMMARY

          # Lint
          LINT="${{ needs.lint.result }}"
          case "$LINT" in
            success) echo "| 🔍 Lint & Format | ✅ Passed |" >> $GITHUB_STEP_SUMMARY ;;
            skipped) echo "| 🔍 Lint & Format | ⏭️ Skipped |" >> $GITHUB_STEP_SUMMARY ;;
            failure) echo "| 🔍 Lint & Format | ❌ Failed |" >> $GITHUB_STEP_SUMMARY ;;
            *) echo "| 🔍 Lint & Format | ⚠️ $LINT |" >> $GITHUB_STEP_SUMMARY ;;
          esac

          # Unit Tests
          UNIT="${{ needs.unit-tests.result }}"
          case "$UNIT" in
            success) echo "| 🧪 Unit Tests | ✅ Passed |" >> $GITHUB_STEP_SUMMARY ;;
            skipped) echo "| 🧪 Unit Tests | ⏭️ Skipped |" >> $GITHUB_STEP_SUMMARY ;;
            failure) echo "| 🧪 Unit Tests | ❌ Failed |" >> $GITHUB_STEP_SUMMARY ;;
            *) echo "| 🧪 Unit Tests | ⚠️ $UNIT |" >> $GITHUB_STEP_SUMMARY ;;
          esac

          # Integration Tests
          INTEG="${{ needs.integration-tests.result }}"
          case "$INTEG" in
            success) echo "| 🔗 Integration Tests | ✅ Passed |" >> $GITHUB_STEP_SUMMARY ;;
            skipped) echo "| 🔗 Integration Tests | ⏭️ Skipped |" >> $GITHUB_STEP_SUMMARY ;;
            failure) echo "| 🔗 Integration Tests | ❌ Failed |" >> $GITHUB_STEP_SUMMARY ;;
            *) echo "| 🔗 Integration Tests | ⚠️ $INTEG |" >> $GITHUB_STEP_SUMMARY ;;
          esac

          # E2E Tests
          E2E="${{ needs.e2e-tests.result }}"
          case "$E2E" in
            success) echo "| 🎭 E2E Tests | ✅ Passed |" >> $GITHUB_STEP_SUMMARY ;;
            skipped) echo "| 🎭 E2E Tests | ⏭️ Skipped |" >> $GITHUB_STEP_SUMMARY ;;
            failure) echo "| 🎭 E2E Tests | ❌ Failed |" >> $GITHUB_STEP_SUMMARY ;;
            *) echo "| 🎭 E2E Tests | ⚠️ $E2E |" >> $GITHUB_STEP_SUMMARY ;;
          esac

      - name: Check for failures
        run: |
          # Check if any required job failed
          LINT="${{ needs.lint.result }}"
          UNIT="${{ needs.unit-tests.result }}"
          INTEG="${{ needs.integration-tests.result }}"
          E2E="${{ needs.e2e-tests.result }}"

          if [ "$LINT" == "failure" ] || [ "$UNIT" == "failure" ] || [ "$INTEG" == "failure" ] || [ "$E2E" == "failure" ]; then
            echo "❌ CI Pipeline failed"
            exit 1
          fi

          echo "✅ CI Pipeline completed successfully"

# ============================================================================
# Shared Test Environment Setup Action
# ============================================================================
# This composite action sets up test environment variables for CI pipelines.
#
# Two modes of operation:
#
#   1. Service Containers (default) — ephemeral PostgreSQL/Redis spun up per job
#      Uses localhost with isolated ports (5433/6380/9002).
#
#   2. External Infrastructure — connect to shared HA-Postgres and Redis
#      Set `use-external-db: 'true'` and provide connection details.
#      Designed for GitLab-hosted runners on the 10.10.1.0/24 network, but
#      also usable in GitHub Actions if a VPN/tunnel is available.
#
# External Test Infrastructure:
#   PostgreSQL HA:  10.10.1.250:5000  (HAProxy R/W VIP → vox_dev)
#   Redis Dev:      10.10.1.120:6379  (DB 8 reserved for CI tests)
#
# IMPORTANT: Keep in sync with:
#   - .env.test (local development)
#   - tests/docker-compose.test.yml (test containers)
#   - .gitlab/ci/test.yml (GitLab CI test jobs)
#
# Usage (service containers — default):
#   - uses: ./.github/actions/setup-test-env
#     with:
#       database-port: '5433'
#       redis-port: '6380'
#
# Usage (external infrastructure):
#   - uses: ./.github/actions/setup-test-env
#     with:
#       use-external-db: 'true'
#       external-pg-host: '10.10.1.250'
#       external-pg-port: '5000'
#       external-pg-user: ${{ secrets.TEST_PG_USER }}
#       external-pg-password: ${{ secrets.TEST_PG_PASSWORD }}
#       external-pg-database: 'vox_dev'
#       external-redis-host: '10.10.1.120'
#       external-redis-port: '6379'
#       external-redis-password: ${{ secrets.TEST_REDIS_PASSWORD }}
#       external-redis-db: '8'
# ============================================================================

name: 'Setup Test Environment'
description: 'Sets up test environment variables for HOPE platform (mirrors .env.test)'

inputs:
  # --- Service container mode (default) ---
  database-port:
    description: 'PostgreSQL port for test database (default: 5433)'
    required: false
    default: '5433'
  redis-port:
    description: 'Redis port for test cache (default: 6380)'
    required: false
    default: '6380'
  minio-port:
    description: 'MinIO port for test storage (default: 9002)'
    required: false
    default: '9002'
  minio-console-port:
    description: 'MinIO console port (default: 9003)'
    required: false
    default: '9003'
  log-level:
    description: 'Log level for tests (default: error)'
    required: false
    default: 'error'
  enable-file-logging:
    description: 'Enable file logging during tests'
    required: false
    default: 'false'

  # --- External infrastructure mode ---
  use-external-db:
    description: 'Use external HA-Postgres and Redis instead of service containers'
    required: false
    default: 'false'
  external-pg-host:
    description: 'External PostgreSQL host (e.g. 10.10.1.250)'
    required: false
    default: ''
  external-pg-port:
    description: 'External PostgreSQL port (e.g. 5000 for HAProxy)'
    required: false
    default: '5000'
  external-pg-user:
    description: 'External PostgreSQL user'
    required: false
    default: ''
  external-pg-password:
    description: 'External PostgreSQL password'
    required: false
    default: ''
  external-pg-database:
    description: 'External PostgreSQL database name'
    required: false
    default: 'vox_dev'
  external-redis-host:
    description: 'External Redis host (e.g. 10.10.1.120)'
    required: false
    default: ''
  external-redis-port:
    description: 'External Redis port'
    required: false
    default: '6379'
  external-redis-password:
    description: 'External Redis password'
    required: false
    default: ''
  external-redis-db:
    description: 'External Redis database number'
    required: false
    default: '8'

outputs:
  database-url:
    description: 'Full database connection URL'
    value: ${{ steps.set-env.outputs.database-url }}
  redis-url:
    description: 'Full Redis connection URL'
    value: ${{ steps.set-env.outputs.redis-url }}

runs:
  using: 'composite'
  steps:
    - id: set-env
      shell: bash
      run: |
        USE_EXTERNAL="${{ inputs.use-external-db }}"

        # =============================================================================
        # Core Environment
        # =============================================================================
        echo "NODE_ENV=test" >> $GITHUB_ENV
        echo "CI=true" >> $GITHUB_ENV

        # =============================================================================
        # Database & Redis Configuration
        # =============================================================================
        if [ "$USE_EXTERNAL" = "true" ]; then
          echo "🔧 Setting up test environment (EXTERNAL infrastructure)..."
          echo "   PostgreSQL: ${{ inputs.external-pg-host }}:${{ inputs.external-pg-port }}/${{ inputs.external-pg-database }}"
          echo "   Redis:      ${{ inputs.external-redis-host }}:${{ inputs.external-redis-port }}/db${{ inputs.external-redis-db }}"

          PG_HOST="${{ inputs.external-pg-host }}"
          PG_PORT="${{ inputs.external-pg-port }}"
          PG_USER="${{ inputs.external-pg-user }}"
          PG_PASS="${{ inputs.external-pg-password }}"
          PG_DB="${{ inputs.external-pg-database }}"
          REDIS_HOST="${{ inputs.external-redis-host }}"
          REDIS_PORT="${{ inputs.external-redis-port }}"
          REDIS_PASS="${{ inputs.external-redis-password }}"
          REDIS_DB="${{ inputs.external-redis-db }}"

          DB_URL="postgresql://${PG_USER}:${PG_PASS}@${PG_HOST}:${PG_PORT}/${PG_DB}?schema=public&connect_timeout=10"
          REDIS_URL="redis://:${REDIS_PASS}@${REDIS_HOST}:${REDIS_PORT}/${REDIS_DB}"

          echo "DATABASE_URL=${DB_URL}" >> $GITHUB_ENV
          echo "DATABASE_URL_DIRECT=${DB_URL}" >> $GITHUB_ENV
          echo "database-url=${DB_URL}" >> $GITHUB_OUTPUT

          echo "REDIS_URL=${REDIS_URL}" >> $GITHUB_ENV
          echo "REDIS_HOST=${REDIS_HOST}" >> $GITHUB_ENV
          echo "REDIS_PORT=${REDIS_PORT}" >> $GITHUB_ENV
          echo "REDIS_PASS=${REDIS_PASS}" >> $GITHUB_ENV
          echo "redis-url=${REDIS_URL}" >> $GITHUB_OUTPUT

          echo "TEST_DATABASE_URL=postgresql+asyncpg://${PG_USER}:${PG_PASS}@${PG_HOST}:${PG_PORT}/${PG_DB}" >> $GITHUB_ENV
          echo "TEST_REDIS_URL=${REDIS_URL}" >> $GITHUB_ENV
          echo "SUMMARY_AGENT_DATABASE_URL=postgresql+asyncpg://${PG_USER}:${PG_PASS}@${PG_HOST}:${PG_PORT}/${PG_DB}" >> $GITHUB_ENV
          echo "SUMMARY_AGENT_REDIS_URL=${REDIS_URL}" >> $GITHUB_ENV
          echo "CELERY_BROKER_URL=${REDIS_URL}" >> $GITHUB_ENV
          echo "CELERY_RESULT_BACKEND=${REDIS_URL}" >> $GITHUB_ENV
        else
          echo "🔧 Setting up test environment (service containers)..."
          echo "   Database port: ${{ inputs.database-port }}"
          echo "   Redis port: ${{ inputs.redis-port }}"
          echo "   MinIO port: ${{ inputs.minio-port }}"

          DB_URL="postgresql://test:test@localhost:${{ inputs.database-port }}/hope_test?schema=public"
          REDIS_URL="redis://:test_redis_pass@localhost:${{ inputs.redis-port }}"

          echo "DATABASE_URL=${DB_URL}" >> $GITHUB_ENV
          echo "DATABASE_URL_DIRECT=${DB_URL}" >> $GITHUB_ENV
          echo "database-url=${DB_URL}" >> $GITHUB_OUTPUT

          echo "REDIS_URL=${REDIS_URL}" >> $GITHUB_ENV
          echo "REDIS_HOST=localhost" >> $GITHUB_ENV
          echo "REDIS_PORT=${{ inputs.redis-port }}" >> $GITHUB_ENV
          echo "REDIS_PASS=test_redis_pass" >> $GITHUB_ENV
          echo "redis-url=${REDIS_URL}" >> $GITHUB_OUTPUT
        fi

        # =============================================================================
        # MinIO Configuration (matches .env.test)
        # =============================================================================
        echo "MINIO_ENDPOINT=localhost:${{ inputs.minio-port }}" >> $GITHUB_ENV
        echo "MINIO_ACCESS_KEY=test" >> $GITHUB_ENV
        echo "MINIO_SECRET_KEY=testpassword" >> $GITHUB_ENV
        echo "MINIO_USE_SSL=false" >> $GITHUB_ENV

        # =============================================================================
        # API Configuration (matches .env.test)
        # =============================================================================
        echo "PORT=8868" >> $GITHUB_ENV
        echo "API_PORT=8868" >> $GITHUB_ENV
        echo "API_URL=http://localhost:8868" >> $GITHUB_ENV

        # =============================================================================
        # JWT/Security Configuration (matches .env.test - test-only secrets)
        # =============================================================================
        echo "JWT_SECRET=test-jwt-secret-for-testing-only-do-not-use-in-production" >> $GITHUB_ENV
        echo "JWT_EXPIRES_IN=1h" >> $GITHUB_ENV
        echo "JWT_REFRESH_SECRET=test-refresh-secret-for-testing-only" >> $GITHUB_ENV
        echo "JWT_REFRESH_EXPIRES_IN=7d" >> $GITHUB_ENV
        echo "SESSION_SECRET_KEY=test-session-secret" >> $GITHUB_ENV

        # =============================================================================
        # Microservice URLs (matches .env.test)
        # =============================================================================
        echo "STT_V2_PORT=8861" >> $GITHUB_ENV
        echo "STT_V2_URL=http://localhost:8861" >> $GITHUB_ENV
        echo "SMR_PORT=8862" >> $GITHUB_ENV
        echo "SMR_URL=http://localhost:8862" >> $GITHUB_ENV
        echo "TTS_PORT=8863" >> $GITHUB_ENV
        echo "TTS_URL=http://localhost:8863" >> $GITHUB_ENV
        echo "NLP_PORT=8864" >> $GITHUB_ENV
        echo "NLP_URL=http://localhost:8864" >> $GITHUB_ENV

        # =============================================================================
        # Logging Configuration (matches .env.test)
        # =============================================================================
        echo "LOG_LEVEL=${{ inputs.log-level }}" >> $GITHUB_ENV
        echo "LOG_FILE_ENABLED=${{ inputs.enable-file-logging }}" >> $GITHUB_ENV
        echo "LOG_FILE_PATH=./logs" >> $GITHUB_ENV

        # =============================================================================
        # MQTT Configuration (matches .env.test - disabled for tests)
        # =============================================================================
        echo "MQTT_HOST=localhost" >> $GITHUB_ENV
        echo "MQTT_PORT=1883" >> $GITHUB_ENV
        echo "MQTT_USER=" >> $GITHUB_ENV
        echo "MQTT_PASS=" >> $GITHUB_ENV

        # =============================================================================
        # Observability (matches .env.test - disabled for tests)
        # =============================================================================
        echo "OTEL_TRACES_ENABLED=false" >> $GITHUB_ENV
        echo "OTEL_METRICS_ENABLED=false" >> $GITHUB_ENV

        # =============================================================================
        # Test-specific Configuration (matches .env.test)
        # =============================================================================
        echo "DEFAULT_TENANT_ID=50000000-0000-0000-0000-000000000000" >> $GITHUB_ENV
        echo "SYSTEM_USER_ID=60000000-0000-0000-0000-000000000000" >> $GITHUB_ENV
        echo "DEBUG_PRISMA=false" >> $GITHUB_ENV
        echo "SKIP_SEED=false" >> $GITHUB_ENV

        echo "✅ Test environment setup complete!"

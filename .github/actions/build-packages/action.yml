# ============================================================================
# Build Packages Composite Action
# ============================================================================
# Reusable action for building HOPE monorepo packages.
#
# Usage:
#   - uses: ./.github/actions/build-packages
#     with:
#       include-modules: 'true'  # optional, defaults to false
#       include-api: 'false'     # optional, defaults to false
# ============================================================================

name: 'Build Packages'
description: 'Builds HOPE monorepo packages with Prisma client generation'

inputs:
  include-modules:
    description: 'Also build application modules'
    required: false
    default: 'false'
  include-api:
    description: 'Also build API application'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Generate Prisma client
      shell: bash
      run: pnpm db:generate

    - name: Build packages
      shell: bash
      run: pnpm build:packages

    - name: Build modules
      if: inputs.include-modules == 'true'
      shell: bash
      run: pnpm build:modules

    - name: Build API
      if: inputs.include-api == 'true'
      shell: bash
      run: pnpm build:api

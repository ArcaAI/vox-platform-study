# Keepalived — BACKUP (VM 501 / pg-node2)
# Install on host: sudo apt-get install -y keepalived
# Copy to: /etc/keepalived/keepalived.conf
#
# IMPORTANT: Replace 'eth0' below with your actual interface name.
#   Find it with:  ip -br addr show | grep 10.10.1.201
#   Common names:  ens18 (Proxmox/KVM), eth0 (classic), ens3 (cloud)

global_defs {
    enable_script_security
    script_user root
}

vrrp_script check_haproxy {
    script "/usr/bin/curl -sf http://127.0.0.1:7000/ > /dev/null 2>&1"
    interval 3
    weight -20
    fall 3
    rise 2
    user root
}

vrrp_instance VI_PG {
    state BACKUP
    interface enp6s18
    virtual_router_id 51
    priority 90
    advert_int 1

    authentication {
        auth_type PASS
        auth_pass hopepgha
    }

    virtual_ipaddress {
        10.10.1.250/24
    }

    track_script {
        check_haproxy
    }
}

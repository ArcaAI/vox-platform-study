# pgbouncer_exporter scrape config — TASK-302 Stream C Phase 2A.
#
# Append the snippet under `scrape_configs:` in your Prometheus config
# (typically /etc/prometheus/prometheus.yml). The HA stack runs the
# exporter on host port 9127 on every PG node (see docker-compose.yml,
# `pgbouncer-exporter` service, `monitoring` profile).
#
# Metrics surfaced:
#   - pgbouncer_pools_server_active_connections   (sv_active)
#   - pgbouncer_pools_server_idle_connections     (sv_idle)
#   - pgbouncer_pools_client_active_connections   (cl_active)
#   - pgbouncer_pools_client_waiting_connections  (cl_waiting)
#   - pgbouncer_pools_client_maxwait_seconds      (alarm)
#   - pgbouncer_stats_total_query_count           (rate)
#   - pgbouncer_stats_total_query_time            (latency)
#   - pgbouncer_stats_total_xact_count            (txn throughput)
#
# Alert rules live alongside this file: ./pgbouncer-alerts.yml

scrape_configs:
  - job_name: pgbouncer
    scrape_interval: 15s
    scrape_timeout: 5s
    static_configs:
      - targets:
          - '10.10.1.200:9127'
          - '10.10.1.201:9127'
          - '10.10.1.202:9127'
        labels:
          cluster: hope-prod
          component: pgbouncer

# pgBackRest Configuration — MinIO S3 Repository (TLS)
# Mounted into the patroni container at /etc/pgbackrest/pgbackrest.conf
# The PGBACKREST_CONFIG env var overrides the image default path
#
# MinIO runs with self-signed TLS on 10.10.1.102:9000
# The CA cert is mounted into the container at /etc/pgbackrest/minio-ca.crt
# Service account created in deploy-vm402-minio.md section 9b

[global]
repo1-type=s3
repo1-s3-endpoint=10.10.1.102
repo1-storage-port=9000
repo1-s3-bucket=pgbackrest
# ── MinIO/S3 credentials — TASK-369 Phase 4 (NOT stored in this file) ─────────
# The S3 access key + secret are injected via pgBackRest's native environment
# overrides on the patroni container (set from the node .env, sourced from
# Vault), so no credential is committed here:
#     PGBACKREST_REPO1_S3_KEY         ->  repo1-s3-key
#     PGBACKREST_REPO1_S3_KEY_SECRET  ->  repo1-s3-key-secret
# pgBackRest does NOT expand ${shell} variables inside this config, so the value
# MUST arrive via the environment (or be rendered at deploy time). With neither
# set, pgBackRest fails closed ("repo1-s3-key is required") — intentional.
#
# SECURITY — ROTATE REQUIRED: a previous revision of this file committed the
# pgbackrest-svc literals (access key 75WG05FEQ23YOBK7M49T + its secret). Treat
# them as COMPROMISED. An operator MUST rotate the pgbackrest-svc service account
# in MinIO (mc admin user svcacct rm/add — deploy-vm402-minio.md §9b.3) and store
# the new pair in Vault. This change cannot rotate live MinIO credentials.
#   repo1-s3-key=${PGBACKREST_REPO1_S3_KEY}                # injected via env (see above)
#   repo1-s3-key-secret=${PGBACKREST_REPO1_S3_KEY_SECRET}  # injected via env (see above)
repo1-s3-region=us-east-1
repo1-s3-uri-style=path
repo1-storage-ca-file=/etc/pgbackrest/minio-ca.crt
repo1-path=/repo1

# ── Backup encryption at rest — TASK-369 Phase 4 ─────────────────────────────
# Every file pgBackRest writes to the repo (full/diff/incr backups + archived
# WAL) is AES-256-CBC encrypted on the host BEFORE upload, so the MinIO copy is
# ciphertext independent of bucket SSE (defense-in-depth for stolen buckets/keys).
repo1-cipher-type=aes-256-cbc
# The cipher passphrase is the ROOT OF TRUST for every backup: without it NO
# restore is possible, and it cannot be rotated without re-encrypting the whole
# repo (new stanza). It is NOT stored in this file — it is injected via the
# environment, sourced from Vault:
#     PGBACKREST_REPO1_CIPHER_PASS    ->  repo1-cipher-pass
#     Vault: secret/hope/PGBACKREST_REPO1_CIPHER_PASS   (generate: openssl rand -base64 48)
# With repo1-cipher-type set but no pass available, pgBackRest fails closed.
# Custody + restore verification: research/deployments/dr-break-glass-runbook.md
# and research/deployments/encryption-at-rest-luks-minio-sse-runbook.md.
#   repo1-cipher-pass=${PGBACKREST_REPO1_CIPHER_PASS}      # injected via env (see above)

repo1-retention-full=2
repo1-retention-diff=7

repo1-bundle=y
repo1-block=y

compress-type=zst
compress-level=6
process-max=4
start-fast=y
delta=y

archive-async=y
spool-path=/tmp/pgbackrest
archive-push-queue-max=4GiB

log-level-console=info
log-level-file=detail

[hope-cluster]
pg1-path=/home/postgres/pgdata/data
pg1-port=5432
pg1-user=postgres

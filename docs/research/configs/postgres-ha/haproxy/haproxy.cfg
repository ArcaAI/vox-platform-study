global
    maxconn 1000
    log stdout format raw local0

defaults
    log     global
    mode    tcp
    retries 3
    timeout connect 5s
    timeout client  30m
    timeout server  30m
    timeout check   5s

# ── Stats Dashboard (HTTP) ──
listen stats
    mode http
    bind *:7000
    stats enable
    stats uri /
    stats refresh 10s
    stats show-legends

# ── Read/Write — Primary Only ──
# Patroni REST API /primary returns 200 only on the leader node
listen pg_primary
    bind *:5000
    mode tcp
    option httpchk GET /primary
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions maxconn 500
    server pg-node1 10.10.1.200:5432 check port 8008
    server pg-node2 10.10.1.201:5432 check port 8008
    server pg-node3 10.10.1.202:5432 check port 8008

# ── Read-Only — Replicas (Round-Robin) ──
# Patroni REST API /replica returns 200 only on replica nodes
listen pg_replicas
    bind *:5001
    mode tcp
    balance roundrobin
    option httpchk GET /replica
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions maxconn 500
    server pg-node1 10.10.1.200:5432 check port 8008
    server pg-node2 10.10.1.201:5432 check port 8008
    server pg-node3 10.10.1.202:5432 check port 8008

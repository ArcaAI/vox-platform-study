##############################################################################
# GitLab Runner — Production Configuration (Multi-Runner)
#
# Location on VM 411:  /home/dell/.gitlab-runner/config.toml
#                      ^ the LIVE file. gitlab-runner runs in user mode here.
#                      /etc/gitlab-runner/config.toml also exists but holds
#                      only a stub (concurrent = 1, no [[runners]]) and is NOT
#                      what the service reads — verified 2026-09-03.
# Managed copy:        docs/research/configs/gitlab-runner/config.toml
#
# ── S3 cache TLS (Insecure = false) — PREREQUISITE ──────────────────────────
# MinIO on 10.10.1.102:9000 serves HTTPS ONLY. With Insecure = true the runner
# spoke plaintext HTTP to a TLS port, so MinIO answered 400 Bad Request: every
# job logged "FATAL: received: 400 Bad Request / Failed to create cache" after
# ~94 s, and every restore logged "Failed to extract cache" — i.e. the cache
# has been entirely non-functional (measured 2026-09-03, pipeline 1112).
#
# The server cert is issued by "ARCAAI Internal CA" (CN = s3.taphuynh.dev,
# SAN includes IP 10.10.1.102, valid to 2028-03-21), so the endpoint below is
# covered — but that CA is NOT in any default trust store. Before applying
# this file, install it on VM 411:
#
#   scp <minio-vm>:/home/dell/minio/certs/CAs/ca.crt \
#       /usr/local/share/ca-certificates/arcaai-internal-ca.crt
#   sudo update-ca-certificates
#   curl -sI https://10.10.1.102:9000/minio/health/live   # must be 200, no -k
#
# That covers the runner process. The actual cache upload/download runs in the
# helper container, which has its own trust store — hence the read-only CA
# bind-mount in every [runners.docker] volumes list below. It lands in
# /etc/ssl/certs/, which Go's crypto/x509 scans as a cert DIRECTORY in addition
# to the ca-certificates.crt bundle, so the Go-based cache-archiver picks it up.
#
# Skipping either half turns the 400 into a TLS verification failure.
#
# Architecture:
#   4 specialized runners on the SAME host, each with different tags and
#   concurrency. Fast jobs (lint, typecheck) never queue behind slow builds.
#
# Runner tokens: create 4 separate runners in GitLab Admin UI:
#   Admin → CI/CD → Runners → New instance runner (repeat 4 times)
#
# After editing this file, restart the runner:
#   sudo gitlab-runner restart
#   sudo gitlab-runner verify
#
# Reference: https://docs.gitlab.com/runner/configuration/advanced-configuration.html
##############################################################################


## ═══════════════════════════════════════════════════════════════════════════
## GLOBAL — Applies to all runners registered on this host
## ═══════════════════════════════════════════════════════════════════════════

# Total parallel jobs across ALL [[runners]] sections.
# Raised 2026-08-08 at user request: fast(6) + build(6) + test(6) + deploy(6)
# = 24 max slots on a 12 vCPU / 12 GB host. This deliberately oversubscribes —
# 6 concurrent Docker builds (4+ GB RAM each, especially STT with PyTorch) and
# 6 parallel deploys both exceed what the host sustains comfortably; watch for
# OOM kills and racing deploys. Reconfirmed as intentional 2026-09-03.
concurrent = 24

check_interval = 3
shutdown_timeout = 0
log_level = "info"
log_format = "text"

[session_server]
  session_timeout = 1800


## ═══════════════════════════════════════════════════════════════════════════
## RUNNER 1 — FAST (lint, typecheck, unit tests)
## ═══════════════════════════════════════════════════════════════════════════
##
## For quick jobs that finish in <2 minutes.
## High concurrency so these never queue behind heavy builds.
##
## GitLab Admin UI:
##   Tags: fast,lint,typecheck,unit
##   Run untagged jobs: NO
##   Description: fast-runner-01

[[runners]]
  name = "fast-runner-01"
  url = "http://10.10.1.110"
  id = 1
  token = "glrt-umRZcnhJXo7aUR_h1FPJNm86MQp0OjEKdToyCw.01.120e1ck0n"
  token_obtained_at = 2026-03-17T00:00:00Z
  token_expires_at = 0001-01-01T00:00:00Z
  executor = "docker"
  limit = 6
  clone_url = "http://10.10.1.110"
  builds_dir = "/builds/fast"
  environment = [
    "DOCKER_TLS_CERTDIR=",
    "GIT_STRATEGY=fetch",
    "GIT_DEPTH=10"
  ]

  [runners.docker]
    tls_verify = false
    image = "node:22-alpine"
    privileged = false
    disable_entrypoint_overwrite = false
    oom_kill_disable = false
    disable_cache = false
    volumes = [
      "/cache:/cache",
      "/srv/gitlab-runner/pnpm-store:/pnpm-store:rw",
      "/usr/local/share/ca-certificates/arcaai-internal-ca.crt:/etc/ssl/certs/arcaai-internal-ca.pem:ro"
    ]
    shm_size = 0
    pull_policy = ["if-not-present"]
    wait_for_services_timeout = 30
    dns = ["8.8.8.8", "1.1.1.1"]
    extra_hosts = [
      "registry.taphuynh.dev:10.10.1.110",
      "pages.taphuynh.dev:10.10.1.110"
    ]

  [runners.cache]
    MaxUploadedArchiveSize = 0
    Type = "s3"
    Shared = true
    [runners.cache.s3]
      ServerAddress = "10.10.1.102:9000"
      AccessKey = "VAK1EE5PBL9ASRK3S91X"
      SecretKey = "Q+MtHJbRr0su1mUXtkaid+mm17wQ7AU5+GLW5SV1"
      BucketName = "gitlab-runner-cache"
      Insecure = false


## ═══════════════════════════════════════════════════════════════════════════
## RUNNER 2 — BUILD (Docker image builds)
## ═══════════════════════════════════════════════════════════════════════════
##
## For heavy Docker builds. Privileged mode + socket mount.
## Lower concurrency — each build is CPU + disk I/O intensive.
##
## GitLab Admin UI:
##   Tags: build,docker
##   Run untagged jobs: NO
##   Description: build-runner-01

[[runners]]
  name = "build-runner-01"
  url = "http://10.10.1.110"
  id = 2
  token = "glrt-M2Xiw1X7C8a4JYzZXc2I0m86MQp0OjEKdToyCw.01.121amy2q1"
  token_obtained_at = 2026-03-17T00:00:00Z
  token_expires_at = 0001-01-01T00:00:00Z
  executor = "docker"
  # 6 concurrent builds — each Docker buildx build (especially STT with
  # PyTorch) can consume 4+ GB RAM and saturate CPU. See the concurrent
  # note above: this is a deliberate oversubscription, not a sizing estimate.
  limit = 6
  output_limit = 20480
  clone_url = "http://10.10.1.110"
  builds_dir = "/builds/build"
  environment = [
    "DOCKER_TLS_CERTDIR=",
    "GIT_STRATEGY=fetch",
    "GIT_DEPTH=1",
    "DOCKER_BUILDKIT=1"
  ]

  [runners.docker]
    tls_verify = false
    image = "docker:27"
    privileged = true
    disable_entrypoint_overwrite = false
    oom_kill_disable = false
    disable_cache = false
    volumes = [
      "/var/run/docker.sock:/var/run/docker.sock",
      "/cache:/cache",
      "/srv/gitlab-runner/buildkit:/var/lib/buildkit:rw",
      "/usr/local/share/ca-certificates/arcaai-internal-ca.crt:/etc/ssl/certs/arcaai-internal-ca.pem:ro"
    ]
    shm_size = 536870912
    pull_policy = ["if-not-present"]
    wait_for_services_timeout = 30
    dns = ["8.8.8.8", "1.1.1.1"]
    extra_hosts = [
      "registry.taphuynh.dev:10.10.1.110",
      "pages.taphuynh.dev:10.10.1.110"
    ]

  [runners.cache]
    MaxUploadedArchiveSize = 0
    Type = "s3"
    Shared = true
    [runners.cache.s3]
      ServerAddress = "10.10.1.102:9000"
      AccessKey = "VAK1EE5PBL9ASRK3S91X"
      SecretKey = "Q+MtHJbRr0su1mUXtkaid+mm17wQ7AU5+GLW5SV1"
      BucketName = "gitlab-runner-cache"
      Insecure = false



# TASK-824 — MinIO -> PVC model warm sync.
#
# STAGED, NOT APPLIED. Destination in `hope-v2-deployment`:
#   deployment/k8s/base/llama-cpp-models.yaml
#
# ============================================================================
# WHAT CHANGED VERSUS THE TICKET'S ORIGINAL §3.3 DESIGN
# ============================================================================
# §3.3 step 3 mandated `lms import <file> --user-repo <publisher>/<model> -y -L`
# INSIDE the container, because §4.10 established — three independent ways —
# that LM Studio has NO rescan API and NO rescan CLI, so a GGUF dropped on the
# volume is simply not visible. That step carried its own trap: `lms import`
# MOVES the file by default, so omitting `-L`/`-c` silently empties staging.
#
# With llama-server that entire step does not exist. There is no catalogue and
# no indexer to inform: the server is told `--model /path/file.gguf`, or in
# router mode reads a preset file at startup and re-reads it on `GET /models?reload=1`.
#
# So this Job's contract is smaller and stronger than §3.3's:
#     download -> verify sha256 -> verify GGUF magic -> flip .ready
# with NO in-container registration step, NO <publisher>/<model>/ layout
# requirement (§4.10's "a GGUF at the models root is not discovered" is an
# LM Studio constraint), and no exec into a serving pod.
#
# The verification is NOT relaxed, though. §3.2's hazard is unchanged and the
# reason the sentinel is flipped last.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hope-llama-models
  labels:
    app: hope-llama-cpp
    app.kubernetes.io/part-of: project-hope
spec:
  accessModes:
    # ReadOnlyMany at consumption time (§3.3: "serving pods mount it
    # ReadOnlyMany; nothing re-pulls per pod"). The Job needs RWO to write, so
    # the claim is RWX where the storage class supports it. On single-node k3s
    # with local-path this is effectively RWO and that is fine — every consumer
    # is on the one node. If the storage class is local-path, RWX is silently
    # downgraded; that is acceptable HERE and nowhere else.
    - ReadWriteOnce
  resources:
    requests:
      # Sized for the four-model catalogue with room for one replacement in
      # flight (TASK-831 §6.3 measured totals):
      #   E2B 3.12 + mmproj 0.92 + E4B 4.80 + mmproj 0.92
      #   + Guardian Q4_K_M 4.77 + EmbeddingGemma 0.26 = 14.79 GiB
      # 40Gi leaves headroom to stage a new quant before deleting the old one.
      storage: 40Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hope-llama-model-manifest
  labels:
    app: hope-llama-cpp
    app.kubernetes.io/part-of: project-hope
data:
  # ==========================================================================
  # THE MANIFEST — every sha256 below was read from the HuggingFace blob API
  # on 2026-08-30, not copied from a model card.
  # ==========================================================================
  #
  # WHY CHECKSUMS ARE NON-NEGOTIABLE FOR THESE EXACT FILES (TASK-831 §4.1):
  # LM Studio bug-tracker #2169 reported Google's Gemma 4 GGUFs crashing on
  # load "regardless of whether an mmproj file is present". It was resolved not
  # by an engine fix but by GOOGLE RE-UPLOADING the files on 2026-07-17
  # ("Upload validated QAT GGUF checkpoint (280 sequence length, corrected
  # vocabulary)"). Any copy cached or mirrored between 15-17 July 2026 is
  # POISONED and will load as a subtly-wrong model.
  #
  # Both Gemma repos below report lastModified 2026-07-17T21:23Z, i.e. these
  # digests are the POST-re-upload, known-good blobs. The `revision` field pins
  # the commit so a future re-upload is a visible diff, not a silent swap.
  manifest.json: |
    {
      "schemaVersion": 1,
      "ticket": "TASK-824",
      "verifiedAt": "2026-08-30",
      "bucket": "hope-models",
      "note": "sha256 + byte sizes read from the HuggingFace blob API. Mirror these objects into MinIO before first sync; the serving namespace must never egress to huggingface.co (see §3.1b and L-3).",
      "models": [
        {
          "id": "llama-cpp-gemma-4-e2b-it-qat",
          "repo": "google/gemma-4-E2B-it-qat-q4_0-gguf",
          "revision": "675cff42a74c774d6cb76f76d8eacb49b48c9b93",
          "files": [
            {
              "key": "google/gemma-4-E2B-it-qat-q4_0-gguf/q4_0/gemma-4-E2B_q4_0-it.gguf",
              "role": "weights",
              "bytes": 3349516256,
              "sha256": "fa401b55b07ee70a54c6dae3903c783a6e65064312529ea57175cb5f8dec6634"
            },
            {
              "key": "google/gemma-4-E2B-it-qat-q4_0-gguf/q4_0/gemma-4-E2B-it-mmproj.gguf",
              "role": "mmproj",
              "bytes": 986833664,
              "sha256": "021059cce659fe7f9170d5599761d7bbaf644b798dab9503aca30dc43e6beb14",
              "note": "BF16 projector carrying BOTH vision (gemma4v) and audio (gemma4a) encoders. PR #21421 warns non-BF16 projectors have degraded performance."
            }
          ]
        },
        {
          "id": "llama-cpp-gemma-4-e4b-it-qat",
          "repo": "google/gemma-4-E4B-it-qat-q4_0-gguf",
          "revision": "4b4a2c1d584be7264f87aac328a1bc739ce81b6c",
          "files": [
            {
              "key": "google/gemma-4-E4B-it-qat-q4_0-gguf/q4_0/gemma-4-E4B_q4_0-it.gguf",
              "role": "weights",
              "bytes": 5154941280,
              "sha256": "676c35070db6dbe52f93e9c864ee0fba4eddea94b9c875d9cb10daff453fbaee"
            },
            {
              "key": "google/gemma-4-E4B-it-qat-q4_0-gguf/q4_0/gemma-4-E4B-it-mmproj.gguf",
              "role": "mmproj",
              "bytes": 991552256,
              "sha256": "7498a37cb619e55f2fcf87eb931f56e99389ed6d432e4c5c66110694c0d65578"
            }
          ]
        },
        {
          "id": "llama-cpp-granite-guardian-4.1-8b",
          "repo": "ibm-granite/granite-guardian-4.1-8b-GGUF",
          "revision": "bc78f0995361543a70438fe44a60bb7613fed2f0",
          "files": [
            {
              "key": "ibm-granite/granite-guardian-4.1-8b-GGUF/Q4_K_M/granite-guardian-4.1-8b-Q4_K_M.gguf",
              "role": "weights",
              "bytes": 5116703808,
              "sha256": "979114c9e6a589a1e37c2d597677555d3eb78c2856e920ed4ec97f7bded787a4",
              "note": "Q4_K_M = 4.77 GiB measured. TASK-831 §7.1 flags that the existing seed row says computeType 'q4_k_s'; Q4_K_S is a DIFFERENT file (4.53 GiB, sha f713dd82...). Reconcile the row against whichever is actually staged."
            }
          ]
        },
        {
          "id": "llama-cpp-embeddinggemma-300m-qat",
          "repo": "ggml-org/embeddinggemma-300M-qat-q4_0-GGUF",
          "revision": "8dd0ca2a66a8f14470acb0e2a71f801afbc5fb73",
          "files": [
            {
              "key": "ggml-org/embeddinggemma-300M-qat-q4_0-GGUF/q4_0/embeddinggemma-300M-qat-Q4_0.gguf",
              "role": "weights",
              "bytes": 277852192,
              "sha256": "50d28e22432a148f6f8a86eab3700f92add5d1f54baf7790675a2a4dadbccf26",
              "note": "The 278 MB ggml-org build, NOT the 229 MB lmstudio-community one — TASK-831 §5 attributes the delta to the optional SentenceTransformers dense modules, whose omission degrades embedding quality."
            }
          ]
        }
      ]
    }

  # ==========================================================================
  # THE MACHINE-READABLE MANIFEST.
  #
  # WHY A TSV AND NOT THE JSON ABOVE: the sync Job runs in `minio/mc`, which
  # ships NO `jq` and NO package manager to add one. This was found by actually
  # running the Job's script in that image, where it died on
  # `jq: command not found` — a failure that YAML validation, `sh -n`, and code
  # review all pass straight over.
  #
  # So `manifest.json` is the DOCUMENTATION (provenance, notes, revisions) and
  # this TSV is what the script parses with `read`. They are kept honest by
  # `deployment/verify-manifest.py`, which re-derives this table from the JSON
  # and diffs — run it after ANY manifest edit.
  #
  # Columns: key <TAB> sha256 <TAB> bytes
  manifest.tsv: |
    google/gemma-4-E2B-it-qat-q4_0-gguf/q4_0/gemma-4-E2B_q4_0-it.gguf	fa401b55b07ee70a54c6dae3903c783a6e65064312529ea57175cb5f8dec6634	3349516256
    google/gemma-4-E2B-it-qat-q4_0-gguf/q4_0/gemma-4-E2B-it-mmproj.gguf	021059cce659fe7f9170d5599761d7bbaf644b798dab9503aca30dc43e6beb14	986833664
    google/gemma-4-E4B-it-qat-q4_0-gguf/q4_0/gemma-4-E4B_q4_0-it.gguf	676c35070db6dbe52f93e9c864ee0fba4eddea94b9c875d9cb10daff453fbaee	5154941280
    google/gemma-4-E4B-it-qat-q4_0-gguf/q4_0/gemma-4-E4B-it-mmproj.gguf	7498a37cb619e55f2fcf87eb931f56e99389ed6d432e4c5c66110694c0d65578	991552256
    ibm-granite/granite-guardian-4.1-8b-GGUF/Q4_K_M/granite-guardian-4.1-8b-Q4_K_M.gguf	979114c9e6a589a1e37c2d597677555d3eb78c2856e920ed4ec97f7bded787a4	5116703808
    ggml-org/embeddinggemma-300M-qat-q4_0-GGUF/q4_0/embeddinggemma-300M-qat-Q4_0.gguf	50d28e22432a148f6f8a86eab3700f92add5d1f54baf7790675a2a4dadbccf26	277852192

  sync.sh: |
    #!/bin/sh
    # Download every manifest object from MinIO, verify it, and only then flip
    # the readiness sentinel. Idempotent: re-running skips files already present
    # with a matching digest, so this is safe as an ArgoCD PreSync hook.
    #
    # POSIX sh with NO jq — see the manifest.tsv note above. Verified by running
    # this exact script, unmodified, in minio/mc against a live MinIO.
    set -eu

    DEST="${DEST:-/models}"
    MANIFEST="${MANIFEST:-/manifest/manifest.tsv}"
    BUCKET="${BUCKET:-hope-models}"

    echo "sync: endpoint=${AWS_ENDPOINT_URL} bucket=${BUCKET} dest=${DEST}"

    # The sentinel is removed FIRST. If this Job dies midway, the volume stays
    # un-ready and every serving pod refuses to start (entrypoint assertion A-1
    # + the initContainer gate) rather than serving a half-synced model.
    rm -f "${DEST}/.ready"
    mkdir -p "${DEST}/staging"

    # The loop reads from a FILE, not a pipe, deliberately: `cmd | while read`
    # runs the body in a SUBSHELL, so `fail=1` would be discarded at the end of
    # the loop and a checksum mismatch would report a successful sync. Reading
    # from a redirected file keeps the body in the current shell.
    fail=0
    while IFS="$(printf '\t')" read -r key sha bytes; do
      [ -n "${key:-}" ] || continue
      target="${DEST}/staging/$(basename "$key")"

      # Skip work if a verified copy is already in place.
      if [ -f "$target" ]; then
        have="$(sha256sum "$target" | cut -d' ' -f1)"
        if [ "$have" = "$sha" ]; then
          echo "  ok (cached)  $(basename "$key")"
          continue
        fi
        echo "  stale, refetching: $(basename "$key")"
        rm -f "$target"
      fi

      echo "  fetching     s3://${BUCKET}/${key}"
      # `mc` over the LAN endpoint. TASK-828 §4b: the public tunnel hostname
      # s3.taphuynh.dev is ~248x slower (495.6 ms vs 2.0 ms) AND puts PHI-adjacent
      # traffic on the public internet AND makes the egress NetworkPolicy
      # unwritable, because the rule would have to allow Cloudflare's whole edge
      # range instead of a single /32.
      if ! mc cp --quiet "hope/${BUCKET}/${key}" "$target"; then
        echo "  FETCH FAILED $key"; fail=1; continue
      fi

      # --- verification gate 1: size --------------------------------------
      actual_bytes="$(stat -c %s "$target" 2>/dev/null || stat -f %z "$target")"
      if [ "$actual_bytes" != "$bytes" ]; then
        echo "  SIZE MISMATCH $key: expected ${bytes}, got ${actual_bytes}"; fail=1; continue
      fi

      # --- verification gate 2: sha256 ------------------------------------
      # The gate that catches the 15-17 July poisoned Gemma uploads, and any
      # truncated or partially-written object.
      actual_sha="$(sha256sum "$target" | cut -d' ' -f1)"
      if [ "$actual_sha" != "$sha" ]; then
        echo "  SHA MISMATCH  $key"
        echo "    expected $sha"
        echo "    actual   $actual_sha"
        rm -f "$target"; fail=1; continue
      fi

      # --- verification gate 3: GGUF magic --------------------------------
      # §3.3 step 2 wanted `gguf-dump.py --no-tensors --json` to assert file_type
      # and context_length. gguf-dump is not in this image, so we assert the
      # cheap structural invariant here — the first four bytes must be "GGUF".
      # A checksum-matching non-GGUF is impossible, so this is belt-and-braces
      # against a manifest that names the wrong object.
      magic="$(head -c 4 "$target" | tr -d '\0')"
      if [ "$magic" != "GGUF" ]; then
        echo "  NOT A GGUF    $key (magic='${magic}')"; rm -f "$target"; fail=1; continue
      fi

      echo "  verified     $(basename "$key")  ${bytes} B"
    done < "$MANIFEST"

    if [ "$fail" -ne 0 ]; then
      echo "sync: FAILED — sentinel NOT written; serving pods will refuse to start."
      exit 1
    fi

    # Publish atomically: everything verified in staging/ is hard-linked into
    # the flat serving directory, then the sentinel is written LAST.
    #
    # Hard links, not moves. This is the same discipline §4.10 demanded of
    # `lms import -L` — and for the same reason: a move empties the staging area,
    # so the next run has to re-download everything and an interrupted move
    # leaves neither copy intact. Here it also makes re-verification free.
    for f in "${DEST}"/staging/*.gguf; do
      [ -e "$f" ] || continue
      ln -f "$f" "${DEST}/$(basename "$f")"
    done

    date -u +%Y-%m-%dT%H:%M:%SZ > "${DEST}/.ready"
    echo "sync: OK — $(ls -1 "${DEST}"/*.gguf 2>/dev/null | wc -l) objects verified, sentinel written"
    ls -la "${DEST}"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: hope-llama-model-sync
  labels:
    app: hope-llama-cpp
    app.kubernetes.io/part-of: project-hope
  annotations:
    # PreSync so the volume is warm and verified BEFORE the serving Deployments
    # roll. Wave -1 matches the db-migrate.yaml shape called out in §14.4 item 9.
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: hope-llama-cpp
        app.kubernetes.io/part-of: project-hope
    spec:
      restartPolicy: OnFailure
      # §14.4 item 4 — required on EVERY pod spec, Jobs included, or CI's
      # `pull-secrets` job fails the pipeline.
      imagePullSecrets:
        - name: hope-registry-creds
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: sync
          # mc + jq + coreutils. Pinned, no :latest (§14.4 item 12 — CI's
          # image-hygiene job bans it).
          image: minio/mc:RELEASE.2025-04-16T18-13-26Z
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              mc --quiet config host add hope "$AWS_ENDPOINT_URL" \
                 "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" --api S3v4
              exec /bin/sh /scripts/sync.sh
          env:
            # LAN endpoint, never the public tunnel — TASK-828 §4b.
            - name: AWS_ENDPOINT_URL
              value: "https://10.10.1.102:9000"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: { name: hope-secrets, key: MINIO_ROOT_USER }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: hope-secrets, key: MINIO_ROOT_PASSWORD }
            # MinIO's leaf cert is issued by the private "ARCAAI Internal CA".
            # NOTE: `mc` does NOT read AWS_CA_BUNDLE — it reads certs from
            # ~/.mc/certs/CAs/. The CA is projected to BOTH paths below so the
            # same ConfigMap serves mc here and boto3/AWS-SDK consumers elsewhere.
            - name: AWS_CA_BUNDLE
              value: /etc/ssl/arcaai/ca.crt
            - name: SSL_CERT_FILE
              value: /etc/ssl/arcaai/ca.crt
            - name: MC_CONFIG_DIR
              value: /home/hope/.mc
          volumeMounts:
            - { name: models,    mountPath: /models }
            - { name: manifest,  mountPath: /manifest, readOnly: true }
            - { name: scripts,   mountPath: /scripts,  readOnly: true }
            - { name: arcaai-ca, mountPath: /etc/ssl/arcaai, readOnly: true }
            # mc reads its trust store from <config-dir>/certs/CAs/*.crt.
            - { name: arcaai-ca, mountPath: /home/hope/.mc/certs/CAs, readOnly: true }
          resources:
            requests: { cpu: "500m", memory: "512Mi" }
            limits:   { cpu: "2",    memory: "2Gi" }
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: hope-llama-models
        - name: manifest
          configMap:
            name: hope-llama-model-manifest
            # Both projected: the TSV is what sync.sh parses (no jq in
            # minio/mc); the JSON rides along so the provenance notes are
            # readable from inside a debugging exec.
            items:
              - { key: manifest.tsv,  path: manifest.tsv }
              - { key: manifest.json, path: manifest.json }
        - name: scripts
          configMap:
            name: hope-llama-model-manifest
            items: [{ key: sync.sh, path: sync.sh }]
        - name: arcaai-ca
          configMap:
            # SAME ConfigMap TASK-823 requires and which DOES NOT EXIST YET in
            # hope-v2-dev. Both tickets are blocked on it; see deployment/README.md
            # ROOT_CONFIG_REQUESTS. Deliberately fails closed
            # (CreateContainerConfigError) rather than skipping TLS verification
            # against the object store.
            name: arcaai-internal-ca
            items: [{ key: ca.crt, path: ca.crt }]

# =============================================================================
# TASK-824 — LM Studio (`llmster`) in-cluster serving tier
# =============================================================================
# STAGED, NOT APPLIED. Destination in `hope-v2-deployment`:
#     deployment/k8s/base/lmstudio.yaml
# The ORCHESTRATOR makes every commit to that repo (EXECUTION-PLAN §14.5).
#
# This file is SAFE to register in base/kustomization.yaml immediately: every
# workload in it ships at `replicas: 0` and the sync Job fails closed on an
# unfilled model version, so registering it changes nothing that serves.
#
# ⚠️ THE SERVICE IS DELIBERATELY NOT IN THIS FILE. It lives in
#    lmstudio-service-cutover.yaml, because applying it is the one irreversible,
#    outage-capable step in this migration. Read that file before touching it.
#
# ── THIS IS A MIGRATION, NOT A NEW DEPLOY (EXECUTION-PLAN §14.3) ─────────────
# LM Studio already serves this platform from the node HOST (10.10.1.10:1234),
# fronted by a selector-less Service + hand-written Endpoints applied OUTSIDE
# kustomize and Argo. Those two objects are retired by the cutover file, not by
# this one.
#
# ── ENGINE CHOICE: OWNER DECISION, NOT AN OPEN QUESTION (ticket §0) ──────────
# A prior lane recommended llama.cpp. The owner considered that and OVERRULED
# it: LM Studio + vLLM. The six risks that decision accepts (A-1..A-6) are
# recorded once in the ticket and are not re-argued here. Where a control below
# is weaker than the llama.cpp equivalent, the comment says so plainly rather
# than pretending parity.
# =============================================================================
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hope-lmstudio-models
  labels:
    app: hope-lmstudio
    app.kubernetes.io/part-of: project-hope
spec:
  accessModes:
    # The Job writes; the serving pod ALSO writes (see the Deployment's
    # readOnly:false note — `lms import` hard-links into the models tree and the
    # daemon maintains its index there). RWO is correct on single-node k3s.
    - ReadWriteOnce
  resources:
    requests:
      # Four models, vision on: 14.79 GiB (TASK-831 §6.3). The staging area
      # holds a SECOND copy only transiently — `lms import -L` hard-links, so a
      # published model occupies its bytes once, not twice (measured: link
      # count 1 -> 2, same inode). 60Gi leaves room to stage a replacement
      # prefix before deleting the old one, which is mandatory because
      # promotion is a NEW prefix and never an overwrite
      # (infrastructure/docker/minio/README.md §5.5).
      storage: 60Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hope-lmstudio-manifest
  labels:
    app: hope-lmstudio
    app.kubernetes.io/part-of: project-hope
data:
  # ==========================================================================
  # WHAT TO SYNC — one row per published model version.
  #     slug <TAB> version <TAB> role
  #
  # Slugs are TASK-832's (infrastructure/docker/minio/README.md §5.1), which
  # lowercases the catalogue id. This ticket does NOT define the bucket layout;
  # it consumes it.
  #
  # ⚠️ THE `version` VALUES ARE PLACEHOLDERS AND THE JOB REFUSES TO RUN WITH
  # THEM. `<version>` is content-addressed (`<quant>-<sha256-12>` of
  # manifest.json) and is only knowable AFTER publication. Failing closed on a
  # placeholder is deliberate: a silently-wrong version syncs a DIFFERENT model
  # and content-addressed prefixes make that undetectable downstream.
  #
  # `qwen3.5-4b` is deliberately absent — TASK-831 §4.2 recommends dropping it
  # (no first-party GGUF, a RETIRED slug that must not be reused, and it is
  # what collapses the KV budget on the card hosting the guardrail model).
  models.tsv: |
    gemma4-e2b-it-qat	SET-AT-PUBLISH	llm
    gemma4-e4b-it-qat	SET-AT-PUBLISH	llm
    granite-guardian-4.1-8b	SET-AT-PUBLISH	llm
    text-embedding-embeddinggemma-300m-qat	SET-AT-PUBLISH	embeddings

  # ==========================================================================
  # HOW TO PUBLISH EACH STAGED FILE INTO LM STUDIO'S CATALOGUE
  #     <staged-relative-path> <TAB> <publisher>/<model> <TAB> <expected key>
  #
  # ── WHY THIS FILE EXISTS AT ALL ────────────────────────────────────────────
  # TASK-832's bucket is keyed `<slug>/<version>/`. LM Studio resolves models
  # from a `<publisher>/<model>/` directory tree. Something must bridge the two
  # shapes, and `lms import --user-repo` IS that bridge — which is precisely why
  # the bucket layout does NOT need to change to accommodate this engine.
  #
  # ── THE THIRD COLUMN IS THE §7.4 TRAP, DEFUSED ─────────────────────────────
  # MEASURED (llmster 0.0.23-1, 2026-08-30): the model key is derived from the
  # <model> SEGMENT OF --user-repo, not from the filename. Importing a file
  # named `hope-test-model.gguf` as `hopetest/imported-model` produced the key
  # `text-embedding-imported-model`.
  #
  # That matters because `resolveTextSelectionForKey` puts `AiModel.sourceUri`
  # on the wire as the OpenAI `model` field. If the key LM Studio advertises
  # differs from the seed row's sourceUri, EVERY generation 404s. The seed
  # values are test-pinned by `ai-model-consolidation-seed.test.ts`, so they are
  # the fixed point and the <model> segment is what must match them:
  #     seed/ai-models/llm.ts:114  sourceUri 'gemma-4-e2b-it-qat'
  #     seed/ai-models/llm.ts:135  sourceUri 'gemma-4-e4b-it-qat'
  #     seed/ai-models/llm.ts:65   sourceUri 'granite-guardian-4.1-8b'
  #
  # entrypoint.sh asserts every expected key is visible before it serves, so a
  # wrong guess here fails at POD START with exit 78 — not at 3am on a clinical
  # request.
  #
  # ⚠️ EMBEDDING MODELS GET A `text-embedding-` PREFIX ADDED BY LM STUDIO.
  # MEASURED: directory `hope-embed-test` -> key `text-embedding-hope-embed-test`.
  # So the <model> segment is `embeddinggemma-300m-qat` and the resulting key is
  # `text-embedding-embeddinggemma-300m-qat`, which is exactly TASK-832's slug.
  # Naming the directory with the prefix already on it would double it.
  #
  # ⚠️ THE PROJECTORS ARE NOT LISTED, AND THAT IS AN OPEN ITEM, NOT AN OMISSION.
  # Gemma 4 E2B/E4B ship a separate `*-mmproj.gguf` carrying BOTH the vision and
  # audio encoders. llama.cpp needs an explicit `--mmproj`; whether LM Studio
  # auto-pairs a projector sitting next to the weights in the same
  # <publisher>/<model>/ directory is UNVERIFIED — see AUDIO_VERDICT in the
  # handover README. The sync places them on the volume regardless; how they are
  # activated must be settled before any multimodal traffic.
  imports.tsv: |
    # staged path	publisher/model	expected key
    gemma4-e2b-it-qat/gemma-4-E2B_q4_0-it.gguf	hope/gemma-4-e2b-it-qat	gemma-4-e2b-it-qat
    gemma4-e4b-it-qat/gemma-4-E4B_q4_0-it.gguf	hope/gemma-4-e4b-it-qat	gemma-4-e4b-it-qat
    granite-guardian-4.1-8b/granite-guardian-4.1-8b-Q4_K_M.gguf	hope/granite-guardian-4.1-8b	granite-guardian-4.1-8b

  sync.sh: |
    #!/bin/sh
    # MinIO -> PVC warm sync for the LM Studio serving tier.
    #
    # Contract:  fetch prefix -> verify SHA256SUMS -> flip .ready
    # The catalogue registration step (`lms import`) is NOT here: `minio/mc`
    # ships no `lms`, and the import must run where the daemon and the models
    # tree are — i.e. in the serving container. entrypoint.sh A-3 does it.
    #
    # POSIX sh with NO jq: `minio/mc` ships neither jq nor a package manager to
    # add one (found the hard way by a prior lane, whose script died on
    # `jq: command not found`). Verifying against the prefix's plain-text
    # SHA256SUMS instead of a JSON manifest makes that a non-issue AND keeps ONE
    # source of truth — digests are never copied into this repo.
    #
    # Idempotent: a prefix already present and correct is re-verified and
    # skipped, so this is safe as an ArgoCD PreSync hook.
    set -eu

    DEST="${DEST:-/models}"
    STAGING="${DEST}/staging"
    MODELS="${MODELS:-/manifest/models.tsv}"
    BUCKET="${BUCKET:-hope-models}"

    echo "sync: endpoint=${AWS_ENDPOINT_URL} bucket=${BUCKET} dest=${DEST}"

    # The sentinel goes FIRST. If this Job dies midway the volume stays un-ready
    # and every serving pod refuses to start (entrypoint A-0 + the await-models
    # initContainer) rather than serving a half-synced model.
    rm -f "${DEST}/.ready"
    mkdir -p "${STAGING}"

    fail=0
    # Read from a redirected FILE, not a pipe: `cmd | while read` runs the body
    # in a SUBSHELL, so `fail=1` would be discarded at the end of the loop and a
    # checksum mismatch would report a SUCCESSFUL sync.
    while IFS="$(printf '\t')" read -r slug version role; do
      [ -n "${slug:-}" ] || continue
      case "${slug}" in \#*) continue ;; esac

      if [ "$version" = "SET-AT-PUBLISH" ] || [ -z "${version:-}" ]; then
        echo "  FATAL ${slug}: version is unset. The prefix is content-addressed"
        echo "        (<quant>-<sha256-12> of manifest.json) and is known only after"
        echo "        publication. Fill models.tsv — see deployment-llmster/README.md R-3."
        fail=1; continue
      fi

      prefix="${slug}/${version}"
      stage="${STAGING}/${slug}"
      echo "  syncing s3://${BUCKET}/${prefix}  (role=${role})"
      mkdir -p "$stage"

      # LAN endpoint, never the public tunnel. TASK-832: s3.taphuynh.dev is a
      # Cloudflare Tunnel with no Access app in front — 495.6 ms vs 2.0 ms
      # measured, it puts PHI-adjacent traffic on the public internet, and it
      # makes the egress NetworkPolicy unwritable (the rule would have to allow
      # Cloudflare's whole edge range instead of a single /32).
      #
      # `--insecure` — TLS verification deliberately disabled, same reason and
      # same reversal as the `config host add` line in the container args. It is
      # NOT inherited from that call: mc evaluates the flag per invocation, so
      # omitting it here would fail the mirror while the alias add succeeded.
      if ! mc mirror --quiet --insecure --overwrite "hope/${BUCKET}/${prefix}/" "$stage/"; then
        echo "  FETCH FAILED ${prefix}"; fail=1; continue
      fi

      # --- the verification gate --------------------------------------------
      # SHA256SUMS is written by the publisher from the bytes it uploaded
      # (minio/README.md §5.5 step 1) and shipped in the prefix for exactly this
      # `shasum -c` interop.
      if [ ! -f "${stage}/SHA256SUMS" ]; then
        echo "  NO SHA256SUMS in ${prefix} — refusing to trust this prefix"
        fail=1; continue
      fi
      if ! ( cd "$stage" && sha256sum -c SHA256SUMS ); then
        echo "  CHECKSUM MISMATCH in ${prefix}"
        fail=1; continue
      fi
      echo "  verified ${prefix}"
    done < "$MODELS"

    if [ "$fail" -ne 0 ]; then
      echo "sync: FAILED — sentinel NOT written; serving pods will refuse to start."
      exit 1
    fi

    date -u +%Y-%m-%dT%H:%M:%SZ > "${DEST}/.ready"
    echo "sync: OK — staged and verified; sentinel written."
    echo "sync: the serving pod publishes these into LM Studio's catalogue via"
    echo "      'lms import -L' (entrypoint A-3) — there is no rescan API."
    ls -la "${STAGING}"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: hope-lmstudio-model-sync
  labels:
    app: hope-lmstudio
    app.kubernetes.io/part-of: project-hope
  annotations:
    # PreSync/wave -1 so the volume is warm and verified BEFORE the serving
    # Deployment rolls. Matches the db-migrate.yaml shape (§14.4 item 9).
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: hope-lmstudio
        app.kubernetes.io/part-of: project-hope
        # ADDED 2026-08-30, and it is load-bearing rather than decorative.
        # NetworkPolicy selects PODS BY LABEL, and this Job pod carries
        # `app: hope-lmstudio` — so `hope-lmstudio-egress` (DNS only) selects it
        # too, and would block the very `mc mirror` this Job exists to run.
        # This extra label lets `hope-lmstudio-model-sync-egress` (bottom of this
        # file) grant MinIO egress to the JOB ALONE. Policies are additive, so
        # the Job gets DNS + MinIO while the serving pod keeps DNS only.
        app.kubernetes.io/component: model-sync
    spec:
      restartPolicy: OnFailure
      # §14.4 item 4 — required on EVERY pod spec, Jobs included, or CI's
      # `pull-secrets` job fails the pipeline.
      imagePullSecrets:
        - name: hope-registry-creds
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: sync
          # Pinned, no :latest (CI's image-hygiene job bans it).
          image: minio/mc:RELEASE.2025-04-16T18-13-26Z
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              # ══ TLS VERIFICATION IS DELIBERATELY DISABLED HERE ══════════════
              # `--insecure` REPLACES the SSL_CERT_FILE + /etc/ssl/arcaai/ca.crt
              # mount that used to be here. The transport is still https:// (see
              # config/lmstudio.env); what is gone is the private CA and the
              # verification of the peer. Owner directive 2026-08-30: no CA at
              # all, authentication is the MinIO service account and nothing
              # else, PHI hardening de-prioritised for now.
              # ⚠️ This encrypts but does not authenticate the peer. Reinstating
              # is two edits — drop `--insecure` HERE and from `mc mirror` in
              # sync.sh below, and restore SSL_CERT_FILE + the CA volume.
              mc --quiet --insecure config host add hope "$AWS_ENDPOINT_URL" \
                 "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" --api S3v4
              exec /bin/sh /scripts/sync.sh
          env:
            # THE ENDPOINT IS NOT A SECRET — it is a LAN transport address, which
            # `09-infrastructure-devops.md` §Configuration Tiers puts squarely in
            # the `env` tier. CHANGED 2026-08-30: it was a hardcoded literal here
            # (and `hope-secrets.MINIO_ENDPOINT` elsewhere in the platform); it is
            # now a NON-OPTIONAL configMapKeyRef, so a missing key fails the Job
            # as CreateContainerConfigError instead of silently defaulting.
            #
            # The value is PLAIN HTTP by owner directive 2026-08-30 — see
            # config/lmstudio.env for the full rationale, the cost, and the
            # one-line rollback if MinIO's listener is still TLS.
            - name: AWS_ENDPOINT_URL
              valueFrom:
                configMapKeyRef:
                  name: hope-lmstudio-config
                  key: LMSTUDIO_S3_ENDPOINT_URL
            # THE ONLY AUTHENTICATION TO MinIO: a MinIO SERVICE ACCOUNT.
            # `hope-models-reader` — ListBucket/GetObject/GetObjectVersion on
            # hope-models ONLY, and NO DeleteObject (minio/README.md §4). This
            # Job must never hold the root key or the publisher key: a weight
            # fetch has no business with a credential that can write PHI buckets.
            # TASK-823's vLLM pod reads the SAME Secret and keys — one service
            # account serves both serving tiers.
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: { name: hope-models-reader, key: accessKeyId }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: hope-models-reader, key: secretAccessKey }
            # ⚠️ SSL_CERT_FILE AND THE /etc/ssl/arcaai MOUNT WERE REMOVED HERE ON
            # 2026-08-30 (owner directive). There is no TLS on this path any more,
            # so there is no private CA to trust and `ROOT_CONFIG_REQUEST R-1`
            # (create ConfigMap `arcaai-internal-ca`) is CANCELLED — see README §3.
            # Do not re-add either without also flipping the scheme in
            # config/lmstudio.env; an SSL_CERT_FILE against an http:// endpoint is
            # inert and misleading.
            - name: MC_CONFIG_DIR
              value: /home/hope/.mc
          volumeMounts:
            - { name: models,    mountPath: /models }
            - { name: manifest,  mountPath: /manifest, readOnly: true }
            - { name: scripts,   mountPath: /scripts,  readOnly: true }
            # ⚠️ REQUIRED, AND ITS ABSENCE WAS A HARD FAILURE — not a nicety.
            # MEASURED 2026-08-30 on a single-node k8s by running THIS Job:
            #     mc: <ERROR> Unable to save new mc config.
            #                 mkdir /home/hope: permission denied.
            # `minio/mc` has no /home/hope, /home is root-owned, and the pod runs
            # as uid 10001 — so the very first command (`mc config host add`)
            # died before a single byte was fetched. An emptyDir gives uid 10001
            # (fsGroup 10001) a writable HOME. Deleting this mount reintroduces
            # the failure; pointing MC_CONFIG_DIR at /tmp would also work today
            # but breaks the moment readOnlyRootFilesystem is set.
            - { name: mc-config, mountPath: /home/hope }
          resources:
            requests: { cpu: "500m", memory: "512Mi" }
            limits:   { cpu: "2",    memory: "2Gi" }
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: hope-lmstudio-models
        - name: manifest
          configMap:
            name: hope-lmstudio-manifest
            items:
              - { key: models.tsv, path: models.tsv }
        - name: scripts
          configMap:
            name: hope-lmstudio-manifest
            items: [{ key: sync.sh, path: sync.sh }]
        # Writable HOME for `mc` — see the volumeMount comment above.
        - name: mc-config
          emptyDir: {}
        # (The `arcaai-ca` volume was removed on 2026-08-30 — see the
        # SSL_CERT_FILE note in the container's env block above. This Job now
        # depends on exactly ONE hand-created object: the `hope-models-reader`
        # Secret.)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hope-lmstudio
  labels:
    app: hope-lmstudio
    app.kubernetes.io/part-of: project-hope
spec:
  # ==========================================================================
  # SHIPS AT ZERO, DELIBERATELY. Same posture as TASK-823's vllm.yaml.
  # ==========================================================================
  # LM Studio ALREADY RUNS ON THE NODE HOST and holds VRAM the k8s scheduler
  # cannot see. Scaling this to 1 while that instance is still running competes
  # for the same two 15.99 GiB cards with NO isolation of any kind — TASK-831
  # §6.1: no MIG, no MPS, no vGPU, just time-slicing handing out fungible
  # permits. Per TASK-823 §2A.1 one pod's CUDA OOM can crash every pod sharing
  # the card, and the likely casualty is `hope-stt`, a WORKING PRODUCTION
  # capability.
  #
  # Scale to 1 ONLY after:
  #   1. reading actual free VRAM on the node
  #      (nvidia-smi --query-gpu=memory.used,memory.total --format=csv), AND
  #   2. stopping or accounting for the host LM Studio instance, AND
  #   3. completing the Service cutover in lmstudio-service-cutover.yaml.
  replicas: 0
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
    type: RollingUpdate
  selector:
    matchLabels: { app: hope-lmstudio }
  template:
    metadata:
      labels:
        app: hope-lmstudio
        app.kubernetes.io/part-of: project-hope
      # NOTE: no prometheus.io/* annotations, and that is a MEASURED fact, not
      # an oversight. LM Studio exposes NO metrics endpoint: GET /metrics
      # returns 200 with {"error":"Unexpected endpoint or method. (GET
      # /metrics)"}. This is a real observability REGRESSION versus llama.cpp
      # (which serves Prometheus metrics) and is a consequence of the engine
      # decision, recorded rather than hidden. Scrape annotations here would be
      # decorative and would imply a signal that does not exist.
    spec:
      runtimeClassName: nvidia
      imagePullSecrets:
        - name: hope-registry-creds
      # L-5: the Service must drop this endpoint BEFORE the process gets
      # SIGTERM, and the grace period must exceed the longest generation.
      terminationGracePeriodSeconds: 180
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        # fsGroup is load-bearing here, not boilerplate: the serving container
        # WRITES to the models volume (`lms import` hard-links into the tree and
        # the daemon maintains its index there), so the PVC must be group-owned
        # by the runtime UID.
        fsGroup: 10001
      affinity:
        podAntiAffinity:
          # SOFT only — single node (§14.4 item 7). `required` is unschedulable.
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: { app: hope-lmstudio }
      initContainers:
        # Belt to the entrypoint's braces. entrypoint.sh A-0 refuses to exec
        # without /models/.ready; this refuses to even START the container, so a
        # failed sync surfaces as Init:CrashLoopBackOff — which names the actual
        # problem — instead of a serving container flapping.
        - name: await-models
          image: busybox:1.36.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              echo "waiting for verified model volume (/models/.ready)..."
              i=0
              while [ ! -f /models/.ready ]; do
                i=$((i+1))
                [ "$i" -gt 120 ] && { echo "timeout: sync Job has not published .ready"; exit 1; }
                sleep 5
              done
              echo "model volume verified at $(cat /models/.ready)"
          volumeMounts:
            - { name: models, mountPath: /models, readOnly: true }
      containers:
        - name: lmstudio
          # Overlay sets newName + digest (§14.4 item 11). Built by CI only —
          # .gitlab/ci/build.yml `build-lmstudio`, gated by
          # `verify-lmstudio-runtime`, which fails the pipeline if the image
          # turns out to be CPU-only. NEVER built or pushed from a workstation:
          # the upstream installer selects its bundle from the BUILD HOST, so a
          # laptop or a GPU-less runner silently produces a CPU-only image.
          image: registry.taphuynh.dev/hope/lmstudio:dev
          env:
            - { name: LMS_PORT, value: "1234" }
            # MANDATORY. MEASURED: a fresh container's daemon records
            # {"host":"127.0.0.1","port":41343} — loopback on a RANDOM high
            # port. `lms server start` defaults its port to "the same port as
            # the last time it was started", and a fresh container has no last
            # time. Omitting either value does not fall back to 0.0.0.0:1234; it
            # lands somewhere unreachable, the pod looks healthy from inside,
            # and every request from `apps/text` is refused.
            - { name: LMS_SERVER_HOST, value: "0.0.0.0" }
            # ---- the anti-silent-CPU control (ticket §0 risk A-3) -----------
            # `strict` makes entrypoint A-2 exit 78 when no GPU is present.
            # §8.4: a CPU-only deployment is UNDETECTABLE OVER HTTP, so this is
            # the only place it can be caught. Do not set this to `warn` to make
            # a pod start — a started pod that serves on CPU is the failure.
            - { name: HOPE_ACCEL_ENFORCE, value: "strict" }
            # HOPE_EXPECT_ACCEL is intentionally NOT set here. It is baked into
            # the image from the build arg, so a manifest cannot weaken the
            # guarantee by declaring a weaker expectation than the bundle
            # delivers.
            - { name: HOPE_IMPORT_MAP, value: "/manifest/imports.tsv" }
            # Preload one model so readiness means something. Multi-model
            # residency is NOT configured here: TASK-831 §6.4's per-card plan is
            # not enforceable under time-slicing, and `--models-max` has no LM
            # Studio equivalent. Add models only after measuring free VRAM.
            - { name: LMS_LOAD,     value: "gemma-4-e2b-it-qat" }
            - { name: LMS_GPU,      value: "max" }
            - { name: LMS_CONTEXT,  value: "8192" }
            # Max Concurrent Predictions. Source-verified, absent from the
            # published docs, default 4, llama.cpp runtime only. §6: raising
            # this without raising batch size just spreads the same throughput
            # across more queues — latency rises, aggregate tok/s does not.
            - { name: LMS_PARALLEL, value: "4" }
            # Stable instance id, so the readiness probe can grep for it.
            - { name: LMS_IDENTIFIER, value: "hope-primary" }
          ports:
            - { name: http, containerPort: 1234, protocol: TCP }
          # ---- PROBES ------------------------------------------------------
          # ⚠️ EVERY PROBE HERE IS AN `exec`, AND THAT IS MANDATORY, NOT STYLE.
          #
          # MEASURED (llmster 0.0.23-1) — LM Studio returns HTTP 200 for paths
          # that do not exist:
          #     /lmstudio-greeting        200 {"lmstudio":true}
          #     /this-path-does-not-exist 200 {"error":"Unexpected endpoint..."}
          #     /health                   200 {"error":"Unexpected endpoint..."}
          #     /totally/bogus            200 {"error":"Unexpected endpoint..."}
          #
          # A k8s `httpGet` probe inspects ONLY the status code. Therefore NO
          # httpGet probe on this server can ever fail — it would report a dead
          # or broken pod as healthy, forever. The body is the only signal, and
          # only `exec` can read it. Do not "simplify" these into httpGet.
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - curl -fsS http://127.0.0.1:1234/lmstudio-greeting | grep -q '"lmstudio":[[:space:]]*true'
            periodSeconds: 10
            failureThreshold: 90      # up to 15 min: cold PVC read + model load
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - curl -fsS http://127.0.0.1:1234/lmstudio-greeting | grep -q '"lmstudio":[[:space:]]*true'
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            # READINESS IS NOT /v1/models. §4.3 proposed turning JIT off and
            # gating on it; MEASURED: there is NO JIT control anywhere in the
            # CLI (not on `lms server start`, not on `lms load`, not on
            # `lms server`), and with JIT on /v1/models lists every model ON
            # DISK regardless of load state — both test models appeared with
            # nothing loaded. It is therefore useless as a readiness signal,
            # exactly as §4.3 warns.
            #
            # MEASURED alternative: GET /api/v1/models returns, per model,
            #     "key": "...", "loaded_instances": [ { "id": "<identifier>" } ]
            # and loaded_instances is EMPTY for a model merely on disk. Grepping
            # for the identifier we passed to `lms load --identifier` proves
            # THIS pod has THAT model resident.
            exec:
              command:
                - /bin/sh
                - -c
                - curl -fsS http://127.0.0.1:1234/api/v1/models | grep -q '"hope-primary"'
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              exec: { command: ["/bin/sh", "-c", "sleep 10"] }
          resources:
            requests:
              cpu: "2"
              # >= weights + KV. E2B 3.12 GiB + mmproj 0.92 + KV headroom.
              # Host RAM request covers the mmap'd read during load.
              memory: "12Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "8"
              memory: "20Gi"
              nvidia.com/gpu: "1"
          volumeMounts:
            # NOT readOnly. `lms import` hard-links into the models tree and the
            # daemon maintains its index there, so the serving container needs
            # write access to this volume. This is a genuine difference from a
            # llama.cpp deployment, where the same volume can be mounted ro.
            - { name: models,   mountPath: /data }
            - { name: manifest, mountPath: /manifest, readOnly: true }
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: hope-lmstudio-models
        - name: manifest
          configMap:
            name: hope-lmstudio-manifest
            items: [{ key: imports.tsv, path: imports.tsv }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hope-lmstudio-ingress
  labels:
    app: hope-lmstudio
    app.kubernetes.io/part-of: project-hope
spec:
  podSelector:
    matchLabels: { app: hope-lmstudio }
  policyTypes: [Ingress]
  ingress:
    # ⚠️ THIS IS THE ONLY ENFORCEMENT POINT, NOT DEFENCE IN DEPTH (§5 L-1,
    # ticket §0 risk A-4). LM Studio auth is off by default and there is NO
    # headless way to mint a token: grepping `lms/src` for
    # apiToken|requireAuth|createToken|bearer returns zero hits, and `lms`
    # issue #489 confirms it. The alternative — minting a token on a GUI
    # machine and baking the config dir into the image — creates an
    # unrotatable, GUI-minted secret, which is worse.
    #
    # This is a REGRESSION versus the llama.cpp option, which supports
    # --api-key-file and would have made this policy defence in depth. It is an
    # accepted consequence of the engine decision, named here rather than
    # papered over. Treat any change to this peer list as a security change.
    #
    # ── THE PEER SET: `hope-text` PLUS THE TWO HARNESS WORKLOADS ────────────
    # OWNER RULING 2026-08-30 (SUPERSEDES the earlier "hope-text and nothing
    # else" reading recorded in ../README.md §4A as OPEN-824-HARNESS).
    #
    # The earlier ruling was that internal peers reach LM Studio THROUGH the
    # gateway. It was overturned on measurement, not preference: the gateway's
    # text surface is BUSINESS-plane — `UnifiedAuthGuard` accepts a
    # service-account token, an API key or a JWT, and never `X-Service-Token`
    # — so neither harness workload can authenticate to it today, and the
    # credential that would let them is tenant-bound with no wildcard. Holding
    # the narrow peer set would therefore not have routed harness through the
    # gateway; it would only have cut it off.
    #
    #   hope-text — reaches LM Studio per request through the LMStudioProvider
    #               adapter using the baseUrl on the SYSTEM AiProviderConnection
    #               row (`http://hope-lmstudio:1234/v1`, README §5).
    #
    #   hope-harness, hope-harness-worker — dial LM Studio DIRECTLY for
    #               Institutional-RAG embeddings
    #               (`HARNESS_RETRIEVAL_EMBEDDINGS_BASE_URL`, hope-v2-deployment
    #               base/harness.yaml:110 and base/harness-worker.yaml:123).
    #               These callers are LIVE against the out-of-band Service and
    #               are admitted here so the Service cutover does not present as
    #               an embeddings outage. This is an embeddings path, not a
    #               generation path — it does not go through the router, and
    #               widening it does not license a generation call.
    #
    # ⚠️ EVERY ENTRY IN THIS LIST IS UNCONDITIONAL ACCESS. LM Studio has NO
    # authentication of any kind — its `/v1` surface accepts any bearer token
    # including none — so this policy is the ONLY control, not defence in
    # depth. Adding a pod label here grants that workload the full engine.
    # Treat any change to this list as a security change, and prefer routing a
    # new consumer through `hope-text` over adding it here.
    #
    # Deliberately ABSENT, each for a reason:
    #   hope-guardrail — no longer dials an LLM directly. base/guardrail.yaml
    #     sets TEXT_URL/NLP_URL and its GUARDRAIL_OPENAI_COMPAT_* engine config
    #     was deleted (06-python-services.md). The "guardrail path" the cutover
    #     file mentions is guardrail -> text -> lmstudio, and hope-text is
    #     already allowed. Do not add guardrail "because the cutover file says
    #     it carries the guardrail path" — that path is indirect.
    #   hope-nlp, hope-api, hope-admin-console — no reference to :1234 anywhere
    #     in hope-v2-deployment or in this repo's service code. If one acquires
    #     a direct dependency, route it through hope-text rather than widening.
    #   prometheus — LM Studio exposes NO metrics endpoint (measured: GET
    #     /metrics returns 200 with "Unexpected endpoint or method"). A scrape
    #     rule would imply a signal that does not exist.
    - from:
        - podSelector:
            matchLabels: { app: hope-text }
        - podSelector:
            matchLabels: { app: hope-harness }
        - podSelector:
            matchLabels: { app: hope-harness-worker }
      ports: [{ protocol: TCP, port: 1234 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hope-lmstudio-egress
  labels:
    app: hope-lmstudio
    app.kubernetes.io/part-of: project-hope
spec:
  podSelector:
    matchLabels: { app: hope-lmstudio }
  policyTypes: [Egress]
  egress:
    # DNS FIRST. Omitting this is the classic egress-policy outage.
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
  # ==========================================================================
  # AND NOTHING ELSE FOR THE SERVING POD. What is ABSENT here is the point:
  #
  #   * No MinIO rule. Unlike vLLM, which streams weights from S3 at runtime,
  #     this pod reads weights from a PVC the sync Job already warmed. The
  #     serving pod never speaks S3.
  #
  #     ⚠️ CORRECTION 2026-08-30 — that reasoning was right about the SERVING
  #     POD and wrong about what this policy SELECTS. A NetworkPolicy selects
  #     pods by label, and the model-sync Job's pod template also carries
  #     `app: hope-lmstudio`, so this DNS-only policy selected the Job as well
  #     and would have blocked its `mc mirror` outright on any cluster that
  #     actually enforces NetworkPolicy. The fix is the separate, narrower
  #     `hope-lmstudio-model-sync-egress` policy at the bottom of this file —
  #     NOT a MinIO rule here, which would hand the serving pod an S3 path it
  #     has no use for.
  #
  #   * No huggingface.co. §3.1b noted that LM Studio's native
  #     POST /api/v1/models/download accepts a catalog id or an HF URL and would
  #     egress to huggingface.co FROM A PHI NAMESPACE. Choosing to mirror into
  #     MinIO instead is what lets this rule stay empty — and it also means the
  #     console's "download a model" affordance CANNOT work in this namespace.
  #     That is deliberate: weights are checksum-pinned and the serving
  #     namespace has no internet path at all.
  #   * L-3 asked to block telemetry egress and to verify no first-run analytics
  #     call. This closed policy makes the question moot rather than trusting
  #     the answer — which matters more here than it did for llama.cpp, because
  #     LM Studio is closed-source and its telemetry behaviour cannot be read
  #     from source. §4.9 item 9 (offline cold start with egress blocked) is
  #     still UNVERIFIED and must be proven on first deploy.
  # ==========================================================================
---
# ══════════════════════════════════════════════════════════════════════════
# The model-sync Job's egress. ADDED 2026-08-30.
# ══════════════════════════════════════════════════════════════════════════
#
# WHY THIS EXISTS AS A SECOND POLICY RATHER THAN A RULE IN THE ONE ABOVE:
# NetworkPolicies are ADDITIVE. A pod selected by two policies may do the UNION
# of what they allow. The sync Job's pod carries BOTH `app: hope-lmstudio` and
# `app.kubernetes.io/component: model-sync`, so it gets DNS (from the policy
# above) + MinIO (from this one). The SERVING pod carries only the first label,
# so it gets DNS and no S3 path at all — which is the property the policy above
# was written to have, and which a MinIO rule added there would have destroyed.
#
# This is also the fix for a real defect: before this file existed, the DNS-only
# egress policy selected the Job and would have blocked `mc mirror` on any
# cluster enforcing NetworkPolicy. The Job would have failed closed (no `.ready`
# sentinel, serving pod refuses to start), so the symptom would have presented
# as "the models never sync" rather than as a networking change.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hope-lmstudio-model-sync-egress
  labels:
    app: hope-lmstudio
    app.kubernetes.io/component: model-sync
    app.kubernetes.io/part-of: project-hope
spec:
  podSelector:
    matchLabels:
      app: hope-lmstudio
      app.kubernetes.io/component: model-sync
  policyTypes: [Egress]
  egress:
    # DNS. Repeated deliberately: a policy's rules are not inherited, and if the
    # sibling policy above is ever narrowed this Job must still resolve names.
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    # MinIO S3 API on the LAN, https (TLS, verification disabled at the client —
    # see the container args). 9001 is the console and is deliberately absent.
    # A single /32 — this is only expressible because the endpoint is the LAN
    # host and not the Cloudflare tunnel (TASK-832).
    - to:
        - ipBlock:
            cidr: 10.10.1.102/32
      ports:
        - { protocol: TCP, port: 9000 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: hope-lmstudio
  labels:
    app: hope-lmstudio
    app.kubernetes.io/part-of: project-hope
spec:
  # Inert but present, per §14.4 item 8 ("the primitive exists uniformly").
  # minAvailable: 0 is correct while replicas: 0.
  minAvailable: 0
  selector:
    matchLabels: { app: hope-lmstudio }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hope-lmstudio
  labels:
    app: hope-lmstudio
    app.kubernetes.io/part-of: project-hope
spec:
  # Deliberately INERT (min == max), the same shape as stt.yaml's HPA and for
  # the same reason: CPU-based autoscaling is wrong for a GPU pod, and there is
  # exactly one GPU-capable node. Present for uniformity only.
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hope-lmstudio
  minReplicas: 1
  maxReplicas: 1
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 90

apiVersion: v1
kind: Namespace
metadata:
  name: hope-lab
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-root
  namespace: hope-lab
stringData:
  MINIO_ROOT_USER: labadmin
  MINIO_ROOT_PASSWORD: labadmin12345
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: hope-lab
spec:
  replicas: 1
  selector: { matchLabels: { app: minio } }
  template:
    metadata:
      labels: { app: minio }
    spec:
      containers:
        - name: minio
          image: minio/minio:RELEASE.2025-04-22T22-12-26Z
          args: ["server", "/data", "--console-address", ":9001"]
          envFrom:
            - secretRef: { name: minio-root }
          ports:
            - { containerPort: 9000, name: s3 }
            - { containerPort: 9001, name: console }
          volumeMounts:
            - { name: data, mountPath: /data }
          readinessProbe:
            httpGet: { path: /minio/health/live, port: 9000 }
            initialDelaySeconds: 3
            periodSeconds: 3
      volumes:
        - name: data
          emptyDir: { sizeLimit: 20Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: hope-lab
spec:
  selector: { app: minio }
  ports:
    - { name: s3, port: 9000, targetPort: 9000 }
    - { name: console, port: 9001, targetPort: 9001 }

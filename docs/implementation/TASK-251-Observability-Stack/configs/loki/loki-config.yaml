###############################################################################
# Grafana Loki Configuration — HOPE Observability Stack
#
# Image: grafana/loki:3.7.1
# Deployment: VM 400 (10.10.1.100)
# Mode: Single binary (monolithic) — suitable for up to ~20 GB/day
# Purpose: Log aggregation with label-based indexing, 30-day local retention
###############################################################################

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: "2026-04-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

ingester:
  chunk_encoding: snappy
  chunk_idle_period: 1h
  max_chunk_age: 2h
  chunk_target_size: 1572864  # ~1.5 MB
  flush_check_period: 30s

storage_config:
  filesystem:
    directory: /loki/chunks

  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache

limits_config:
  retention_period: 720h  # 30 days
  ingestion_rate_mb: 10
  ingestion_burst_size_mb: 20
  max_query_parallelism: 8
  max_query_series: 5000
  max_entries_limit_per_query: 10000
  allow_structured_metadata: true
  volume_enabled: true

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150
  delete_request_store: filesystem

querier:
  max_concurrent: 4

query_scheduler:
  max_outstanding_requests_per_tenant: 2048

ruler:
  storage:
    type: local
    local:
      directory: /loki/rules
  rule_path: /loki/rules-tmp
  enable_api: true

analytics:
  reporting_enabled: false

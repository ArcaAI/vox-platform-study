###############################################################################
# Grafana Configuration — HOPE Observability Stack
#
# Image: grafana/grafana:12.4.2
# Deployment: VM 400 (10.10.1.100)
# Purpose: Unified dashboards, alerting, and Faro RUM receiver
###############################################################################

[server]
http_port = 3000
root_url = https://grafana.taphuynh.dev
serve_from_sub_path = false

[security]
admin_user = admin
admin_password = ${GF_SECURITY_ADMIN_PASSWORD}

[auth.anonymous]
enabled = false

[analytics]
reporting_enabled = false

[unified_alerting]
enabled = true

[alerting]
enabled = false

[feature_toggles]
enable = traceToMetrics tempoSearch tempoBackendSearch tempoServiceGraph

[plugin.grafana-pyroscope-app]
enabled = false

[app.faro]
enabled = true

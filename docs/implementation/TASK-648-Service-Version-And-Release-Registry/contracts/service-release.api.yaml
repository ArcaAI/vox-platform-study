openapi: 3.1.0
info:
  title: HOPE — Service Release & Changelog API (TASK-648 U0 frozen contract)
  version: 1.0.0
  description: >
    FROZEN by U0. Units U5, U6, U7, U8, U10 and U11 code against this fragment; a unit that
    needs a shape not described here reports the gap to the integrator rather than widening
    the contract unilaterally.


    Auth posture:
      * `/internal/*` — service-to-service, `X-Service-Token`, never reachable from a browser.
      * `/admin/service-releases/*` — `@CanAny(['manage','all'], ['read','TenantTelemetry'])`,
        the same gate as the existing `/health/services`. Branch + SHA are operator data.
      * `/changelog/*` — any authenticated user; the SERVICE filters by audience.
      * `/admin/changelog/*` — GLOBAL_ADMIN only, enforced imperatively in the service with an
        `// AUTH-NOTE:` marker at the route (the decorators cannot express "global admin only").


    Cross-tenant reads return 404, never 403 (`05-nestjs-api.md`).

servers:
  - url: /api/v1

paths:
  /internal/service-releases:
    post:
      operationId: registerServiceInstance
      summary: Self-registration on boot + heartbeat (U8 → U6)
      description: >
        Idempotent. Upserts the ServiceRelease keyed on (serviceName, gitCommitSha, releaseTag)
        and upserts the ServiceInstance keyed on (serviceName, environment, instanceId).
        A repeat call is a heartbeat: it updates `lastSeenAt` and NOTHING else, and broadcasts
        NO sys-event. Only a first-seen release broadcasts ResourceCreated — otherwise ~15
        processes heartbeating would write ~4,300 audit rows/day of pure noise.
      security: [{ serviceToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterInstanceRequest' }
      responses:
        '200': { description: Registered (or heartbeated), content: { application/json: { schema: { $ref: '#/components/schemas/ServiceReleaseResponse' } } } }
        '401': { description: Missing or invalid X-Service-Token }

  /admin/service-releases:
    get:
      operationId: listServiceReleases
      summary: Release history across all services
      parameters:
        - { name: serviceName, in: query, schema: { type: string } }
        - { name: environment, in: query, schema: { $ref: '#/components/schemas/Environment' } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200': { description: Paginated releases, newest build first }

  /admin/service-releases/current:
    get:
      operationId: getCurrentReleases
      summary: What is running right now, one row per service
      description: >
        The latest LIVE instance per (serviceName, environment). An instance is live when
        `lastSeenAt` is within 15 minutes (3 missed heartbeats); older ones report `stale`.
      parameters:
        - { name: environment, in: query, required: true, schema: { $ref: '#/components/schemas/Environment' } }
      responses:
        '200': { description: Current release per service, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CurrentServiceResponse' } } } } }

  /admin/service-releases/{serviceName}/history:
    get:
      operationId: getServiceReleaseHistory
      parameters:
        - { name: serviceName, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Release timeline for one service, newest first }
        '404': { description: Unknown service }

  /changelog:
    get:
      operationId: listChangelog
      summary: Published release notes visible to the caller
      description: Filtered by audience. Global admins additionally see DRAFT entries.
      parameters:
        - { name: severity, in: query, schema: { $ref: '#/components/schemas/ChangelogSeverity' } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        '200': { description: Paginated entries, newest published first }

  /changelog/unseen:
    get:
      operationId: listUnseenChangelog
      summary: Drives the one-time What's New dialog (U11)
      description: >
        PUBLISHED entries matching the caller's audience with no acknowledgement row, newest
        first, capped at 3. Returns an empty array — never an error — when there is nothing to
        show, so the dialog renders nothing at all.


        Returns EMPTY while impersonating. Otherwise a global admin's support session would
        silently acknowledge a breaking-change notice on behalf of the real user, who would
        then never see it.
      responses:
        '200': { description: Up to 3 unseen entries, content: { application/json: { schema: { type: array, maxItems: 3, items: { $ref: '#/components/schemas/ChangelogEntryResponse' } } } } }

  /changelog/acknowledge:
    post:
      operationId: acknowledgeChangelog
      summary: Mark entries as seen for the current user
      description: Idempotent — acknowledging an already-acknowledged entry is a no-op, not a conflict.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entryIds]
              properties:
                entryIds: { type: array, minItems: 1, items: { type: string, format: uuid } }
      responses:
        '204': { description: Acknowledged }

  /admin/changelog:
    post:
      operationId: createChangelogEntry
      summary: Create a release note (GLOBAL_ADMIN only; CI creates DRAFTs by this route)
      responses:
        '201': { description: Created as DRAFT }
        '403': { description: Not a global admin }

  /admin/changelog/{id}:
    patch:
      operationId: updateChangelogEntry
      description: OCC-guarded — `If-Match` required.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: If-Match, in: header, required: true, schema: { type: string } }
      responses:
        '200': { description: Updated }
        '412': { description: Version drift }
        '428': { description: If-Match header missing }

  /admin/changelog/{id}/publish:
    post:
      operationId: publishChangelogEntry
      summary: Make an entry visible to its audience
      description: >
        The only path from DRAFT to PUBLISHED, and it is always a human action. CI never
        publishes — an auto-published changelog is an unreviewed broadcast to every customer
        admin. Publishing an already-published entry is rejected.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: If-Match, in: header, required: true, schema: { type: string } }
      responses:
        '200': { description: Published }
        '409': { description: Already published }
        '412': { description: Version drift }
        '428': { description: If-Match header missing }

components:
  securitySchemes:
    serviceToken:
      type: apiKey
      in: header
      name: X-Service-Token

  schemas:
    Environment:
      type: string
      enum: [dev, staging, prod]

    ChangelogSeverity:
      type: string
      enum: [INFO, IMPORTANT, BREAKING]

    ChangelogAudience:
      type: string
      enum: [ALL, GLOBAL_ADMIN, TENANT_ADMIN]

    ChangelogPublishStatus:
      type: string
      enum: [DRAFT, PUBLISHED]

    InstanceLiveness:
      type: string
      enum: [live, stale]

    RegisterInstanceRequest:
      description: The baked build-info.json (see build-info.schema.json) plus the two runtime facts only the process knows.
      type: object
      required: [service, version, gitBranch, gitCommitSha, buildAt, environment, instanceId]
      properties:
        service: { type: string }
        version: { type: string }
        releaseTag: { type: [string, 'null'] }
        gitBranch: { type: string }
        gitCommitSha: { type: string, pattern: '^[0-9a-f]{40}$' }
        buildAt: { type: string, format: date-time }
        ciPipelineId: { type: [string, 'null'] }
        ciPipelineUrl: { type: [string, 'null'] }
        environment: { $ref: '#/components/schemas/Environment' }
        instanceId:
          type: string
          description: Pod name, or `hostname:pid` outside Kubernetes.

    ServiceReleaseResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        serviceName: { type: string }
        version: { type: string }
        releaseTag: { type: [string, 'null'] }
        gitBranch: { type: string }
        gitCommitSha: { type: string }
        buildAt: { type: string, format: date-time }
        imageRepository: { type: [string, 'null'] }
        imageDigest:
          type: [string, 'null']
          description: Attached by the CI publish/promote step, not by the build — a digest does not exist until after the push.
        ciPipelineUrl: { type: [string, 'null'] }
        changelog:
          description: Generated technical changelog; see changelog-entry.schema.json.
          type: [array, 'null']
          items: { type: object }

    CurrentServiceResponse:
      type: object
      properties:
        serviceName: { type: string }
        environment: { $ref: '#/components/schemas/Environment' }
        release: { $ref: '#/components/schemas/ServiceReleaseResponse' }
        instanceCount: { type: integer }
        liveness: { $ref: '#/components/schemas/InstanceLiveness' }
        startedAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }

    ChangelogEntryResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        platformVersion: { type: string }
        title: { type: string }
        summary: { type: string }
        body:
          type: string
          description: Markdown. MUST be rendered sanitised — this is the one injection-shaped surface in the ticket.
        severity: { $ref: '#/components/schemas/ChangelogSeverity' }
        audience: { $ref: '#/components/schemas/ChangelogAudience' }
        publishStatus: { $ref: '#/components/schemas/ChangelogPublishStatus' }
        publishedAt: { type: [string, 'null'], format: date-time }
        acknowledged: { type: boolean }

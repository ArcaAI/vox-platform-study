# ============================================================================
# Test Infrastructure - Docker Compose
# ============================================================================
# This Docker Compose file provides ISOLATED test infrastructure.
# All services use different ports from development to avoid conflicts.
#
# Port Mapping (Test vs Dev):
#   PostgreSQL: 5433 (test) vs 5432 (dev)
#   Redis:      6380 (test) vs 6379 (dev)
#   MinIO:      9002 (test) vs 9000 (dev)
#   Qdrant:     6335 (test) vs 6333 (dev)
#   Vault:      8201 (test) vs 8200 (dev)
#
# Vault is fully isolated too (hope-vault-test), NOT the shared dev
# hope-vault container. SECRETS_PROVIDER=vault is required for tests (most
# platform config lives in Vault), so this stack provisions its own dev-mode
# Vault + init sidecar rather than depending on dev infra being up.
#
# Usage:
#   Start:  pnpm docker:test:up
#   Stop:   pnpm docker:test:down
#   Logs:   pnpm docker:test:logs
#   Status: pnpm docker:test:status
#
# ============================================================================

name: hope-test

services:
  # ==========================================================================
  # PostgreSQL 18 Test Database (Minimal Resources)
  # ==========================================================================
  # Image must match dev (timescale/timescaledb-ha:pg18-all) so the schema's
  # required extensions are available:
  #   - pgvector  (used by user.embedding vector(256))
  #   - vectorscale (CASCADE in 20260413000000_add_user_voice_profile migration)
  postgres-test:
    image: ${HOPE_POSTGRES_IMAGE:-timescale/timescaledb-ha:pg18-all}
    container_name: hope-postgres-test
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: hope_test
    ports:
      - '5433:5432'
    # Minimal memory + disabled durability for fast ephemeral tests
    command: >
      postgres
      -c fsync=off
      -c synchronous_commit=off
      -c full_page_writes=off
      -c shared_buffers=64MB
      -c effective_cache_size=128MB
      -c work_mem=4MB
      -c max_connections=100
      -c log_statement=none
    # Long-syntax tmpfs so we can set the mode: the short form mounts the
    # tmpfs root-owned 0755, and the image's postgres user (uid 1000) then
    # cannot mkdir /home/postgres/pgdata/data. 1777 lets it create the data
    # dir, which postgres itself chmods to 0700.
    volumes:
      - type: tmpfs
        target: /home/postgres/pgdata
        tmpfs:
          size: 536870912
          mode: 01777
    shm_size: 64mb
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U test -d hope_test']
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - hope-test-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # ==========================================================================
  # Redis Test Cache & Message Queue (Minimal Resources)
  # ==========================================================================
  redis-test:
    image: redis:8-alpine
    container_name: hope-redis-test
    ports:
      - '6380:6379'
    environment:
      REDIS_PASSWORD: test_redis_pass
    command: >
      redis-server
      --requirepass test_redis_pass
      --maxmemory 32mb
      --maxmemory-policy allkeys-lru
      --appendonly no
      --save ""
    healthcheck:
      test: ['CMD', 'sh', '-c', 'redis-cli -a test_redis_pass ping']
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 3s
    tmpfs:
      - /data
    networks:
      - hope-test-network
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 16M

  # ==========================================================================
  # MinIO Test Storage (Minimal Resources)
  # ==========================================================================
  minio-test:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: hope-minio-test
    ports:
      - '9002:9000'
      - '9003:9001'
    environment:
      MINIO_ROOT_USER: test
      MINIO_ROOT_PASSWORD: testpassword
    command: server /data --console-address ":9001"
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    tmpfs:
      - /data:size=512M
    networks:
      - hope-test-network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  minio-createbuckets:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: hope-minio-createbuckets
    depends_on:
      minio-test:
        condition: service_healthy
    restart: 'no'
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set local http://minio-test:9000 test testpassword; do
        echo 'MinIO not ready, waiting...';
        sleep 3;
      done;
      /usr/bin/mc mb --ignore-existing local/mlflow;
      /usr/bin/mc mb --ignore-existing local/recordings;
      /usr/bin/mc mb --ignore-existing local/generated-audio;
      /usr/bin/mc mb --ignore-existing local/documents;
      /usr/bin/mc mb --ignore-existing local/backups;
      /usr/bin/mc policy set public local/recordings;
      /usr/bin/mc policy set public local/generated-audio;
      echo 'Test buckets created successfully';
      exit 0;
      "
    networks:
      - hope-test-network

  # ==========================================================================
  # Qdrant Test Vector Database (Minimal Resources)
  # ==========================================================================
  qdrant-test:
    image: qdrant/qdrant:v1.19.0
    container_name: hope-qdrant-test
    ports:
      - '6335:6333'
      - '6336:6334'
    tmpfs:
      - /qdrant/storage:size=128M
    healthcheck:
      test: ['CMD-SHELL', 'bash -c "echo > /dev/tcp/localhost/6333"']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - hope-test-network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  # Qdrant Collection Initialization (mirrors dev infrastructure)
  qdrant-init-test:
    container_name: hope-qdrant-init-test
    image: python:3.11-slim-trixie
    depends_on:
      qdrant-test:
        condition: service_healthy
    restart: 'no'
    environment:
      QDRANT_HOST: qdrant-test
      QDRANT_PORT: 6333
    volumes:
      - ../infrastructure/docker/scripts/init-qdrant-collections.py:/scripts/init.py:ro
    command: sh -c "pip install -q qdrant-client && python /scripts/init.py"
    networks:
      - hope-test-network

  # ==========================================================================
  # Vault Test Secrets Engine (isolated from dev's hope-vault)
  # ==========================================================================
  # Dev-mode server: auto-initialized/unsealed, in-memory storage (no volume —
  # ephemeral by design, matching this file's other services). .env.test's
  # SECRETS_PROVIDER=vault is a hard requirement (the PHI-ciphertext seed and
  # the test API/e2e/integration suites need real Vault Transit), so this
  # container is required infra, not optional.
  vault-test:
    image: hashicorp/vault:1.21.4
    container_name: hope-vault-test
    ports:
      - '8201:8200'
    environment:
      VAULT_ADDR: 'http://0.0.0.0:8200'
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: '0.0.0.0:8200'
    command: server -dev -dev-root-token-id=root
    cap_add: [IPC_LOCK]
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O- http://127.0.0.1:8200/v1/sys/health | grep -q "\"initialized\":true"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - hope-test-network
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M

  # Vault bootstrap: kv-v2 + transit (hope-globalsetting, hope-phi keys) +
  # AppRole (hope-app). Trimmed test-scoped twin of dev's vault-init sidecar —
  # see infrastructure/docker/configs/vault/test-init.sh for what's skipped
  # and why (no database engine, no audit device, no KV placeholder seeding).
  vault-init-test:
    container_name: hope-vault-init-test
    image: hashicorp/vault:1.21.4
    depends_on:
      vault-test:
        condition: service_healthy
    restart: 'no'
    environment:
      VAULT_ADDR: 'http://vault-test:8200'
      VAULT_DEV_ROOT_TOKEN: root
    volumes:
      - ../infrastructure/docker/configs/vault/test-init.sh:/vault/init/test-init.sh:ro
      - ../infrastructure/docker/configs/vault/policies:/vault/init/policies:ro
    entrypoint: ['/vault/init/test-init.sh']
    networks:
      - hope-test-network

  # ---------------------------------------------------------------------------
  # Temporal (TASK-869) — the test stack had none, so the harness durable
  # workflows could not run and `task-704-generator-seam` dispatched jobs that
  # sat at PENDING forever. The suite read that as an env-gated skip; it was a
  # missing service.
  #
  # Schemas first (admin-tools runs to completion), then the server. Both point
  # at hope-postgres-test and use DEDICATED databases, so the app's `hope_test`
  # is never touched. Ports are the test convention: dev + 100.
  # ---------------------------------------------------------------------------
  temporal-admin-tools-test:
    container_name: hope-temporal-admin-tools-test
    image: temporalio/admin-tools:${TEMPORAL_ADMINTOOLS_VERSION:-1.31.2}
    networks:
      - hope-test-network
    restart: on-failure:6
    depends_on:
      postgres-test:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=test
      - POSTGRES_PWD=test
      - POSTGRES_SEEDS=postgres-test
      - SQL_PASSWORD=test
      - DBNAME=temporal_test
      - VISIBILITY_DBNAME=temporal_visibility_test
    volumes:
      - ../infrastructure/docker/configs/temporal/scripts:/scripts:ro
    entrypoint: ['/bin/sh']
    command: ['/scripts/setup-postgres.sh']

  temporal-test:
    container_name: hope-temporal-test
    image: temporalio/server:${TEMPORAL_VERSION:-1.31.2}
    networks:
      - hope-test-network
    restart: unless-stopped
    depends_on:
      postgres-test:
        condition: service_healthy
      temporal-admin-tools-test:
        condition: service_completed_successfully
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=test
      - POSTGRES_PWD=test
      - POSTGRES_SEEDS=postgres-test
      - BIND_ON_IP=0.0.0.0
      - DBNAME=temporal_test
      - VISIBILITY_DBNAME=temporal_visibility_test
      # The test Postgres runs max_connections=100 shared with the app and the
      # suite's own pools; keep Temporal well under its share.
      - SQL_MAX_CONNS=8
      - SQL_MAX_IDLE_CONNS=8
      - SQL_VIS_MAX_CONNS=4
      - SQL_VIS_MAX_IDLE_CONNS=4
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    ports:
      - '7333:7233'
    volumes:
      - ../infrastructure/docker/configs/temporal/development-sql.yaml:/etc/temporal/config/dynamicconfig/development-sql.yaml:ro
    healthcheck:
      test: ['CMD', 'nc', '-z', 'localhost', '7233']
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 512M

  # A Temporal server with schemas is NOT yet a usable one. Two more things have
  # to exist before the harness can run a single workflow, and neither is created
  # by `temporalio/auto-setup`'s schema step:
  #
  #   1. the `default` NAMESPACE — without it the worker logs
  #      "Namespace default is not found" and never polls the task queue. Worse,
  #      a worker started BEFORE the namespace exists does not recover on its
  #      own, so this must complete before the worker launches;
  #   2. the `HarnessTenantId` KEYWORD search attribute — the harness stamps it
  #      on every document workflow (`api/endpoints/internal.py`). Unregistered,
  #      the start is rejected and the service degrades to its memo-only
  #      fallback, so the failure shows up as a job stuck at PENDING rather than
  #      as an error.
  #
  # Both were registered by hand while debugging TASK-869; encoding them here is
  # what makes a FRESH test stack able to finish the harness e2e lane. Idempotent
  # (an AlreadyExists is success), so a re-up is safe.
  temporal-init-test:
    container_name: hope-temporal-init-test
    image: temporalio/admin-tools:${TEMPORAL_ADMINTOOLS_VERSION:-1.31.2}
    depends_on:
      temporal-test:
        condition: service_healthy
    restart: 'no'
    environment:
      TEMPORAL_ADDRESS: temporal-test:7233
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -e
        echo "temporal-init: registering namespace 'default'"
        temporal operator namespace create --namespace default 2>&1 | grep -v "AlreadyExists" || true
        temporal operator namespace describe --namespace default >/dev/null
        echo "temporal-init: registering search attribute HarnessTenantId (Keyword)"
        temporal operator search-attribute create --namespace default --name HarnessTenantId --type Keyword 2>&1 | grep -v "already exists" || true
        temporal operator search-attribute list --namespace default | grep -q HarnessTenantId
        echo "temporal-init: done"
    networks:
      - hope-test-network

networks:
  hope-test-network:
    driver: bridge

# =============================================================================
# HOPE Python Workspace (virtual root)
# =============================================================================
# Single source of truth for ALL Python service dependency resolution.
#
# This is a uv *workspace* root: it owns ONE lockfile (`uv.lock`) covering every
# member service, so every service resolves identical versions (e.g. a single
# transformers/torch/onnxruntime/gliner2-onnx version across the monorepo).
# This mirrors the shared local conda env (`arcaenv`) and prevents the
# per-service version drift that previously broke Docker `uv --frozen` builds.
#
# Local development still uses conda `arcaenv` (see scripts/setup-python-env.sh).
# Docker images consume this single lock via `uv sync --frozen --package <svc>`.
#
# Regenerate the lock after changing any member's dependencies:
#   uv lock
# =============================================================================

[tool.uv.workspace]
members = [
    "apps/guardrail",
    "apps/nlp",
    "apps/text",
    "apps/harness",
    "apps/stt",
    "apps/tts",
    # Shared model-lifecycle contract consumed by the five
    # in-process services. Dependency-free by design, so adding it as a member
    # cannot perturb the resolution of anything else in this lock.
    "packages/py-runtime-models",
    # The ONE env-file loader for every Python service (NODE_ENV →
    # .env.<env>, host env wins). Its single dependency (python-dotenv) is
    # already declared by every member, so it adds nothing to this resolution.
    "packages/py-env",
    # The ONE W3C trace-propagation helper for
    # services that cross a Redis-Stream boundary (currently stt, text).
    # Consolidates what was a deliberate, time-boxed duplicate in each service.
    # Its single dependency (opentelemetry-api) is already declared by every
    # member, so it adds nothing to this resolution.
    "packages/py-otel",
    # TASK-717: the normative async task/event envelope (identity, tenancy,
    # type, payload-or-claim-check, correlation, causation, idempotency key,
    # schema version) shared with the TypeScript twin `@arcaai/async-contract`.
    # Its single dependency (pydantic) is already declared by every member, so
    # it adds nothing to this resolution.
    "packages/py-async-contract",
    # TASK-716 Task 7b: the Python mirror of @arcaai/workflow-contract's
    # `compiledConfig` contract (CompiledWorkflowConfig models, checksum
    # verification, formatVersion guard) — the interpreter's read-only
    # consumer half only; no validator, no compiler. Its single dependency
    # (pydantic) is already declared by every member, so it adds nothing to
    # this resolution.
    "packages/py-workflow-contract",
]

# stt's `nemo` extra pulls nemo-toolkit, which hard-requires transformers
# 4.57.x, while its `ml`/`ml-gpu` extras pin transformers==5.5.4. These can never
# be installed together (this is the long-standing stt ml-vs-nemo conflict).
# Declaring them as conflicting extras lets uv resolve each as an independent
# install profile within the single lock (e.g. `uv sync --extra ml` vs
# `--extra nemo`) instead of trying to co-resolve them and failing.
# `ml-gpu` self-references `ml`, so ml and ml-gpu are NOT mutually conflicting.
[tool.uv]
# Docker images are Linux (`python-base`/Dockerfiles), local dev is macOS
# (conda `arcaenv`) — this workspace never runs on Windows. Without this, uv
# also resolves a hypothetical win32 split, which re-surfaces the same
# nemo-toolkit (transformers<4.58) vs guardrail (transformers>=5.0) conflict
# under a different marker.
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux'",
]
conflicts = [
    [
        { package = "stt", extra = "ml" },
        { package = "stt", extra = "nemo" },
    ],
    [
        { package = "stt", extra = "ml-gpu" },
        { package = "stt", extra = "nemo" },
    ],
    [
        { package = "guardrail" },
        { package = "stt", extra = "nemo" },
    ],
    # ragas 0.4.x → instructor 1.15.4 requires openai<3. TEXT + harness[eval]
    # take openai 3.1; keep eval-ragas on its own openai 2.x fork so ragas
    # cannot silently downgrade (0.4.3 → 0.3.1) to co-resolve.
    [
        { package = "harness", extra = "eval-ragas" },
        { package = "text" },
    ],
    [
        { package = "harness", extra = "eval-ragas" },
        { package = "harness", extra = "eval" },
    ],
]

# ---------------------------------------------------------------------------
# black — repo-root defaults (TASK-799)
# ---------------------------------------------------------------------------
# Every app already declares `line-length = 100` in its own pyproject.toml, and
# the per-service `pnpm <svc>:format` scripts invoke black one path at a time so
# each discovers its own config. This block exists for the OTHER invocation:
#
#     black apps/guardrail/src apps/harness/src ...       # or plain `black .`
#
# black resolves configuration from the COMMON BASE DIRECTORY of its arguments.
# Span two apps and that base is the repo root — which, without this section,
# contained no `[tool.black]` at all, so black silently fell back to its own
# default line length of 88. The effect was not a warning but a wrong answer:
# `--check` reported 738 of 1067 files as needing reformatting, and actually
# running it would have rewritten ~600 correctly-formatted files to the wrong
# width while looking exactly like a routine cleanup. Measured 2026-08-24;
# per-path invocation put the real drift at 143 files.
#
# Keep `line-length` here EQUAL to every app's value. If they ever diverge, the
# same command means two different things depending on how many paths you pass.
[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
# A root-scoped run walks the whole monorepo, so it must skip what the
# per-service runs never saw: agent worktrees (which contain full checkouts, and
# would be formatted as if they were source), JS dependencies, and build output.
extend-exclude = '''
/(
  \.eggs
  | \.git
  | \.claude/worktrees
  | \.hg
  | \.mypy_cache
  | \.pytest_cache
  | \.ruff_cache
  | \.tox
  | \.turbo
  | \.venv
  | \.next
  | node_modules
  | build
  | dist
  | htmlcov
)/
'''

# =============================================================================
# HOPE Python Workspace (virtual root)
# =============================================================================
# Single source of truth for ALL Python service dependency resolution.
#
# This is a uv *workspace* root: it owns ONE lockfile (`uv.lock`) covering every
# member service, so every service resolves identical versions (e.g. a single
# transformers/torch/onnxruntime/gliner2-onnx version across the monorepo).
# This mirrors the shared local conda env (`arcaenv`) and prevents the
# per-service version drift that previously broke Docker `uv --frozen` builds.
#
# Local development still uses conda `arcaenv` (see scripts/setup-python-env.sh).
# Docker images consume this single lock via `uv sync --frozen --package <svc>`.
#
# Regenerate the lock after changing any member's dependencies:
#   uv lock
# =============================================================================

[tool.uv.workspace]
members = [
    "apps/guardrail",
    "apps/nlp",
    "apps/smr",
    "apps/harness",
    "apps/stt",
    "apps/tts",
    # TASK-529 — shared model-lifecycle contract consumed by the five
    # in-process services. Dependency-free by design, so adding it as a member
    # cannot perturb the resolution of anything else in this lock.
    "packages/py-runtime-models",
    # TASK-558 — the ONE env-file loader for every Python service (NODE_ENV →
    # .env.<env>, host env wins). Its single dependency (python-dotenv) is
    # already declared by every member, so it adds nothing to this resolution.
    "packages/py-env",
]

# stt's `nemo` extra pulls nemo-toolkit, which hard-requires transformers
# 4.57.x, while its `ml`/`ml-gpu` extras pin transformers==5.5.4. These can never
# be installed together (this is the long-standing stt ml-vs-nemo conflict).
# Declaring them as conflicting extras lets uv resolve each as an independent
# install profile within the single lock (e.g. `uv sync --extra ml` vs
# `--extra nemo`) instead of trying to co-resolve them and failing.
# `ml-gpu` self-references `ml`, so ml and ml-gpu are NOT mutually conflicting.
[tool.uv]
# Docker images are Linux (`python-base`/Dockerfiles), local dev is macOS
# (conda `arcaenv`) — this workspace never runs on Windows. Without this, uv
# also resolves a hypothetical win32 split, which re-surfaces the same
# nemo-toolkit (transformers<4.58) vs guardrail (transformers>=5.0) conflict
# under a different marker.
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux'",
]
conflicts = [
    [
        { package = "stt", extra = "ml" },
        { package = "stt", extra = "nemo" },
    ],
    [
        { package = "stt", extra = "ml-gpu" },
        { package = "stt", extra = "nemo" },
    ],
    [
        { package = "guardrail" },
        { package = "stt", extra = "nemo" },
    ],
]

# deepfilternet 0.5.6 (TASK-507, latest release on PyPI) declares
# numpy>=1.22,<2.0, but stt's base dependencies require numpy>=2.0.0 (shared
# with the rest of the `ml` extra: torch 2.8, scipy 1.17, librosa). deepfilternet
# has no numpy-2.x-compatible release upstream, so the <2.0 pin is overridden
# here to unblock resolution. deepfilterlib is a compiled (PyO3) extension and
# numpy 2.0 made a C-API/ABI break — this override has NOT been runtime-verified.
# Manually smoke-test the DeepFilterNet3 denoise path before relying on it
# (see docs/implementation/TASK-507-ASR-Pipeline-Model-Catalog-Refresh/README.md).
override-dependencies = ["numpy>=2.0.0"]

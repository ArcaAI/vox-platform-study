[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hope-workflow-contract"
version = "0.1.0"
description = "TASK-716 Task 7b: the Python mirror of @arcaai/workflow-contract's compiledConfig contract (CompiledWorkflowConfig models, checksum verification, formatVersion guard) — the interpreter's read-only consumer half"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.12"

# ONE dependency, and a free one: every workspace member (guardrail, nlp, text,
# harness, stt, tts) already declares `pydantic>=2.12.5` for its own
# request/response models and settings, so adding it here forces nothing new onto
# anyone and cannot perturb the single root `uv.lock` (same rationale
# py-async-contract states for pydantic, py-otel for opentelemetry-api and py-env
# for python-dotenv).
dependencies = ["pydantic>=2.12.5"]

[tool.setuptools.packages.find]
where = ["src"]

# PEP 561 — ship inline types, or every `from hope_workflow_contract import ...` in
# the interpreter (TASK-718) degrades to `Any` under mypy, which is exactly the
# `no-any-return` noise hope-runtime-models' own marker was added to stop.
[tool.setuptools.package-data]
hope_workflow_contract = ["py.typed"]

[project.optional-dependencies]
# jsonschema is TEST-ONLY: tests/test_parity.py needs an independent judge of the
# normative packages/workflow-contract/schemas/compiled-config.schema.json, so that the fixture's validity is
# established by something other than the pydantic models under test. Already
# resolved in the root uv.lock as apps/harness's dependency (jsonschema>=4.23.0) —
# pinning the same floor here adds no new package to the workspace resolution.
dev = ["pytest>=9.0.2", "ruff>=0.16.3", "mypy>=2.3.1", "jsonschema>=4.23.0"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
# S101 assert — pytest's whole idiom.
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
minversion = "9.0"
addopts = ["-ra", "--strict-config", "--strict-markers"]
testpaths = ["tests"]

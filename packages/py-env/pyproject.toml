[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hope-env"
version = "0.1.0"
description = "Shared environment-file loader (NODE_ENV → .env.<env>, host env wins) for the HOPE Python services"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.12"

# ONE dependency, and a free one: every workspace member already declares
# `python-dotenv>=1.2.0`, so adding it here forces nothing new onto anyone and
# cannot perturb the single root `uv.lock`. Using the real parser (rather than
# the hand-rolled `KEY=VALUE` split the four copied loaders used) is the point:
# it handles quoting, `export ` prefixes, multi-line values and — the bug that
# bit STT's API_GATEWAY_KEY — inline `#` comments.
#
# `pydantic-settings` is equally free: all six services already declare
# `pydantic-settings>=2.13.1`, which is also the floor the source-ordering API
# used by `settings_sources.py` requires (verified against the installed 2.14.2).
dependencies = ["python-dotenv>=1.2.0", "pydantic-settings>=2.13.1"]

[tool.setuptools.packages.find]
where = ["src"]

# PEP 561 — ship inline types, or every `from hope_env import load_env` in an
# adopting service degrades to `Any` under mypy (same rationale as
# hope-runtime-models).
[tool.setuptools.package-data]
hope_env = ["py.typed"]

[project.optional-dependencies]
dev = ["pytest>=9.0.2", "ruff>=0.15.7", "mypy>=1.20.0"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
# S101 assert — pytest's whole idiom.
# S105/S106 "hardcoded password" — the precedence tests must assign literal probe
# values ("from-host", "from-vault") to secret-shaped names; that IS the fixture.
"tests/*" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
minversion = "9.0"
addopts = ["-ra", "--strict-config", "--strict-markers"]
testpaths = ["tests"]

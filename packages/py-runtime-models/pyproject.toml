[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hope-runtime-models"
version = "0.1.0"
description = "Shared model-lifecycle contract (idle-TTL / LRU / pin / VRAM) for the HOPE Python services"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.12"

# Deliberately DEPENDENCY-FREE. This package is imported by every Python
# service, so any dependency it declared would be forced onto all of them and
# would have to co-resolve inside the single root `uv.lock`. The cache contract
# needs nothing beyond the stdlib; Prometheus metrics and the NVML probe are
# injected by the host service (see `metrics.py` / `vram.py`).
dependencies = []

# `pynvml` stays an EXTRA, never a base dependency (see the rationale above) —
# `vram.py` already feature-detects it via a lazy, try/except-guarded import,
# so it is fully optional at runtime; CPU-only hosts and CI fall through to
# the estimate budget either way. A host with a GPU installs it explicitly
# with `hope-runtime-models[nvml]` to get the real free-VRAM probe instead of
# silently running estimate-only (F-012).
[project.optional-dependencies]
nvml = ["pynvml>=11.5.0"]

[tool.setuptools.packages.find]
where = ["src"]

# PEP 561 — ship the inline type information. Without this marker mypy treats
# every `from hope_runtime_models import ...` in an adopting service as
# `import-untyped` and degrades everything downstream of it to `Any`, which is
# what produced the `no-any-return` noise in harness/stt-v2/tts-v2 (TASK-530).
[tool.setuptools.package-data]
hope_runtime_models = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

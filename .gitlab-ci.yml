# ══════════════════════════════════════════════════════════════════════════════
# HOPE v2 — GitLab CI/CD Pipeline
# ══════════════════════════════════════════════════════════════════════════════
#
# Monorepo pipeline for:
#   TypeScript: api (NestJS)
#   Python:     stt (FastAPI), smr (FastAPI), nlp (FastAPI)
#   Infra:      database (Prisma migrations)
#   SDK:        @arcaai/vox, @arcaai/room, @arcaai/stt, @arcaai/vad,
#               @arcaai/noise-filter, @arcaai/med-ner, @arcaai/pipeline
#
# Branch strategy:
#   main                 — default branch: validate + test via MR gates, no builds
#   dev                  — integration branch: validate + test + manual builds + scan
#   staging              — pre-production: validate + test + manual builds + scan + deploy
#   cicd                 — pipeline testing: all stages, builds manual
#   release-sdk          — SDK publishing: @arcaai/vox + deps → GitLab Package Registry
#   maintenance/*        — maintenance branches: validate + test + scan
#   prod-*               — release-line branch: validate + test only, NO
#                          builds/deploys. Production is
#                          reached by pushing a protected `vX.Y.Z` tag, which
#                          promotes the digest a dev-*/staging-* pipeline
#                          already built — see promote-prod in deploy.yml.
#
# Image versioning (NO `latest` tag):
#   Tags:      <semver>, <major>.<minor>, <major>   (e.g. 1.2.3, 1.2, 1)
#   staging:   staging-<sha8>
#   dev:       dev-<sha8>
#   cicd:      cicd-<sha8>
#   feature:   <branch>-<sha8>
#   All:       sha-<sha8>  (immutable audit trail)
#   prod:      environment tag == the release tag itself (vX.Y.Z) — see
#              promote.sh; never rebuilt, only re-tagged from sha-<sha8>
#
# ══════════════════════════════════════════════════════════════════════════════

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $RUN_NOTIFY_ONLY == "true"
      variables:
        PIPELINE_TYPE: "notify_only"
    # Per-service / all release tags: <SVC>-<ver> (e.g. SMR-2.1.0) or ALL-<ver>.
    # The build/publish jobs key off the exact CI_COMMIT_TAG prefix; this type
    # just makes the tag pipeline run (and run the full test suite via rules.yml).
    - if: $CI_COMMIT_TAG =~ /^(SDK|SMR|STT|GUARD|TTS|HARNESS|API|ADMIN|NLP|ALL)-/
      variables:
        PIPELINE_TYPE: "release"
    - if: $CI_COMMIT_TAG =~ /^v\d+/
      variables:
        PIPELINE_TYPE: "tag_release"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      variables:
        PIPELINE_TYPE: "merge_request"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == "cicd"
      variables:
        PIPELINE_TYPE: "cicd"
    # TEMPORARY (dev-2.1 only): skip tests + checks, keep the build. Tests honor
    # SKIP_TESTS; validate + scan jobs are skipped via `.skip-on-dev-2-1` in
    # .gitlab/ci/rules.yml. Remove this rule (and the fragment references) to
    # restore the full pipeline. Must precede the generic /^dev-/ rule below.
    - if: $CI_COMMIT_BRANCH == "dev-2.1"
      variables:
        PIPELINE_TYPE: "dev"
        SKIP_TESTS: "true"
    # Release-line branches: dev-* / staging-* / prod-* (e.g. dev-2.1). A plain
    # push runs the full test suite then builds all images (env-tagged).
    - if: $CI_COMMIT_BRANCH =~ /^dev-/
      variables:
        PIPELINE_TYPE: "dev"
    - if: $CI_COMMIT_BRANCH =~ /^staging-/
      variables:
        PIPELINE_TYPE: "staging"
    # Branch model is dev-* / staging-* / prod-*.
    #
    # RESOLVED 2026-08-07 (owner): `prod-*` is the production release line.
    # `production-*` is RETIRED and deliberately NOT matched here — it falls
    # through to the `feature` catch-all, which is now the correct outcome.
    # Do not re-add it without an explicit decision; the two spellings are not
    # interchangeable (`^prod-` does not match `production-2.1`), and having
    # both recognized was the ambiguity this resolution removes.
    #
    # prod-* runs validate + test only. It does NOT build (build.yml's
    # `.build-common-rules` excludes it) and does NOT deploy. Production is
    # reached solely by pushing a protected `vX.Y.Z` tag, which promotes the
    # digest an earlier dev-*/staging-* pipeline already built and scanned.
    - if: $CI_COMMIT_BRANCH =~ /^prod-/
      variables:
        PIPELINE_TYPE: "prod"
    - if: $CI_COMMIT_BRANCH == "release-sdk"
      variables:
        PIPELINE_TYPE: "release_sdk"
    - if: $CI_COMMIT_BRANCH =~ /^maintenance\//
      variables:
        PIPELINE_TYPE: "feature"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      variables:
        PIPELINE_TYPE: "main"
    - if: $CI_COMMIT_BRANCH
      variables:
        PIPELINE_TYPE: "feature"

stages:
  - install
  - validate
  - prepare
  - test
  - build
  - scan
  - publish
  - deploy
  - notify

default:
  interruptible: true

variables:
  # ── Docker / Registry ──────────────────────────────────────────────────────
  DOCKER_HOST: unix:///var/run/docker.sock
  DOCKER_TLS_CERTDIR: ""
  DOCKER_BUILDKIT: "1"
  REGISTRY: 10.10.1.110:5050
  # GITHUB_REPO_URL removed: nothing read it. The
  # github-backup job builds its remote URL from a literal in .gitlab/ci/notify.yml.
  GITHUB_BACKUP_BRANCH: "back-up"
  RUN_NOTIFY_ONLY: ""
  #
  # ── Vault via GitLab OIDC ──────────────────────────────────────────────────
  # VAULT_ADDR EMPTY = the mechanism is off and every job uses its CI variables
  # exactly as before. Set it (Settings → CI/CD → Variables, NOT masked — it is
  # topology, not a secret) to switch the whole pipeline over. See
  # .gitlab/ci/vault.yml for the job contract and the Vault-side role setup.
  VAULT_ADDR: ""
  VAULT_OIDC_AUD: "https://vault.hope.arcaai.com"
  VAULT_AUTH_PATH: "jwt-gitlab"
  VAULT_KV_MOUNT: "secret"
  #
  # ── Manual skip controls ────────────────────────────────────────────────────
  # Set any of these to "true" when running a pipeline to skip stages:
  #   SKIP_TESTS       — skip ALL test jobs
  #   SKIP_TESTS_TS    — skip TypeScript test jobs (test-api, test-packages, test-sdk, test-apps, test-ui-ct)
  #   SKIP_TESTS_PY    — skip Python test jobs (test-stt, test-smr, test-guardrail, test-nlp, test-harness)
  #
  # Usage:
  #   1. GitLab UI → CI/CD → Run pipeline → add variable SKIP_TESTS = true
  #   2. API:  curl --form "variables[SKIP_TESTS]=true" ...trigger...
  #   3. git push -o ci.variable="SKIP_TESTS=true"
  SKIP_TESTS: ""
  SKIP_TESTS_TS: ""
  SKIP_TESTS_PY: ""
  #
  # ── Test environment ───────────────────────────────────────────────────────
  # These provide defaults for test jobs.
  #
  # PREFERRED PATH: the test credentials live in Vault at
  # `secret/ci/*` and reach the job through .gitlab/ci/vault.yml — no long-lived
  # token in project settings, scoped by the role's bound_claims, auditable.
  #
  # FALLBACK (masked variables are a fallback, not the design):
  # while VAULT_ADDR is empty the jobs read these CI/CD Variables instead.
  # Masking prevents casual echo; it does not scope, expire, or audit.
  #
  #   Settings → CI/CD → Variables:
  #
  #   Variable                 | Value                                                      | Flags
  #   ─────────────────────────┼────────────────────────────────────────────────────────────┼──────────────────
  #   CI_DATABASE_URL          | postgresql://ci_user:****@10.10.1.250:5000/vox_staging     | masked, protected
  #   CI_REDIS_URL             | redis://:****@10.10.1.120:6379/8                           | masked, protected
  #   CI_REDIS_PASS            | ****                                                      | masked, protected
  #   CI_JWT_SECRET            | <random 64-char string>                                   | masked, protected
  #   CI_API_KEY_PEPPER        | <random 32-char string>                                   | masked, protected
  #
  # Non-secret test defaults (safe to commit):
  NODE_ENV: "test"
  REDIS_HOST: "ha-redis"
  REDIS_PORT: "6379"
  LOG_LEVEL: "error"
  LOG_FILE_ENABLED: "false"
  OTEL_TRACES_ENABLED: "false"
  OTEL_METRICS_ENABLED: "false"
  # OTEL_METRICS_ENABLED is the GATEWAY-scoped switch, but NLP falls back to it
  # when its own prefixed switch is unset (apps/nlp/src/nlp/core/config.py),
  # so the global "false" above unmounts NLP's /metrics and fails the OBS-02
  # contract test. Each service owns its own switch — declare NLP's explicitly
  # rather than letting it inherit a gateway variable.
  NLP_METRICS_ENABLED: "true"
  # Torch/BLAS default to one intra-op thread per core, per process. With six
  # Python test jobs plus the Node suites on one runner that oversubscribes the
  # box, which is how test-harness lost a Temporal query to its 30s deadline.
  # Cap the pools so peak RSS and CPU contention stay bounded. (NOT the cause of
  # the test-smr OOM — that was an infinite loop in a stale test, fixed
  # separately in test_stream_endpoint.py / test_dependency_injection.py.)
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"
  TOKENIZERS_PARALLELISM: "false"
  MINIO_USE_SSL: "false"
  API_KEY_ALLOW_QUERY_PARAM: "true"
  API_KEY_MAX_LIFETIME_DAYS: "90"
  JWT_EXPIRES_IN: "1h"
  DEFAULT_TENANT_ID: "50000000-0000-0000-0000-000000000000"
  SYSTEM_USER_ID: "60000000-0000-0000-0000-000000000000"

include:
  - local: .gitlab/ci/vault.yml
  - local: .gitlab/ci/templates.yml
  - local: .gitlab/ci/rules.yml
  - local: .gitlab/ci/install.yml
  - local: .gitlab/ci/validate.yml
  - local: .gitlab/ci/prepare.yml
  - local: .gitlab/ci/test.yml
  - local: .gitlab/ci/build.yml
  - local: .gitlab/ci/scan.yml
  - local: .gitlab/ci/publish.yml
  - local: .gitlab/ci/deploy.yml
  - local: .gitlab/ci/notify.yml

stages:
  - build
  - github-backup

variables:
  DOCKER_HOST: unix:///var/run/docker.sock
  DOCKER_TLS_CERTDIR: ""
  DOCKER_BUILDKIT: "1"
  REGISTRY: 10.10.1.110:5050
  GITHUB_REPO_URL: "https://github.com/4bits-vn/project-hope-v2.git"
  GITHUB_BACKUP_BRANCH: "back-up"

workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH =~ /^devops\//

# ── TEMPLATE ─────────────────────────────────────────────────────────────────

.build-template:
  stage: build
  tags: [build]
  image: docker:27
  timeout: 30m
  variables:
    SERVICE_NAME: ""
    DOCKER_CONTEXT: "."
    DOCKERFILE: ""
    BUILD_TARGET: ""
    BUILD_ARGS: ""
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$REGISTRY"
    - |
      printf '[registry."%s"]\nhttp = true\ninsecure = true\n' "$REGISTRY" > /tmp/buildkitd.toml
      if ! docker buildx inspect cibuilder >/dev/null 2>&1; then
        docker buildx create --name cibuilder --driver docker-container \
          --config /tmp/buildkitd.toml
      fi
      docker buildx use cibuilder
      docker buildx inspect --bootstrap
  script:
    - |
      set -eu

      image_repo="$REGISTRY/$CI_PROJECT_PATH/$SERVICE_NAME"
      cache_repo="$image_repo/cache"
      short_sha=$(echo "$CI_COMMIT_SHA" | cut -c1-8)
      created_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)

      # ── Compute tags ──────────────────────────────────────────────────
      #   Semver tag:      1.2.3  + latest + <sha>
      #   Default branch:  main-<sha> + <sha> + latest
      #   Feature branch:  devops-foo-<sha> + <sha>   (no latest)
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        SEMVER_TAG="${CI_COMMIT_TAG#v}"
        TAGS="$SEMVER_TAG latest $short_sha"
      elif [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        TAGS="main-${short_sha} ${short_sha} latest"
      else
        BRANCH_SLUG=$(echo "$CI_COMMIT_BRANCH" | sed 's/[^a-zA-Z0-9]/-/g')
        TAGS="${BRANCH_SLUG}-${short_sha} ${short_sha}"
      fi

      build_target_arg=""
      if [ -n "$BUILD_TARGET" ]; then
        build_target_arg="--target $BUILD_TARGET"
      fi

      # ── Build tag list for buildx --tag flags ─────────────────────────
      tag_args=""
      for tag in $TAGS; do
        tag_args="$tag_args --tag $image_repo:$tag"
      done

      primary_tag=$(echo "$TAGS" | awk '{print $1}')
      echo "Building service=$SERVICE_NAME primary_tag=$primary_tag all_tags=$TAGS"
      echo "  commit=$CI_COMMIT_SHA branch=${CI_COMMIT_BRANCH:-} git_tag=${CI_COMMIT_TAG:-}"

      # ── Build + push with registry cache ──────────────────────────────
      # mode=max caches ALL intermediate stages (deps, builder, etc.),
      # not just the final target. This means apt-get, uv pip install,
      # and torch download layers are reused across CI runs.
      docker buildx build \
        --push \
        --cache-from type=registry,ref=$cache_repo \
        --cache-to   type=registry,ref=$cache_repo,mode=max,compression=zstd \
        --label org.opencontainers.image.source=$CI_PROJECT_URL \
        --label org.opencontainers.image.revision=$CI_COMMIT_SHA \
        --label org.opencontainers.image.created=$created_at \
        --label org.opencontainers.image.version=$primary_tag \
        $build_target_arg \
        $BUILD_ARGS \
        $tag_args \
        -f "$DOCKERFILE" \
        "$DOCKER_CONTEXT"

      echo "  pushed tags:"
      for tag in $TAGS; do
        echo "    $image_repo:$tag"
      done

# ── JOBS ─────────────────────────────────────────────────────────────

api:
  extends: .build-template
  variables:
    SERVICE_NAME: api
    DOCKER_CONTEXT: "."
    DOCKERFILE: apps/api/Dockerfile
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+/
    - if: $CI_COMMIT_BRANCH =~ /^devops\//
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - apps/api/**/*
        - packages/application/**/*
        - packages/database/**/*
        - packages/domain/**/*
        - packages/exception/**/*
        - packages/logger/**/*
        - packages/tools/**/*
        - packages/config-eslint/**/*
        - packages/config-rollup/**/*
        - packages/config-ts/**/*


stages:
  - build
  - deploy
  - promote

variables:
  DOCKER_HOST: unix:///var/run/docker.sock
  DOCKER_TLS_CERTDIR: ""
  REGISTRY: 10.10.1.110:5050

workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ── TEMPLATE ─────────────────────────────────────────────────────────────────

.build-template:
  stage: build
  tags: [build]
  image: docker:27
  variables:
    SERVICE_NAME: ""
    DOCKER_CONTEXT: "."
    DOCKERFILE: ""
    BUILD_TARGET: ""
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$REGISTRY"
  script:
    - |
      set -eu

      image_repo="$REGISTRY/$CI_PROJECT_PATH/$SERVICE_NAME"

      # Compute tag based on trigger type
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        IMAGE_TAG="${CI_COMMIT_TAG#v}"      # v1.0.0 → 1.0.0
      else
        IMAGE_TAG="latest"                  # dev branch
      fi

      build_target_arg=""
      if [ -n "$BUILD_TARGET" ]; then
        build_target_arg="--target $BUILD_TARGET"
      fi

      echo "Building service=$SERVICE_NAME tag=$IMAGE_TAG context=$DOCKER_CONTEXT"
      docker build \
        --label org.opencontainers.image.source=$CI_PROJECT_URL \
        --label org.opencontainers.image.revision=$CI_COMMIT_SHA \
        --label org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
        $build_target_arg \
        -f "$DOCKERFILE" \
        -t "$image_repo:$IMAGE_TAG" \
        "$DOCKER_CONTEXT"

      docker push "$image_repo:$IMAGE_TAG"

# ── JOBS ─────────────────────────────────────────────────────────────

api:
  extends: .build-template
  variables:
    SERVICE_NAME: api
    DOCKER_CONTEXT: "."
    DOCKERFILE: apps/api/Dockerfile
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - apps/api/**/*
        - packages/application/**/*
        - packages/database/**/*
        - packages/domain/**/*
        - packages/exception/**/*
        - packages/logger/**/*
        - packages/tools/**/*
        - packages/config-eslint/**/*
        - packages/config-rollup/**/*
        - packages/config-ts/**/*

ui-playground:
  extends: .build-template
  variables:
    SERVICE_NAME: ui-playground
    DOCKER_CONTEXT: "."
    DOCKERFILE: apps/ui-playground/Dockerfile
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - apps/ui-playground/**/*
        - packages/ui/**/*
        - packages/room/**/*
        - packages/vad/**/*
        - packages/stt/**/*
        - packages/noise-filter/**/*
        - packages/med-ner/**/*
        - packages/vox/**/*

nlp:
  extends: .build-template
  variables:
    SERVICE_NAME: nlp
    DOCKER_CONTEXT: apps/nlp
    DOCKERFILE: apps/nlp/Dockerfile
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - apps/nlp/**/*

smr:
  extends: .build-template
  variables:
    SERVICE_NAME: smr
    DOCKER_CONTEXT: apps/smr
    DOCKERFILE: apps/smr/Dockerfile
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - apps/smr/**/*

stt-v2:
  extends: .build-template
  variables:
    SERVICE_NAME: stt-v2-ml-runtime
    DOCKER_CONTEXT: apps/stt-v2
    DOCKERFILE: apps/stt-v2/docker/Dockerfile
    BUILD_TARGET: ml-runtime
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - apps/stt-v2/**/*

stt-v2-worker:
  extends: .build-template
  variables:
    SERVICE_NAME: stt-v2-worker
    DOCKER_CONTEXT: apps/stt-v2
    DOCKERFILE: apps/stt-v2/docker/Dockerfile
    BUILD_TARGET: worker
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - apps/stt-v2/**/*

database:
  extends: .build-template
  variables:
    SERVICE_NAME: database
    DOCKER_CONTEXT: .
    DOCKERFILE: packages/database/Dockerfile
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - packages/database/**/*

# ── DEPLOY ───────────────────────────────────────────────────────────────────

deploy-dev:
  stage: deploy
  image: argoproj/argocd:latest
  tags: [build]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs:
    - job: api
      optional: true
    - job: ui-playground
      optional: true
    - job: nlp
      optional: true
    - job: smr
      optional: true
    - job: stt-v2
      optional: true
    - job: stt-v2-worker
      optional: true
    - job: database
      optional: true
  script:
    - argocd login "$ARGOCD_SERVER" --auth-token "$ARGOCD_AUTH_TOKEN" --grpc-web --insecure
    - argocd app get hope-dev --hard-refresh
    - argocd app sync hope-dev --prune --timeout 300
    - argocd app wait hope-dev --timeout 300

# ── PROMOTE ──────────────────────────────────────────────────────────────────

promote-prod:
  stage: promote
  image: alpine/git:latest
  tags: [build]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+/
  needs:
    - job: api
    - job: ui-playground
    - job: nlp
    - job: smr
    - job: stt-v2
    - job: stt-v2-worker
    - job: database
  variables:
    GIT_STRATEGY: clone
    GIT_CHECKOUT: "true"
  script:
    - |
      set -eu
      VERSION="${CI_COMMIT_TAG#v}"   # v1.0.0 → 1.0.0
      OVERLAY="deployment/k3s/overlays/prod/kustomization.yaml"

      # Update all newTag values in prod overlay
      sed -i "s/newTag: .*/newTag: \"$VERSION\"/" "$OVERLAY"

      # Commit and push
      git config user.email "ci@hope.local"
      git config user.name "GitLab CI"
      git remote set-url origin "https://ci-token:${CI_GIT_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
      git checkout -b ci/promote-$VERSION
      git add "$OVERLAY"
      git commit -m "release: promote v$VERSION to production [skip ci]"
      git push origin ci/promote-$VERSION:$CI_DEFAULT_BRANCH

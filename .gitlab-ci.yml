build-api:
  stage: build
  tags: [4bits-runner]
  variables:
    SERVICE: "api"
    CONTEXT: "."
    DOCKERFILE: "apps/api/Dockerfile"
  before_script: *docker_before
  script:
    - *build_push_fn
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $FORCE_REBUILD == "true"'
      when: on_success
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - apps/api/**          # NestJS API app
        - apps/api/package.json
        - package.json
        - apps/api/tsconfig*.json
        - packages/applications/**   # shared app services used by API
        - packages/domains/**        # domains package used by API
        - packages/logger/**         # if API depends on it
        - packages/exceptions/**     # if API depends on it
        - packages/database/**       # Prisma schema / migrations
        - packages/tools/**          # prisma-commander etc.
        - Dockerfile
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - scheduler_failure


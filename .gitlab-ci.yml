stages:
  - build
  - github-backup

variables:
  DOCKER_HOST: unix:///var/run/docker.sock
  DOCKER_TLS_CERTDIR: ""
  REGISTRY: 10.10.1.110:5050
  GITHUB_REPO_URL: "https://github.com/4bits-vn/project-hope-v2.git"
  GITHUB_BACKUP_BRANCH: "back-up"

workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ── TEMPLATE ─────────────────────────────────────────────────────────────────

.build-template:
  stage: build
  tags: [build]
  image: docker:27
  variables:
    SERVICE_NAME: ""
    DOCKER_CONTEXT: "."
    DOCKERFILE: ""
    BUILD_TARGET: ""
    BUILD_ARGS: ""
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$REGISTRY"
  script:
    - |
      set -eu

      image_repo="$REGISTRY/$CI_PROJECT_PATH/$SERVICE_NAME"
      short_sha=$(echo "$CI_COMMIT_SHA" | cut -c1-8)
      created_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)

      # Compute tags based on trigger type.
      # Every image gets a commit-pinned tag so deployments are always traceable.
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        SEMVER_TAG="${CI_COMMIT_TAG#v}"          # v1.0.0 → 1.0.0
        TAGS="$SEMVER_TAG latest $short_sha"
      else
        BRANCH_SLUG=$(echo "$CI_COMMIT_BRANCH" | sed 's/[^a-zA-Z0-9]/-/g')
        TAGS="${BRANCH_SLUG}-${short_sha} ${short_sha} latest"
      fi

      build_target_arg=""
      if [ -n "$BUILD_TARGET" ]; then
        build_target_arg="--target $BUILD_TARGET"
      fi

      # Build once, tag many.
      primary_tag=$(echo "$TAGS" | awk '{print $1}')
      echo "Building service=$SERVICE_NAME primary_tag=$primary_tag all_tags=$TAGS"
      echo "  commit=$CI_COMMIT_SHA branch=${CI_COMMIT_BRANCH:-} git_tag=${CI_COMMIT_TAG:-}"

      docker build \
        --label org.opencontainers.image.source=$CI_PROJECT_URL \
        --label org.opencontainers.image.revision=$CI_COMMIT_SHA \
        --label org.opencontainers.image.created=$created_at \
        --label org.opencontainers.image.version=$primary_tag \
        $build_target_arg \
        $BUILD_ARGS \
        -f "$DOCKERFILE" \
        -t "$image_repo:$primary_tag" \
        "$DOCKER_CONTEXT"

      # Apply all additional tags and push each one.
      for tag in $TAGS; do
        docker tag "$image_repo:$primary_tag" "$image_repo:$tag"
        docker push "$image_repo:$tag"
        echo "  pushed $image_repo:$tag"
      done

# ── JOBS ─────────────────────────────────────────────────────────────

api:
  extends: .build-template
  variables:
    SERVICE_NAME: api
    DOCKER_CONTEXT: "."
    DOCKERFILE: apps/api/Dockerfile
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - apps/api/**/*
        - packages/application/**/*
        - packages/database/**/*
        - packages/domain/**/*

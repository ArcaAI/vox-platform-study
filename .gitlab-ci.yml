# ══════════════════════════════════════════════════════════════════════════════
# HOPE v2 — GitLab CI/CD Pipeline
# ══════════════════════════════════════════════════════════════════════════════
#
# Monorepo pipeline for:
#   TypeScript: api (NestJS), ui-playground (React/Vite)
#   Python:     stt-v2 (FastAPI), smr (FastAPI), nlp (FastAPI)
#   Infra:      database (Prisma migrations)
#
# Pipeline types (set via workflow rules):
#   release        — semver tag (v*)        → full pipeline + all builds
#   merge_request  — MR opened/updated      → lint + test + scan (no builds)
#   main           — push to default branch → lint + test + build (changed only)
#   feature        — push to devops/*       → lint + test + build
#
# ══════════════════════════════════════════════════════════════════════════════

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+/
      variables:
        PIPELINE_TYPE: "release"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      variables:
        PIPELINE_TYPE: "merge_request"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      variables:
        PIPELINE_TYPE: "main"
    - if: $CI_COMMIT_BRANCH =~ /^devops\//
      variables:
        PIPELINE_TYPE: "feature"

stages:
  - install
  - validate
  - test
  - build
  - scan
  - notify

default:
  interruptible: true

variables:
  DOCKER_HOST: unix:///var/run/docker.sock
  DOCKER_TLS_CERTDIR: ""
  DOCKER_BUILDKIT: "1"
  REGISTRY: 10.10.1.110:5050
  GITHUB_REPO_URL: "https://github.com/4bits-vn/project-hope-v2.git"
  GITHUB_BACKUP_BRANCH: "back-up"

include:
  - local: .gitlab/ci/templates.yml
  - local: .gitlab/ci/rules.yml
  - local: .gitlab/ci/install.yml
  - local: .gitlab/ci/validate.yml
  - local: .gitlab/ci/test.yml
  - local: .gitlab/ci/build.yml
  - local: .gitlab/ci/scan.yml
  - local: .gitlab/ci/notify.yml

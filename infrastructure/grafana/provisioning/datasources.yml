apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    uid: prometheus
    isDefault: true
    editable: false

  # HOPE Postgres — backs the Consumption & Cost dashboard (consumption.json),
  # whose panels bind to datasource uid `hope-postgres`. Reaches
  # Postgres by its compose service name on `hope-network`; app data lives in the
  # `hope` database. Dev-default credentials — a real deployment injects its own.
  - name: HOPE Postgres
    type: postgres
    access: proxy
    url: postgres:5432
    user: postgres
    uid: hope-postgres
    editable: false
    jsonData:
      database: hope
      sslmode: disable
      postgresVersion: 1800
    secureJsonData:
      password: postgres

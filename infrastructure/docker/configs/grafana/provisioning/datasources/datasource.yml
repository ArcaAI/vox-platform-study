# ============================================================================
# HOPE — DEV Grafana datasource provisioning (TASK-397, builds on TASK-386)
# ============================================================================
# Single Prometheus datasource for the dev platform-metrics profile. Grafana
# and Prometheus share the compose `hope-network`, so Grafana reaches Prometheus
# by its service name (`prometheus:9090`) — NOT host.docker.internal (that is
# only how Prometheus reaches the HOST-run API/Python /metrics endpoints).
#
# The fixed `uid` (hope-prometheus) lets the provisioned starter dashboard bind
# to this datasource deterministically (no manual datasource pick on import).
# ============================================================================

apiVersion: 1

datasources:
  - name: Prometheus
    uid: hope-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST

  # ==========================================================================
  # HOPE Postgres — the AI usage/billing plane (TASK-615 #10).
  # The Consumption & Cost dashboard (uid `hope-consumption`) binds every panel
  # to datasource uid `hope-postgres`; without this row the dashboard shows
  # "datasource not found". Grafana reaches Postgres by its compose service name
  # on the shared `hope-network` (`postgres:5432`, NOT host.docker.internal).
  # The app data — the `core.AiUsage*` tables the dashboard queries — lives in
  # database `hope`, NOT the compose default maintenance DB. Dev credentials are
  # the compose defaults; a real deployment injects its own via Grafana env/secret.
  # ==========================================================================
  - name: HOPE Postgres
    uid: hope-postgres
    type: postgres
    access: proxy
    url: postgres:5432
    user: postgres
    editable: false
    jsonData:
      database: hope
      sslmode: disable
      postgresVersion: 1800
    secureJsonData:
      password: postgres

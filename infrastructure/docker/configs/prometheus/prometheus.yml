# ============================================================================
# HOPE — DEV Prometheus scrape config (TASK-386 Platform Runtime Metrics)
# ============================================================================
# Scrapes the API gateway + every Python service /metrics endpoint and feeds
# the NestJS PrometheusQueryService (PROMETHEUS_URL=http://localhost:9090).
#
# IMPORTANT — host networking:
#   In DEV the API gateway and the Python services run on the HOST (pnpm/conda),
#   NOT in containers. Prometheus runs in Docker, so every target is reached via
#   `host.docker.internal` (Docker Desktop resolves this automatically; on Linux
#   the compose service maps it to `host-gateway`).
#
# Label strategy:
#   We deliberately do NOT set a target-level `service` label (static_configs
#   labels:) — the cross-service per-model metrics already carry their own
#   {service,model} labels, and a target-level `service` label would collide
#   (Prometheus renames theirs to `exported_service`).
#   Instead each job carries a per-metric `metric_relabel_configs` rule scoped
#   to `__name__ =~ "http_.*"` that stamps `service` onto the HTTP metrics only,
#   leaving model_* series untouched. This keeps PlatformMetricsService's
#   `sum by (service) (...)` queries correct without a job→service naming
#   coincidence (job name != service name is fine now).
#
# Canonical contract: docs/implementation/TASK-386-Platform-Metrics-Backend/METRIC-CONTRACT.md
# ============================================================================

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    cluster: hope-dev

scrape_configs:
  # ---- Prometheus self-monitoring -----------------------------------------
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # ---- API Gateway (NestJS, @willsoto/nestjs-prometheus) -------------------
  # Exposes http_requests_total / http_request_duration_seconds (with its own
  # `service` label) + socket gauges (active_connections_count). Owned by the
  # NestJS worker; scraped here for the platform dashboard.
  - job_name: api-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8868"]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "http_.*"
        target_label: service
        replacement: api-gateway

  # ---- STT (FastAPI) ----------------------------------------------------
  # http_* (instrumentator) + stt_* domain metrics + model_* per-model
  # (service="stt", model in {whisper-large-v3-turbo, silero-vad-v5}).
  - job_name: stt
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8861"]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "http_.*"
        target_label: service
        replacement: stt

  # ---- SMR (FastAPI) ----------------------------------------------------
  # http_* + smr_* domain metrics + model_* (service="smr", model="gemma-4-e4b").
  - job_name: smr
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8862"]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "http_.*"
        target_label: service
        replacement: smr

  # ---- Guardrail (FastAPI) -------------------------------------------------
  # model_* per-model (service="guardrail", model="granite-guardian-4.1-8b")
  # + http_* (FastAPI instrumentator, added to close the former "no http_*"
  # gap — previously /metrics only ran generate_latest() with no middleware).
  - job_name: guardrail
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8863"]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "http_.*"
        target_label: service
        replacement: guardrail

  # ---- NLP (FastAPI) -------------------------------------------------------
  # http_* (FastAPI instrumentator, un-namespaced — was nlp_http_* until
  # aligned with the rest of the fleet) + model_* (service="nlp", model in
  # {Medical-NER, symps-disease-bert}). Domain metrics use OTel/OTLP
  # (NOT scraped here).
  - job_name: nlp
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8864"]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "http_.*"
        target_label: service
        replacement: nlp

  # ---- Harness (FastAPI + Temporal worker) ---------------------------------
  # http_* only — the harness orchestrates the model services and runs no local
  # ML model, so it emits no model_* metrics (by design, not a gap).
  - job_name: harness
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8866"]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "http_.*"
        target_label: service
        replacement: harness

# Temporal dynamic config (development, SQL persistence).
# Mounted into temporalio/server at
#   /etc/temporal/config/dynamicconfig/development-sql.yaml
# and referenced via DYNAMIC_CONFIG_FILE_PATH. Mirrors the upstream
# temporalio/samples-server compose dynamicconfig for a Postgres-backed dev server.
#
# Clinical Documentation Harness — dev/opt-in only.
limit.maxIDLength:
  - value: 255
    constraints: {}
system.forceSearchAttributesCacheRefreshOnRead:
  - value: true # Dev only — do NOT enable in production.
    constraints: {}

# ============================================================================
# HOPE Infrastructure - Extended Services (Vault, Qdrant)
# ============================================================================
# Additional infrastructure services for STT and advanced features.
# NOTE: Kafka has been removed - using Redis for job queues and PostgreSQL for audit logs.
#
# USAGE (from monorepo root):
#   Start both together (recommended):
#     docker compose -f infrastructure/docker/docker-compose.yml \
#                    -f infrastructure/docker/docker-compose.dev.yml up -d
#
#   Or use the convenience script:
#     ./scripts/start-infra.sh --all
#
#   Start separately (if core is already running):
#     docker compose -f infrastructure/docker/docker-compose.dev.yml up -d
#
# ENVIRONMENT:
#   Compose interpolation reads infrastructure/docker/.env — a GENERATED file
#   (scripts/dev-infra.sh writes it from .env.dev on every `pnpm infra:dev:up`;
#   never hand-edit it). `.env.dev` itself is created by `pnpm setup:dev` from
#   the consolidated .env.sample at the repo root.
# ============================================================================

name: hope-infra-dev

networks:
  hope-network:
    # When used standalone, create the network
    # When used with docker-compose.yml, this merges with the existing definition
    name: hope-network
    driver: bridge

volumes:
  vault-data:
  qdrant-data:
  # HF TEI reranker model/weights cache (avoids re-downloading
  # BAAI/bge-reranker-v2-m3 on every `up`).
  reranker-data:
  # Prometheus TSDB for the dev platform-metrics backend.
  prometheus-data:
  # Grafana state (users, starred dashboards) for the dev
  # platform-metrics profile. Provisioning (datasource + dashboards) is mounted
  # read-only from ./configs/grafana, so this only persists runtime UI state.
  grafana-data:
 # /514: HF weights cache for the production-inference `inference`
  # profile (vLLM safetensors + TEI bge-m3), so `up` does not re-download on
  # every restart. llama.cpp reads pre-staged GGUFs from a host bind-mount
  # instead (operator-managed), so it needs no named volume.
  vllm-cache:
  tei-embed-data:

services:
  # HashiCorp Vault - Secret Management
  # Opt-in via `--profile vault`.
  # Default `docker compose up` does NOT start Vault — local dev keeps using
  # EnvSecretsProvider against .env.dev. Devs opt in with:
  #   docker compose -f infrastructure/docker/docker-compose.dev.yml --profile vault up -d
  vault:
    container_name: hope-vault
    image: hashicorp/vault:1.21.4
    profiles: ["vault"]
    networks:
      - hope-network
    restart: unless-stopped
    ports:
      - '8200:8200'
    volumes:
      - vault-data:/vault/file
      # Audit log on a host bind-mount so the API process
      # (which runs on the HOST via `pnpm dev:api`, not in a container) can
      # tail it for the VaultRotationWorker. A named volume would not be
      # host-readable at a stable path. /tmp is portable across dev machines
      # and keeps a committed .env.dev free of machine-specific absolute paths.
      - /tmp/hope-vault-audit:/vault/audit
      - ./configs/vault/dev-init.sh:/vault/init/dev-init.sh:ro
    environment:
      VAULT_ADDR: 'http://0.0.0.0:8200'
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN:-root}
      VAULT_DEV_LISTEN_ADDRESS: '0.0.0.0:8200'
    command: server -dev -dev-root-token-id="${VAULT_DEV_ROOT_TOKEN:-root}"
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O- http://127.0.0.1:8200/v1/sys/health | grep -q "\"initialized\":true"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Vault init sidecar - mounts engines + audit log on profile up
  # Runs once per `up`, exits 0.
  vault-init:
    container_name: hope-vault-init
    image: hashicorp/vault:1.21.4
    profiles: ["vault"]
    networks:
      - hope-network
    depends_on:
      vault:
        condition: service_healthy
    restart: 'no'
    environment:
      VAULT_ADDR: 'http://vault:8200'
      VAULT_DEV_ROOT_TOKEN: ${VAULT_DEV_ROOT_TOKEN:-root}
      # Phase 5 database-engine target. Defaults point at the *host* PG so
      # the dynamic-credential path can mint users against the developer's
      # local Postgres without joining the docker network.
      VAULT_DB_HOST: ${VAULT_DB_HOST:-host.docker.internal}
      VAULT_DB_PORT: ${VAULT_DB_PORT:-5432}
      VAULT_DB_NAME: ${VAULT_DB_NAME:-hope}
      VAULT_DB_ADMIN_USER: ${VAULT_DB_ADMIN_USER:-vault_admin}
      VAULT_DB_ADMIN_PASS: ${VAULT_DB_ADMIN_PASS:-vault_admin_dev_pw}
    volumes:
      - ./configs/vault/dev-init.sh:/vault/init/dev-init.sh:ro
      - ./configs/vault/policies:/vault/init/policies:ro
      - vault-data:/vault/file
    entrypoint: ["/vault/init/dev-init.sh"]

  # Qdrant - Vector Database
  qdrant:
    container_name: hope-qdrant
    image: qdrant/qdrant:v1.19.0
    networks:
      - hope-network
    restart: unless-stopped
    ports:
      - '6333:6333'  # HTTP API
      - '6334:6334'  # gRPC API
    volumes:
      - qdrant-data:/qdrant/storage

  # Qdrant Collection Initialization
  qdrant-init:
    container_name: hope-qdrant-init
    image: python:3.11-slim-trixie
    networks:
      - hope-network
    depends_on:
      - qdrant
    restart: 'no'
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
    volumes:
      - ./scripts/init-qdrant-collections.py:/scripts/init.py:ro
    command: sh -c "pip install -q qdrant-client && python /scripts/init.py"

  # ==========================================================================
  # Temporal — durable-workflow substrate for the Clinical Documentation
  # Harness (apps/harness).
  #
  # OPT-IN by design: the Temporal services below are gated behind the `temporal`
  # profile, so a plain `docker compose up` (and `start-infra.sh --all`, which
  # only activates `--profile vault`) does NOT start them — existing
  # postgres/redis/minio/qdrant/vault are untouched. Mirrors the Vault opt-in
  # precedent above.
  #
  # PERSISTENCE: Temporal shares the core `postgres` (hope-postgres) instance
  # instead of running its own container. admin-tools provisions two DEDICATED
  # databases (TEMPORAL_DB_NAME=`temporal` + TEMPORAL_VISIBILITY_DB_NAME=
  # `temporal_visibility`) alongside the app `hope` DB — the app database is
  # never touched, and Temporal's data inherits the same encrypted-at-rest
  # volume as the app DB. Dropping the dedicated container removes a
  # whole Postgres from dev. Because `temporal` now `depends_on: postgres`
  # (defined in the core compose file), ALWAYS pass BOTH -f files — the wrappers
  # (scripts/dev-infra.sh) and the commands below already do.
  #
  # IMAGES: `temporalio/auto-setup` is deprecated and has no 1.30/1.31
  # tags. Layout matches temporalio/samples-server compose/docker-compose-postgres.yml
  # — `temporalio/admin-tools` (schema) + `temporalio/server` + `temporalio/ui`.
  # Schema updates are in-place (no `docker compose down -v`).
  #
  # VOLUME HOP: if hope-temporal fails on a leftover auto-setup 1.29.x
  # DB, hop the server — do not wipe volumes, do not DROP Temporal DBs.
  #   TEMPORAL_VERSION=1.30.4 TEMPORAL_ADMINTOOLS_VERSION=1.30.4 pnpm infra:dev:up
  #   # wait until hope-temporal is healthy, then
  #   pnpm infra:dev:up # defaults 1.31.2
  # admin-tools:1.29.7 does not exist; last auto-setup tag is 1.29.7.
  # Print-only helper: pnpm infra:dev:temporal-hop
  # Runbook:
  #
  # Start (from the monorepo root):
  #   docker compose -f infrastructure/docker/docker-compose.yml \
  #                  -f infrastructure/docker/docker-compose.dev.yml \
  #                  --profile temporal up -d temporal temporal-ui
  #
  #   Web UI: http://localhost:${TEMPORAL_UI_PORT:-8233}
  #   gRPC frontend: localhost:${TEMPORAL_PORT:-7233}
  # ==========================================================================

  # One-shot schema create/upgrade against hope-postgres (SQL visibility, no ES).
  temporal-admin-tools:
    container_name: hope-temporal-admin-tools
    image: temporalio/admin-tools:${TEMPORAL_ADMINTOOLS_VERSION:-1.31.2}
    profiles: ["temporal"]
    networks:
      - hope-network
    restart: on-failure:6
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PWD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_SEEDS=postgres
      - SQL_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DBNAME=${TEMPORAL_DB_NAME:-temporal}
      - VISIBILITY_DBNAME=${TEMPORAL_VISIBILITY_DB_NAME:-temporal_visibility}
    volumes:
      - ./configs/temporal/scripts:/scripts:ro
    entrypoint: ["/bin/sh"]
    command: ["/scripts/setup-postgres.sh"]

  # Temporal server (schemas must already be at this image's required version).
  temporal:
    container_name: hope-temporal
    image: temporalio/server:${TEMPORAL_VERSION:-1.31.2}
    profiles: ["temporal"]
    networks:
      - hope-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      temporal-admin-tools:
        condition: service_completed_successfully
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PWD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_SEEDS=postgres
      - BIND_ON_IP=0.0.0.0
      # Dedicated databases inside hope-postgres (kept separate from `hope`).
      - DBNAME=${TEMPORAL_DB_NAME:-temporal}
      - VISIBILITY_DBNAME=${TEMPORAL_VISIBILITY_DB_NAME:-temporal_visibility}
      # Cap the SQL pools: hope-postgres runs a small dev budget
      # (max_connections=50) shared with the app, so keep Temporal modest
      # (<=12 conns total) to avoid starving Prisma / the other services.
      - SQL_MAX_CONNS=8
      - SQL_MAX_IDLE_CONNS=8
      - SQL_VIS_MAX_CONNS=4
      - SQL_VIS_MAX_IDLE_CONNS=4
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
      # Temporal server metrics, off by default. Same env var
      # arca/hope-v2-deployment's base/temporal.yaml sets on the in-cluster
      # (currently disconnected) hope-temporal Deployment — task-queue latency,
      # workflow-task timeouts, and persistence errors are otherwise invisible
      # to Prometheus for every durable workflow this platform runs. Paired
      # with configs/prometheus/prometheus.yml's `temporal` scrape job below.
      # AUTHORED, NOT RUNTIME-VERIFIED: local infra was down for the
      # whole of this session, so this has not been confirmed against a live
      # `temporalio/server:1.31.2` container — verify on the next infra-up.
      - PROMETHEUS_ENDPOINT=0.0.0.0:9090
    ports:
      - '${TEMPORAL_PORT:-7233}:7233'
    volumes:
      - ./configs/temporal/development-sql.yaml:/etc/temporal/config/dynamicconfig/development-sql.yaml:ro
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7233"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 60

  # Ensures the `default` namespace exists (idempotent).
  temporal-create-namespace:
    container_name: hope-temporal-namespace
    image: temporalio/admin-tools:${TEMPORAL_ADMINTOOLS_VERSION:-1.31.2}
    profiles: ["temporal"]
    networks:
      - hope-network
    restart: on-failure:5
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - DEFAULT_NAMESPACE=${TEMPORAL_NAMESPACE:-default}
    volumes:
      - ./configs/temporal/scripts:/scripts:ro
    entrypoint: ["/bin/sh"]
    command: ["/scripts/create-namespace.sh"]

  # Temporal Web UI.
  temporal-ui:
    container_name: hope-temporal-ui
    image: temporalio/ui:${TEMPORAL_UI_VERSION:-2.53.1}
    profiles: ["temporal"]
    networks:
      - hope-network
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_healthy
      temporal-create-namespace:
        condition: service_completed_successfully
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:${TEMPORAL_UI_PORT:-8233}
    ports:
      - '${TEMPORAL_UI_PORT:-8233}:8080'

  # ==========================================================================
  # hope-reranker — HF Text-Embeddings-Inference cross-encoder reranker
  # (institutional RAG). Serves BAAI/bge-reranker-v2-m3 on
  # container port 80; the harness hybrid retriever posts query/document pairs to
  # its OpenAI-style ``/rerank`` endpoint (HARNESS_RETRIEVAL_RERANKER_BASE_URL).
  #
  # Profile-gated (`rag`) so a bare `docker compose up` without profiles does
  # NOT pull the model. The base tier (`pnpm infra:up` / `dev:setup` /
  # `dev:stack`) always enables `rag`. Prefer those entry points over raw
  # compose.
  #
  # IMAGE: defaults to the x86_64 CPU build. `scripts/dev-infra.sh` auto-sets
  #   HOPE_RERANKER_IMAGE=...cpu-arm64-latest on Apple Silicon when unset.
  # NOTE: the TEI image is minimal (no shell/curl), so — like the qdrant service
  # above — no exec healthcheck is defined; readiness is observed via /health.
  # ==========================================================================
  hope-reranker:
    container_name: hope-reranker
    image: ${HOPE_RERANKER_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.9}
    profiles: ["rag"]
    networks:
      - hope-network
    restart: unless-stopped
    ports:
      - '${HOPE_RERANKER_PORT:-8870}:80'
    environment:
      MODEL_ID: ${HOPE_RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}
      # Trim batch sizes for CPU-only dev hosts.
      MAX_CLIENT_BATCH_SIZE: "32"
    command: ["--model-id", "${HOPE_RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}"]
    volumes:
      - reranker-data:/data

  # ==========================================================================
  # Prometheus — DEV platform-metrics backend. Scrapes the API
  # gateway + every Python service /metrics (running on the HOST, reached via
  # host.docker.internal) and answers the NestJS PrometheusQueryService at
  # PROMETHEUS_URL=http://localhost:9090.
  #
  # OPT-IN observability tier: gated behind `prometheus`
  # (alias `observability`) so the base tier does NOT start it. Start with:
  #   pnpm infra:up -- -o
  #   pnpm dev:setup-o / pnpm dev:stack-o
  #   pnpm infra:observability:up
  # Local Grafana keeps dev-convenience auth (admin/admin, anonymous Viewer).
  # Production Prometheus/Grafana live under cluster/ops — not this Compose file.
  #
  #   Prometheus UI: http://localhost:9090 · Grafana UI: http://localhost:3001
  # ==========================================================================
  prometheus:
    container_name: hope-prometheus
    image: prom/prometheus:v3.13.2
    profiles: ["observability", "prometheus"]
    networks:
      - hope-network
    restart: unless-stopped
    ports:
      - '${PROMETHEUS_PORT:-9090}:9090'
    # Reach HOST-run services (API + Python) from inside the container. Docker
    # Desktop provides host.docker.internal automatically; this mapping makes it
    # work on Linux too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # alert rules, matching prometheus.yml's `rule_files` glob.
      - ./configs/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ==========================================================================
  # Grafana — DEV visualization for the platform metrics.
  # Provisions a single Prometheus datasource (pointing at the
  # in-network `prometheus:9090`) + a starter "HOPE Platform Metrics" dashboard
  # (running instances, per-model inference p95/avg latency, request rates).
  #
  # Same profile(s) as Prometheus. Start via `pnpm infra:up -- -o` /
  # `pnpm dev:setup-o` / `pnpm dev:stack-o`.
  #
  #   Grafana UI: http://localhost:${GRAFANA_PORT:-3001} (dev login admin/admin;
  #   anonymous Viewer is enabled so dashboards open without signing in).
  # ==========================================================================
  grafana:
    container_name: hope-grafana
    image: grafana/grafana:13.1.2
    profiles: ["observability", "prometheus"]
    networks:
      - hope-network
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    ports:
      # Host port 3001 per .cursor/rules/09-infrastructure.mdc (container stays 3000).
      - '${GRAFANA_PORT:-3001}:3000'
    environment:
      # Dev-only defaults; override via env for anything shared.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Convenience for local dev — view the provisioned dashboard without login.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
      # This mounted ./configs/grafana/dashboards, which held a
      # SINGLE dashboard, while the nine purpose-built ones (TEXT overview /
      # resilience / security / cache-friendliness, consumption,
      # agentic-trajectory, model-retention, optimistic-locking, pgbouncer) sat
      # unmounted in ../grafana/dashboards — reachable only from the standalone
      # apps/text/docker-compose.yml stack. The two directories are now one.
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ==========================================================================
  # Production-inference engines. OPT-IN behind the `inference` profile —
  # the base tier does NOT start them. Entry points:
  #   pnpm infra:up -- -e
  #   pnpm dev:setup-e / pnpm dev:stack-e
  # This profile stages the PRODUCTION engine matrix (AD-4) for a GPU dev host;
  # LM Studio + Ollama remain the default local engines. hope-vllm needs NVIDIA;
  # `dev-infra.sh -e` warns when the NVIDIA runtime is missing.
  #
  # Wire TEXT to them by seeding a SYSTEM-tenant `AiProviderConnection` row per
  # engine, carrying the `baseUrl` (see packages/applications/.../ai-provider-connection).
  # There is NO env-var wiring: `TEXT_VLLM_BASE_URL` / `TEXT_LLAMA_CPP_BASE_URL`
  # were deleted with the engine sub-configs (/799) and are BANNED BY NAME
  # in test_task799_config_surface.py — setting one has no effect at all.
  # Every self-hosted adapter is fail-closed on a caller-supplied base_url
  # (`text.core.connection.require_base_url`); it holds no endpoint of its own.
  #
  # Images are PINNED (no `latest`). vLLM + llama.cpp roll fast; bump to a build
  # you have validated on your hardware (see docs/operations/inference/README.md).
  # ==========================================================================

  # vLLM — production primary chat/summarization engine (OpenAI wire, continuous
  # batching, automatic prefix caching, native structured outputs, /metrics).
  # Requires an NVIDIA GPU + the NVIDIA container runtime on the host.
  vllm:
    container_name: hope-vllm
    image: vllm/vllm-openai:v0.11.0
    profiles: ["inference"]
    networks:
      - hope-network
    restart: unless-stopped
    # vLLM needs a large /dev/shm for its NCCL/worker IPC.
    ipc: host
    # LOOPBACK ONLY. vLLM is UNAUTHENTICATED by default, and
    # `--api-key` protects only /v1, /v2 and /inference — NOT /invocations,
    # /pause, /abort_requests or /update_weights. CVE-2026-22778 (CVSS 9.8) is a
    # pre-auth RCE reachable on /invocations. In the cluster an nginx
    # allow-list sidecar fronts the engine; compose has no sidecar, so the
    # equivalent control is to not publish the port beyond the host. Other
    # containers are unaffected: they reach `http://vllm:8000` over hope-network
    # by service name, which never traverses a published port.
    ports:
      - '127.0.0.1:${TEXT_VLLM_PORT:-8000}:8000'
    environment:
      # A gated model download needs a token; ungated models ignore it.
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HOME: /data
      # V-4: INFO, never DEBUG. At DEBUG vLLM logs prompt text and token ids.
      VLLM_LOGGING_LEVEL: ${VLLM_LOGGING_LEVEL:-INFO}
      # ── MinIO weight streaming ( ─────────────────────────────
      # Inert while VLLM_MODEL is a HuggingFace repo id. Set VLLM_MODEL to an
      # `s3://hope-models/...` URI and VLLM_LOAD_FORMAT=runai_streamer to stream
      # weights from the local MinIO instead — the `hope-models` bucket is
      # already created (and versioned) by minio-setup in docker-compose.yml.
      #
      # PATH-STYLE ADDRESSING IS MANDATORY FOR MinIO: unset, the streamer builds
      # virtual-host-style URLs (`<bucket>.<host>`) and every load dies on DNS.
      RUNAI_STREAMER_S3_USE_VIRTUAL_ADDRESSING: "0"
      # No instance metadata service here; without this the SDK burns its retry
      # budget probing 169.254.169.254 before falling back to static keys.
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_ENDPOINT_URL: ${VLLM_S3_ENDPOINT_URL:-http://minio:9000}
      # Set explicitly as version insurance, not because AWS_ENDPOINT_URL is
      # known to be insufficient: with runai-model-streamer 0.16.1 a full weight
      # stream succeeds with this variable UNSET, so the AWS C++ SDK reads
      # AWS_ENDPOINT_URL on its own. vLLM nonetheless copies one into the other
      # (runai_streamer_loader.py:43-49) — and only inside
      # `if load_config.model_loader_extra_config:`, which this service does not
      # pass. Since the vLLM image pins no streamer version, setting both keeps
      # this working whichever version the image happens to carry.
      RUNAI_STREAMER_S3_ENDPOINT: ${VLLM_S3_ENDPOINT_URL:-http://minio:9000}
      AWS_REGION: ${VLLM_S3_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio_admin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minio_admin}
      # NOTE — AWS_CA_BUNDLE is deliberately NOT declared here.
      # The local compose MinIO is plain HTTP, so no bundle is needed, and
      # declaring it as `${VLLM_S3_CA_BUNDLE:-}` would export the EMPTY STRING
      # on every run — botocore reads that as a certificate PATH, not as
      # "unset". The CLUSTER's MinIO is different: it is TLS with a private
      # issuer ("ARCAAI Internal CA"), which is why base/vllm.yaml mounts a CA
      # and sets AWS_CA_BUNDLE there. To reproduce that path locally, add the
      # variable and a bind-mounted PEM by hand.
      # NOTE: VLLM_SERVER_DEV_MODE is deliberately, permanently ABSENT (V-1).
      # Setting it to "1" exposes /collective_rpc — arbitrary RPC execution.
      # It is also why there is no Sleep-Mode hot-swap: model changes are
      # restarts, here and in the cluster.
    command:
      # ⚠️ The default below is a HuggingFace pull of an 8B model at BF16, which
      # needs ~16.4 GB for WEIGHTS ALONE. It will not load on a 16 GB card (the
      # cluster's RTX 2000 Ada, and many dev boxes) — it OOMs at load, before
      # any KV cache exists. On a 16 GB card use a 4B-class AWQ checkpoint and
      # see for the arithmetic that decides what fits.
      - "--model"
      - "${VLLM_MODEL:-Qwen/Qwen3-8B}"
      - "--served-model-name"
      - "${VLLM_SERVED_MODEL_NAME:-${VLLM_MODEL:-Qwen/Qwen3-8B}}"
      # `auto` keeps the HuggingFace path. `runai_streamer` reads an s3:// URI
      # directly from MinIO with no download step and no volume.
      - "--load-format"
      - "${VLLM_LOAD_FORMAT:-auto}"
      # NEVER the model's advertised max — that multiplies KV per sequence and
      # collapses concurrency.
      - "--max-model-len"
      - "${VLLM_MAX_MODEL_LEN:-8192}"
      - "--gpu-memory-utilization"
      - "${VLLM_GPU_MEM_UTIL:-0.90}"
      # A CEILING, not achieved concurrency: the KV cache is the real bound.
      - "--max-num-seqs"
      - "${VLLM_MAX_NUM_SEQS:-64}"
      # vLLM requires >= 2048 and >= max-num-seqs.
      - "--max-num-batched-tokens"
      - "${VLLM_MAX_NUM_BATCHED_TOKENS:-8192}"
      # Set EXPLICITLY: the engine-args reference and the V1 guide disagree
      # about this default, so passing the flag removes the ambiguity.
      - "--enable-prefix-caching"
      # V-4. `--enable-log-requests` is deliberately absent and must stay absent.
      - "--disable-uvicorn-access-log"
    volumes:
      - vllm-cache:/data
    # First boot downloads weights, so the startup window is generous. The
    # vLLM image ships python3 (but not curl), so probe /health via python.
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 600s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: ["gpu"]

  # llama.cpp server — production GGUF-tier engine (CPU/edge, small utility
  # models, MiniCheck GGUF path). Serves the native /completion endpoint TEXT's
  # `llama-cpp` provider targets. Reads a PRE-STAGED GGUF from a host bind-mount
  # (operator downloads it once — see the runbook); no weights are pulled here.
  # `--slots` exposes /slots for per-slot occupancy visibility + healthcheck.
  llama-cpp:
    container_name: hope-llama-cpp
    image: ghcr.io/ggml-org/llama.cpp:server-b9853
    profiles: ["inference"]
    networks:
      - hope-network
    restart: unless-stopped
    ports:
      - '${TEXT_LLAMA_CPP_PORT:-8080}:8080'
    environment:
      LLAMA_ARG_HOST: "0.0.0.0"
      LLAMA_ARG_PORT: "8080"
    command:
      - "-m"
      - "/models/${LLAMA_CPP_MODEL:-model.gguf}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "-c"
      - "${LLAMA_CPP_CTX_SIZE:-8192}"
      # Expose /slots (per-slot state) for the healthcheck + ops visibility.
      - "--slots"
    volumes:
      - ${LLAMA_CPP_MODELS_DIR:-./models/llama-cpp}:/models:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/slots > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s

  # TEI embeddings — production BAAI/bge-m3 embeddings (AD-4). Mirrors the
  # hope-reranker TEI service but serves the embedding model on a separate port.
  # Like the reranker, the TEI image is minimal (no shell/curl) → no exec
  # healthcheck; readiness is observed via /health. On Apple Silicon set
  # HOPE_TEI_EMBED_IMAGE=...cpu-arm64-latest (auto-set by scripts/dev-infra.sh on arm64).
  tei-embed:
    container_name: hope-tei-embed
    image: ${HOPE_TEI_EMBED_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.9}
    profiles: ["inference"]
    networks:
      - hope-network
    restart: unless-stopped
    ports:
      - '${HOPE_TEI_EMBED_PORT:-8871}:80'
    environment:
      MODEL_ID: ${HOPE_TEI_EMBED_MODEL:-BAAI/bge-m3}
      HF_HOME: /data
      MAX_CLIENT_BATCH_SIZE: "32"
    command: ["--model-id", "${HOPE_TEI_EMBED_MODEL:-BAAI/bge-m3}"]
    volumes:
      - tei-embed-data:/data


  # ==========================================================================
  # MLflow — model registry, experiment tracking, lineage
  # ==========================================================================
  # OPT-IN tier, gated behind the `mlflow` profile. Start with:
  #   pnpm infra:dev:up -- -m (or --mlflow)
  # `pnpm infra:dev:down` tears it down too — `mlflow` is in dev-infra.sh's
  # ALL_PROFILES, so it never lingers as an orphan.
  #
  #   MLflow UI: http://localhost:5000
  #
  # This block mirrors the CLUSTER manifests exactly where it matters — same
  # image DIGEST, same server flags, same migrate-then-serve ordering — and
  # differs only in endpoints. Keep them in step: the shipped manifests are
  # *.yaml.
  #
  # ⚠️ IMAGE: the `-full` variant, NOT the plain one. `ghcr.io/mlflow/mlflow`
  # ships mlflow + SQLAlchemy + alembic and NOTHING ELSE — no psycopg2, no
  # boto3, no prometheus_flask_exporter — so it cannot reach Postgres, cannot
  # reach MinIO and cannot serve --expose-prometheus. Verified 2026-08-30 by
  # importing all three in both images. `-full` carries all of them.
  #
  # PHI (S-1): nothing here enables GenAI tracing. MLflow 3 captures full
  # prompts and responses BY DEFAULT, and masking is opt-in + client-side, so
  # `log_traces=False` at every autolog call site is the control — not redaction.
  # No clinical-text path may autolog against this server.
  mlflow-migrate:
    container_name: hope-mlflow-migrate
    image: ${HOPE_MLFLOW_IMAGE:-ghcr.io/mlflow/mlflow:v3.15.2-full@sha256:2c9c50ca72e314cb1b8b301ceaa43882629ad91873d7271f3be92796930c3647}
    profiles: ["mlflow"]
    networks:
      - hope-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    # The compose analogue of the PreSync migration Job. `mlflow` below waits on
    # service_completed_successfully, so the server can never start against a
    # stale schema — it hard-fails there, and that failure reads like a bad
    # connection string rather than a missing migration.
    #
    # Creating the database is part of this one-shot on purpose: MLflow gets its
    # OWN `mlflow` database, never the Prisma-managed one (Alembic's ledger and
    # Prisma's drift detection must not share a schema). It cannot be a
    # /docker-entrypoint-initdb.d script — that only runs on FIRST init, and
    # every existing developer already has a populated hope-postgres-data-pg18
    # volume, so it would silently never run for them.
    #
    # The pg_isready retry loop is load-bearing: timescaledb-ha answers
    # pg_isready over the LOCAL SOCKET while Patroni is still starting, so
    # `service_healthy` fires before the server accepts TCP.
    entrypoint: ['/bin/bash', '-c']
    command:
      - |
        set -euo pipefail
        export PGPASSWORD="${POSTGRES_PASSWORD:-postgres}"
        for i in $$(seq 1 60); do
          python3 -c "import socket,sys; s=socket.create_connection(('postgres',5432),2); s.close()" 2>/dev/null && break
          echo "mlflow-migrate: waiting for postgres TCP ($$i/60)"; sleep 2
        done
        python3 - <<'PY'
        import os, psycopg2
        from psycopg2.extensions import ISOLATION_LEVEL_AUTOCOMMIT
        c = psycopg2.connect(host="postgres", port=5432,
                             user=os.environ.get("POSTGRES_USER", "postgres"),
                             password=os.environ["PGPASSWORD"], dbname="postgres")
        c.set_isolation_level(ISOLATION_LEVEL_AUTOCOMMIT)
        cur = c.cursor()
        cur.execute("SELECT 1 FROM pg_database WHERE datname = 'mlflow'")
        if cur.fetchone() is None:
            cur.execute("CREATE DATABASE mlflow")
            print("mlflow-migrate: created database 'mlflow'")
        else:
            print("mlflow-migrate: database 'mlflow' already present")
        PY
        mlflow db upgrade "$$MLFLOW_BACKEND_STORE_URI"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      MLFLOW_BACKEND_STORE_URI: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/mlflow

  mlflow:
    container_name: hope-mlflow
    image: ${HOPE_MLFLOW_IMAGE:-ghcr.io/mlflow/mlflow:v3.15.2-full@sha256:2c9c50ca72e314cb1b8b301ceaa43882629ad91873d7271f3be92796930c3647}
    profiles: ["mlflow"]
    networks:
      - hope-network
    restart: unless-stopped
    ports:
      - '${HOPE_MLFLOW_PORT:-5000}:5000'
    depends_on:
      mlflow-migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    # Matches the cluster pod's securityContext (runAsUser 1000,
    # readOnlyRootFilesystem true), so a permission problem surfaces here rather
    # than on first deploy. --expose-prometheus needs a WRITABLE multiprocess
    # dir, which is what the /tmp tmpfs is for.
    user: '1000:1000'
    read_only: true
    tmpfs:
      - /tmp
    environment:
      # Artifact-store credentials live SERVER-SIDE ONLY (R-1, proxied mode).
      # Clients get a tracking URI and nothing else — that is the whole point:
      # direct mode would mean issuing MinIO credentials to every client.
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio_admin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minio_admin}
      AWS_DEFAULT_REGION: us-east-1
      MLFLOW_S3_IGNORE_TLS: 'false'
      MLFLOW_ENABLE_PROXY_MULTIPART_UPLOAD: 'true'
      MLFLOW_MULTIPART_UPLOAD_MINIMUM_FILE_SIZE: '524288000'
      MLFLOW_MULTIPART_UPLOAD_CHUNK_SIZE: '104857600'
      MLFLOW_PRESIGNED_DOWNLOAD_URL_TTL_SECONDS: '300'
      HOME: /tmp
      PROMETHEUS_MULTIPROC_DIR: /tmp/metrics
      MLFLOW_BACKEND_STORE_URI: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/mlflow
    # `--artifacts-destination`, NOT `--default-artifact-root`: the latter is the
    # DIRECT-access knob and silently puts you in direct mode, where clients need
    # MinIO credentials nobody issued them.
    #
    # `--allowed-hosts` is MANDATORY. Its default is "localhost + private IPs",
    # matched on the IP literal, so ANY client reaching the server by DNS name
    # (`http://hope-mlflow:5000` from another container) gets
    #   403 'Invalid Host header - possible DNS rebinding attack detected'
    # on every call. Both bare name and name:port are listed because the Host
    # header carries the port.
    entrypoint: ['/bin/sh', '-c']
    command:
      - >
        mlflow server
        --host 0.0.0.0 --port 5000 --workers 4
        --backend-store-uri "$$MLFLOW_BACKEND_STORE_URI"
        --serve-artifacts
        --artifacts-destination s3://mlflow/artifacts
        --expose-prometheus /tmp/metrics
        --allowed-hosts hope-mlflow,hope-mlflow:5000,mlflow,mlflow:5000,localhost,localhost:5000,127.0.0.1,127.0.0.1:5000
    healthcheck:
      test: ['CMD', 'python3', '-c', "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # ==========================================================================
  # GGUF serving tier — /
  # ==========================================================================
  # OPT-IN behind the `gguf` profile (NOT `inference`, deliberately: this tier
  # and the vLLM/TEI tier target the same GPU, and starting both at once on a
  # 16 GB card is how you OOM the pod that was already working).
  #
  #   docker compose -f infrastructure/docker/docker-compose.dev.yml --profile gguf up -d
  #
  # WHY THIS EXISTS ALONGSIDE THE `llama-cpp` SERVICE ABOVE
  # -------------------------------------------------------
  # The existing `llama-cpp` service serves ONE model over llama.cpp's NATIVE
  # /completion endpoint, which is what TEXT's `llama-cpp` provider adapter
  # targets. That adapter is a RAW-PROMPT client
  # (`providers/llama_cpp.py:79 _build_prompt`) — it applies no chat template
  # and cannot express image or audio content parts.
  #
  # >>> THE TRAP WORTH STATING ONCE: in the AiModel catalogue,
  # >>> `provider: 'llama-cpp'` does NOT mean "served by llama.cpp". It selects
  # >>> the native /completion adapter, which is text-only and un-templated.
  # >>> A Gemma 4 IT multimodal model tagged `provider: 'llama-cpp'` would lose
  # >>> its chat template silently and both its modalities loudly.
  #
  # So this service serves the SAME engine on its OPENAI-COMPATIBLE /v1 wire and
  # is addressed by the `lm-studio` / `openai_compat` provider names, which
  # `openai_compat.py:37` already treats as one:
  #     _LM_STUDIO_PROVIDER_NAMES = frozenset({"lm-studio", "openai_compat"})
  # That is why no router code changes: only an AiProviderConnection baseUrl.
  #
  # (`openai_compat` additionally probes LM Studio's native /api/v0/models to
  # enrich listings. llama-server answers 404 there. VERIFIED SAFE — that helper
  # documents "ANY failure returns {}: enrichment is strictly best-effort and
  # must never degrade or fail the /v1/models listing", and a non-200 returns {}
  # before any parsing.)
  #
  # BUILD FLOOR — NOT NEGOTIABLE. Pinned b9853 (2026-07-01). sets
  # a hard floor of b9383: below it a projector pre-norm bug and an audio
  # RMS-norm eps bug make Gemma 4 vision/audio output plausible but WRONG, with
  # no error. Verified by ancestry, not by build number —
  #
  # Weights are operator-staged into ${GGUF_MODELS_DIR} (default ./models/gguf),
  # the same posture as the llama-cpp service above. In the cluster a Job syncs
  # them from MinIO with sha256 verification; locally you place them by hand.
  # Pinned revisions + digests:
  gguf-server:
    container_name: hope-gguf-server
    # CPU image by default so this profile starts on any dev box, Apple Silicon
    # included. On an NVIDIA host set
    #   HOPE_GGUF_IMAGE=ghcr.io/ggml-org/llama.cpp:server-cuda-b9853
    # and uncomment the `deploy.resources` block below.
    image: ${HOPE_GGUF_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-b9853}
    profiles: ["gguf"]
    networks:
      - hope-network
    restart: unless-stopped
    ports:
      - '${HOPE_GGUF_PORT:-8872}:8080'
    environment:
      LLAMA_ARG_HOST: "0.0.0.0"
      LLAMA_ARG_PORT: "8080"
    command:
      # Router mode: ONE endpoint serving every model in the preset file,
      # dispatching on the OpenAI `model` field. This is what lets a THREE-model
      # chat catalogue sit behind the single baseUrl AiProviderConnection allows
      # per (tenantId, service, provider) — the table is UNIQUE on that triple,
      # so three single-model servers could not all be addressed.
      #
      # ⚠️ llama-server prints, at every startup:
      #      "NOTE: router mode is experimental"
      #      "it is not recommended to use this mode in untrusted environments"
      # Recorded, not hidden. for why it is accepted here
      #    (ingress-restricted pod + --api-key-file) and what the fallback is.
      - "--models-preset"
      - "/models/presets.ini"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      # Cap simultaneous residency. On a card with no MIG/MPS/vGPU this is the
      # only real VRAM bound — per-card placement is not enforceable.
      - "--models-max"
      - "${HOPE_GGUF_MODELS_MAX:-1}"
      - "--metrics"
    volumes:
      - ${GGUF_MODELS_DIR:-./models/gguf}:/models:ro
    healthcheck:
      # /health is 503 while a model loads and 200 once resident — one endpoint
      # answering both liveness and readiness. (In ROUTER mode it returns 200 as
      # soon as the router is up, because children load on demand, which is why
      # the k8s manifests use /v1/models as the readiness signal there.)
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 120s
    # Uncomment on an NVIDIA dev host (and switch HOPE_GGUF_IMAGE to -cuda-):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: ["gpu"]

  # Dedicated embedding server. Separate from the router on purpose: it is a
  # different `service` ('embeddings') and therefore a different
  # AiProviderConnection row anyway, it is only 0.26 GiB, and keeping it in
  # plain single-model mode means the embedding path never depends on the
  # experimental router.
  #
  # ⚠️ NOT REACHABLE FROM apps/text YET. `main.py:191-194` registers exactly one
  # embedding provider — `tei-embed` — and TEI cannot load a GGUF at all
  # (safetensors/ONNX only). Wiring this needs an `embeddings`
  # provider factory in apps/text, which is owner decision 2.
  # The server works; the routing does not exist. It is started here so that
  # decision can be evaluated against a running endpoint instead of a document.
  gguf-embed:
    container_name: hope-gguf-embed
    image: ${HOPE_GGUF_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-b9853}
    profiles: ["gguf"]
    networks:
      - hope-network
    restart: unless-stopped
    ports:
      - '${HOPE_GGUF_EMBED_PORT:-8873}:8080'
    environment:
      LLAMA_ARG_HOST: "0.0.0.0"
      LLAMA_ARG_PORT: "8080"
    command:
      - "--model"
      - "/models/${GGUF_EMBED_MODEL:-embeddinggemma-300M-qat-Q4_0.gguf}"
      # The served id. MUST equal the AiModel row's `sourceUri`: the gateway
      # puts `model.sourceUri` on the wire as the OpenAI `model` field, so a
      # mismatch 404s every request
      - "--alias"
      - "llama-cpp-embeddinggemma-300m-qat"
      - "--embeddings"
      - "--pooling"
      - "mean"
      # 8 slots x 2048 tokens. --ctx-size is the TOTAL budget, DIVIDED across
      # --parallel slots (verified: `-c 2048 -np 4` logs
      # "n_slots = 4, n_ctx_slot = 512"), so this is 8*2048 — not 16k per
      # sequence. 2048 is a hard ceiling here: the model reports n_ctx_train=2048.
      - "--ctx-size"
      - "16384"
      - "--parallel"
      - "8"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "--metrics"
    volumes:
      - ${GGUF_MODELS_DIR:-./models/gguf}:/models:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s

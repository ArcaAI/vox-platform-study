# ============================================================================
# HOPE Infrastructure - Core Services
# ============================================================================
# This Docker Compose file provides core infrastructure for local development.
#
# USAGE (from monorepo root):
#   Start: docker compose -f infrastructure/docker/docker-compose.yml up -d
#   Stop: docker compose -f infrastructure/docker/docker-compose.yml down
#   Logs: docker compose -f infrastructure/docker/docker-compose.yml logs -f
#   Status: docker compose -f infrastructure/docker/docker-compose.yml ps
#
# ENVIRONMENT:
#   Compose interpolation reads infrastructure/docker/.env — a GENERATED file
#   (scripts/dev-infra.sh writes it from .env.dev on every `pnpm infra:dev:up`;
#   never hand-edit it). `.env.dev` itself is created by `pnpm setup:dev` from
#   the consolidated .env.sample at the repo root.
# ============================================================================

name: hope-infra

networks:
    hope-network:
        name: hope-network
        driver: bridge

volumes:
    # At-rest encryption: this named volume lives under the
    # Docker data root on the HOST. PostgreSQL has no built-in transparent
    # at-rest encryption, so the backing filesystem MUST be encrypted to protect
    # PHI on stolen disks/VM snapshots. Dev relies on host full-disk encryption
    # (macOS FileVault / Linux LUKS); production Postgres data+WAL volumes sit on
    # LUKS/dm-crypt — see
    # research/deployments/encryption-at-rest-luks-minio-sse-runbook.md.
    postgres-data:
        name: hope-postgres-data-pg18

services:
    # ============================================================================
    # Core Data Services
    # ============================================================================

    # PostgreSQL 18 - Primary Database
    # Pin: timescale/timescaledb-ha:pg18-all (pgvector + vectorscale).
    postgres:
        container_name: hope-postgres
        image: ${HOPE_POSTGRES_IMAGE:-timescale/timescaledb-ha:pg18-all}
        networks:
            - hope-network
        restart: unless-stopped
        ports:
            - '${POSTGRES_PORT:-5432}:5432'
        environment:
            POSTGRES_DB: ${POSTGRES_DB:-postgres}
            POSTGRES_USER: ${POSTGRES_USER:-postgres}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
            POSTGRES_INITDB_ARGS: '--encoding=UTF-8 --lc-collate=C --lc-ctype=C'
        volumes:
            # Mount at the timescaledb-ha data root. This image sets
            # PGDATA=/home/postgres/pgdata/data and declares NO volume there, so a
            # mount anywhere else leaves the cluster in the container's writable
            # layer, where `compose up -d` / image bumps silently destroy it.
            # (The /var/lib/postgresql guidance in docker-library/postgres#1259
            # applies to the OFFICIAL postgres image, which this is not.)
            - postgres-data:/home/postgres/pgdata
        # Minimal PostgreSQL tuning for local development (low resource usage)
        command: >
            postgres
            -c shared_buffers=64MB
            -c effective_cache_size=128MB
            -c work_mem=4MB
            -c maintenance_work_mem=32MB
            -c max_connections=100
            -c wal_level=minimal
            -c max_wal_senders=0
            -c log_min_duration_statement=500
        shm_size: 64mb
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}']
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
        deploy:
            resources:
                limits:
                    memory: 512M
                reservations:
                    memory: 128M

    minio:
        container_name: hope-minio
        image: minio/minio:RELEASE.2025-04-22T22-12-26Z
        networks:
            - hope-network
        restart: unless-stopped
        ports:
            - '${MINIO_PORT:-9000}:9000'
            - '${MINIO_CONSOLE_PORT:-9001}:9001'
        environment:
            MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
            MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_admin}
            # At-rest SSE: server-side encryption needs a KMS.
            # Dev can use MinIO's built-in single-key KMS (DEV ONLY); production
            # uses KES backed by a real KMS/Vault. Uncomment, then enable SSE per
            # bucket in minio-setup below. Generate a dev key:
            #   openssl rand -base64 32 -> MINIO_KMS_SECRET_KEY=hope-dev-key:<base64>
            # MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY:-}
        command: server /data --console-address ":9001"
        healthcheck:
            test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 10s
        deploy:
            resources:
                limits:
                    memory: 256M
                reservations:
                    memory: 64M

    # MinIO Bucket Setup
    minio-setup:
        container_name: hope-minio-setup
        image: minio/mc:RELEASE.2025-04-16T18-13-26Z
        networks:
            - hope-network
        depends_on:
            minio:
                condition: service_healthy
        restart: 'no'
        environment:
            MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
            MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_admin}
        volumes:
            # IAM policy documents. Kept as files rather than inlined because
            # embedding JSON inside a double-quoted shell string inside a YAML
            # scalar is unreviewable. See ../minio/README.md.
            - ./minio/policies:/policies:ro
        # ⚠️ `|` (LITERAL), never `>` (FOLDED). This block was a folded scalar
        # until and it was silently broken: `>` joins every line into
        # ONE line, so the first `#` comment turned the entire remainder of the
        # script into a shell comment. Effects, in order of when they landed:
        # 2026-08-23 — the comment above `mc mb harness-claim-check`
        #     meant that bucket was never created. The comment itself warned the
        #     missing bucket fails SILENTLY; the fix disabled its own fix.
        # 2026-08-30 — a comment moved above `mc mb mlflow`, so from
        #     that commit NO bucket was created at all, on any dev machine.
        # A literal block keeps one command per line and comments stay comments.
        # If you ever change this back to `>`, every comment below becomes a
        # kill switch for everything after it.
        entrypoint: |
            /bin/sh -c "
            echo 'Setting up MinIO buckets and policies...';
            until /usr/bin/mc alias set minio http://minio:9000 ${MINIO_ROOT_USER:-minio_admin} ${MINIO_ROOT_PASSWORD:-minio_admin}; do
              echo 'MinIO not ready, waiting 5 seconds...';
              sleep 5;
            done;
            echo 'MinIO is ready, creating buckets...';
            # MLflow's PROXIED artifact store. Only the MLflow server
            # ever holds credentials for it — clients reach artifacts over HTTP
            # through the tracking server and never see this bucket.
            #
            # ⚠️ Deliberately NOT versioned. `mlflow gc` is the only hard-delete
            # path MLflow has, and therefore the only right-to-erasure mechanism.
            # With versioning on, gc writes a DELETE MARKER and the artifact bytes
            # survive as a non-current version — invisible to `mc ls`, fully
            # recoverable, and erasure silently becomes retention. Verified
            # 2026-08-30. Versioning + object lock belong on the SEPARATE
            # `hope-models` weights bucket, where immutability is the goal.
            /usr/bin/mc mb minio/mlflow --ignore-existing;
            # served model weights live HERE, in a plain bucket,
            # NOT in MLflow's artifact store. MLflow records the s3:// URI and a
            # checksum as model-version tags and nothing more. This is load-bearing:
            # in proxied mode MLflow can only ever hand a client an HTTP URL, and
            # vLLM's runai_streamer needs a real s3:// URI. Move weights into
            # MLflow artifacts and vLLM breaks with no error at the MLflow layer.
            #
            # created WITH OBJECT LOCK. Note the asymmetry with mlflow
            # directly above — mlflow must NOT be versioned (versioning turns
            # `mlflow gc` into a delete marker and erasure silently becomes
            # retention); hope-models must be, because a published weight prefix
            # must never change under a running pod. Same product, opposite
            # requirements. Reasoning in full: ../minio/README.md section 3.
            #
            # Object lock can ONLY be set at creation (mc mb --with-lock); it
            # cannot be enabled afterwards, and `mb --ignore-existing --with-lock`
            # against an existing bucket does nothing and exits 0. So probe, and
            # say so loudly rather than reporting a success that did not happen.
            if /usr/bin/mc ls minio/hope-models > /dev/null 2>&1; then
              if /usr/bin/mc retention info --default minio/hope-models > /dev/null 2>&1; then
                echo '  hope-models: present, object lock ON';
              else
                echo '  WARNING: hope-models exists WITHOUT object lock.';
                echo '           Object lock is creation-only and cannot be added now.';
                echo '           Dev fix: mc rb --force minio/hope-models, then re-run this setup.';
                echo '           Until then immutability rests on versioning + the';
                echo '           hope-models-reader policy (no PutObject), not on lock.';
              fi;
            else
              /usr/bin/mc mb --with-lock minio/hope-models;
              echo '  hope-models: created with versioning + object lock';
            fi;
            /usr/bin/mc version enable minio/hope-models;
            /usr/bin/mc mb minio/recordings --ignore-existing;
            /usr/bin/mc mb minio/generated-audio --ignore-existing;
            /usr/bin/mc mb minio/documents --ignore-existing;
            /usr/bin/mc mb minio/backups --ignore-existing;
            # the compiled-config claim check every workflow dispatch mints into.
            # Without it a consultation-open dispatch fails with 'The specified bucket does
            # not exist' — and because dispatch is best-effort, it fails SILENTLY.
            # (those quotes were DOUBLE quotes until now. This whole script is
            # one double-quoted argument to /bin/sh -c, so a literal double-quote inside
            # it closed the argument early and everything after became stray argv. Never
            # put a double-quote character anywhere in this block — comments included.
            # The only two in the whole entrypoint are the opening and closing delimiter.)
            /usr/bin/mc mb minio/harness-claim-check --ignore-existing;
            echo 'Setting bucket policies...';
            /usr/bin/mc policy set public minio/recordings;
            /usr/bin/mc policy set public minio/generated-audio;
            echo 'Configuring at-rest SSE (Phase 1)...';
            # Requires MINIO_KMS_SECRET_KEY on the minio service (see above).
            # Uncomment to auto-encrypt new objects in the PHI/media + backup
            # buckets. Production enables SSE-KMS via KES (see the at-rest runbook).
            # /usr/bin/mc encrypt set sse-s3 minio/recordings;
            # /usr/bin/mc encrypt set sse-s3 minio/generated-audio;
            # /usr/bin/mc encrypt set sse-s3 minio/documents;
            # /usr/bin/mc encrypt set sse-s3 minio/backups;
            echo 'Provisioning least-privilege hope-models identities ...';
            # Weight consumers must NOT hold the root key, and must not hold the
            # MINIO_ACCESS_KEY pair either: that pair carries read/write over the
            # PHI buckets, and a weight fetch has no business being able to write
            # `recordings`. Two scoped identities instead:
            #   hope-models-reader -> Get/List on hope-models only (services)
            #   hope-models-publisher -> the above + Put/retention (humans/CI)
            # Neither can DeleteObject. Retiring a published prefix is a root
            # action taken knowingly, not something a compromised inference pod
            # or a mistyped `mc rm --recursive` can do.
            # Policy documents are mounted at /policies; see ../minio/README.md.
            #
            # The variable references below are interpolated by COMPOSE from the
            # host env / infrastructure/docker/.env, NOT by the container shell —
            # the same mechanism the MINIO_ROOT_USER reference in the alias line
            # above already relies on. (Corollary: never write a bare dollar-brace
            # placeholder in a comment here; compose tries to interpolate that too
            # and fails the whole file. Learned the hard way, twice.)
            # The defaults are obvious dev placeholders; the cluster host gets real
            # keys from the operator procedure, never these.
            /usr/bin/mc admin policy create minio hope-models-reader /policies/hope-models-reader.json;
            /usr/bin/mc admin policy create minio hope-models-publisher /policies/hope-models-publisher.json;
            /usr/bin/mc admin user add minio ${MINIO_MODELS_READER_KEY:-hope-models-reader} ${MINIO_MODELS_READER_SECRET:-dev_placeholder_reader_secret};
            /usr/bin/mc admin user add minio ${MINIO_MODELS_PUBLISHER_KEY:-hope-models-publisher} ${MINIO_MODELS_PUBLISHER_SECRET:-dev_placeholder_publisher_secret};
            # `policy attach` errors with 'already in effect' on a re-run. That is
            # success, not failure, so it is swallowed — this whole script must be
            # idempotent (compose re-runs it on every `up`).
            /usr/bin/mc admin policy attach minio hope-models-reader --user ${MINIO_MODELS_READER_KEY:-hope-models-reader} > /dev/null 2>&1 || true;
            /usr/bin/mc admin policy attach minio hope-models-publisher --user ${MINIO_MODELS_PUBLISHER_KEY:-hope-models-publisher} > /dev/null 2>&1 || true;
            echo 'Blob layout for hope-models: <slug>/<version>/{manifest.json,SHA256SUMS,*.gguf,...}';
            echo '  version is content-addressed; a published prefix is NEVER overwritten.';
            echo '  Convention + manifest.json schema: infrastructure/docker/minio/README.md';
            echo 'MinIO setup completed successfully';
            exit 0;
            "

    # Redis - Caching & Message Queue
    redis:
        container_name: hope-redis
        image: redis:8-alpine
        networks:
            - hope-network
        restart: unless-stopped
        ports:
            - '${REDIS_PORT:-6379}:6379'
        environment:
            REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_password}
        # Minimal Redis config for local development.
        # At-rest: persistence is DISABLED here (--appendonly no
        # + --save "") so nothing is written to disk — the safest posture if Redis
        # ever caches PHI. If a deployment must enable RDB/AOF persistence, put the
        # Redis data dir on a LUKS-encrypted volume (see the at-rest runbook).
        command: >
            redis-server
            ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD:-redis_password}}
            --maxmemory 64mb
            --maxmemory-policy allkeys-lru
            --appendonly no
            --save ""
        healthcheck:
            test: ['CMD', 'sh', '-c', 'redis-cli ${REDIS_PASSWORD:+-a ${REDIS_PASSWORD:-redis_password}} ping']
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 5s
        deploy:
            resources:
                limits:
                    memory: 128M
                reservations:
                    memory: 32M

# =============================================================================
# HOPE — seal Vault, PRODUCTION digest-pinned apply
# =============================================================================
# Enforces the image digest pin (not just a comment): the `images:` transformer
# rewrites `hashicorp/vault:1.21.4` -> `hashicorp/vault@sha256:…` at apply time.
#
#   PRODUCTION:  kubectl apply -k seal-vault/        (immutable digest)
#   kind E2E:    kubectl apply -f seal-vault/seal-vault.yaml  (tag — so the image
#                can be `kind load`ed without a slow/flaky live digest pull)
#
# Verify/bump the digest with: docker buildx imagetools inspect hashicorp/vault:1.21.4
# -----------------------------------------------------------------------------
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - seal-vault.yaml
images:
  - name: hashicorp/vault
    digest: sha256:4e33b126a59c0c333b76fb4e894722462659a6bec7c48c9ee8cea56fccfd2569

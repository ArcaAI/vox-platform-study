# Keepalived — MASTER (VM 500 / pg-node1)
# Install on host: sudo apt-get install -y keepalived
# Copy to: /etc/keepalived/keepalived.conf
# NOTE: Replace 'eth0' with your actual interface name (check with: ip a)

vrrp_script check_haproxy {
    script "/usr/bin/curl -sf http://127.0.0.1:7000/ > /dev/null 2>&1"
    interval 3
    weight -20
    fall 3
    rise 2
}

vrrp_instance VI_PG {
    state MASTER
    interface eth0
    virtual_router_id 51
    priority 100
    advert_int 1

    authentication {
        auth_type PASS
        auth_pass hopepgha
    }

    virtual_ipaddress {
        10.10.1.250/24
    }

    track_script {
        check_haproxy
    }
}

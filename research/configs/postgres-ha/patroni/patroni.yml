scope: hope-cluster
namespace: /service
name: ${NODE_NAME}

restapi:
  listen: 0.0.0.0:8008
  connect_address: ${NODE_IP}:8008

etcd3:
  hosts:
    - ${PEER1_IP}:2379
    - ${PEER2_IP}:2379
    - ${PEER3_IP}:2379

bootstrap:
  dcs:
    ttl: 30
    loop_wait: 10
    retry_timeout: 10
    maximum_lag_on_failover: 1048576
    synchronous_mode: true
    synchronous_mode_strict: false
    synchronous_node_count: 1
    failsafe_mode: true
    postgresql:
      use_pg_rewind: true
      use_slots: true
      parameters:
        # TimescaleDB
        shared_preload_libraries: "timescaledb"
        timescaledb.max_background_workers: 16
        timescaledb.telemetry_level: "off"
        # Replication
        wal_level: replica
        hot_standby: "on"
        max_wal_senders: 10
        max_replication_slots: 10
        wal_log_hints: "on"
        archive_mode: "on"
        archive_command: "/bin/true"
        # Workers (3 + 16 bg workers + 8 parallel = 27)
        max_worker_processes: 27
        max_parallel_workers: 8
        # Security
        password_encryption: scram-sha-256

  initdb:
    - encoding: UTF8
    - data-checksums

  pg_hba:
    - local all all peer
    - host all all 127.0.0.1/32 scram-sha-256
    - host all all ::1/128 scram-sha-256
    - host replication replicator 10.10.1.0/24 scram-sha-256
    - host all all 10.10.1.0/24 scram-sha-256
    - host all all 0.0.0.0/0 reject

postgresql:
  listen: 0.0.0.0:5432
  connect_address: ${NODE_IP}:5432
  data_dir: /home/postgres/pgdata/data
  bin_dir: /usr/lib/postgresql/17/bin
  pgpass: /tmp/pgpass0
  authentication:
    superuser:
      username: postgres
      password: ${PG_PASSWORD}
    replication:
      username: replicator
      password: ${REPL_PASSWORD}
  parameters:
    # TimescaleDB (must also be in local parameters for extension to load at startup)
    shared_preload_libraries: "timescaledb"
    timescaledb.max_background_workers: 16
    timescaledb.telemetry_level: "off"
    # Memory (16 GB RAM per node)
    max_connections: 200
    shared_buffers: 4GB
    effective_cache_size: 12GB
    work_mem: 128MB
    maintenance_work_mem: 1GB
    wal_buffers: 64MB
    # WAL
    max_wal_size: 4GB
    min_wal_size: 1GB
    # Checkpoints
    checkpoint_completion_target: 0.9
    checkpoint_timeout: 15min
    # I/O
    random_page_cost: 1.1
    effective_io_concurrency: 200
    # Workers
    max_worker_processes: 27
    max_parallel_workers_per_gather: 4
    max_parallel_workers: 8
    max_parallel_maintenance_workers: 4
    # Replication
    hot_standby: "on"
    wal_level: replica
    wal_log_hints: "on"
    archive_mode: "on"
    archive_command: "/bin/true"
    # Logging
    log_min_duration_statement: 1000
    log_checkpoints: "on"
    log_connections: "on"
    log_disconnections: "on"
    log_lock_waits: "on"
    log_timezone: UTC
    timezone: UTC
    # Security
    password_encryption: scram-sha-256
    huge_pages: try
  create_replica_methods:
    - basebackup
  basebackup:
    checkpoint: fast
    max-rate: 100M

watchdog:
  mode: automatic
  device: /dev/watchdog
  safety_margin: 5

tags:
  nofailover: false
  noloadbalance: false
  clonefrom: false
  nosync: false

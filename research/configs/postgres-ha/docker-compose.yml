# TimescaleDB HA Cluster — Docker Compose
# Uses timescale/timescaledb-ha which bundles PG 18 + TimescaleDB 2.25 + Patroni 4.1.0 + pgBackRest
#
# Usage:
#   1. Copy this entire postgres-ha/ directory to ~/postgres-ha on each VM
#   2. Copy .env.example to .env, set NODE_NAME and NODE_IP per node
#   3. Start services in order: etcd → patroni → haproxy → pgbouncer → postgres-exporter
#
# Node mapping:
#   VM 500 (pg-node1): NODE_NAME=pg-node1  NODE_IP=10.10.1.200
#   VM 501 (pg-node2): NODE_NAME=pg-node2  NODE_IP=10.10.1.201
#   VM 502 (pg-node3): NODE_NAME=pg-node3  NODE_IP=10.10.1.202

services:

  # ── etcd (Distributed Configuration Store) ──
  etcd:
    image: quay.io/coreos/etcd:v3.5.21
    container_name: etcd
    hostname: etcd-${NODE_NAME}
    restart: unless-stopped
    network_mode: host
    environment:
      ETCD_NAME: etcd-${NODE_NAME}
      ETCD_DATA_DIR: /etcd-data
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://${NODE_IP}:2380
      ETCD_ADVERTISE_CLIENT_URLS: http://${NODE_IP}:2379
      ETCD_INITIAL_CLUSTER: etcd-pg-node1=http://${PEER1_IP}:2380,etcd-pg-node2=http://${PEER2_IP}:2380,etcd-pg-node3=http://${PEER3_IP}:2380
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_INITIAL_CLUSTER_TOKEN: hope-pg-cluster
      ETCD_AUTO_COMPACTION_RETENTION: "1"
      ETCD_QUOTA_BACKEND_BYTES: "8589934592"
      ETCD_HEARTBEAT_INTERVAL: "1000"
      ETCD_ELECTION_TIMEOUT: "5000"
      ETCD_SNAPSHOT_COUNT: "10000"
    volumes:
      - /data/etcd:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Patroni + TimescaleDB (PG 18) ──
  # Image bundles: PG 18, TimescaleDB 2.25, Patroni 4.1.0, pgBackRest, PostGIS, pgvector, pg_cron, etc.
  #
  # IMPORTANT: The image has two entrypoints:
  #   /docker-entrypoint.sh      — standard postgres (requires POSTGRES_PASSWORD, no Patroni)
  #   /timescaledb_entrypoint.sh — Patroni mode (reads /home/postgres/postgres.yml)
  #
  # We use patroni/entrypoint.sh which generates postgres.yml from env vars, then execs Patroni.
  # This avoids the POSTGRES_PASSWORD requirement and lets Patroni manage initialization.
  patroni:
    image: timescale/timescaledb-ha:pg18-all-amd64
    container_name: patroni
    hostname: ${NODE_NAME}
    restart: unless-stopped
    network_mode: host
    entrypoint: ["/bin/bash", "/patroni-entrypoint.sh"]
    environment:
      PATRONI_NAME: ${NODE_NAME}
      NODE_IP: ${NODE_IP}
      PEER1_IP: ${PEER1_IP}
      PEER2_IP: ${PEER2_IP}
      PEER3_IP: ${PEER3_IP}
      PG_PASSWORD: ${PG_PASSWORD}
      REPL_PASSWORD: ${REPL_PASSWORD}
      PGDATA: /home/postgres/pgdata/data
      PGBACKREST_CONFIG: /etc/pgbackrest/pgbackrest.conf
    volumes:
      - ./patroni/entrypoint.sh:/patroni-entrypoint.sh:ro
      - ./pgbackrest/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
      - ./pgbackrest/minio-ca.crt:/etc/pgbackrest/minio-ca.crt:ro
      - /data/postgresql:/home/postgres/pgdata
      - /data/pgbackrest:/var/lib/pgbackrest
      - /dev/watchdog:/dev/watchdog
    devices:
      - /dev/watchdog:/dev/watchdog
    depends_on:
      etcd:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8008/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── HAProxy (Load Balancer) ──
  # Deploy on VM 500 and VM 501 only (Keepalived manages VIP between them)
  haproxy:
    image: haproxy:3.1-alpine
    container_name: haproxy
    hostname: haproxy-${NODE_NAME}
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      patroni:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7000/ > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    profiles:
      - haproxy

  # ── PgBouncer (Connection Pooler) ──
  # Transaction-mode rollout per TASK-302 Stream C Phase 2A.
  # Validated by packages/database/tests/pgbouncer-validation/ (see
  # docs/implementation/TASK-302-System-Config-Implementation-Roadmap/
  # 03-pgbouncer-validation-report.md — PASS verdict).
  pgbouncer:
    image: edoburu/pgbouncer:v1.25.1-p0  # ≥ 1.21 for MAX_PREPARED_STATEMENTS; v1.25.1-p0 is the validated tag
    container_name: pgbouncer
    hostname: pgbouncer-${NODE_NAME}
    restart: unless-stopped
    network_mode: host
    environment:
      DATABASE_URL: "postgres://postgres:${PG_PASSWORD}@127.0.0.1:5432/postgres"
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 500           # tuned per validation rig (was 1000)
      DEFAULT_POOL_SIZE: 50          # raised for HOPE projected scale (was 25; ≤ 50 tenants by 2027)
      MIN_POOL_SIZE: 5               # keep 5 idle backends pre-warmed per pool
      RESERVE_POOL_SIZE: 10          # absorb deploy spikes (was 5)
      RESERVE_POOL_TIMEOUT: 3
      SERVER_LIFETIME: 3600
      SERVER_IDLE_TIMEOUT: 600
      LOG_CONNECTIONS: 1
      LOG_DISCONNECTIONS: 1
      LISTEN_PORT: 6432
      # ── Prisma 7 transaction-mode requirements (Phase 2A, TASK-302) ──
      MAX_PREPARED_STATEMENTS: 200       # required for Prisma in txn mode (PgBouncer ≥ 1.21)
      SERVER_RESET_QUERY: 'DISCARD ALL'  # explicit (mirrors default)
      SERVER_RESET_QUERY_ALWAYS: 1       # force DISCARD ALL between transactions in txn mode
      IGNORE_STARTUP_PARAMETERS: extra_float_digits,search_path
      LOG_POOLER_ERRORS: 1
      AUTH_TYPE: scram-sha-256
    depends_on:
      patroni:
        condition: service_healthy
    profiles:
      - pgbouncer

  # ── Prometheus postgres_exporter ──
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    container_name: postgres-exporter
    hostname: pg-exporter-${NODE_NAME}
    restart: unless-stopped
    network_mode: host
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:${PG_PASSWORD}@127.0.0.1:5432/postgres?sslmode=disable"
    depends_on:
      patroni:
        condition: service_healthy
    profiles:
      - monitoring

  # ── Prometheus pgbouncer_exporter (TASK-302 Stream C Phase 2A) ──
  # Exposes pgbouncer pool stats (sv_active, cl_waiting, maxwait, etc.)
  # for the Grafana dashboard (community ID 13353 or hand-crafted).
  # Connects to the special `pgbouncer` admin database, which exposes
  # SHOW STATS / SHOW POOLS to users listed in `stats_users`.
  pgbouncer-exporter:
    image: prometheuscommunity/pgbouncer-exporter:v0.10.0
    container_name: pgbouncer-exporter
    hostname: pgbouncer-exporter-${NODE_NAME}
    restart: unless-stopped
    network_mode: host
    environment:
      PGBOUNCER_EXPORTER_HOST: 127.0.0.1
      PGBOUNCER_EXPORTER_PORT: 9127
      # `hope_metrics` must be listed in pgbouncer's `stats_users`. The
      # password is provisioned via PGBOUNCER_PASSWORD when AUTH_TYPE is
      # scram-sha-256; see deploy-vm500-502-postgres-ha.md §10.
      DATA_SOURCE_NAME: "postgres://hope_metrics:${METRICS_PASSWORD}@127.0.0.1:6432/pgbouncer?sslmode=disable"
    # No `depends_on: pgbouncer` because pgbouncer lives in a separate
    # profile; the exporter retries until pgbouncer is reachable. In a
    # production deployment, start with `--profile pgbouncer --profile
    # monitoring` to enable both.
    profiles:
      - monitoring

# Redis Configuration — Dev Environment (VM 420)
# Copy this to redis.conf on the target VM before starting

# ── Network ──────────────────────────────────────────────────────────
bind 0.0.0.0
port 6379
protected-mode yes
tcp-backlog 511
tcp-keepalive 300
timeout 0

# ── Authentication ───────────────────────────────────────────────────
# Password is set via requirepass. All clients must AUTH before commands.
# The actual password is injected from .env via the Docker healthcheck,
# but must also be set here for redis-server to enforce it.
# IMPORTANT: Change this to match the REDIS_PASS in your .env file.
requirepass CHANGE_ME_dev_password_here

# ── Memory ───────────────────────────────────────────────────────────
maxmemory 512mb
maxmemory-policy allkeys-lru

# ── Persistence — RDB Snapshots ──────────────────────────────────────
# Save after 900s if 1 key changed, 300s if 10, 60s if 10000
save 900 1
save 300 10
save 60 10000

rdbchecksum yes
rdbcompression yes
dbfilename dump.rdb
dir /data

# ── Persistence — AOF ────────────────────────────────────────────────
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-use-rdb-preamble yes

# ── Logging ──────────────────────────────────────────────────────────
loglevel notice
logfile "/var/log/redis/redis.log"

# ── Connections ──────────────────────────────────────────────────────
maxclients 1000

# ── Lua Script Limits ────────────────────────────────────────────────
lua-time-limit 5000

# ── Slow Log ─────────────────────────────────────────────────────────
# Log commands taking longer than 10ms
slowlog-log-slower-than 10000
slowlog-max-len 128

# ── Latency Monitoring ──────────────────────────────────────────────
latency-monitor-threshold 100

# ── Dev Environment — Dangerous Commands ALLOWED ─────────────────────
# In dev, all commands are available for debugging convenience.
# FLUSHALL, FLUSHDB, CONFIG, DEBUG, KEYS — all unrestricted.

# Redis Configuration — Staging Environment (VM 421)
# Copy this to redis.conf on the target VM before starting

# ── Network ──────────────────────────────────────────────────────────
bind 0.0.0.0
port 6379
protected-mode yes
tcp-backlog 511
tcp-keepalive 300
timeout 0

# ── Authentication ───────────────────────────────────────────────────
# IMPORTANT: Change this to match the REDIS_PASS in your .env file.
requirepass vf9QxavOLlYRtduL+IvnK7Yx5mWspxXH_staging_password_here

# ── Memory ───────────────────────────────────────────────────────────
maxmemory 2gb
maxmemory-policy allkeys-lru

# ── Persistence — RDB Snapshots ──────────────────────────────────────
save 900 1
save 300 10
save 60 10000

rdbchecksum yes
rdbcompression yes
dbfilename dump.rdb
dir /data

# ── Persistence — AOF ────────────────────────────────────────────────
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-use-rdb-preamble yes

# ── Logging ──────────────────────────────────────────────────────────
loglevel notice
logfile ""

# ── Connections ──────────────────────────────────────────────────────
maxclients 1000

# ── Lua Script Limits ────────────────────────────────────────────────
lua-time-limit 5000

# ── Slow Log ─────────────────────────────────────────────────────────
slowlog-log-slower-than 10000
slowlog-max-len 128

# ── Latency Monitoring ──────────────────────────────────────────────
latency-monitor-threshold 100

# ── Staging Environment — Dangerous Commands RENAMED ─────────────────
# Prevents accidental data loss. Use the renamed versions if you truly
# need these commands (e.g., during planned maintenance).
#
# FLUSHALL → blocked (empty string = disabled)
# FLUSHDB  → blocked
# CONFIG   → renamed (use CONFIG_b4f8a2c1 instead)
# DEBUG    → blocked
# KEYS     → renamed (use KEYS_d9e3f1a7 instead — prefer SCAN)
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG "CONFIG_b4f8a2c1"
rename-command DEBUG ""
rename-command KEYS "KEYS_d9e3f1a7"

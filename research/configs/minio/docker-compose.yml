##############################################################################
# MinIO — Docker Compose (Production Homelab)
#
# Location on VM 402: ~/minio/docker-compose.yml
#
# Usage:
#   docker compose up -d                           # Start
#   docker compose pull && docker compose up -d    # Upgrade
#   docker compose down                            # Stop
#   docker compose logs -f minio                   # Logs
#
# Console: http://10.10.1.102:9001
# S3 API:  http://10.10.1.102:9000
##############################################################################

services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"

    ports:
      - "9000:9000"    # S3 API
      - "9001:9001"    # MinIO Console (Web UI)

    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"

      # Server URL — used by Console to construct S3 API links
      MINIO_SERVER_URL: "http://10.10.1.102:9000"
      MINIO_BROWSER_REDIRECT_URL: "http://10.10.1.102:9001"

      # Lifecycle / Healing
      MINIO_SCANNER_SPEED: "slow"

    volumes:
      - /srv/minio/data:/data

    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G

    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

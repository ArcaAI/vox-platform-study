packages:
  - "apps/*"
  # Standalone demo app: installs @arcaai/vox from GitHub Packages with npm and
  # deliberately depends on NO workspace package.
  - "!apps/quick-compat-app"
  - "packages/*"
  - "packages/agentic-sdk-v2/examples/*"

onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/adapter-pg"
  - "@prisma/engines"
  - prisma

overrides:
  class-validator: 0.15.1
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.4
  react: 19.2.8
  react-dom: 19.2.8
  # same-major advisory floors (do not jump denylist majors)
  "brace-expansion@^1.0.0": 1.1.18
  "brace-expansion@^2.0.0": 2.1.4
  "brace-expansion@^5.0.0": 5.0.9
  socket.io-parser: 4.2.7
  ip-address: 10.5.0
  # @nestjs/platform-express pins multer 2.2.0; 3x high DoS fixed in 2.3.0.
  multer: 2.3.0
  # 6x high (injection/ReDoS) via @node-saml/node-saml -> xml-crypto/xml-encryption.
  "@xmldom/xmldom": 0.8.15
  # high auth-plugin downgrade; reached only through the prisma CLI (dev/CI).
  mysql2: ">=3.22.0"
  # @huggingface/transformers@4.2.0 resolves sharp 0.34.5, below the libheif
  # floor (GHSA-g89c-p67h-r497 -- the same advisory behind the Next.js AVIF
  # RCE). next@16.3.4 already ships 0.35.4; this lifts the transformers copy.
  sharp: ^0.35.4
  "fast-uri@^3.0.0": 3.1.7
  "js-yaml@^4.0.0": 4.3.2
  "js-yaml@^5.0.0": 5.3.0
  "undici@^6.0.0": 6.28.0
  "undici@^7.0.0": 7.29.0
  mermaid: 11.16.1
  dompurify: 3.4.13
  fast-xml-parser: 5.10.1
  # @streamdown/code@1.1.1 still depends on shiki ^3.19.0. streamdown@2.5.0
  # PluginConfig types resolve against the workspace shiki 4, so the dual copies
  # make `plugins={{ code }}` fail dts/typecheck (BundledLanguage / HighlightOptions).
  shiki: 4.4.3
  # happy-dom 20.14.0 drops a subtree out of the ACCESSIBILITY tree that 20.11.2
  # keeps in it. Measured on packages/ui's workflow-canvas suite: the React Flow
  # node subtree renders (5 <button> elements in the DOM, the remove button among
  # them, visibility: visible) but `getByRole('button')` sees only the 4 outside
  # the flow viewport -- `{ hidden: true }` finds all 5. So it is an inaccessibility
  # verdict, not a render or a timing failure.
  #
  # This is NOT caused by any version this repo chose: with pristine manifests and
  # pristine ranges, deleting the lockfile and re-resolving reproduces it, because
  # `^20.11.2` floats to 20.14.0. An override is the only fix that holds -- pinning
  # the declaration in packages/ui leaves a SECOND copy at 20.14.0, and that is the
  # one vitest loads.
  #
  # Dev-only (the vitest DOM environment); nothing ships it. Lift when upstream fixes it.
  happy-dom: 20.11.2
  # Cross-major advisory floors (TASK-936 D-4): the fix exists only over a major,
  # and each reaches us through a package we do not control.
  #   linkify-it  <=5.0.1  2x high ReDoS, via the UNMAINTAINED ansi-to-react@6.2.6
  #                        (pinned at 3.0.3; no newer release exists).
  #   adm-zip     <0.6.0   high, crafted ZIP forces a 4 GB allocation, via
  #                        onnxruntime-node <- @huggingface/transformers.
  linkify-it: ^5.0.2
  adm-zip: ^0.6.0

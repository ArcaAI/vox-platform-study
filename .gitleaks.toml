# .gitleaks.toml — HOPE Phase 0 Item 6 (TASK-302 Stream A)
# Extends the gitleaks default ruleset with HOPE-specific patterns.

title = "HOPE gitleaks rule pack (Phase 0)"

[extend]
# Inherit gitleaks' built-in rules so we get AWS, Azure, GCP, Slack, JWT
# patterns for free. We only add HOPE-specific extensions.
useDefault = true

# ─── HOPE-specific rule pack (per plan Appendix C) ─────────────────────────────

[[rules]]
id = "hope-azure-openai-api-key"
description = "Azure OpenAI API key committed to a .env or source file"
regex = '''(?i)(AZURE_OPENAI_API_KEY|SMR_AZURE_API_KEY)\s*[:=]\s*["']?[A-Za-z0-9]{80,}["']?'''
tags = ["azure", "openai", "key"]

[[rules]]
id = "hope-jwt-secret"
description = "JWT secret committed (non-empty value)"
regex = '''(?i)(JWT_SECRET_KEY|JWT_REFRESH_SECRET|SESSION_SECRET_KEY)\s*[:=]\s*["']?[A-Za-z0-9+/=_-]{32,}["']?'''
tags = ["jwt", "session", "secret"]

[[rules]]
id = "hope-s3-credentials"
description = "S3 access/secret committed (non-placeholder)"
regex = '''(?i)(S3_ACCESS_KEY|S3_SECRET_KEY|AWS_ACCESS_KEY_ID|AWS_SECRET_ACCESS_KEY|MINIO_ROOT_PASSWORD)\s*[:=]\s*["']?[A-Za-z0-9+/=]{16,}["']?'''
tags = ["s3", "aws", "minio"]

[[rules]]
id = "hope-db-url-password"
description = "DATABASE_URL with embedded password (postgresql://user:pw@...)"
regex = '''(?i)(DATABASE_URL|DB_CONNECTION_STRING)\s*[:=]\s*["']?postgresql://[^:]+:[^@\s"']{8,}@'''
tags = ["postgres", "url"]

[[rules]]
id = "hope-pgbouncer-userlist"
description = "PgBouncer userlist.txt format (Stream C interlock)"
regex = '''(?i)^[a-z0-9_]+\s+"[a-z0-9+/=]{20,}"$'''
tags = ["pgbouncer"]

[[rules]]
id = "hope-redis-password"
description = "REDIS_PASS / REDIS_URL with embedded password"
regex = '''(?i)(REDIS_PASS|REDIS_URL)\s*[:=]\s*["']?[^"'\s]{12,}["']?'''
tags = ["redis"]

[[rules]]
id = "hope-mqtt-password"
description = "MQTT_PASS with embedded password"
regex = '''(?i)MQTT_PASS\s*[:=]\s*["']?[^"'\s]{8,}["']?'''
tags = ["mqtt"]

[[rules]]
id = "hope-api-key-pepper"
description = "API_KEY_PEPPER committed"
regex = '''(?i)API_KEY_PEPPER\s*[:=]\s*["']?[A-Za-z0-9+/=_-]{16,}["']?'''
tags = ["api-key"]

[[rules]]
id = "hope-langfuse-key"
description = "Langfuse public/secret key"
regex = '''(?i)LANGFUSE_(PUBLIC|SECRET)_KEY\s*[:=]\s*["']?[a-z]{2}-[a-z]+-[a-z0-9-]{30,}["']?'''
tags = ["langfuse", "observability"]

[[rules]]
id = "hope-huggingface-token"
description = "HuggingFace token"
regex = '''(?i)(HF_TOKEN|HUGGINGFACE_TOKEN)\s*[:=]\s*["']?hf_[A-Za-z0-9]{20,}["']?'''
tags = ["huggingface"]

# TASK-302 Stream B (Phase 1 + R6) — Vault tokens.
#
# Two variants:
#   1. The named-env-var form: VAULT_TOKEN=hvs....  (most common
#      slip-up — devs paste a token straight into a shell rc or .env).
#   2. The raw token form: hvs.<base62>.<base62>.<base62>  (catches
#      tokens copy-pasted into runbook examples, log scrubs that didn't
#      catch the value, etc.).
# Vault tokens are unambiguously identifiable by the `hvs.` prefix
# introduced in Vault 1.10+; older `s.` and `b.` prefixes are deprecated.
[[rules]]
id = "hope-vault-token-env"
description = "VAULT_TOKEN= committed in env/source"
regex = '''(?i)VAULT_TOKEN\s*[:=]\s*["']?hvs\.[A-Za-z0-9_-]{20,}["']?'''
tags = ["vault", "token"]

[[rules]]
id = "hope-vault-token-raw"
description = "Raw Vault token (hvs.<...>) anywhere in source"
regex = '''hvs\.[A-Za-z0-9_-]{20,}'''
tags = ["vault", "token"]

# ─── Allowlist ────────────────────────────────────────────────────────────────
#
# The allowlist below excludes paths and regex patterns that the Phase 0
# Section A security-auditor reviewed as legitimate-noise. Each category is
# justified inline. Real-secret findings on these paths are still reported
# unless an explicit fingerprint in .gitleaksignore matches.
#
# Categories:
#   - Build artefacts, lockfiles, binary assets (never scanned).
#   - Test/fixture/example files with intentional placeholder values.
#   - Generated source (entities, factories, DTOs) that match identifier
#     names but carry no live values.
#   - Documentation and runbooks that quote example/historic credentials.
#   - Deployment templates that use angle-bracket placeholders.

[allowlist]
description = "Phase 0 baseline allowlist (paths + regex placeholder patterns)"

paths = [
  # Binary & lockfiles
  '''(.*?)(jpg|gif|doc|pdf|bin|svg|ico|png|jpeg|wav|mp3|woff2|onnx)$''',
  '''pnpm-lock\.yaml$''',
  '''package-lock\.json$''',
  '''yarn\.lock$''',
  # Build artefact dirs
  '''(^|/)node_modules/''',
  '''(^|/)dist/''',
  '''(^|/)build/''',
  '''(^|/)out/''',
  '''(^|/)\.turbo/''',
  '''(^|/)\.next/''',
  '''(^|/)coverage/''',
  '''(^|/)htmlcov/''',
  '''(^|/)\.pytest_cache/''',
  # Phase 0 documentation that legitimately references rotated/example values
  '''docs/implementation/.*\.md$''',
  '''docs/CODEMAPS/.*\.md$''',
  '''docs/developer-guide/.*\.md$''',
  '''docs/archive/.*''',
  '''apps/api/docs/.*\.md$''',
  '''apps/smr/docs/.*\.md$''',
  '''apps/tts/docs/.*\.md$''',
  '''apps/stt/README\.md$''',
  '''research/security/.*\.md$''',
  '''research/architecture/.*\.md$''',
  '''research/deployments/.*\.md$''',
  '''research/deploy-.*\.md$''',
  '''research/proxmox-.*\.md$''',
  '''research/setup-.*\.md$''',
  '''research/configs/.*''',
  '''knowledge/.*\.md$''',
  '''packages/.*/README\.md$''',
  '''packages/database/README\.md$''',
  # Templates / examples / fixtures
  '''.*\.example$''',
  '''.*\.template$''',
  '''.*\.example\..*$''',
  '''deployment/secrets\..*\.example$''',
  '''deployment/k3s/config/secrets\.yaml\.template$''',
  '''infrastructure/docker/env\..*\.example$''',
  # Test / fixture sources
  '''(^|/)__tests__/''',
  '''(^|/)tests?/''',
  '''.*\.test\.ts$''',
  '''.*\.spec\.ts$''',
  '''.*\.test\.tsx$''',
  '''.*\.spec\.tsx$''',
  '''.*\.test\.py$''',
  '''(^|/)conftest\.py$''',
  # Generated entity/factory/dto code (identifier "apiKey" not a value)
  '''packages/domains/src/entities/generated/''',
  '''packages/domains/src/factories/generated/''',
  '''packages/applications/src/services/user/user/dto/''',
  # Seed scripts use deterministic test data, not live secrets
  '''packages/database/src/prisma/.*/seed/.*''',
  # CI workflow templates that interpolate ${VAR}
  '''\.github/actions/setup-test-env/action\.yml$''',
  '''(^|/)\.gitlab/ci/.*\.yml$''',
  # MQTT/Redis config service code references variable names, not values
  '''packages/applications/src/services/baseServices/_meta/config/config\.service\.ts$''',
  '''packages/applications/src/services/baseServices/mqtt/.*\.ts$''',
  # Per-app docker-compose configs use service-name URLs (redis://redis:6379)
  '''apps/[^/]+/docker-compose\.yml$''',
  # Per-app .env.production files use local-loopback URLs by default
  # (services run in single-deployment mode against localhost Redis)
  '''apps/(smr|stt|guardrail|nlp|tts)/\.env\.production$''',
  # Per-app READMEs include local-loopback connection examples
  '''apps/[^/]+/README\.md$''',
  # Local MCP-server config — holds per-developer tokens (GitLab OAuth), is
  # now gitignored + untracked (see .gitignore). Committed copies in history
  # are covered by the rotated-commit allowlist below; the .example templates
  # carry only placeholders.
  '''(^|/)\.mcp\.json$''',
  '''(^|/)\.cursor/mcp\.json$''',
]

# Regex patterns that, when matched against a finding's raw secret, suppress
# the report. Used for obvious placeholder shapes that survive path filters.
regexes = [
  # Variable / template interpolation
  '''\$\{[A-Z_][A-Z0-9_]*\}''',
  '''\$\$?\{\{\s*[A-Za-z_][A-Za-z0-9_.]*\s*\}\}''',
  '''<[A-Z_][A-Z0-9_]*>''',
  '''<[a-z][a-z0-9-]+>''',
  '''CHANGE_ME[_a-zA-Z0-9]*''',
  '''REPLACE_[A-Z0-9_]+''',
  # Obvious test/dev keywords
  '''(?i)(test|dev|fake|dummy|example|sample|change[_-]?me|your[_-])[_-]?[a-z0-9_-]{0,40}''',
  '''(?i)not[_-]?for[_-]?prod''',
  '''(?i)do[_-]?not[_-]?use''',
  # Local-only loopback connection strings
  '''postgresql://[^:]+:(postgres|prisma|password)@(localhost|127\.0\.0\.1|database|db|host\.docker\.internal)''',
  # Redis loopback URL with no password
  '''redis://(localhost|127\.0\.0\.1)(:\d+)?(/\d+)?$''',
  # HuggingFace placeholder
  '''hf_x{20,}''',
  # Doc-example bearer token shapes
  '''eyJhbGciOiJIUzI1NiIs\.\.\.''',
  '''sk_live_abc123xyz''',
]

# Specific commits that may be ignored. Reserved for explicit historic
# rotations (TASK-302 Phase 0 Item 6 documents the value in the rotation log).
